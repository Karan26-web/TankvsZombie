  $('stage').classList.toggle('is-pregame', newState===GameState.PREGAME);
  updateControlsForState();
}
/* + and - walk the table one entry at a time and stop at its ends. They do
   NOT wrap: 90 rolling round to 0 would read as the dial breaking, and the
   two ends are exactly the values a student most needs to see are the ends. */
function nudge(d){
  if(G.state!==GameState.AIMING || trigOpen) return;
  const i = angleIndex(G.angleTarget);
  const next = Math.max(0, Math.min(ANGLE_CHOICES.length-1, i+d));
  if(next === i){ AU.tick(); return; }
  AU.tick(); setAngle(ANGLE_CHOICES[next]);
}

/* Press-and-hold: one step on the press, a repeat once it's been held. Each
   key keeps its own timers — they used to share one pair, so a finger on
   each key left a repeat running that nothing could stop, and the dial
   walked on by itself. Only the primary finger (or the main mouse button)
   counts, the key holds on to its pointer so the release always arrives,
   and every hold ends the moment the controls stand down. */
const holds = new Set();
function bindHold(btn, d){
  let t = null, i = null;
  const stop = ()=>{ clearTimeout(t); clearInterval(i); t = i = null; holds.delete(stop); };
  btn.addEventListener('pointerdown', e=>{
    if(!e.isPrimary || (e.pointerType==='mouse' && e.button!==0) || btn.disabled) return;
    e.preventDefault();
    stop();
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    nudge(d);
    holds.add(stop);
    t = setTimeout(()=>{ i = setInterval(()=>nudge(d), 70); }, 400);
  });
  ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(ev=>btn.addEventListener(ev, stop));
}
function stopHolds(){ [...holds].forEach(stop=>stop()); }
bindHold($('upBtn'),1); bindHold($('downBtn'),-1);

/* Typing is gone: the field is the dial's read-out. Leaving it editable
   would have re-opened the whole 1-89 range through the keyboard, which is
   the one thing this rework exists to close. It stays an <input> so it keeps
   its focus ring and is still announced, and the arrow keys still drive it. */
angleInput.addEventListener('beforeinput', e=>e.preventDefault());
angleInput.addEventListener('blur', ()=>{ angleInput.value = G.angleTarget; });

addEventListener('keydown', e=>{
  /* a held key repeats, and only the dial's arrows mean to — a held Enter
     used to skip every scene in its path and then fire the next round */
  if(e.repeat && e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
  /* while the table is up it owns the keyboard — otherwise Enter would fire
     the gun through it, at whatever angle the dial happened to be holding */
  if(trigOpen){
    if(e.key==='Escape'){ e.preventDefault(); AU.click(); closeTrigSheet(); }
    else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); AU.click();
      trigRevealed ? closeTrigSheet() : revealTrigAnswer(); }
    else if(e.key==='h' || e.key==='H'){ e.preventDefault(); pressHint(); }
    return;
  }
  // once she has asked, Enter and Space answer her rather than skip
  if(G.state===GameState.COMMANDER && G.cmd && G.cmd.ready && (e.key==='Enter' || e.key===' ')){
    e.preventDefault(); flashPress($('cmdNext')); pressCommanderNext(); return;
  }
  if(G.story){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if(storyTap()) AU.click(); return; }
    if(e.key==='Escape'){ e.preventDefault(); skipStory(); return; }
  }
  if(inChoreo() && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); skipChoreo(); return; }
  if(G.state===GameState.AIMING){
    if(e.key==='ArrowUp'){ nudge(1); flashPress($('upBtn')); e.preventDefault(); }
    if(e.key==='ArrowDown'){ nudge(-1); flashPress($('downBtn')); e.preventDefault(); }
    if(e.key==='Enter'){ flashPress($('fireBtn')); pressFire(); }
    if(e.key==='h' || e.key==='H'){ flashPress($('hintBtn')); pressHint(); }
  } else if(G.state===GameState.PREGAME && e.key==='Enter'){
    const play = $('playBtn');
    if(!play || !play.disabled){ e.preventDefault(); startGame(); }
  }
});

/* ---------- press physics ----------
   :active alone does not survive contact with this UI. Three separate holes:
     · the stepper's hold-to-repeat calls preventDefault() on pointerdown,
       which is exactly what tells the browser to drop :active;
     · FIRE disables itself inside its own click handler, and a disabled
       button is forced back to transform:none before the press can paint;
     · a fast tap holds :active for less time than the key takes to travel,
       and touch browsers withhold it anyway until they have ruled out a
       scroll gesture.
   So the press is a class we own: on at pointerdown, held for at least
   PRESS_MIN so every tap reads as a real push no matter how quick the
   finger is, then released on pointerup wherever that lands. */
const PRESS_MIN = 120;
function armPress(btn){
  if(!btn) return;
  const id = btn._pressId = (btn._pressId||0)+1;
  const t0 = performance.now();
  btn.classList.add('is-pressed');
  const release = ()=>{
    EVENTS.forEach(ev=>removeEventListener(ev, release));
    setTimeout(()=>{ if(btn._pressId===id) btn.classList.remove('is-pressed'); },
               Math.max(0, PRESS_MIN-(performance.now()-t0)));
  };
  // on window, not the button: the finger may slide off before it lifts, and
  // blur/visibilitychange catch an app switch mid-hold so no key stays stuck down
  const EVENTS = ['pointerup','pointercancel','blur','visibilitychange'];
  EVENTS.forEach(ev=>addEventListener(ev, release));
}
/* keyboard has no pointerup to wait for — the key just blinks the button, so
   the on-screen control still answers when the round is played from the keys */
function flashPress(btn){
  if(!btn) return;
  const id = btn._pressId = (btn._pressId||0)+1;
  btn.classList.add('is-pressed');
  setTimeout(()=>{ if(btn._pressId===id) btn.classList.remove('is-pressed'); }, PRESS_MIN);
}
/* ---------- the tap shield ----------
   A tap that changes what is under the finger — NEXT hiding itself, a card
   or the table rising, the table closing, a scene skipped — holds off the
   next TAP_SHIELD ms of touches and clicks, so the second half of a
   double-tap can't land on whatever took its place (NEXT's second tap was
   skipping her duck, and a third the round's briefing). Registered ahead of
   everything else, so a shielded touch never reaches anything at all. Keys
   aren't touched: their clicks carry detail 0. */
const TAP_SHIELD = 350;
let tapShieldUntil = 0;
function shieldTaps(){ tapShieldUntil = performance.now() + TAP_SHIELD; }
addEventListener('pointerdown', e=>{
  if(performance.now() < tapShieldUntil){ e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
addEventListener('click', e=>{
  if(e.detail>0 && performance.now() < tapShieldUntil){ e.stopImmediatePropagation(); e.preventDefault(); }
}, true);

addEventListener('pointerdown', e=>{
  const btn = e.target.closest && e.target.closest('button');
  if(btn && !btn.disabled) armPress(btn);
}, true);

$('fireBtn').addEventListener('click', pressFire);
$('hintBtn').addEventListener('click', pressHint);
$('trigReveal').addEventListener('click', ()=>{ AU.click(); revealTrigAnswer(); });
$('trigClose').addEventListener('click', ()=>{ AU.click(); closeTrigSheet(); });
// clicking the darkened game behind the panel dismisses it, as a sheet should
$('trigSheet').addEventListener('pointerdown', e=>{
  if(e.target === $('trigSheet')){ AU.click(); closeTrigSheet(); }
});
$('cmdNext').addEventListener('click', pressCommanderNext);
/* ---------- tapping the world ----------
   A tap on the world moves things on: the story to its next beat, the
   roll-in, briefing, hatch scene or ending to its end — and only clicks
   when there was something left to skip. It used to act on any press, so
   on a touch screen a resting palm, a second finger or a swipe skipped
   scenes. Now it has to be a real TAP: the primary finger (or the main
   mouse button), lifted within TAP_MAX ms and TAP_SLOP px of where it went
   down; a second finger cancels it. And each scene ignores taps for its
   first SCENE_TAP_GUARD ms, as each story beat does, so a tap meant for the
   scene before can't skip the one after it. */
const TAP_SLOP = 20, TAP_MAX = 600, SCENE_TAP_GUARD = 800;   // px, ms, ms
let worldPress = null;
cv.addEventListener('pointerdown', e=>{
  worldPress = e.isPrimary && (e.pointerType!=='mouse' || e.button===0)
    ? {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now()} : null;
});
cv.addEventListener('pointercancel', ()=>{ worldPress = null; });
cv.addEventListener('pointerup', e=>{
  const p = worldPress; worldPress = null;
  if(!p || e.pointerId!==p.id || performance.now() - p.t > TAP_MAX
     || Math.hypot(e.clientX - p.x, e.clientY - p.y) > TAP_SLOP) return;
  if(G.story){ if(storyTap()){ AU.click(); shieldTaps(); } return; }   // the story: on to the next beat
  if(inChoreo() && performance.now() - stateAt >= SCENE_TAP_GUARD && skipChoreo()){
    AU.click(); shieldTaps();
  }
});
$('storySkip').addEventListener('click', skipStory);
let startingMission = false;
/* The title screen is the painted plate and one button, so the mute,
   music, fullscreen and how-to plates are gone. AU.setMuted /
   AU.setMusicMuted are left intact — the capability is still there, it
   just has no control surface on this screen any more. */
function toggleSound(){
  AU.setMuted(!AU.muted);
  if(!AU.muted) AU.click();
}

/* ============================================================
   TITLE MARKUP
   The wordmark, the tank and the watchtower are painted into the
   preLBD1 plate that drawTitleScene() lays down, so this layer
   carries no art of its own — only the pill, the corner plates and
   the heading screen readers need.
   ============================================================ */
function titleMarkup(ready=true){
  return `<h1 class="srOnly">${t('Tank vs Zombie — Angle Academy')}</h1>

      <div class="titleCtas">
        ${ready ? '' : '<div id="loadBar"><div id="loadFill"></div></div>'}
        <button type="button" class="playTitleBtn" id="playBtn" ${ready?'':'disabled'}
                title="${t('Start — or press Enter')}">${ready ? startLabel() : t('LOADING')}</button>
      </div>`;
}
/* START ▶ — the platform's own word for this key, with the same play arrow
   the storyboard puts on its NEXT ▶ */
function startLabel(){
  return `<span>${t('START')}</span><svg viewBox="0 0 24 24" aria-hidden="true">`
    + '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>';
}
function wireTitleButtons(){
  const play = $('playBtn');
  if(!play) return;
  play.onpointerdown = ()=>{ if(!play.disabled) AU.open(); };
  play.onclick = startGame;
}
function setTitleReady(){
  const fill = $('loadFill'), bar = $('loadBar'), play = $('playBtn');
  if(fill) fill.style.width = '100%';
  if(bar){
    bar.classList.add('ready');
    // opacity:0 still occupies the layer, and a transition that never runs
    // would leave the bar sitting on the plate — so pull it once it has gone
    setTimeout(()=>bar.remove(), 420);
  }
  if(play){
    play.disabled = false;
    play.innerHTML = startLabel();
  }
  wireTitleButtons();
}
function startGame(){
  if(startingMission) return;
  const play = $('playBtn');
  if(play && play.disabled) return;
  startingMission = true;
  AU.init(); AU.resume(); AU.click();
  GameBus.launched();
  hideMsg();
  const overlay = $('overlay');
  overlay.classList.add('leaving');
  setTimeout(()=>{
    overlay.classList.add('hidden');
    overlay.classList.remove('titleScreen','leaving');
    G.level=0;
    resetWorld();
    initializeLevel(0, {revive:true, enter:'none'});
    beginStory();
    startingMission = false;
  }, 420);
}

function showCard(html, variant){
  const overlay = $('overlay'), card = $('overlayCard');
  overlay.classList.remove('titleScreen','leaving','is-win');
  if(variant) overlay.classList.add(variant);
  card.className = 'card';
  card.innerHTML = html;
  overlay.classList.remove('hidden');
  shieldTaps();                     // its keys rise under fingers still tapping the world
  requestAnimationFrame(()=>{
    const action = card.querySelector('button');
    if(action) action.focus({preventScroll:true});
  });
}
function showTitle(){
  setGameState(GameState.PREGAME);
  const overlay = $('overlay'), card = $('overlayCard');
  overlay.classList.remove('hidden','leaving','is-win');
  overlay.classList.add('titleScreen');
  card.className = 'titleScreenInner';
  card.innerHTML = titleMarkup(true);
  wireTitleButtons();
}

let msgTimer=null;
function showMsg(txt, ms=2600){
  $('msgText').textContent = txt; $('msg').style.opacity=1;
  clearTimeout(msgTimer);
  if(ms) msgTimer=setTimeout(hideMsg, ms);
}
function hideMsg(){ $('msg').style.opacity=0; }

/* ---------- THE CAPTION ----------
   The storyboard's narration line, set across the top of the screen the way
   its frames carry theirs. Only the ending speaks this way. */
function showCaption(txt, speaker=true){
  const c = $('caption');
  $('captionText').textContent = txt;
  c.classList.toggle('has-speaker', !!speaker);    // her lines carry her face
  c.classList.remove('hidden');
  c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';   // replay the entrance
}
function hideCaption(){ $('caption').classList.add('hidden'); }

/* ---------- THE SHELL RACK ----------
   How many tries are left on THIS zombie, in the corner the whole round. It
   was the one number the game kept to itself — three misses anywhere in the
   mission ended it, with nothing on screen counting down — so now the rack
   is always visible, the rule is said out loud the first time it matters, a
   miss says what it cost, and every new zombie reloads it in plain sight. */
const SHELL_SVG = '<svg viewBox="0 0 16 34" aria-hidden="true">'
  + '<path class="nose" d="M8 1.5C12.6 5.3 13.5 9.8 13.5 13H2.5C2.5 9.8 3.4 5.3 8 1.5Z"/>'
  + '<rect class="body" x="2.5" y="13" width="11" height="15"/>'
  + '<rect class="band" x="2.5" y="21" width="11" height="3"/>'
  + '<rect class="base" x="1.5" y="28" width="13" height="4.5" rx="1"/>'
  + '<rect class="shine" x="4.2" y="7" width="2" height="19" rx="1"/></svg>';
const shellIcon = spent => `<i class="shell${spent ? ' spent' : ''}">${SHELL_SVG}</i>`;
let shellsExplained = false;
function renderShells(how){
  const box = $('shellIcons'); if(!box) return;
  if(box.children.length !== SHELLS) box.innerHTML = shellIcon(false).repeat(SHELLS);
  [...box.children].forEach((el, i)=>{
    el.classList.remove('is-loading', 'is-spending');
    el.classList.toggle('spent', i >= G.shells);
    void el.offsetWidth;                                     // so the same animation can replay
    if(how==='load') el.classList.add('is-loading');
    if(how==='spend' && i===G.shells) el.classList.add('is-spending');
  });
  $('shellBar').setAttribute('aria-label', t('Shells left: {n} of {total}', {n:G.shells, total:SHELLS}));
}
/* said once, when round one's rack is first in play; every round after
   that, and every retry, just reloads */
function announceShells(){
  if(!shellsExplained){
    shellsExplained = true;
    showMsg(t('You have {n} shells for each zombie.', {n:SHELLS}), 4600);
    const bar = $('shellBar');
    bar.classList.remove('is-calling'); void bar.offsetWidth; bar.classList.add('is-calling');
  } else showMsg(t('Reloaded: {n} shells', {n:SHELLS}), 2400);
}

/* ============================================================
   FIRING
   ============================================================ */
/* FIRE is a commitment, not an aim: the gun lays over to the number the
   player typed, holds one beat, and only then shoots. Three separate moments
   the player can read — decide, aim, boom — instead of one instant event. */
function pressFire(){
  if(G.state!==GameState.AIMING || trigOpen) return;   // the sheet has the floor
  const v = G.angleTarget;      // the dial cannot hold anything else
  hideMsg();
  setGameState(GameState.LAYING);
  const from = G.angleShown;
  const dur = ambientMotionAllowed()
    ? Math.min(LAY_MAX, LAY_BASE + Math.abs(v-from)*LAY_PER_DEG)
    : .001;
  G.lay = {from, to:v, t:0, dur, hold:LAY_HOLD, laid:false};
  G.barrelTarget = v;                      // stays laid until the shot resolves
  AU.servo(dur);
}
function updateLay(dt){
  const l = G.lay; if(!l) return;
  l.t += dt;
  if(!l.laid){
    G.angleShown = l.from + (l.to-l.from)*easeInOutCubic(clamp01(l.t/l.dur));
    if(l.t>=l.dur){ G.angleShown = l.to; l.laid = true; l.t = 0; AU.lockOn(); }
    return;
  }
  if(l.t>=l.hold){ G.lay = null; launchShell(); }
}
function launchShell(){
  setGameState(GameState.PROJECTILE_FLYING);
  G.tries++;
  G.angleShown = G.angleTarget;
  /* The round is answered or it is not. The zombie stands ON the answer ray,
     so the right angle already flies through him — but the shot is gated on
     the ANSWER rather than on the sprite it happens to graze, so no amount of
     hitbox padding can ever hand a round to a wrong table value. */
  G.shotIsAnswer = G.angleTarget === currentLevelData().ans;
  GameBus.signal('shot_fired', {angle:G.angleTarget, answer:currentLevelData().ans, attempt:G.tries});
  const aimPath = calculateAimPath(G.angleTarget);
  G.aimPath = aimPath;
  G.shell = { x:aimPath.startX, y:aimPath.startY, a:aimPath.screenAngle, path:aimPath, travelled:0, minDz:1e9 };
  G.recoil = 14; G.flash = .13; G.shake = 5;
  AU.fire(); AU.whoosh(aimPath.length/PROJECTILE_SPEED);
  if(G.zombie){ G.zombie.mode='alert'; AU.zombieUhOh(); }
  spawnSmoke(aimPath.startX, aimPath.startY, 8);
}

function resolveHit(){
  GameBus.answered(true);
  if(G.activeNode) G.activeNode.status='CLEARED';
  callHint(false);
  G.zombie.mode='burst'; G.zombie.burstF=0; G.zombie.animT=0;
  AU.explode(true); AU.zombiePop();
  G.shake=14; hideMsg();
  /* The hit is its own praise: the blast, the stars and the chime. It used
     to stamp "PERFECT!" or "BOOM!" over it and float a "+300" off the
     zombie, and a points total ranked the run at the end — none of which
     measured anything the round teaches, so all of it is gone. */
  spawnStars(G.zombie.x, G.zombie.y, 16);
  setTimeout(()=>AU.success(), 480);
  setGameState(GameState.HIT_REACTION);
}

function resolveMiss(){
  GameBus.answered(false);
  AU.explode(false);
  G.shake=5; G.shells--; renderShells('spend');
  G.zombie.mode='idle';
  /* A miss says what it COST, never where it went. It used to post "Too
     steep ⬇", which is a binary search dressed as teaching: told which side
     of the answer you landed on, a five-value dial is solved by stepping, and
     the ratio never has to be worked out at all. The shot already says
     everything true — the shell visibly flies over the roof or falls short of
     it, one leaves the rack, and the gun drops back to rest — so what the
     plate added was the one thing the player was supposed to derive.
     Help did not go away, it moved: the bulb is lit here, and pressing it
     opens the table with the pair of sides named. Asked for, not pushed.
     What it DOES say is how many shells are left, which is no hint at all:
     it is the one fact about the round the player cannot see for themselves.
     Running dry no longer reveals the answer either — the card offers this
     same zombie again, not its solution. */
  AU.wrong();
  closeTrigSheet(); callHint(true);
  if(G.shells<=0){
    setTimeout(gameOver, 1400);
  } else {
    showMsg(G.shells===1 ? t('Missed! Last shell!') : t('Missed! {n} shells left.', {n:G.shells}), 2800);
    G.barrelTarget = BARREL_REST_ANGLE;     // gun settles back down for another lay
    setGameState(GameState.AIMING);
  }
}

function gameOver(){
  setGameState(GameState.GAME_OVER);
  GameBus.screen('game_over', 'outro');
  // the card says exactly what happened, shows the empty rack, and offers
  // the same zombie again with a full one
  showCard(`<h2>${t('OUT OF SHELLS')}</h2>
    <div class="cardShells" aria-hidden="true">${shellIcon(true).repeat(SHELLS)}</div>
    <p>${t('You used all {n} shells on this zombie. Reload and try again!', {n:SHELLS})}</p>
    <button type="button" class="bigBtn" onclick="retryLevel()">${t('TRY AGAIN')}</button>`);
}
window.retryLevel = ()=>{
  AU.click(); $('overlay').classList.add('hidden');
  shieldTaps();                     // the world is under the card
  setupLevel({fast:true});
};

/* The last screen, as the storyboard has it: Mission Complete and one key,
   FINISH. No stars and no score — they ranked the run on points the round
   never taught — and no PLAY AGAIN: the mission ends where the story does,
   inside the safe zone, whose fireworks keep going behind the card. FINISH
   is the only thing in the game that reports completion — see proceedNext. */
function winGame(){
  setGameState(GameState.GAME_COMPLETE);
  hideCaption();
  GameBus.screen('celebration', 'outro');
  showCard(`<h1>${t('MISSION COMPLETE!')}</h1>
    <div class="cardActions">
      <button type="button" class="bigBtn" id="proceedBtn" onclick="proceedNext()">${t('FINISH')}</button>
    </div>`, 'is-win');
}
/* The hand-off. activity_completed, the validator report and the existing
   swiftpal:proceed message all hang off THIS tap and nothing earlier, so a
   host that redirects on completion can never cut the celebration short. */
window.proceedNext = ()=>{
  AU.click();
  const btn = $('proceedBtn'); if(btn) btn.disabled = true;
  GameBus.complete();
};

/* ============================================================
   PARTICLES
   ============================================================ */
function spawnSmoke(x,y,n){
  for(let i=0;i<n;i++) G.particles.push({
    x,y, vx:(Math.random()-.3)*60, vy:-Math.random()*50-10,
    r:6+Math.random()*10, t:0, life:.8+Math.random()*.6, kind:'smoke'});
}
function spawnBoom(x,y){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*220;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,
      r:4+Math.random()*8,t:0,life:.5+Math.random()*.6,kind:'fire'});
  }
  spawnSmoke(x,y,10);
}
function spawnStars(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=90+Math.random()*260;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,
      r:8+Math.random()*9,t:0,life:1.1+Math.random()*.7,kind:'star',
      rot:Math.random()*6, vr:(Math.random()-.5)*8});
  }
}
function spawnDriveDust(){
  G.particles.push({
    x:G.tankWorldX + TANK.w*.12, y:PLAY_SURFACE_Y-4,
    vx:-28-Math.random()*38, vy:-6-Math.random()*12,
    r:4+Math.random()*5, t:0, life:.42+Math.random()*.16, kind:'dust', world:true
  });
}
function easeInOutCubic(t){
  return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
}
function updateNodeStatuses(){
  G.levelNodes.forEach(node=>{
    if(node.status==='CLEARED' && G.tankWorldX > node.worldX + node.tower.w + 60){
      node.status='PASSED';
    }
    const sx = node.worldX - G.cameraX;
    if((node.status==='PASSED' || node.status==='CLEARED') && sx + node.tower.w < -DESPAWN_MARGIN){
      node.status='OFFSCREEN';
    }
  });
}

function updateZombies(dt){
  G.levelNodes.forEach(node=>{
    const z=node.zombie;
    if(z.dead) return;
    const t = zombieTypeOf(z);
    z.animT+=dt;
    if(z.mode==='burst'){
      if(z.animT > 1/t.fall.fps){
        z.animT=0; z.burstF++;
        if(z.burstF>=t.fall.poses.length){
          z.dead=true; z.mode='gone';
          if(node===G.activeNode) G.hitDelay=.78;   // the stars get to land
        }
      }
    } else if(z.mode==='idle' && t.look.fps>0 && z.animT > 1/t.look.fps){
      // the alarm pose is a held beat, so only the idle loop steps
      z.animT=0; z.frame=(z.frame+1)%t.look.idle.length;
    }
  });
}

/* One box for all three types — see the FAIRNESS note on ZOMBIE_TYPES.
   It is anchored on z.y, the point the triangle actually solves for. */
function zombieHitbox(z){
  return {
    x:z.x-48-HIT_PADDING,
    y:z.y-70-HIT_PADDING,
    w:96+HIT_PADDING*2,
    h:126+HIT_PADDING*2
  };
}

function pointInBox(x,y,b){
  return x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h;
}

function updateProjectile(dt){
  const s=G.shell, z=G.zombie;
  if(!s || !z) return;
  const p=s.path;
  s.travelled = Math.min(p.length, s.travelled + PROJECTILE_SPEED*dt);
  const u = p.length ? s.travelled/p.length : 1;
  s.x = p.startX + (p.endX-p.startX)*u;
  s.y = p.startY + (p.endY-p.startY)*u;
  s.a = p.screenAngle;
  if(Math.random()<.65) G.particles.push({
    x:s.x-p.dirX*28, y:s.y-p.dirY*28, vx:0, vy:0,
    r:3.5, t:0, life:.24, kind:'smoke'
  });

  const dz = Math.hypot(s.x-z.x, s.y-z.y);
  s.minDz = Math.min(s.minDz, dz);
  if(G.shotIsAnswer && !z.dead && z.mode!=='burst' && pointInBox(s.x, s.y, zombieHitbox(z))){
    spawnBoom(s.x,s.y); G.shell=null; resolveHit();
  } else if(u>=1){
    if(s.x>-80 && s.x<W+100 && s.y>-100 && s.y<H+80) spawnBoom(s.x,s.y);
    G.shell=null; resolveMiss();
  }
}

function finishDrive(){
  const d=G.drive; if(!d) return;
  AU.engineStop();
  G.cameraX = d.cameraEnd;
  G.tankWorldX = d.tankEnd;
  G.tankVel = 0;
  G.drive = null;
  syncWorldPositions();
  updateNodeStatuses();
  if(d.onArrive){ d.onArrive(); return; }   // the opening roll-in hands off to the briefing
  if(d.nextLevel==null){
    winGame();
    return;
  }
  initializeLevel(d.nextLevel, {revive:false});
}

function updateDrive(dt){
  const d=G.drive; if(!d) return;
  AU.engineStart();
  d.t += dt;
  const remaining = Math.max(0, d.tankEnd - G.tankWorldX);
  const stopDistance = G.tankVel*G.tankVel/(2*TANK_DECEL);
  const targetVel = remaining <= stopDistance + 10 ? 0 : TANK_MAX_SPEED;
  if(targetVel > G.tankVel) G.tankVel = Math.min(targetVel, G.tankVel + TANK_ACCEL*dt);
  else G.tankVel = Math.max(targetVel, G.tankVel - TANK_DECEL*dt);
  let moved = Math.min(remaining, Math.max(0,G.tankVel)*dt);
  if(remaining<12 && G.tankVel<55){ moved=remaining; G.tankVel=0; }
  G.tankWorldX += moved;

  const lookAhead = Math.min(G.tankVel*.10, CAMERA_LOOKAHEAD_MAX);
  let desiredCamera = Math.max(d.cameraStart, G.tankWorldX - CAMERA_FOLLOW_X + lookAhead);
  desiredCamera = Math.min(d.cameraEnd, desiredCamera);
  G.cameraX += (desiredCamera - G.cameraX) * Math.min(1, CAMERA_FOLLOW_STRENGTH*dt);
  if(d.tankEnd - G.tankWorldX < 1.2){
    G.tankWorldX = d.tankEnd;
    G.tankVel = 0;
    G.cameraX += (d.cameraEnd - G.cameraX) * Math.min(1, CAMERA_FOLLOW_STRENGTH*1.35*dt);
  }

  G.wheelRot += Math.abs(moved)/TANK.wheelR;
  AU.engineDrive(Math.abs(G.tankVel)/TANK_MAX_SPEED);
  G.dustT -= dt;
  if(G.dustT<=0 && Math.abs(G.tankVel)>55){
    spawnDriveDust();
    G.dustT = .14 + Math.random()*.09;
  }
  syncWorldPositions();
  updateNodeStatuses();
  if(Math.abs(d.tankEnd-G.tankWorldX)<.8 && Math.abs(d.cameraEnd-G.cameraX)<1.5 && Math.abs(G.tankVel)<1){
    finishDrive();
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  G.time+=dt;
  syncWorldPositions();
  // barrel eases toward target angle
  // the barrel is driven by the laying tween while a shot is being committed,
  // and otherwise eases toward its rest / travel angle
  if(G.lay) updateLay(dt);
  else G.angleShown += (G.barrelTarget-G.angleShown)*Math.min(1,dt*6.5);
  const guidesUp = G.state===GameState.BRIEFING || G.state===GameState.AIMING || G.state===GameState.LAYING
                || !!(G.story && G.story.guides);
  const guideTarget = guidesUp ? 1 : (G.state===GameState.PROJECTILE_FLYING ? .6 : 0);
  G.guideAlpha += (guideTarget-G.guideAlpha)*Math.min(1,dt*8);
  /* The measured lengths are the QUESTION, and the question is over the
     moment FIRE is pressed — from there the round is watching an answer land.
     They also sit in the air the shell is about to fly through. So they clear
     as soon as the gun starts laying, while the triangle itself stays: the
     player still wants to see the shot against the shape they solved. */
  const chipsUp = G.state===GameState.BRIEFING || G.state===GameState.AIMING;
  G.chipAlpha += ((chipsUp?1:0)-G.chipAlpha)*Math.min(1,dt*9);
  if(G.recoil>0) G.recoil=Math.max(0,G.recoil-dt*46);   // the gun rides back out, not snaps
  if(G.flash>0) G.flash-=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*21);

  if(G.state===GameState.BRIEFING) updateBriefing(dt);
  if(G.state===GameState.COMMANDER) updateCommander(dt);
  if(G.story) updateStory(dt);

  updateZombies(dt);

  updateProjectile(dt);

  if(G.state===GameState.HIT_REACTION && G.zombie && G.zombie.dead){
    G.hitDelay = Math.max(0, G.hitDelay-dt);
    if(G.hitDelay<=0){
      if(G.level>=TOTAL_LEVELS-1) startOutro();
      else startDrive();
    }
  }

  // the safe zone runs on past the card: its fireworks go on behind it
  if(G.outro) updateOutro(dt);

  // rolling: the opening entrance, the runs between rounds and the last run
  // into the safe zone all share one drive
  if(G.state===GameState.TRAVELLING || G.state===GameState.INTRO
     || (G.state===GameState.OUTRO && G.drive)){
    updateDrive(dt);
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.kind==='star'){ p.vy+=300*dt; p.rot+=p.vr*dt; }
    if(p.kind==='fire') p.vy+=115*dt;
    if(p.kind==='smoke') p.r+=11*dt;
    if(p.kind==='dust'){ p.r+=8*dt; p.vy-=4*dt; }
    if(p.kind==='steam'){ p.r+=14*dt; p.vx-=p.vx*2.2*dt; p.vy+=(-14-p.vy)*1.6*dt; }
    if(p.kind==='spark'){ p.vx-=p.vx*1.3*dt; p.vy+=150*dt-p.vy*1.3*dt; }
    if(p.t>p.life) G.particles.splice(i,1);
  }
}

function prepareDrive(){
  G.guideAlpha = 0;
  G.barrelTarget = BARREL_REST_ANGLE;    // gun back to travel position
  stowDock(true);
  if(G.activeNode && G.activeNode.status==='ACTIVE') G.activeNode.status='CLEARED';
  const nextNode = G.levelNodes[G.level+1] || null;
  const cameraEnd = nextNode ? levelRestCamera(nextNode.level) : G.cameraX + FINAL_ROLL_DISTANCE;
  // the next round has its own resting x — the drive has to land the tank on it
  const tankEnd = nextNode ? levelRestTankX(nextNode.level) : cameraEnd + CAMERA_FOLLOW_X;
  G.drive = {
    t:0,
    nextLevel:nextNode ? nextNode.level : null,
    tankStart:G.tankWorldX,
    tankEnd:Math.max(G.tankWorldX+90, tankEnd),
    cameraStart:G.cameraX,
    cameraEnd:Math.max(G.cameraX, cameraEnd)
  };
  G.dustT = 0;
  syncWorldPositions();
}
function poseDriveAt(progress){
  const d = G.drive; if(!d) return;
  const u = Math.max(0,Math.min(1,progress));
  const e = easeInOutCubic(u);
  G.tankWorldX = d.tankStart + (d.tankEnd-d.tankStart)*e;
  const lookAhead = u>0 && u<1 ? CAMERA_LOOKAHEAD_MAX*.7 : 0;
  G.cameraX = Math.min(d.cameraEnd, Math.max(d.cameraStart, G.tankWorldX - CAMERA_FOLLOW_X + lookAhead));
  G.tankVel = u>0 && u<1 ? TANK_MAX_SPEED*(1-Math.abs(u-.5)*1.2) : 0;
  G.wheelRot = Math.abs(G.tankWorldX-d.tankStart)/TANK.wheelR;
  syncWorldPositions();
  updateNodeStatuses();
}
function startDrive(){
  if(G.state===GameState.PAUSED && G.prevPaused===GameState.HIT_REACTION){ prepareDrive(); G.prevPaused=GameState.TRAVELLING; return; }
  if(G.state!==GameState.HIT_REACTION) return;
  setGameState(GameState.TRAVELLING);
  prepareDrive();
}

/* ============================================================
   THE ENDING — into the safe zone
   The storyboard's last two beats, and then its last screen:
     roll   the road is clear, and the tank drives up to the SAFE ZONE —
            "The path is clear. Let's head in!"
     open   its gates roll apart, and warm light spills out
     enter  the tank drives in, out of the night
     shut   the gates roll shut behind it, and clang home
     cheer  fireworks over the compound — "We made it to the safe zone!"
     card   Mission Complete, and its one key: FINISH
   One clock per beat on the game loop, like the rest of the choreography:
   a tap goes straight to the card, and under reduced motion the card comes
   up at once.
   ============================================================ */
const OUT = {open:.95, shut:.6, cheer:2.9, burst:.42, burstLater:1.1};
const SAFE_ZONE_RUN = 1150;          // world px from the last zombie's column to the compound
const TANK_NOSE = .87;               // where the hull art's nose is, across TANK.w
/* THE COMPOUND — assets/safeZone.webp and its gate, assets/safeGate.webp
   (painted from SAFE_ZONE_ART.md; `tools/fit_assets.py safezone` keys, scales
   and measures them). SZ is what that step printed, in stage px with y down
   from the art's top and the ground along its bottom edge: the gate opening,
   the blank sign plate the game letters, the beacon glass, and the faces of
   the two floodlamps. The tank drives in BEHIND everything right of the
   opening — the wall it disappears into — and in FRONT of everything left
   of it. */
const SZ = {w:802, h:361, door:{x:67, y:234, w:229, h:120}, sign:{x:70, y:150, w:223, h:44},
            beacon:[730,12], lamps:[[45,90],[322,90]]};
/* The opening is played down to the ground: the art's last 7px under the
   magenta are only its bottom outline over bare ground, and the tank's
   tracks ride there — a gate that stopped short would shut over them and
   leave the wheels showing underneath. */
const SZ_GATE_H = SZ.h - SZ.door.y;
const FW_COLORS = ['#ffd23f','#ff7a59','#5ec8ff','#8be05a','#f08bff','#fff4c8'];
let SZ_ART = null;

function safeZoneX(){ return G.levelNodes[TOTAL_LEVELS-1].targetWorldX + SAFE_ZONE_RUN; }
/* framed with the compound's far end just in from the right edge, so all of
   it — and the tank pulled up at its gate — is on screen at once */
function safeZoneCamera(){ return safeZoneX() + SZ.w - (W - 70); }

function startOutro(){
  setGameState(GameState.OUTRO);
  G.guideAlpha = 0; G.barrelTarget = BARREL_REST_ANGLE;
  clearReveal(); stowDock(true); hideMsg(); callHint(false);
  if(G.activeNode && G.activeNode.status==='ACTIVE') G.activeNode.status='CLEARED';
  GameBus.screen('safe_zone', 'outro');
  G.outro = {phase:'roll', t:0, gate:0, burstT:0};
  if(!ambientMotionAllowed()){ finishOutro(); return; }
  showCaption(t("The path is clear. Let's head in!")); playVO('end_01');
  const sx = safeZoneX();
  G.drive = {t:0, nextLevel:null, tankStart:G.tankWorldX,
             tankEnd:sx + SZ.door.x - 30 - TANK.w*TANK_NOSE,   // nose just short of the gates
             cameraStart:G.cameraX, cameraEnd:safeZoneCamera(),
             onArrive:()=>outroPhase('open')};
}
function outroPhase(phase){
  const o = G.outro; o.phase = phase; o.t = 0;
  if(phase==='open') AU.gateRumble(OUT.open);
  else if(phase==='enter'){
    G.drive = {t:0, nextLevel:null, tankStart:G.tankWorldX,
               tankEnd:safeZoneX() + SZ.door.x + 6,        // all of it past the opening's edge
               cameraStart:G.cameraX, cameraEnd:G.cameraX,  // the camera holds; the tank leaves
               onArrive:()=>outroPhase('shut')};
  }
  else if(phase==='shut'){ hideCaption(); AU.gateRumble(OUT.shut); }
  else if(phase==='cheer'){ showCaption(t('We made it to the safe zone!')); playVO('end_02'); AU.fanfare(); }
  else if(phase==='card'){ o.gate = 0; winGame(); }
}
function updateOutro(dt){
  const o = G.outro; if(!o) return;
  o.t += dt;
  if(o.phase==='open'){
    o.gate = easeInOutCubic(clamp01(o.t/OUT.open));
    if(o.t>=OUT.open) outroPhase('enter');
  } else if(o.phase==='shut'){
    const u = clamp01(o.t/OUT.shut);
    o.gate = 1 - u*u;                           // gathering speed, then home
    if(u>=1){ AU.clang(true); G.shake = 5; outroPhase('cheer'); }
  } else if(o.phase==='cheer' || o.phase==='card'){
    if(ambientMotionAllowed() && (o.burstT -= dt) <= 0){
      firework();
      o.burstT = o.phase==='cheer' ? OUT.burst : OUT.burstLater;
    }
    if(o.phase==='cheer' && o.t>=OUT.cheer) outroPhase('card');
  }
}
/* a tap goes straight to the card: the tank already inside, the gates shut */
function skipOutro(){
  if(!G.outro || G.outro.phase==='card') return false;
  finishOutro(); return true;
}
function finishOutro(){
  AU.engineStop();
  G.drive = null; G.tankVel = 0;
  G.cameraX = safeZoneCamera();
  G.tankWorldX = safeZoneX() + SZ.door.x + 6;
  syncWorldPositions();
  outroPhase('card');
}
/* one burst over the compound: a flash, then a full peony of hot stars in
   two colours, falling and fading as they spread */
function firework(){
  const x = safeZoneX() - G.cameraX + 60 + Math.random()*(SZ.w-120);
  const y = 100 + Math.random()*170;
  const pick = () => FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  const c = pick(), c2 = pick();
  for(let i=0;i<46;i++){
    const a = Math.random()*Math.PI*2, sp = 50 + Math.random()*190;
    G.particles.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      r:3+Math.random()*2.6, t:0, life:.8+Math.random()*.7, kind:'spark', c:i%3 ? c : c2});
  }
  G.particles.push({x, y, vx:0, vy:0, r:30, t:0, life:.24, kind:'flash'});
  AU.firework();
}

/* ---- drawing it -------------------------------------------------------
   Two passes around the tank: 'back' is the whole compound and the lit
   passage behind its gates; 'front' is only the wall RIGHT of the opening,
   which the tank drives in behind, then the gates, and the lights. */
function drawSafeZone(layer){
  if(!G.levelNodes.length) return;
  const x = safeZoneX() - G.cameraX;
  if(x > W + 60 || x + SZ.w < -60) return;
  const art = SZ_ART || (SZ_ART = bakeSafeZone());
  // planted the same few px into the grass as the tank's tracks, so the two
  // share one ground line — and the shut gate meets the ground the wheels do
  const top = PLAY_SURFACE_Y + TANK_BOTTOM_PADDING - SZ.h, d = SZ.door;
  const open = G.outro ? G.outro.gate : 0;
  if(layer==='back'){
    ctx.fillStyle = 'rgba(2,16,20,.32)';                      // its weight on the ground
    ctx.beginPath(); ctx.ellipse(x + SZ.w*.5, PLAY_SURFACE_Y + 3, SZ.w*.52, 9, 0, 0, 7); ctx.fill();
    ctx.drawImage(art.back, x, top);
    if(open>0){                                               // light spilling out of the gate
      const cx = x + d.x + d.w/2, g = ctx.createRadialGradient(cx, PLAY_SURFACE_Y, 0, cx, PLAY_SURFACE_Y, d.w*1.15);
      g.addColorStop(0, `rgba(255,196,120,${.42*open})`); g.addColorStop(1, 'rgba(255,170,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(cx, PLAY_SURFACE_Y + 4, d.w*1.15, 24, 0, 0, 7); ctx.fill();
    }
    return;
  }
  ctx.drawImage(art.front, x, top);
  // the gates roll apart into the wall either side of the opening; each
  // leaf is backed in ink so the passage's light never shows through its
  // soft painted edge
  const half = d.w/2, slide = half*open, gh = SZ_GATE_H;
  ctx.save();
  ctx.beginPath(); ctx.rect(x + d.x, top + d.y, d.w, gh); ctx.clip();
  ctx.fillStyle = '#0e1310';
  [[0, -slide], [half, slide]].forEach(([at, by], i)=>{
    const lx = x + d.x + at + by;
    ctx.fillRect(lx + 1, top + d.y + 1, half - 2, gh - 2);
    ctx.drawImage(art.leaf[i], lx, top + d.y, half, gh);
  });
  ctx.restore();
  // the floodlamps burn steady; the beacon pulses, quickening while the gates move
  SZ.lamps.forEach(([lx, ly])=>{
    const gx = x + lx, gy = top + ly, gl = ctx.createRadialGradient(gx, gy, 0, gx, gy, 34);
    gl.addColorStop(0, 'rgba(255,238,196,.7)'); gl.addColorStop(1, 'rgba(255,222,150,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(gx, gy, 34, 0, 7); ctx.fill();
  });
  const bx = x + SZ.beacon[0], by = top + SZ.beacon[1];
  const busy = G.outro && (G.outro.phase==='open' || G.outro.phase==='shut');
  const p = .5 + .5*Math.sin(G.time*(busy ? 10 : 3.2));
  const bg = ctx.createRadialGradient(bx, by, 0, bx, by, 52);
  bg.addColorStop(0, `rgba(150,225,255,${.55 + .35*p})`);
  bg.addColorStop(.35, `rgba(70,160,255,${.22 + .2*p})`);
  bg.addColorStop(1, 'rgba(40,120,255,0)');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, 52, 0, 7); ctx.fill();
}

/* The compound's three pieces, made once: back (the art, its sign lettered,
   with a lit passage set into the gate opening), front (only the art right of
   the opening) and the two gate leaves (the gate art, cut at its seam). */
function bakeSafeZone(){
  const {w, h, door:d, sign:s} = SZ;
  const full = makeCv(w, h), g = full.getContext('2d');
  g.drawImage(IMGS.safeZone, 0, 0, w, h);
  // the sign, in the player's language, centred on its ink on the blank plate
  const label = t('SAFE ZONE');
  const face = px => `400 ${px}px "Luckiest Guy","Chakra Petch","Noto Sans Devanagari",`
                   + `"Noto Sans Gujarati","Noto Sans Telugu","Noto Sans Oriya",sans-serif`;
  let fs = Math.round(s.h*.7);
  g.font = face(fs);
  while(fs > 14 && g.measureText(label).width > s.w - 26){ fs--; g.font = face(fs); }
  const m = g.measureText(label);
  const ty = s.y + s.h/2 + ((m.actualBoundingBoxAscent||fs*.7) - (m.actualBoundingBoxDescent||0))/2;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.lineWidth = 5; g.strokeStyle = 'rgba(14,40,24,.85)'; g.strokeText(label, s.x + s.w/2, ty);
  g.fillStyle = '#fff4c8'; g.fillText(label, s.x + s.w/2, ty);

  // the passage behind the gates: a lit hangar, drawn in depth
  const back = makeCv(w, h), b = back.getContext('2d');
  b.drawImage(full, 0, 0);
  const dh = SZ_GATE_H;
  b.save(); b.beginPath(); b.rect(d.x, d.y, d.w, dh); b.clip();
  b.fillStyle = '#1b1510'; b.fillRect(d.x, d.y, d.w, dh);
  const ix = d.x + d.w*.28, iy = d.y + dh*.22, iw = d.w*.44, ih = dh*.5;
  const wall = b.createRadialGradient(ix + iw/2, iy + ih*.6, 4, ix + iw/2, iy + ih*.6, d.w*.6);
  wall.addColorStop(0, '#ffd08a'); wall.addColorStop(.5, '#c27a3a'); wall.addColorStop(1, '#3a2414');
  b.fillStyle = wall; b.fillRect(ix, iy, iw, ih);
  const quad = (pts, c) => { b.fillStyle = c; b.beginPath(); pts.forEach(([px,py],i)=>i ? b.lineTo(px,py) : b.moveTo(px,py)); b.closePath(); b.fill(); };
  quad([[d.x, d.y + dh], [d.x + d.w, d.y + dh], [ix + iw, iy + ih], [ix, iy + ih]], '#5a4128');     // floor
  quad([[d.x, d.y], [d.x + d.w, d.y], [ix + iw, iy], [ix, iy]], '#20180f');                         // ceiling
  quad([[d.x, d.y], [ix, iy], [ix, iy + ih], [d.x, d.y + dh]], '#3b2a1a');                          // walls
  quad([[d.x + d.w, d.y], [ix + iw, iy], [ix + iw, iy + ih], [d.x + d.w, d.y + dh]], '#3b2a1a');
  b.restore();

  // the wall the tank drives in behind: everything right of the opening
  const front = makeCv(w, h), f = front.getContext('2d');
  f.drawImage(full, 0, 0);
  f.clearRect(0, 0, d.x + d.w, h);

  // the gates: the painted pair, split at its seam into the two leaves
  const gate = IMGS.safeGate, gw = gate.naturalWidth, gh = gate.naturalHeight;
  const lw = Math.ceil(d.w/2);
  const leaf = [0, 1].map(side => {
    const c = makeCv(lw, dh);
    c.getContext('2d').drawImage(gate, side*gw/2, 0, gw/2, gh, 0, 0, lw, dh);
    return c;
  });
  return {back, front, leaf};
}

/* ============================================================
   DRAW
   ============================================================ */
function drawBG(){
  const cam = Math.max(0, Math.min(G.cameraX, BGL.world.width-W));
  ctx.drawImage(BGL.world, cam,0,W,H, 0,0,W,H);
}

/* ---------- sky clouds — the background plates are painted clean of
   clouds, so every cloud on screen is this drifting layer, cut from the
   one painted cloud.webp. With a single source sprite the trick is to stop
   it reading as copy-paste: each cloud gets a DEPTH, and size, opacity,
   parallax and wind speed are all derived from that one number, so far
   clouds are small, pale and slow while near ones are big, solid and
   quick — the layer gains real depth instead of looking like one shape
   scattered nine times. A per-cloud mirror and slight vertical squash
   then break up the silhouette so no two repeats line up. ---------- */
const SKY_CLOUD_SPAN = 1800;             // world-px before the pattern repeats
const CLOUD_BAND_Y = [34, 250];          // kept in open sky, clear of the mountain line
const lerp = (a,b,t)=>a+(b-a)*t;
// few and small on purpose: the sky is backdrop, not scenery — a handful of
// modest clouds spaced wide apart keeps the tank, target and guides dominant
const SKY_CLOUDS = Array.from({length:5}, (_,i)=>{
  const depth = Math.random();           // 0 = near/bold, 1 = far/faint
  return {
    // evenly spaced, then jittered, so they never sit in a visible rhythm
    baseX:   (i+.5)/5*SKY_CLOUD_SPAN + (Math.random()-.5)*150,
    y:       lerp(CLOUD_BAND_Y[1], CLOUD_BAND_Y[0], depth) + (Math.random()-.5)*40,
    w:       lerp(200, 85, depth),       // near clouds read bigger
    alpha:   lerp(.82, .38, depth),      // ...and more solid
    parallax:lerp(.55, .20, depth),      // ...and slide past faster
    wind:    lerp(11, 3.5, depth),       // ...and outrun the far ones on the breeze
    flip:    Math.random()<.5 ? -1 : 1,  // mirror half of them
    squash:  .86 + Math.random()*.28,    // vary the silhouette height
    phase:   Math.random()*Math.PI*2,
    bobAmp:  2 + Math.random()*3.5,
    bobSpeed:.25 + Math.random()*.28
  };
});
/* one cloud, centred on (x,y), drawn from the baked sprite */
function drawCloud(x, y, w, alpha, flip=1, squash=1){
  if(!BGL.cloud) return;
  const h = w/BGL.cloudAspect*squash;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(flip<0) ctx.scale(-1,1);
  ctx.drawImage(BGL.cloud, -w/2, -h/2, w, h);
  ctx.restore();
}
function drawSkyClouds(){
  SKY_CLOUDS.forEach(c=>{
    // wind drifts them even while the camera holds still (aiming); parallax
    // slides them against the camera at less than ground speed
    let sx = (c.baseX + G.time*c.wind - G.cameraX*c.parallax) % SKY_CLOUD_SPAN;
    if(sx<0) sx += SKY_CLOUD_SPAN;
    const y = c.y + Math.sin(G.time*c.bobSpeed + c.phase)*c.bobAmp;
    const half = c.w/2;
    for(const off of [-SKY_CLOUD_SPAN, 0, SKY_CLOUD_SPAN]){
      const x = sx+off;
      if(x > -half && x < W+half) drawCloud(x, y, c.w, c.alpha, c.flip, c.squash);
    }
  });
}

/* ============================================================
   TITLE SCENE
   The attract screen is two painted assets and two live layers, drawn
   strictly back to front:

     nbTitle.webp  · the landscape — swamp, ruin, moon, wall
     sky clouds    · the same drifting wisp the rounds use
     the burst     · moonlight thrown from behind the title
     nbWord.webp   · the wordmark, carrying its own halo

   The wordmark used to be baked into the plate, and this function put it
   back over the burst by re-blitting its rectangle out of the plate. That
   is why it is a separate sprite now: a re-blit is a hole in the draw
   order, and everything laid down between the plate and it was erased
   inside that rectangle. Clouds cross that rectangle. With the letters on
   their own transparent layer the order simply reads as what it is, and the
   burst and the clouds both pass behind them for free.

   The pill is HTML, parked below the burst — see .titleCtas.
   ============================================================ */
/* THE BURST SITS ABOVE THE PILL, NOT BEHIND IT, and that is the whole
   reason it can be a full fan.

   It used to be centred on the pill, 52px above the wall's lip — which left
   its lower rays nowhere to go but across the masonry. Weighting them away
   by direction stopped that, but it also cut the fan in half: what should
   read as a light source read as a semicircle with its bottom missing.

   Lifting the centre into the sky fixes the cause rather than the symptom.
   The fan is even again, all twenty rays at one alpha, and it has room to
   splay downward as far as FADE_TO before the ground arrives — where it
   dissolves into the mist instead of stopping on the bricks. What the pill
   loses is being dead centre of the glow, which it never needed: light
   comes from behind the TITLE, and the button stands in the pool below it. */
const TITLE_BURST = {x:640, y:436, rx:276, ry:250, rays:20,
                     fadeFrom:520, fadeTo:600};   // stage y: full → gone by the lip

/* The fan never changes shape, only its angle, so its twenty blurred rays
   are drawn once, here, and each frame only turns the finished fan.
   Blurring all twenty every frame cost ~40 ms a frame and held the title
   screen, and the hand-off into the story, to 20 fps. The blur is the same
   in every direction, so blurring and then turning is the same picture as
   turning and then blurring. */
function bakeBurstFan(){
  const b = TITLE_BURST, pad = 16;
  const c = makeCv(Math.ceil(b.rx*2)+pad*2, Math.ceil(b.ry*2)+pad*2), g = c.getContext('2d');
  g.translate(c.width/2, c.height/2);
  g.scale(1, b.ry/b.rx);
  const fade = g.createRadialGradient(0,0,18, 0,0,b.rx);
  /* Moonlight, not sunlight — and far quieter than either.
     Two things changed together here. The colour: these rays were the yellow
     of the daytime plate's own sky, and on the swamp they read as a sun coming
     up behind a graveyard, so they now carry the moon's #eef5d6 falling off
     through the fog's teal. And the STRENGTH: the old alphas were painted
     against golden dirt, which is a dark warm ground that swallows a pale
     wedge. Mist is neither — it is pale, cool and flat, so the same wedge on
     top of it reads as a printed stripe. Cut to roughly a third, and blurred
     below, they stop being shapes and become what they are meant to be: light
     picked out by fog. */
  fade.addColorStop(0,   'rgba(238,245,214,.58)');
  fade.addColorStop(.5,  'rgba(186,232,206,.38)');
  fade.addColorStop(.82, 'rgba(126,207,192,.19)');
  fade.addColorStop(1,   'rgba(94,182,172,0)');
  g.fillStyle = fade;
  /* Light through mist has no edges. Blurring the fan is what turns twenty
     hard wedges into one soft shaft, and it is done here, on the scratch
     canvas, so the blur never touches the plate or the wordmark. Unsupported
     filters are ignored, which costs sharpness and nothing else. */
  g.filter = 'blur(4px)';
  const step = Math.PI*2/b.rays;
  for(let i=0;i<b.rays;i++){
    const a = i*step;
    g.beginPath();
    g.moveTo(0,0);
    g.arc(0,0,b.rx, a-step*.27, a+step*.27);
    g.closePath();
    g.fill();
  }
  return c;
}

function drawTitleBurst(){
  const b = TITLE_BURST;
  /* Drawn into a scratch canvas rather than straight onto the stage, because
     the fade has to run down the SCREEN while the fan turns. Turn the baked
     fan, then multiply the whole thing by one vertical ramp: rotation and
     ramp stay independent, which they cannot be if the ramp is baked per ray.
     The canvas is the fan's own bounding box, not the stage, so this costs
     one small composite on the attract screen and nothing anywhere else. */
  const pad = 8, w = Math.ceil(b.rx*2)+pad*2, h = Math.ceil(b.ry*2)+pad*2;
  if(!BGL.burst || BGL.burst.width!==w) BGL.burst = makeCv(w,h);
  if(!BGL.fan) BGL.fan = bakeBurstFan();
  const g = BGL.burst.getContext('2d');
  g.clearRect(0,0,w,h);
  g.save();
  g.translate(w/2, h/2);
  g.rotate(G.time*0.055);
  g.drawImage(BGL.fan, -BGL.fan.width/2, -BGL.fan.height/2);
  g.restore();
  // the core the title is bedded into
  const core = g.createRadialGradient(w/2,h/2,0, w/2,h/2,b.rx*.7);
  core.addColorStop(0,'rgba(238,245,214,.34)');
  core.addColorStop(1,'rgba(160,222,206,0)');
  g.fillStyle = core;
  g.beginPath(); g.ellipse(w/2,h/2,b.rx*.7,b.ry*.7,0,0,7); g.fill();

  // …and now the one ramp, in stage space, that keeps light off the stone
  const top = b.y - h/2;
  const ramp = g.createLinearGradient(0, b.fadeFrom-top, 0, b.fadeTo-top);
  ramp.addColorStop(0,'rgba(0,0,0,1)');
  ramp.addColorStop(1,'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'destination-in';
  g.fillStyle = ramp; g.fillRect(0,0,w,h);
  g.globalCompositeOperation = 'source-over';

  ctx.drawImage(BGL.burst, Math.round(b.x-w/2), Math.round(top));
}

function drawTitleScene(){
  ctx.clearRect(0, 0, W, H);
  drawCover(ctx, IMGS.pre, 0, 0, W, H);
  drawSkyClouds();                                  // the plate is painted clean of them
  drawTitleBurst();
  drawCover(ctx, IMGS.word, 0, 0, W, H);            // the wordmark, over both
}

function visibleLevelNodes(){
  return G.levelNodes.filter(node=>{
    if(node.status==='OFFSCREEN') return false;
    const sx = node.worldX - G.cameraX;
    return sx > -node.tower.w-CULL_MARGIN && sx < W+CULL_MARGIN;
  });
}

/* ---------- the zombie's perch: one complete building illustration,
   scaled as a single piece so its flat deck lands at the height this
   level's opposite side needs — no sliced or repeated sections --- */
function drawTower(tower=G.tower){
  const b=tower; if(!b) return;
  // contact shadow on the lane it actually stands on — the shadow is what
  // plants a set-back structure in the field instead of floating it
  const footY = b.y + b.h;
  const cs=ctx.createRadialGradient(b.x+b.w/2, footY, 0, b.x+b.w/2, footY, b.w*.7);
  cs.addColorStop(0,'rgba(20,35,20,.4)'); cs.addColorStop(1,'rgba(20,35,20,0)');
  ctx.fillStyle=cs;
  ctx.beginPath(); ctx.ellipse(b.x+b.w/2, footY, b.w*.7, 12, 0,0,7); ctx.fill();
  // one complete structure, scaled as a single piece — no stacked slices
  const [sx,sy,sw,sh] = b.bld.box;
  ctx.drawImage(IMGS[b.bld.img], sx,sy,sw,sh, b.x, b.y, b.w, b.h);
}
/* Still solid all the way down to the tank's own ground line, not just to
   its foot line: nothing can reach the strip behind it anyway (every shot
   leaves the muzzle climbing), and a wall is the safer answer than a gap. */
function hitTower(x,y){
  const b=G.tower;
  return b && x>b.x-4 && x<b.x+b.w+4 && y>b.y+6 && y<GROUND_Y;
}

function drawZombie(z=G.zombie){
  if(!z || z.dead) return;
  const t = zombieTypeOf(z);
  const k = z.scale || 1;                // the round's perspective scale
  const feetY = z.y + t.feetOffset*k;    // soles rest on the building's deck
  const set = z.mode==='burst' ? t.fall : t.look;
  const f   = z.mode==='burst' ? set.poses[Math.min(z.burstF, set.poses.length-1)]
            : z.mode==='alert' ? set.alert
            : set.idle[z.frame % set.idle.length];
  const sc = t.height*k/set.bodyPx;
  const w = f[2]*sc, h = f[3]*sc;
  const ax = (f[4]!==undefined ? f[4] : f[2]/2)*sc;   // the body's centre-line
  // every pose hangs off (z.x, feetY), so a knockdown staggers, falls and
  // crumples ON the roof whatever shape its frame happens to be
  ctx.save();
  ctx.translate(z.x, feetY);
  if(z.sway) ctx.rotate(z.sway);              // the story's stragglers, shambling on the spot
  // a right-facing sheet is mirrored about the pose's own centre-line, so the
  // flip costs nothing in placement: the anchor still lands on (z.x, feetY)
  if(t.facesRight) ctx.scale(-1, 1);
  // a type with no idle loop breathes instead: a squash anchored at the soles,
  // so the torso rises and falls while the feet stay glued to the deck
  if(z.mode==='idle' && set.fps===0) ctx.scale(1, 1 + Math.sin(G.time*2.1)*.022);
  ctx.drawImage(IMGS[set.sheet], f[0],f[1],f[2],f[3], -ax, -h, w, h);
  ctx.restore();
}

/* ============================================================
   THE TRIANGLE — the round's word problem, drawn on the world.

     A = the gun's rotation centre      B = corner under the target
     C = the target                     θ = the unknown at A

   Every zombie is placed on the ray leaving A at its level's answer angle,
   so this triangle IS the level data — there is no second source of truth
   to drift out of sync with what actually hits.
   ============================================================ */
const GUIDE_INK='#fff4c8',            // the given sides — lit filament, not hairline
      GUIDE_BLOOM='#ffb02e',          // the amber light they throw
      GUIDE_HALO='rgba(3,18,24,.5)',  // keeps them readable over a moonlit wall
      GUIDE_VALUE='#ffcb57',          // the plates' tan, for numbers and θ
      GUIDE_SHOT='#ff9a2e';           // your committed angle
function trigTriangle(){
  const z = G.zombie; if(!z) return null;
  const ax = TANK.x + TANK.w*.44, ay = TANK.y + TANK.h*.10;   // pivot, ignoring recoil
  return {ax, ay, bx:z.x, by:ay, cx:z.x, cy:z.y};
}
function meters(v){
  const n = Math.abs(v-Math.round(v))<.05 ? Math.round(v) : v.toFixed(1);
  return `${n} ${t('m')}`;
}
/* Every measured mark is struck the same way, so the whole triangle reads as
   one filament of light: a faint dark halo (so it survives a bright wall), a
   wide soft bloom, a tighter hot bloom, then a near-white core inside both.
   `path` only builds the path — each pass re-strokes it.
   The bloom breathes slowly, which is what makes the sides read as LIT rather
   than merely drawn; held still when the player asked for reduced motion. */
function glowStroke(path, {w=3.4, halo=7.5, core=GUIDE_INK, bloom=GUIDE_BLOOM, blur=1,
                           cap='round'}={}){
  const pulse = ambientMotionAllowed() ? 1 + Math.sin(G.time*1.6)*.16 : 1;
  ctx.save();
  ctx.lineCap=cap; ctx.lineJoin='round';
  // halo 0 = skip the dark backing pass. Over the tank that backing is a dark
  // line on dark armour, which at low alpha reads as grime rather than as a
  // guide; there, only the hot core is worth drawing.
  if(halo>0){ ctx.strokeStyle=GUIDE_HALO; ctx.lineWidth=halo; path(); ctx.stroke(); }
  ctx.shadowColor=bloom; ctx.shadowBlur=22*blur*pulse;      // the amber band and its spill
  ctx.strokeStyle=bloom; ctx.lineWidth=w+3.5; path(); ctx.stroke();
  ctx.shadowColor='rgba(255,228,152,.95)'; ctx.shadowBlur=7*blur;
  ctx.strokeStyle=core;  ctx.lineWidth=w;     path(); ctx.stroke();
  ctx.restore();
}
/* A side that draws itself on: u is how much of it has arrived.
   BUTT caps, not round. Every vertex of this triangle is a place where two
   legs end at the same point, and a round cap adds half a stroke width of
   overshoot past that point — on three stacked passes (halo 7.5, bloom 6.9,
   core 3.4) the caps piled up and the corners read as lumps rather than
   joins. Cut flat, the strokes meet exactly where the maths says they do. */
function guideLeg(x1,y1,x2,y2,u,opts){
  if(u<=.002) return;
  const x=x1+(x2-x1)*u, y=y1+(y2-y1)*u;
  glowStroke(()=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x,y); },
             Object.assign({cap:'butt'}, opts));
}
function guideText(txt,x,y,{size=21,weight=800,fill=GUIDE_VALUE,align='center',
                            outline='rgba(38,14,4,.72)'}={}){
  ctx.font=`${weight} ${size}px ${FONT}`;
  ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(4,size*.34);
  if(txt.indexOf('√')>=0){ surdText(txt,x,y,size,align,fill,outline); return; }
  if(outline){ ctx.strokeStyle=outline; ctx.strokeText(txt,x,y); }
  ctx.fillStyle=fill; ctx.fillText(txt,x,y);
}
/* A RADICAL, DRAWN. A radical whose bar you cannot see is a division sign,
   and "8√2 m" read as "8/2 m" is 4 metres instead of 11.3 — in a maths game
   that is not a cosmetic bug. The display face has no √ of its own; the
   fallback font's is a thin tick, and with a separate rule laid over the
   radicand the two never met, so "7√3" read as "7/3" with a bar floating
   over the 3. The whole sign is drawn instead, as ONE path — the small tick,
   the stroke down, the long stroke up, and the bar running on from its top
   across exactly the radicand — in the same two passes (dark outline, then
   ink) as the digits it sits among.
   surdBox lays it out: where each piece goes, and the ink it covers above
   and below a 'middle' line, which is what the cards centre on. */
function surdBox(txt,size){
  const i = txt.indexOf('√'), stop = txt.indexOf(' ', i);
  const end = stop<0 ? txt.length : stop;              // the radicand ends at the unit
  const pre = txt.slice(0,i), rad = txt.slice(i+1,end), post = txt.slice(end);
  const sign = size*.52, gap = pre ? size*.05 : 0, tail = size*.07;
  const wPre = ctx.measureText(pre).width, wRad = ctx.measureText(rad).width;
  const m = ctx.measureText(rad);
  const a = m.actualBoundingBoxAscent || size*.36, d = m.actualBoundingBoxDescent || size*.36;
  const bar = a + size*.15;                             // the bar's height over the line
  return {pre, rad, post, sign, gap, tail, wPre, wRad, a, d, bar,
          width: wPre + gap + sign + wRad + tail + ctx.measureText(post).width,
          up: bar + size*.06, down: d + size*.05};
}
function surdText(txt,x,y,size,align,fill,outline){
  const b = surdBox(txt,size);
  const left = align==='center' ? x - b.width/2 : align==='right' ? x - b.width : x;
  const xs = left + b.wPre + b.gap, xr = xs + b.sign, xp = xr + b.wRad + b.tail;
  const yBar = y - b.bar, yLow = y + b.d;
  const sign = ()=>{
    ctx.beginPath();
    ctx.moveTo(xs, y + size*.06);                       // the tick…
    ctx.lineTo(xs + b.sign*.22, y - size*.05);
    ctx.lineTo(xs + b.sign*.52, yLow);                  // …down…
    ctx.lineTo(xs + b.sign, yBar);                      // …all the way up…
    ctx.lineTo(xp - size*.02, yBar);                    // …and over the radicand
  };
  const pieces = [[b.pre, left], [b.rad, xr], [b.post, xp]].filter(([p])=>p);
  ctx.save();
  ctx.textAlign = 'left'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if(outline){
    ctx.strokeStyle = outline; ctx.lineWidth = Math.max(4, size*.34);
    pieces.forEach(([p,px])=>ctx.strokeText(p, px, y));
    sign(); ctx.stroke();
  }
  ctx.fillStyle = fill;
  pieces.forEach(([p,px])=>ctx.fillText(p, px, y));
  ctx.strokeStyle = fill; ctx.lineWidth = Math.max(2, size*.1);
  sign(); ctx.stroke();
  ctx.restore();
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else {
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
}
/* ---- A GIVEN LENGTH, ON ITS OWN CARD ---------------------------------
   These two numbers are the question. As glowing text they were competing
   with the very thing they label — the sides glow too — and they crossed
   girders, brickwork and sky depending on the round, so their legibility
   changed with whatever happened to be behind them. On a card they read the
   same everywhere.
   The card is DRAWN rather than the smlBrd plaque: at ~150x66 that art had
   to stretch nearly 3x, and where the dock's board can carry that (it is a
   long board, and reads as one), a label this small stretched into a wide
   plank fought its own proportions. Drawn, the corner radius and the rim
   stay honest at any width the number happens to need.
   Its COLOURS are the plaque's, though — the plum saw-line, the plank face
   that darkens downward, the cream the glyphs on every wooden key are cut
   in. So it belongs to the same set without having to be the same picture.
   THETA keeps the glow: it is not a given, it is the unknown standing on the
   triangle itself, and it should look like part of the drawing. */
/* ---- A MEASUREMENT, NOT A LABELLED MEASUREMENT -----------------------
   This card used to carry two lines: the side's NAME above, its length
   below. The name is gone, and with it the taller plate that existed to hold
   it — a card is now the number and nothing else.

   What that costs is worth being clear about, because it changes the
   exercise. Naming the pair of sides you were handed is the decision this
   round is really asking for, and the words used to make it for you: read
   "OPPOSITE" and "HYPOTENUSE" off two plates and the only step left is
   arithmetic. Without them the pairing has to be read off the PICTURE — the
   vertical leg, the slope, the leg along the ground — which is the same
   recognition the textbook asks for, now done on the drawing instead of on a
   caption. The geometry is what tells you which side you are looking at, and
   the geometry is drawn to scale.

   Two things keep that honest. Each number sits ON the side it measures, so
   position carries the meaning the caption used to; and the hint still names
   the pair in words when a player asks for it, so help exists without the
   answer standing on screen for the whole round.

   The plate keeps its warm body — the world went cool, and every piece of
   interface in this game is warm against it, which is what separates the two
   layers at a glance. What changed is its RIM: it was lit warm from above,
   as it would be under the old daylight, and it now catches the moon's own
   pale green instead. Warm stone, cold moonlight on the edge. */
/* `hang` puts y at the card's TOP edge instead of its middle, so a card can
   hang from the line it measures at a fixed gap, whatever its height. */
function guideCard(x,y,value,u,align='center',minLeft=null,hang=false){
  if(u<=.01) return;
  ctx.save();
  ctx.globalAlpha *= clamp01(u);
  const rise = (1-u)*10;
  ctx.font = `800 25px ${FONT}`; ctx.textBaseline = 'middle';
  // a surd carries its radical and bar, so it needs headroom plain digits do not
  const surd = value.indexOf('√') >= 0, sb = surd ? surdBox(value, 25) : null;
  const vw = surd ? sb.width : ctx.measureText(value).width;
  const w = vw + 32, h = surd ? 40 : 38, r = 13;
  let left = align==='center' ? x - w/2 : align==='left' ? x : x - w;
  if(minLeft!=null && left < minLeft) left = minLeft;
  const top  = (hang ? y : y - h/2) + rise;
  // it sits ON the scene, so it carries its own ground shadow
  ctx.save();
  ctx.shadowColor = 'rgba(2,16,20,.55)'; ctx.shadowBlur = 11; ctx.shadowOffsetY = 4;
  roundRectPath(left, top, w, h, r);
  ctx.fillStyle = '#42122c'; ctx.fill();                    // the saw-cut edge
  ctx.restore();
  roundRectPath(left+3.5, top+3.5, w-7, h-7, r-3);
  const g = ctx.createLinearGradient(0, top, 0, top+h);
  g.addColorStop(0,'#a8482a'); g.addColorStop(.55,'#963c2d'); g.addColorStop(1,'#84322d');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(214,240,222,.6)'; ctx.lineWidth = 1.6;   // moonlight on the edge
  roundRectPath(left+4.8, top+4.8, w-9.6, h-9.6, r-4); ctx.stroke();
  /* The number is centred on its INK, measured — not on a nudge. guideText
     sets 'middle', whose line sits wherever the face's em box puts it, and a
     fixed offset tuned for one font left the digits riding low in the card.
     A radical is ink too, so a surd centres together with its sign and bar. */
  ctx.textAlign = 'center';
  const m = surd ? null : ctx.measureText(value);
  const up = surd ? sb.up : (m.actualBoundingBoxAscent || 0);
  const down = surd ? sb.down : (m.actualBoundingBoxDescent || 0);
  const dx = surd ? 0 : ((m.actualBoundingBoxLeft || 0) - (m.actualBoundingBoxRight || 0))/2;
  guideText(value, left + w/2 + dx, top + h/2 + (up - down)/2,
            {size:25, weight:800, fill:'#ffeec2', align:'center',
             outline:'rgba(46,14,8,.85)'});
  ctx.restore();
}
function elbowPath(x,y,dx,dy){
  ctx.beginPath(); ctx.moveTo(x+dx,y); ctx.lineTo(x+dx,y+dy); ctx.lineTo(x,y+dy);
}
/* ---- THE THREE SIDES, ACROSS THE TANK --------------------------------
   The sides used to be drawn BEHIND the tank, which hid the apex: the
   adjacent leg and the hypotenuse both start at the gun's pivot, and the
   pivot sits INSIDE the hull — so the one corner that shows the angle being
   solved for was the one corner buried under the sprite.
   They are in front now, but a bright line painted straight over the tank
   reads as a scratch on the paint. So the legs are drawn TWICE, each pass
   clipped to a different half of the screen:
     · everywhere except the tank's box, at full strength;
     · inside it, faded — present, subordinate, obviously behind the armour.
   Clipping is what makes this cheap AND correct: neither pass touches the
   other's pixels, so there is no double-strength overdraw where they meet,
   and the step in brightness lands exactly on the tank's own edge, which is
   where the eye expects a change anyway.
   The BOX rather than the silhouette is deliberate and it costs nothing
   here: the adjacent leg runs the length of the hull, and the hypotenuse
   leaves through the top within ~16px of the pivot — both over solid armour
   the whole time they are inside the box. */
const TANK_OVERLAY_FADE = .78;
function drawTriangleLegs(){
  if(G.guideAlpha<=.01) return;
  const t = trigTriangle(); if(!t) return;
  const leg = (k, x1, y1, x2, y2, o)=>{
    guideLeg(x1, y1, x2, y2, G.reveal[k], o);
    const hl = G.story ? G.story.hl[k] : 0;          // the story lights it in its own colour
    if(hl>0){
      ctx.save(); ctx.globalAlpha *= hl;
      guideLeg(x1, y1, x2, y2, G.reveal[k], Object.assign({}, o, SIDE_HUE[k]));
      ctx.restore();
    }
  };
  const legs = o=>{
    leg('adj', t.ax,t.ay,t.bx,t.by, o);   // adjacent
    leg('opp', t.bx,t.by,t.cx,t.cy, o);   // opposite
    leg('hyp', t.ax,t.ay,t.cx,t.cy, o);   // hypotenuse / line of fire
  };
  /* Solid over the hull, but it keeps a thin dark backing. The adjacent leg
     leaves the pivot horizontally and the gun RESTS horizontally, so that leg
     runs along the barrel — with no outline a solid cream line there is not
     hidden by the tank so much as indistinguishable from it, lost in the
     barrel's own highlight. The halo is what separates the two, and it is
     kept narrow so it reads as an edge on the line rather than as grime on
     the armour. */
  const OVER_TANK = {halo:4.6, w:2.8, blur:.5};
  const hx = TANK.x - G.recoil*.6, hy = TANK.y;   // the hull, where it is this frame

  ctx.save(); ctx.globalAlpha *= G.guideAlpha;
  // everything but the tank: the whole canvas minus the hull, wound the other
  // way so evenodd cuts the hull out of it
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.rect(hx, hy, TANK.w, TANK.h);
  ctx.clip('evenodd');
  legs();
  ctx.restore();

  ctx.save(); ctx.globalAlpha *= G.guideAlpha * TANK_OVERLAY_FADE;
  ctx.beginPath(); ctx.rect(hx, hy, TANK.w, TANK.h); ctx.clip();
  legs(OVER_TANK);
  ctx.restore();
}
/* The parts that must stay readable over everything: right-angle box, the θ
   sweep at the gun, the two given lengths, and — only once a shot has been
   committed — where the barrel is actually pointing. */
function drawGuides(){
  if(G.guideAlpha<=.01) return;
  const tri = trigTriangle(); if(!tri) return;
  const L = currentLevelData();
  const inSign = Math.sign(tri.ax-tri.bx) || -1, upSign = Math.sign(tri.cy-tri.by) || -1;

  const ru = clamp01((G.reveal.opp-.5)/.35);
  if(ru>0){
    const s = 16*ru, gap = 3;
    ctx.save(); ctx.globalAlpha *= G.guideAlpha*ru;
    /* held `gap` off both legs: drawn flush it was a third stroke crossing
       the very junction it is meant to annotate, and the corner turned to
       mush. Butt caps for the same reason the legs have them. */
    glowStroke(()=>elbowPath(tri.bx+inSign*gap, tri.by+upSign*gap, inSign*s, upSign*s),
               {w:2.6, halo:5.4, blur:.8, cap:'butt'});
    ctx.restore();
  }

  if(G.reveal.theta>0){
    const ans = Math.atan2(tri.ay-tri.cy, tri.cx-tri.ax);    // the unknown, straight off the geometry
    const u = G.reveal.theta, R = 104, swept = ans*u;
    ctx.save(); ctx.globalAlpha *= G.guideAlpha;
    glowStroke(()=>{ ctx.beginPath(); ctx.arc(tri.ax,tri.ay,R,-swept,0); },
               {w:3.6, halo:7, cap:'butt'});
    const mid = swept*.5;
    guideText('θ', tri.ax+Math.cos(mid)*(R+32), tri.ay-Math.sin(mid)*(R+32), {size:26+8*(1-u)});
    ctx.restore();
  }

  ctx.save(); ctx.globalAlpha *= G.guideAlpha;
  /* A round labels the two sides it GIVES and leaves the third blank — which
     is what makes it a tan, a sin or a cos question rather than five of the
     same. The two chips arrive on the same two beats whichever sides they
     land on, so the briefing's rhythm is unchanged. */
  const given = GIVEN_SIDES[L.type] || ['adj','opp'];
  /* the cards stand OFF their side rather than on it, so neither the glow
     nor the card has to be read through the other */
  /* On a steep round the adjacent leg is short and its midpoint lands ON the
     tank, so that card is held clear of the hull's nose instead. The other
     two are never near it. */
  const clearOfTank = TANK.x - G.recoil*.6 + TANK.w + 12;
  /* The adjacent card HANGS from its leg, 7px clear of the line's glow, so it
     reads as that leg's measurement wherever the round puts it — and stays
     well clear of the console under it. The dock is markup over the canvas,
     so anything it crosses is simply gone; its top edge is at y≈604 and a
     40px card hung here ends by 570. */
  const SIDE = {
    adj: {x:tri.ax+(tri.bx-tri.ax)/2, y:tri.by+7, align:'center', minLeft:clearOfTank, hang:true},
    opp: {x:tri.bx+22,                y:(tri.by+tri.cy)/2, align:'left'},
    hyp: {x:(tri.ax+tri.cx)/2 - 26,   y:(tri.ay+tri.cy)/2 - 38, align:'right'}
  };
  [G.reveal.chipA, G.reveal.chipO].forEach((u0,i)=>{
    const u = u0 * G.chipAlpha;
    const p = SIDE[given[i]]; if(!p) return;
    const shown = (L.show && L.show[i]) ? `${L.show[i]} ${t('m')}` : meters(L[given[i]==='adj'?'adjacent':given[i]==='opp'?'opposite':'hyp']);
    guideCard(p.x, p.y, shown, u, p.align, p.minLeft, p.hang);
  });
  ctx.restore();

  if(G.state===GameState.LAYING || G.state===GameState.PROJECTILE_FLYING){
    const p = G.shell ? G.shell.path : calculateAimPath(G.angleShown);
    ctx.save(); ctx.globalAlpha *= .8*G.guideAlpha;
    ctx.setLineDash([12,10]); ctx.lineCap='butt';
    ctx.strokeStyle='rgba(38,14,4,.4)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(p.startX,p.startY); ctx.lineTo(p.endX,p.endY); ctx.stroke();
    ctx.strokeStyle=GUIDE_SHOT; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(p.startX,p.startY); ctx.lineTo(p.endX,p.endY); ctx.stroke();
    ctx.restore();
  }
}

function drawTank(pose=commanderPose()){
  const p = TANK.pivot();
  const a = G.angleShown*Math.PI/180;
  const hx = TANK.x - G.recoil*.6;

  // subtle contact shadow directly under the tracks
  const sg = ctx.createRadialGradient(hx+TANK.w*.45, PLAY_SURFACE_Y+3, 0, hx+TANK.w*.45, PLAY_SURFACE_Y+3, TANK.w*.42);
  sg.addColorStop(0,'rgba(2,22,24,.28)'); sg.addColorStop(1,'rgba(2,22,24,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(hx+TANK.w*.45, PLAY_SURFACE_Y+3, TANK.w*.42, 7, 0,0,7); ctx.fill();

  // cannon (rotates around pivot, drawn under hull dome)
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(-a);
  const cs=SP.cannon, pv=SP.cannonPivot, sc=BARREL_SC;
  const kick = G.recoil*.9;
  ctx.drawImage(IMGS.tank, cs[0],cs[1],cs[2],cs[3],
    -pv[0]*sc - kick, -pv[1]*sc, cs[2]*sc, cs[3]*sc);
  ctx.restore();

  // muzzle flash
  if(G.flash>0){
    const m = muzzlePos(), b=SP.blast, fs=.32+G.flash;
    ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(-a);
    ctx.globalAlpha=Math.min(1,G.flash*10);
    ctx.drawImage(IMGS.shot, b[0],b[1],b[2],b[3], -14, -b[3]*fs/2, b[2]*fs, b[3]*fs);
    ctx.restore();
  }

  // turret dome covers the cannon base
  const d=SP.dome, dw=TANK.w*.19, dh=dw*d[3]/d[2];
  ctx.drawImage(IMGS.tank, d[0],d[1],d[2],d[3], p.x-dw*.52, p.y-dh*.42, dw, dh);

  // hull
  const hs=SP.hull;
  ctx.drawImage(IMGS.tank, hs[0],hs[1],hs[2],hs[3], hx, TANK.y, TANK.w, TANK.h);

  // spinning wheels overlaid on the track
  const wr=TANK.wheelR;
  TANK.wheelFr.forEach((f,i)=>{
    const wx = hx + TANK.w*f[0], wy = TANK.y + TANK.h*f[1];
    const cell = SP.wheels[i];
    const pivot = SP.wheelPivot[i] || [cell[2]*.5, cell[3]*.5];
    const sc = (wr*2) / cell[2];
    // Keep the current rested placement, but spin around the actual hub.
    const axisX = wx + (pivot[0] - cell[2]*.5) * sc;
    const axisY = wy + (pivot[1] - cell[3]*.5) * sc;
    ctx.save(); ctx.translate(axisX,axisY); ctx.rotate(G.wheelRot);
    ctx.drawImage(IMGS.tank, cell[0],cell[1],cell[2],cell[3],
      -pivot[0]*sc, -pivot[1]*sc, cell[2]*sc, cell[3]*sc);
    ctx.restore();
  });

  // the hatch on the turret ring: the lid hinges at the back, so it stands
  // behind her once it is open, and the pop bursts out from behind her too
  drawHatchLid(pose.lid);
  drawPopFx();
  drawCommander(pose.rise, pose.v);
}

/* She is cut off by the hole, not by a line: what shows is everything above
   the hole's centre plus the inside of the hole itself, so the ring's front
   lip — already painted on the hull — is what hides the rest of her.
   Her speed squashes and stretches her about the rim: tall on the way out,
   a touch squat as the spring settles and as she ducks back in. */
function drawCommander(rise, v=0){
  const img = IMGS.commander;
  if(rise<=0 || !img || !img.naturalWidth) return;
  const {h, cutY} = commanderAt(rise), s = CMDR_SC;
  const sy = 1 + Math.max(-.07, Math.min(.14, v*.012)), sx = 1 - (sy-1)*.55;
  ctx.save();
  ctx.beginPath();
  ctx.rect(h.x-W, h.y-H, W*2, H);
  ctx.ellipse(h.x, h.y, h.rx, h.ry, 0, 0, Math.PI*2);
  ctx.clip();
  ctx.translate(h.x, cutY); ctx.scale(sx, sy);
  ctx.drawImage(img, -CMDR.cx*s, -CMDR.cut*s, CMDR.w*s, CMDR.h*s);
  const face = IMGS.commanderFace;
  if(face && face.naturalWidth && commanderBlinking()){
    const [fx, fy, fw, fh, x, y] = CMDR_FACE.blink;
    ctx.drawImage(face, fx, fy, fw, fh, (x-CMDR.cx)*s, (y-CMDR.cut)*s, fw*s, fh*s);
  }
  ctx.restore();
}
/* Once she's up and still she blinks every few seconds: the first .7 s
   after she settles, then every 2.2–3.8 s, never on the way back down. Her
   mouth stays as drawn — flapping it under the caption read as mumbling. */
function commanderBlinking(){
  const c = G.cmd;
  if(!c || c.out!==null || c.dive!=null) return false;
  const up = c.t - CMD_IN.pop - CMD_SETTLE;   // seconds she has been out and still
  for(let k=0, at=.7; at<=up; at += 2.2 + .8*(1 + Math.sin(k*1.7 + .4)), k++)
    if(up < at + .12) return true;
  return false;
}

/* The pop: a ring of air thrown off her and a fan of action lines over the
   top of her helmet, both gone in under half a second. Drawn behind her, so
   they only ever show round her silhouette, never across her face. */
const POP_FX = .42;
function drawPopFx(){
  const c = G.cmd; if(!c || c.out!==null) return;
  const s = c.t - CMD_IN.pop; if(s<0 || s>POP_FX) return;
  const u = s/POP_FX, e = easeOutCubic(u), f = commanderAt(1).head;
  const r = 14 + 40*e;
  ctx.save();
  ctx.globalAlpha = 1-u;
  ctx.strokeStyle = '#fff4c8'; ctx.lineCap = 'round';
  ctx.lineWidth = .8 + 2.6*(1-u);
  ctx.beginPath(); ctx.ellipse(f.x, f.y, r, r*.86, 0, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = 1 + 1.8*(1-u);
  for(let i=0;i<7;i++){
    const a = Math.PI*(1.12 + i*.127), r0 = r + 3, r1 = r0 + 4 + 9*(1-u);
    ctx.beginPath();
    ctx.moveTo(f.x + Math.cos(a)*r0, f.y + Math.sin(a)*r0*.86);
    ctx.lineTo(f.x + Math.cos(a)*r1, f.y + Math.sin(a)*r1*.86);
    ctx.stroke();
  }
  ctx.restore();
}

/* The lid: a round plate lying in the ring, which the camera — just above
   the deck — sees as a flat ellipse. It hinges along the BACK edge of the
   hole, so opening it swings the front edge up and over: the ellipse grows
   tall as it rises, until the plate stands behind her as a near-circle with
   its inner face to the camera. Drawn in the sheet's own ink and olives,
   with the hull-sheet px of HATCH scaled to screen. */
function drawHatchLid(swing){
  const h = hatchAt(), k = h.k;
  const R = HATCH.lidR*k, d = HATCH.lidRy*k;    // its radius, and its depth when shut
  const c = Math.cos(swing), s = Math.sin(swing);
  const hingeY = h.y - d;                         // the back edge of the hole
  const cy = hingeY + d*c - R*s;                  // the plate's centre, swung up about it
  const ry = Math.max(d*.35, Math.hypot(R*s, d*c));
  const outer = swing < .08;                      // past a few degrees, the inside shows
  const th = 5*k*c;                               // the plate's edge, seen while it is low
  ctx.save();
  ctx.lineWidth = 5*k; ctx.strokeStyle = '#19212a'; ctx.lineJoin = 'round';
  ctx.fillStyle = '#434c47';
  ctx.beginPath(); ctx.ellipse(h.x, cy+th, R, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  const g = ctx.createLinearGradient(0, cy-ry, 0, cy+ry);
  if(outer){ g.addColorStop(0,'#a5b36f'); g.addColorStop(1,'#6f7d52'); }
