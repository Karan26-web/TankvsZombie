    const shown = (L.show && L.show[i]) ? `${L.show[i]} m` : meters(L[given[i]==='adj'?'adjacent':given[i]==='opp'?'opposite':'hyp']);
    guideCard(p.x, p.y, p.cap, shown, u, p.align, p.minLeft);
  });
  ctx.restore();

  if(G.state===GameState.LAYING || G.state===GameState.PROJECTILE_FLYING){
    const p = G.shell ? G.shell.path : calculateAimPath(G.angleShown);
    ctx.save(); ctx.globalAlpha *= .8*G.guideAlpha;
    ctx.setLineDash([12,10]); ctx.lineCap='butt';
    ctx.strokeStyle='rgba(38,14,4,.4)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(p.startX,p.startY); ctx.lineTo(p.endX,p.endY); ctx.stroke();
    ctx.strokeStyle=GUIDE_SHOT; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(p.startX,p.startY); ctx.lineTo(p.endX,p.endY); ctx.stroke();
    ctx.restore();
  }
}

function drawTank(){
  const p = TANK.pivot();
  const a = G.angleShown*Math.PI/180;
  const hx = TANK.x - G.recoil*.6;

  // subtle contact shadow directly under the tracks
  const sg = ctx.createRadialGradient(hx+TANK.w*.45, PLAY_SURFACE_Y+3, 0, hx+TANK.w*.45, PLAY_SURFACE_Y+3, TANK.w*.42);
  sg.addColorStop(0,'rgba(2,22,24,.28)'); sg.addColorStop(1,'rgba(2,22,24,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(hx+TANK.w*.45, PLAY_SURFACE_Y+3, TANK.w*.42, 7, 0,0,7); ctx.fill();

  // cannon (rotates around pivot, drawn under hull dome)
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(-a);
  const cs=SP.cannon, pv=SP.cannonPivot, sc=BARREL_SC;
  const kick = G.recoil*.9;
  ctx.drawImage(IMGS.tank, cs[0],cs[1],cs[2],cs[3],
    -pv[0]*sc - kick, -pv[1]*sc, cs[2]*sc, cs[3]*sc);
  ctx.restore();

  // muzzle flash
  if(G.flash>0){
    const m = muzzlePos(), b=SP.blast, fs=.32+G.flash;
    ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(-a);
    ctx.globalAlpha=Math.min(1,G.flash*10);
    ctx.drawImage(IMGS.shot, b[0],b[1],b[2],b[3], -14, -b[3]*fs/2, b[2]*fs, b[3]*fs);
    ctx.restore();
  }

  // turret dome covers the cannon base
  const d=SP.dome, dw=TANK.w*.19, dh=dw*d[3]/d[2];
  ctx.drawImage(IMGS.tank, d[0],d[1],d[2],d[3], p.x-dw*.52, p.y-dh*.42, dw, dh);

  // hull
  const hs=SP.hull;
  ctx.drawImage(IMGS.tank, hs[0],hs[1],hs[2],hs[3], hx, TANK.y, TANK.w, TANK.h);

  // spinning wheels overlaid on the track
  const wr=TANK.wheelR;
  TANK.wheelFr.forEach((f,i)=>{
    const wx = hx + TANK.w*f[0], wy = TANK.y + TANK.h*f[1];
    const cell = SP.wheels[i];
    const pivot = SP.wheelPivot[i] || [cell[2]*.5, cell[3]*.5];
    const sc = (wr*2) / cell[2];
    // Keep the current rested placement, but spin around the actual hub.
    const axisX = wx + (pivot[0] - cell[2]*.5) * sc;
    const axisY = wy + (pivot[1] - cell[3]*.5) * sc;
    ctx.save(); ctx.translate(axisX,axisY); ctx.rotate(G.wheelRot);
    ctx.drawImage(IMGS.tank, cell[0],cell[1],cell[2],cell[3],
      -pivot[0]*sc, -pivot[1]*sc, cell[2]*sc, cell[3]*sc);
    ctx.restore();
  });
}

function drawShell(){
  if(!G.shell) return;
  const s=G.shell, r=SP.shellFlame, len=95, hgt=len*r[3]/r[2];
  ctx.save();
  ctx.translate(s.x,s.y); ctx.rotate(s.a);
  ctx.drawImage(IMGS.shot, r[0],r[1],r[2],r[3], -len+18, -hgt/2, len, hgt);
  ctx.restore();
}

function drawParticles(){
  G.particles.forEach(p=>{
    const k=1-p.t/p.life;
    const px = p.world ? p.x-G.cameraX : p.x;
    if(p.kind==='smoke'){
      ctx.globalAlpha=k*.45; ctx.fillStyle='#cfd4dd';
      ctx.beginPath(); ctx.arc(px,p.y,p.r,0,7); ctx.fill();
    } else if(p.kind==='fire'){
      ctx.globalAlpha=k; ctx.fillStyle=p.t<.15?'#fff3b0':(p.t<.3?'#ffb037':'#ff5d2a');
      ctx.beginPath(); ctx.arc(px,p.y,p.r*k,0,7); ctx.fill();
    } else if(p.kind==='dust'){
      ctx.globalAlpha=k*.22; ctx.fillStyle='#7a532a';
      ctx.beginPath(); ctx.ellipse(px,p.y,p.r*1.8,p.r*.72,0,0,7); ctx.fill();
    } else { // star
      ctx.globalAlpha=Math.min(1,k*1.5); ctx.fillStyle=['#ffd23f','#ff8b3d','#8bd45e','#5ec8ff'][(p.r|0)%4];
      ctx.save(); ctx.translate(px,p.y); ctx.rotate(p.rot);
      star5(p.r); ctx.fill(); ctx.restore();
    }
  });
  ctx.globalAlpha=1;
}
function star5(r){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2?r*.45:r, a=i*Math.PI/5-Math.PI/2;
    i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
}

function drawFloaters(){
  ctx.font='700 34px '+FONT;
  ctx.textAlign='center';
  G.floaters.forEach(f=>{
    ctx.globalAlpha=Math.max(0,1-f.t/1.4);
    ctx.lineWidth=6; ctx.strokeStyle='#143119'; ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle='#8bff5e'; ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.state===GameState.PREGAME){ if(ambientMotionAllowed()) G.time+=dt; render(); return; }
  if(G.state===GameState.PAUSED){ render(); return; }
  update(dt);
  render();
}
function render(){
  syncWorldPositions();
  if(G.state===GameState.PREGAME){
    ctx.save();
    drawTitleScene();
    ctx.restore();
    return;
  }
  const nodes = visibleLevelNodes();
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  drawBG();
  drawSkyClouds();
  nodes.forEach(node=>drawTower(node.tower));
  nodes.forEach(node=>drawZombie(node.zombie));
  drawTank();
  drawTriangleLegs();      // over the tank, faded where it crosses the hull
  drawGuides();            // right angle, θ sweep, the given lengths
  drawShell();
  drawParticles();
  drawFloaters();
  ctx.restore();
  drawTransition();        // full-screen comic panel — the level swap hides under it
}

/* ============================================================
   BOOT
   ============================================================ */
$('overlayCard').innerHTML = titleMarkup(false);
wireTitleButtons();

loadAll(()=>{
  buildLayers();
  setTitleReady();
  setupLevel({enter:'none'});               // so the title screen shows a live scene behind the start layer
  setGameState(GameState.PREGAME);
  const dp = location.hash.match(/^#previewdrive(\d{1,3})$/);
  const sp = location.hash.match(/^#previewshot(\d{1,3})$/);
  const auto = location.hash==='#autoplay';
  const pv = location.hash.match(/^#preview(\d)?(f)?$/);   // headless screenshot helper
  if(auto){
    resetWorld(); G.score=0; G.hearts=3; initializeLevel(0, {resetHearts:true, revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    const autoTimer = setInterval(()=>{
      if(G.state===GameState.AIMING){
        setAngle(Math.round(currentLevelData().ans));
        pressFire();
      }
      if(G.state===GameState.GAME_COMPLETE || G.state===GameState.GAME_OVER){
        document.body.dataset.autoplay = G.state===GameState.GAME_COMPLETE ? 'complete' : 'gameover';
        document.body.dataset.level = String(G.level+1);
        document.body.dataset.score = String(G.score);
        clearInterval(autoTimer);
      }
    }, 180);
  } else if(sp){
    const progress = Math.min(100,+sp[1])/100;
    resetWorld(); initializeLevel(0, {resetHearts:true, revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    setAngle(Math.round(currentLevelData().ans));
    const path = calculateAimPath(G.angleTarget);
    G.aimPath = path;
    G.shell = {x:path.startX, y:path.startY, a:path.screenAngle, path, travelled:path.length*progress, minDz:1e9};
    G.shell.x = path.startX + (path.endX-path.startX)*progress;
    G.shell.y = path.startY + (path.endY-path.startY)*progress;
    setGameState(GameState.PROJECTILE_FLYING);
    G.guideAlpha=.55; G.prevPaused=GameState.PROJECTILE_FLYING; setGameState(GameState.PAUSED);
  } else if(dp){
    const progress = Math.min(100,+dp[1])/100;
    resetWorld(); G.level=0; setupLevel({enter:'aim'});
    $('overlay').classList.add('hidden');
    G.zombie.dead=true; G.zombie.mode='gone';
    if(G.activeNode) G.activeNode.status='CLEARED';
    setGameState(GameState.TRAVELLING); prepareDrive(); poseDriveAt(progress);
    if(progress>=1 && G.drive && G.drive.nextLevel!=null){
      const nextLevel = G.drive.nextLevel;
      G.cameraX = G.drive.cameraEnd;
      G.tankWorldX = G.drive.tankEnd;
      G.drive=null;
      initializeLevel(nextLevel, {resetHearts:false, revive:false, enter:'aim'});
      syncWorldPositions();
    } else {
      G.prevPaused=GameState.TRAVELLING; setGameState(GameState.PAUSED);
    }
  } else if(pv){
    if(pv[1]){
      const level = Math.min(+pv[1],TOTAL_LEVELS-1);
      resetWorld();
      G.cameraX = levelRestCamera(level);
      G.tankWorldX = levelRestTankX(level);
      initializeLevel(level, {resetHearts:true, revive:true, enter:'aim'});
    } else {
      initializeLevel(0, {resetHearts:true, revive:true, enter:'aim'});
    }
    $('overlay').classList.add('hidden');
    if(pv[2]) setTimeout(()=>{ setAngle(Math.round(currentLevelData().ans)); pressFire(); }, 700);
  }
  requestAnimationFrame(loop);
});
</script>
