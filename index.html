const zombieTypeOf = z => ZOMBIE_TYPES[z && z.type] || ZOMBIE_TYPES.shambler;

/* ---------- buildings: one complete structure per file ----------
   box    = content bounds [sx,sy,sw,sh] inside the 1122x1402 file
   deck   = y (image px) of the flat stand-surface on top
   deckCx = x (image px) at the centre of that flat spot — the whole
            building is positioned so this point sits under the zombie ---- */
/* All three numbers are MEASURED off the file, never chosen: tools/fit_assets.py
   reads the alpha box, then finds the widest level run along the silhouette's
   top profile and takes its centre. That matters more here than it did for the
   old skyline set, because these are ruins — their flat surface is not always
   the highest thing in the file. The plinth's grass tufts stand 40px above the
   slab a zombie stands on, and a deck read off the bounding box instead of the
   profile would hang him in the air by that much.

   THREE SHAPES, FIVE ROUNDS. assets/ruinPlinth.webp was drawn for this set and
   is deliberately NOT in it: at 2.55:1 the slab reaches 1.25 of its own height
   left of its deck, and a shape is pinned by its deck, so it would stand on the
   tank in every round — stagingFits() rejects it five times out of five. The
   number to design against is that ratio, not the silhouette: with a centred
   deck it holds only while the shape is about as tall as it is wide (aspect
   <= ~1.2), which is why a wide platform in this geometry needs a tall footing
   under the slab rather than two stubby piers. */
const BUILDINGS = [
  {img:'ruinCrypt',  box:[91,280,847,1010], deck:329, deckCx:491},  // mausoleum — flat slab lid
  {img:'ruinTower',  box:[161,139,712,1267],deck:163, deckCx:447},  // snapped bell tower — broken top course
  {img:'ruinColumn', box:[321,28,403,1484], deck:57,  deckCx:546}   // vine-wrapped column — flat capital
];
// Each building scales as one piece, so it keeps its native aspect — which
// makes WIDTH the real constraint, and specifically how far a shape reaches
// LEFT of its deck, because that edge is what closes on the tank. Which
// shapes clear which rounds is no longer a list kept by hand: stagingFits()
// asks the geometry, so a round's pool follows its angle automatically and a
// new skin joins the rotation by existing. See pickBuilding().

// each type's soles sit t.feetOffset px below its trig anchor (z.y); sink
// them Z_SINK px into the deck so the shoes grip the roof, never graze it
const Z_SINK = 3;

/* ============================================================
   LEVELS — five target nodes. Adjacent/opposite define the real
   right-triangle ratio; hypotenuse and answer are computed once.
   ============================================================ */
/* `zombie` names the type from ZOMBIE_TYPES that mans this roof. The run
   tours all three and never repeats one two rounds running, so each level
   reads as a fresh target; the finale draws the tallest silhouette. */
/* Every round is one ratio question: two sides given, theta unknown, and the
   answer is always a value off the table. Which two sides are given is what
   makes the round a tan / sin / cos question, so the run tours all three
   instead of drilling tan five times.

   `show` is what the triangle LABELS, written the way the textbook writes it.
   The standard angles are irrational everywhere except tan 45, so a round
   that gives 8.7 m has already done the recognising for the student and left
   them a division; a round that gives 5 root 3 m is the actual exercise.
   The numbers underneath are exact, so the drawn triangle is exact too.

   Only 30 and 45 appear as answers, and that is a staging limit rather than
   a teaching choice — see the note above CAMERA_FOLLOW_X. */
const R2 = Math.SQRT2, R3 = Math.sqrt(3);
/* reads a drawn label — "10", "6√3", "9√2" — back to the number it claims */
const SURD_LABEL = /^(\d+(?:\.\d+)?)(?:√(\d+))?$/;
function labelValue(txt){
  const m = SURD_LABEL.exec(String(txt).trim());
  return m ? parseFloat(m[1]) * (m[2] ? Math.sqrt(parseFloat(m[2])) : 1) : NaN;
}
/* All three table angles are used, no two rounds running share one, and the
   ratio type turns over as well — a student meets sin, cos and tan rather
   than one of them five times.
   The SIZES are not free to be a neat ascending ramp, and the reason is the
   tank. Clearance at 45 degrees works out to 0.711*opposite - 146px, so a
   45-degree round needs ~345px of opposite before its structure clears the
   hull at all; below that the round cannot be staged. 30 degrees has no such
   floor — it runs wide and low — so the shallow rounds are free to be the
   small ones and the steep rounds have to be big. The load-time check
   enforces this: an earlier draft of this table put a 6m 45-degree round at
   level 2 and the game refused to start, naming the round and the distance.
   Rounds 1 and 5 share their numbers, 5 and 10, on purpose: one asks for sin
   and one for cos, and they answer 30 and 60. Same two lengths, different
   question, different angle — which is the whole point of the table.
   SIXTY closes the run, and its position is not a preference: it is the
   steepest angle the stage can hold, which makes it both the tightest
   staging and the most dramatic picture — the target almost overhead, the
   tower's foot tucked behind the tank. Putting it last means the player meets
   that composition once they already know how to read the triangle. */
const LEVELS = [
  {id:1, ans:30, type:'sin', h:5,     hyp:10,   show:['5','10'],    zombie:'shambler'},
  {id:2, ans:45, type:'tan', d:9,     h:9,      show:['9','9'],     zombie:'runner'},
  {id:3, ans:30, type:'cos', d:7*R3,  hyp:14,   show:['7√3','14'],  zombie:'shambler'},
  {id:4, ans:45, type:'sin', h:8,     hyp:8*R2, show:['8','8√2'],   zombie:'runner'},
  {id:5, ans:60, type:'cos', d:5,     hyp:10,   show:['5','10'],    zombie:'bruiser'}
].map(L=>{
  // the third side is never given, but the triangle still has to be drawn
  const t = L.ans*Math.PI/180;
  const d   = L.d   !== undefined ? L.d   : (L.hyp!==undefined ? L.hyp*Math.cos(t) : L.h/Math.tan(t));
  const h   = L.h   !== undefined ? L.h   : (L.hyp!==undefined ? L.hyp*Math.sin(t) : L.d*Math.tan(t));
  const hyp = L.hyp !== undefined ? L.hyp : Math.hypot(d,h);
  return {...L, d, h, hyp, adjacent:d, opposite:h};
});
/* Which two sides a round hands over, in the order `show` lists them. */
const GIVEN_SIDES = {tan:['adj','opp'], sin:['opp','hyp'], cos:['adj','hyp']};
/* ...and which of them is over which in the ratio itself. The two orders are
   NOT the same — a tan round is given adjacent-then-opposite but written
   opposite OVER adjacent — so keeping them apart is what stops a hint from
   quietly teaching the ratio upside down. */
const RATIO_OVER = {tan:['opp','adj'], sin:['opp','hyp'], cos:['adj','hyp']};
const SIDE_WORD  = {adj:'ADJACENT', opp:'OPPOSITE', hyp:'HYPOTENUSE'};
const givenValues = L => {
  const v = {}; GIVEN_SIDES[L.type].forEach((side,i)=>{ v[side] = L.show[i]; }); return v;
};
/* Two rungs, and the first one is the one that teaches: naming the pair of
   sides you were handed is the whole decision a class-10 student is making,
   and the substitution after it is only arithmetic. A hint that opens on the
   ratio would hand over the step worth practising. Neither rung gives the
   angle — the table is still theirs to read. */
function hintFor(L, stage){
  const [a,b] = GIVEN_SIDES[L.type];
  if(stage <= 0) return t("You're given the {a} and the {b} — that pair is {fn} θ",
                          {a:t(SIDE_WORD[a]), b:t(SIDE_WORD[b]), fn:L.type});
  const v = givenValues(L), [over, under] = RATIO_OVER[L.type];
  return t('{fn} θ = {over} ÷ {under}', {fn:L.type, over:v[over], under:v[under]});
}
/* The level table is data, and data that lies is worse than none: a round
   whose numbers do not actually make its stated angle would teach the wrong
   ratio and still look right on screen. So it is checked, once, at load. */
LEVELS.forEach(L=>{
  if(!ANGLE_CHOICES.includes(L.ans))
    throw new Error(`level ${L.id}: ${L.ans}° is not on the class-10 table`);
  const given = {tan:L.h/L.d, sin:L.h/L.hyp, cos:L.d/L.hyp}[L.type];
  const table = {tan:Math.tan, sin:Math.sin, cos:Math.cos}[L.type](L.ans*Math.PI/180);
  if(!(Math.abs(given-table) < 1e-9))
    throw new Error(`level ${L.id}: ${L.type} of ${L.ans}° is ${table.toFixed(4)}, but its sides give ${given.toFixed(4)}`);
  if(L.show.length !== 2) throw new Error(`level ${L.id}: needs a label for each given side`);
  /* A label is data too, and one pinned to the wrong side is the worst kind
     of wrong: the picture and the number disagree and both look
     authoritative. The ratio check above cannot see it — 6 over 6√3 is the
     same fraction whichever leg you write where — so each label is parsed
     back and checked against the side it is actually drawn on. */
  const SIDE_KEY = {adj:'d', opp:'h', hyp:'hyp'};
  GIVEN_SIDES[L.type].forEach((side,i)=>{
    const want = L[SIDE_KEY[side]], got = labelValue(L.show[i]);
    if(!(Math.abs(got - want) < 1e-9))
      throw new Error(`level ${L.id}: the ${side} side measures ${want.toFixed(2)} m, `
        + `but the label drawn on it reads "${L.show[i]}" (${got.toFixed(2)} m)`);
  });
});
/* Rounds used to draw their zombie smaller the later they came, on the
   reasoning that each target stood further off than the last. The angle now
   decides that instead, and it does not follow the round order: round 3 is a
   45-degree round staged NEAR and round 4 a 30-degree one staged FAR, so a
   ramp keyed to the round number would have drawn the near target smaller
   than the far one. One size for every round is the only rule that cannot
   contradict where the geometry actually put him. */

if(LEVELS.length !== TOTAL_LEVELS) throw new Error('TOTAL_LEVELS must match LEVELS.length');

/* ============================================================
   AUDIO — everything synthesized with WebAudio (SFX + music)
   ============================================================ */
const AU = {
  ctx:null, master:null, sfxGain:null, musGain:null, muted:false,
  engine:null, musicTimer:null,
  /* Opening the audio device is the slow part — a tenth of a second on the
     main thread — so START opens it as it is pressed down (wireTitleButtons),
     and by the click that starts the game only the music is left to begin. */
  open(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : .9;
    this.master.connect(this.ctx.destination);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
    this.musGain = this.ctx.createGain(); this.musGain.gain.value = this.musicMuted ? 0 : .16;
    this.musGain.connect(this.master);
  },
  init(){ this.open(); this.startMusic(); },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:.9; },
  musicMuted:false,
  setMusicMuted(m){ this.musicMuted=m; if(this.musGain) this.musGain.gain.value = m?0:.16; },
  now(){ return this.ctx.currentTime; },

  tone(freq, t0, dur, type='sine', vol=.3, dest, bendTo){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(bendTo) o.frequency.exponentialRampToValueAtTime(bendTo, t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(dest||this.sfxGain);
    o.start(t0); o.stop(t0+dur+.05);
  },
  noise(t0, dur, vol=.4, fLow=200, fHigh=4000){
    const n = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*dur, this.ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
    n.buffer=buf;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime((fLow+fHigh)/2,t0); bp.Q.value=.6;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    n.connect(bp); bp.connect(g); g.connect(this.sfxGain);
    n.start(t0); n.stop(t0+dur);
    return {n,bp,g};
  },

  click(){ if(!this.ctx)return; this.tone(720,this.now(),.06,'square',.12); },
  tick(){ if(!this.ctx)return; this.tone(980,this.now(),.045,'square',.09); },
  /* one soft mallet note per briefing beat — the reveal has a melody */
  blip(freq){ if(!this.ctx)return; const t=this.now();
    this.tone(freq,t,.16,'triangle',.15); this.tone(freq*2,t,.07,'sine',.045); },
  /* the turret motor, held for exactly as long as the barrel is moving */
  servo(dur=.5){ if(!this.ctx)return; const t=this.now();
    this.tone(190,t,dur,'sawtooth',.05,null,270);
    this.noise(t,dur,.045,320,1100); },
  /* gun laid, target set */
  lockOn(){ if(!this.ctx)return; const t=this.now();
    this.tone(880,t,.07,'square',.09); this.tone(1320,t+.07,.1,'square',.09); },
  /* ---- the commander's hatch: every beat of it has its own sound ---- */
  /* two catches letting go, high then lower */
  latch(){ if(!this.ctx)return; const t=this.now();
    [0,.09].forEach((d,i)=>{ this.noise(t+d,.035,.32,2600,6400);
      this.tone(i?1500:1900,t+d,.045,'square',.06); }); },
  /* the lid rapping against them from underneath */
  knock(){ if(!this.ctx)return; const t=this.now();
    this.noise(t,.05,.26,700,2400);
    this.tone(210+Math.random()*50,t,.07,'square',.09,null,150); },
  /* the pressure going: a sharp burst, then the long tail of it */
  hiss(dur){ if(!this.ctx)return; const t=this.now();
    this.noise(t,.18,.34,2800,9000); this.noise(t+.05,dur,.2,3200,8000); },
  /* a dry hinge: a sawtooth climbing, shaken by a fast wobble */
  creak(dur){ if(!this.ctx)return; const t=this.now();
    const o=this.ctx.createOscillator(), l=this.ctx.createOscillator();
    const lg=this.ctx.createGain(), g=this.ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(330,t); o.frequency.linearRampToValueAtTime(520,t+dur);
    l.frequency.value=34; lg.gain.value=60; l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); l.start(t); o.stop(t+dur+.05); l.stop(t+dur+.05); },
  /* steel on its stop: a struck plate's inharmonic partials over a thud —
     pitched down for the slam shut, so the two ends of the scene rhyme */
  clang(shut){ if(!this.ctx)return; const t=this.now(), f=shut ? .78 : 1;
    [[523,.14,.55],[1431,.09,.42],[2207,.06,.3],[3130,.04,.22]]
      .forEach(([hz,v,d])=>this.tone(hz*f,t,d,'sine',v));
    this.tone(shut?80:105,t,.22,'sine',.4,null,55);
    this.noise(t,.06,.34,500,5000); },
  /* her, out of it like a cork */
  popOut(){ if(!this.ctx)return; const t=this.now();
    this.tone(240,t,.13,'sine',.32,null,1250);
    this.tone(480,t+.01,.09,'triangle',.1,null,2100);
    this.noise(t,.05,.14,1200,4800); },
  /* …and back down she goes */
  duckIn(){ if(!this.ctx)return; const t=this.now();
    this.tone(950,t,.15,'sine',.22,null,240); },
  fire(){
    if(!this.ctx)return; const t=this.now();
    this.noise(t,.28,.5,80,1500);
    this.tone(150,t,.3,'sine',.55,null,42);
    this.tone(60,t,.4,'triangle',.4,null,30);
  },
  whoosh(dur){
    if(!this.ctx)return; const t=this.now();
    const {bp}=this.noise(t,dur,.16,900,2400);
    bp.frequency.setValueAtTime(2200,t);
    bp.frequency.exponentialRampToValueAtTime(500,t+dur);
  },
  /* the safe zone's gates: heavy steel rolling on a track — a low grinding
     rumble under a slow clatter of rollers, for as long as they move */
  gateRumble(dur){
    if(!this.ctx)return; const t=this.now();
    this.noise(t,dur,.22,60,420);
    this.tone(52,t,dur,'sawtooth',.06,null,46);
    for(let k=0;k<dur/.11;k++) this.noise(t+k*.11,.03,.08,900,2600); },
  /* a firework: the crack of the burst, then its crackle settling */
  firework(){
    if(!this.ctx)return; const t=this.now();
    this.noise(t,.12,.3,300,2600);
    this.tone(140,t,.18,'sine',.22,null,60);
    for(let k=0;k<6;k++) this.noise(t+.12+k*.05+Math.random()*.03,.03,.07,3000,9000); },
  explode(big){
    if(!this.ctx)return; const t=this.now();
    this.noise(t,big?.9:.55,big?.7:.5,60,900);
    this.tone(120,t,big?.8:.5,'sine',.6,null,28);
  },
  zombiePop(){
    if(!this.ctx)return; const t=this.now();
    this.tone(300,t,.16,'square',.3,null,900);           // comedic rising pop
    this.tone(140,t+.05,.25,'sawtooth',.22,null,50);     // splat
    this.noise(t+.02,.2,.25,1200,4200);
  },
  zombieUhOh(){
    if(!this.ctx)return; const t=this.now();
    this.tone(500,t,.12,'triangle',.25);
    this.tone(370,t+.15,.2,'triangle',.25);
  },
  /* the story's zombies coming up out of the road: a low, wobbling moan,
     pitched per zombie so six of them are six voices */
  groan(p=1){
    if(!this.ctx)return; const t=this.now();
    this.tone(150*p,t,.55,'sawtooth',.06,null,92*p);
    this.tone(228*p,t+.05,.45,'triangle',.08,null,140*p); },
  wrong(){
    if(!this.ctx)return; const t=this.now();
    this.tone(280,t,.22,'sawtooth',.22,null,240);
    this.tone(240,t+.24,.35,'sawtooth',.22,null,170);
  },
  success(){
    if(!this.ctx)return; const t=this.now();
    [523,659,784,1047].forEach((f,i)=> this.tone(f,t+i*.09,.32,'triangle',.32));
    this.tone(2093,t+.4,.3,'sine',.15);
  },
  fanfare(){
    if(!this.ctx)return; const t=this.now();
    [523,523,659,784,1047,784,1047].forEach((f,i)=> this.tone(f,t+i*.13,.3,'square',.16));
    [262,330,392,523].forEach((f,i)=> this.tone(f,t+i*.13,.4,'triangle',.2));
  },
  engineStart(){
    if(!this.ctx || this.engine) return;
    const o=this.ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=52;
    const o2=this.ctx.createOscillator(); o2.type='square'; o2.frequency.value=26;
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=11;
    const lg=this.ctx.createGain(); lg.gain.value=6;
    lfo.connect(lg); lg.connect(o.frequency);
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
    const g=this.ctx.createGain(); g.gain.value=0;
    g.gain.linearRampToValueAtTime(.25,this.now()+.25);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfxGain);
    o.start(); o2.start(); lfo.start();
    this.engine={o,o2,lfo,g};
  },
  engineDrive(speed01){
    if(!this.engine || !this.ctx) return;
    const e=this.engine, t=this.now(), k=Math.max(0,Math.min(1,speed01));
    e.o.frequency.setTargetAtTime(46 + k*20, t, .08);
    e.o2.frequency.setTargetAtTime(23 + k*10, t, .08);
    e.g.gain.setTargetAtTime(.12 + k*.15, t, .08);
  },
  engineStop(){
    if(!this.engine) return;
    const e=this.engine, t=this.now();
    e.g.gain.linearRampToValueAtTime(0,t+.3);
    setTimeout(()=>{try{e.o.stop();e.o2.stop();e.lfo.stop();}catch(_){}} ,400);
    this.engine=null;
  },
  /* spooky minor-key chiptune loop */
  startMusic(){
    if(this.musicTimer) return;
    const mel=[330,392,494,440, 494,523,494,440, 392,440,494,392, 349,330,311,330];
    const bass=[82,82,110,110, 87,87,98,98, 82,82,110,110, 98,98,82,82];
    let step=0, next=this.ctx.currentTime+.1;
    const beat=.275;   // the loop paces the room; eased with the rest of the game
    this.musicTimer = setInterval(()=>{
      while(next < this.ctx.currentTime + .3){
        const i=step%16;
        if(i%2===0) this.tone(bass[i],next,beat*1.7,'triangle',.5,this.musGain);
        this.tone(mel[i],next,beat*.92,'square',.18,this.musGain);
        if(i%4===2) this.noise(next,.05,.03,5000,9000);
        next+=beat; step++;
      }
    },120);
  }
};

/* ============================================================
   GAME STATE
   ============================================================ */
const GameState = {
  PREGAME:'PREGAME',
  STORY:'STORY',        // the opening story, between START and the first round
  INTRO:'INTRO',        // tank rolls into firing position, camera in tow
  COMMANDER:'COMMANDER',// the hatch opens and she asks for the lesson — once
  BRIEFING:'BRIEF',     // the triangle draws itself in, one side at a time
  AIMING:'AIM',
  LAYING:'LAYING',      // barrel swings to the angle the player committed to
  PROJECTILE_FLYING:'FIRING',
  HIT_REACTION:'BURST',
  OUTRO:'OUTRO',        // the road is clear: into the safe zone, then Mission Complete
  TRAVELLING:'DRIVE',
  GAME_OVER:'GAMEOVER',
  GAME_COMPLETE:'WIN',
  PAUSED:'PAUSED'
};
const G = {
  state:GameState.PREGAME, 
  level:0, shells:3, tries:0,
  angleTarget:DEFAULT_START_ANGLE,      // the number in the dock — the player's answer
  angleShown:BARREL_REST_ANGLE,         // where the barrel actually points
  barrelTarget:BARREL_REST_ANGLE,
  chipAlpha:1,                          // the measured lengths, gone once FIRE lands
  lay:null, brief:null, outro:null, cmd:null,  // active choreography, if any
  reveal:{adj:0,opp:0,hyp:0,theta:0,chipA:0,chipO:0},
  aimPath:null, shell:null, particles:[],
  shake:0, recoil:0, flash:0, guideAlpha:1,
  cameraX:0, tankWorldX:0, tankVel:0,
  zombie:{worldX:0,x:0,y:0,frame:0,animT:0,mode:'idle',burstF:0,dead:false},

/* ============================================================
   BACKGROUND PLATE — one complete 16:9 landscape. Gameplay sprites
   are drawn separately on top, so the world reads as one illustration
   instead of stacked/tiled scenery strips.
   ============================================================ */
const BGL = {};
function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function drawCover(g,img,x,y,w,h){
  const sc = Math.max(w/img.width, h/img.height);
  const sw = w/sc, sh = h/sc;
  const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
  g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function buildLayers(){
  const baseScenes = ['scene','scene2','scene3','scene4','scene5'].map(k=>{
    const c = makeCv(W,H), g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    drawCover(g, IMGS[k], 0, 0, W, H);
    return c;
  });
  const overlap = 360, stride = W - overlap;
  // …on past the last zombie to the safe zone, which the mission ends inside
  const neededWidth = FIRST_TARGET_WORLD_X + TARGET_SPACING*(TOTAL_LEVELS-1) + SAFE_ZONE_RUN + W + 240;
  const sceneCount = Math.max(baseScenes.length, Math.ceil((neededWidth-W)/stride)+1);
  BGL.scenes = Array.from({length:sceneCount}, (_,i)=>baseScenes[i%baseScenes.length]);
  BGL.world = makeCv(stride*(BGL.scenes.length-1)+W, H);
  const wg = BGL.world.getContext('2d');
  wg.drawImage(BGL.scenes[0], 0, 0);
  for(let i=1; i<BGL.scenes.length; i++){
    const x = i*stride, scene = BGL.scenes[i];
    wg.drawImage(scene, overlap,0,W-overlap,H, x+overlap,0,W-overlap,H);
    const blend = makeCv(overlap,H), bg = blend.getContext('2d');
    bg.drawImage(scene, 0,0,overlap,H, 0,0,overlap,H);
    const fade = bg.createLinearGradient(0,0,overlap,0);
    fade.addColorStop(0,'rgba(255,255,255,0)');
    fade.addColorStop(1,'rgba(255,255,255,1)');
    bg.globalCompositeOperation='destination-in';
    bg.fillStyle=fade; bg.fillRect(0,0,overlap,H);
    bg.globalCompositeOperation='source-over';
    wg.drawImage(blend, x, 0);
  }
  bakeCloud();
}

/* nbMist.webp is a 1254² plate that is mostly empty padding, and no cloud
   ever draws wider than ~330px. Bake the tight crop down once into a
   right-sized offscreen canvas: the per-frame draws then sample a small
   texture instead of a 6MB one, and the downscale is filtered once instead of
   every frame.
   The wisp is far flatter than the daytime cloud it replaces — 3.8:1 against
   2.1:1 — so the same widths now draw a thread of ground fog rather than a
   puff, which is what a night sky over a swamp wants. The sizes below are
   unchanged on purpose. */
const CLOUD_SRC = [38,465,1191,312];      // measured content box in nbMist.webp
function bakeCloud(){
  const [sx,sy,sw,sh] = CLOUD_SRC;
  const bw = 512, bh = Math.round(bw*sh/sw);
  BGL.cloud = makeCv(bw,bh);
  const g = BGL.cloud.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(IMGS.cloud, sx,sy,sw,sh, 0,0, bw,bh);
  BGL.cloudAspect = sw/sh;
}

/* ---------- tank geometry ---------- */
const TANK = { w:288 };    // pivot lands ~19% across at rest
TANK.h  = TANK.w * SP.hull[3]/SP.hull[2];           // hull draw height
TANK.baseY = PLAY_SURFACE_Y - TANK.h + TANK_BOTTOM_PADDING;
Object.defineProperties(TANK, {
  x:{get(){ return G.tankWorldX - G.cameraX; }},
  y:{get(){
    const roll = G.drive ? Math.sin(G.time*15)*1.2*Math.min(1,Math.abs(G.tankVel)/210) : 0;
    return TANK.baseY + roll;
  }}
});
// cannon pivot sits on the turret ring (tuned visually)
TANK.pivot = ()=>({ x:TANK.x + TANK.w*0.44 - G.recoil*.6, y:TANK.y + TANK.h*0.10 });
const BARREL_LEN = TANK.w*.6, BARREL_SC = BARREL_LEN/(SP.cannonTip[0]-SP.cannonPivot[0]);
// spinning wheel overlay positions (fraction of hull rect) — measured off the
// hull art's baked road-wheel discs so the overlays land exactly on them
TANK.wheelFr = [[.195,.83],[.346,.83],[.499,.83],[.653,.83]];
TANK.wheelR  = TANK.h*.195;

/* ---------- the commander's hatch ----------
   The turret ring painted on the hull already has an open hole in it. The
   hatch is a lid laid over that hole — drawn here rather than painted,
   because it has to swing — and the commander climbs out through the same
   hole. HATCH is in hull-sheet px (inside SP.hull), measured off the art:
   the hole's dark interior, outline included, at its widest row. */
const HATCH = {cx:410, cy:33, rx:84, ry:7,
               lidR:90, lidRy:8};               // the lid overlaps the rim a little
const LID_OPEN = 100*Math.PI/180;               // just past upright: a shield at her back
/* tools/fit_assets.py commander: her helmet width, the row the rim cuts her
   off at, and the column that centres her in the hole */
const CMDR = {w:381, h:427, headW:300, top:3, cut:306, cx:194};
/* tools/fit_assets.py face: her expressions, as overlays on commander.webp —
   [sx, sy, w, h] on the sheet, then [x, y] where each sits on the bust */
const CMDR_FACE = {blink:[0,0,142,77,160,157]};
const CMDR_HEAD = 40;                           // helmet width on screen; the hole is 48
const CMDR_SC = CMDR_HEAD/CMDR.headW;
function hatchAt(){
  const k = TANK.w/SP.hull[2], hx = TANK.x - G.recoil*.6;
  return {x:hx+HATCH.cx*k, y:TANK.y+HATCH.cy*k, rx:HATCH.rx*k, ry:HATCH.ry*k, k, hx};
}
/* where she is for a given climb: 0 is out of sight under the rim, 1 is
   shoulders-out. `head` is the middle of what shows — the camera aims there. */
function commanderAt(rise=1){
  const h = hatchAt(), tall = (CMDR.cut-CMDR.top)*CMDR_SC;
  const cutY = h.y + h.ry*.5 + (1-rise)*(tall + h.ry + 2);
  return {h, cutY, head:{x:h.x, y:cutY - tall*.5}};
}

/* The gun's rotation centre for a tank parked at this screen x. This is the
   apex of the level's triangle AND the one point every shot's line passes
   through — the muzzle at angle θ always sits on the ray leaving here at θ —
   so placing a target on that ray guarantees the drawn angle and the angle
   that actually hits are the same number. */
function pivotFromTankScreen(tankScreenX){
  return {x:tankScreenX + TANK.w*.44, y:TANK.baseY + TANK.h*.10};
}
/* The bound TARGET_SET_BACK is chosen against, made executable: the right
   angle is drawn where the gun's line meets the target's column, so the
   target's foot line has to stay BELOW that line or the corner comes off the
   building and floats over the field in front of it. */
const CORNER_FOOTING = TARGET_BASE_Y - pivotFromTankScreen(0).y;
if(CORNER_FOOTING < 12) throw new Error(
  `TARGET_SET_BACK is ${Math.round(-CORNER_FOOTING+12)}px too deep — the triangle's right angle would fall off the building it belongs to`);
function muzzlePos(angleDeg=G.angleShown){
  const p=TANK.pivot(), a=angleDeg*Math.PI/180;
  return { x:p.x + Math.cos(a)*BARREL_LEN, y:p.y - Math.sin(a)*BARREL_LEN };
}
function calculateAimPath(angleDeg=G.angleShown){
  const start = muzzlePos(angleDeg), a=angleDeg*Math.PI/180;
  const dx = Math.cos(a), dy = -Math.sin(a);
  const candidates = [];
  if(dx>.001) candidates.push((W+80-start.x)/dx);
  if(dy<-.001) candidates.push((-80-start.y)/dy);
  const length = Math.max(120, Math.min(...candidates.filter(v=>v>0)));
  const endX = start.x + dx*length, endY = start.y + dy*length;
  return {startX:start.x, startY:start.y, endX, endY, angle:a, screenAngle:Math.atan2(dy,dx), angleDeg, length, dirX:dx, dirY:dy};
}

/* ---- where a round lands, for one building at one framing -------------
   The building scales as ONE piece so its flat deck passes exactly under the
   zombie's soles, and slides sideways so the deck's centre (deckCx) sits at
   the zombie's x — he stands on the flat spot, not the art's centre. Because
   the scale is uniform, height drags width along with it, which is why
   `reachLeft` (how far the shape spills LEFT of where it is pinned) is the
   number that decides how close the building crowds the tank.
   ONE source of truth: makeLevelNode places with this and stagingFits vets
   with it, so what is checked is exactly what gets drawn. */
function fitBuilding(level, bld){
  const L = LEVELS[level];
  /* Only the gun's HEIGHT matters here — where the tank stands across the
     frame is decided afterwards, by frameRound(), and none of this depends
     on it. Keeping the two apart is what lets the composition be centred
     without the geometry moving. */
  const gunY = pivotFromTankScreen(0).y;
  /* Both legs come off the same ruler, so the drawn triangle carries the
     level's own ratio by construction — h/d is tan(theta) whatever the
     scale, and the load-time check already proved h/d is this round's angle. */
  const zombieY = gunY - L.h * WORLD_SCALE;
  const zType = ZOMBIE_TYPES[L.zombie] ? L.zombie : 'shambler';
  const t = ZOMBIE_TYPES[zType], zScale = 1;
  const [bsx,bsy,bsw,bsh] = bld.box;
  const deckPlaneY = zombieY + t.feetOffset*zScale - Z_SINK;
  const s = (TARGET_BASE_Y - deckPlaneY) / (bsy + bsh - bld.deck);
  const reachLeft = (bld.deckCx - bsx) * s;
  return {
    zombieY, zType, zScale, reachLeft,
    adjacentPx: L.d * WORLD_SCALE,                        // gun to the target's column
    towerY: deckPlaneY - (bld.deck - bsy) * s,
    w: bsw * s,
    top: zombieY + (t.feetOffset - t.tallest) * zScale    // its zombie's crown
  };
}

/* ---- CENTRING --------------------------------------------------------
   The scene is the tank and the thing it is aiming at, and the frame should
   hold that PAIR in the middle. It never did: the tank was pinned to a fixed
   x near the left edge and everything else grew rightwards from it, so a
   round's composition sat as far left as its triangle was short — the small
   ones worst of all, which is most of them. What was left over was dead
   grass on the right.
   So the tank's resting x is derived, not fixed: measure the content from
   the tank's own left edge to whichever reaches further right — the
   structure's far wall or the zombie standing on it — and give the frame
   equal margins either side. The tank now stands between roughly x=220 and
   x=340 depending on the round, and each round arrives centred.
   Note what this does NOT touch: clearance is a distance BETWEEN two things
   that move together, so nothing about the staging changes — only where the
   whole picture sits. */
const ZOMBIE_HALF = 92;   // how far a pose spreads either side of its column
function frameRound(level, bld){
  const f = fitBuilding(level, bld);
  const targetOff = TANK.w*.44 + f.adjacentPx;     // tank's left edge → target column
  const contentW  = Math.max(targetOff - f.reachLeft + f.w, targetOff + ZOMBIE_HALF);
  const tankScreenX = Math.round((W - contentW) / 2);
  return Object.assign(f, {
    tankScreenX,
    screenX: tankScreenX + targetOff,
    left:    tankScreenX + targetOff - f.reachLeft,
    right:   tankScreenX + contentW
  });
}

/* ---- how far right this round can stand its target ---------------------
   Three things bound it, and the round is framed at the last x that keeps
   all three: its zombie's tallest pose stays clear of the stage's ceiling,
   its building stays whole inside the frame (these are complete
   illustrations — a cropped one reads as a bug, not as depth), and the
   OPPOSITE label keeps its own margin on the right.
   The framing used to be searched for — the widest one the ceiling allowed.
   That search is gone with the ruler: there is exactly one place a round's
   target can stand, so what were bounds to search inside are now facts to
   CHECK. A round that will not fit is a level-design error, and it is thrown
   at load rather than quietly reframed into a lie about its own numbers. */

/* Ground left open between the tank's nose and the structure's near wall.
   Both sit on the same framing, so this is the same number wherever the
   composition is centred — which is why centring cost the staging nothing. */
function tankClearance(level, bld){
  const f = fitBuilding(level, bld);
  return f.adjacentPx + TANK.w*.44 - f.reachLeft - TANK.w;
}
/* Whether a shape can stand a round at all. A steep round pulls its target in
   toward the gun while a tall deck pushes the shape's reach out, so the wide
   ones simply run out of room — this is the question the hand-written pools
   used to answer by eye, asked of the geometry instead. */
/* a declaration, not a const: the level table validates itself at load, and
   that check runs stagingFits from further UP the file than this sits */
function clearanceFloor(level){
  return LEVELS[level].ans >= 60 ? TANK_TUCK : MIN_TANK_CLEARANCE;
}
function stagingFits(level, bld){
  const f = frameRound(level, bld);
  return f.tankScreenX >= TARGET_EDGE_MARGIN && tankClearance(level, bld) >= clearanceFloor(level);
}

function makeLevelNode(level, targetWorldX, bld){
  const L = LEVELS[level];
  const f = frameRound(level, bld);
  const screenX = f.screenX;
  const buildingWorldX = targetWorldX - f.reachLeft;
  const zombie = {
    offsetX:f.reachLeft, offsetY:0,
    worldX:targetWorldX, x:targetWorldX-G.cameraX, y:f.zombieY,
    type:f.zType, scale:1, frame:0, animT:0, mode:'idle', burstF:0, dead:false
  };
  const tower = {worldX:buildingWorldX, x:buildingWorldX - G.cameraX, y:f.towerY, w:f.w, h:TARGET_BASE_Y-f.towerY, bld};
  return {
    level, screenX, tankScreenX:f.tankScreenX, targetWorldX, worldX:buildingWorldX, tower, zombie,
    targetHeight:tower.h, zombieOffsetX:zombie.offsetX, zombieOffsetY:zombie.offsetY,
    status:level===0 ? 'ACTIVE' : 'UPCOMING',
    data:{...L}
  };
}

/* One shape per round, no repeats inside a run, and never one that cannot
   stand the round. The ORDER of the picking is the whole trick: a 45-degree
   round pulls its target in close and only the slimmest shapes still clear
   the tank there, while a 30-degree round can take anything. Let the roomy
   rounds choose first and they strip the few shapes the tight rounds depend
   on, and the run ends up drawing the same building twice. Fewest options
   chooses first. */
function assignBuildings(){
  const fits = LEVELS.map((L,level)=>BUILDINGS.filter(b=>stagingFits(level, b)));
  const order = fits.map((f,level)=>level).sort((a,b)=>fits[a].length-fits[b].length);
  const picks = new Array(TOTAL_LEVELS), used = new Set();
  order.forEach(level=>{
    const free = fits[level].filter(b=>!used.has(b));
    const pool = free.length ? free : (fits[level].length ? fits[level] : BUILDINGS);
    picks[level] = pool[Math.floor(Math.random()*pool.length)];
    used.add(picks[level]);
  });
  return picks;
}
function buildLevelNodes(){
  const picks = assignBuildings();
  return picks.map((bld,level)=>
    makeLevelNode(level, FIRST_TARGET_WORLD_X + level*TARGET_SPACING, bld));
}
/* With the ruler holding the framing still, a round either fits the stage or
   it does not — there is no reframing it. Both ways it can fail are checked
   at load, naming the number that caused it, because either one is a level
   the player would otherwise meet as a cropped picture or a tower standing on
   the tank. Loosen the level's metres or WORLD_SCALE; there is no third fix. */
LEVELS.forEach((L,level)=>{
  const f = fitBuilding(level, BUILDINGS[0]);
  if(f.top < TARGET_TOP_MARGIN)
    throw new Error(`level ${L.id}: ${L.h.toFixed(2)} m of opposite is ${Math.round(L.h*WORLD_SCALE)}px `
      + `at ${WORLD_SCALE} px/m, which puts its zombie ${Math.round(TARGET_TOP_MARGIN-f.top)}px through the ceiling`);
  if(!BUILDINGS.some(b=>stagingFits(level, b)))
    throw new Error(`level ${L.id}: nothing in the set can stand it — at ${Math.round(f.adjacentPx)}px out `
      + `every shape either overlaps the tank or is too wide for the frame`);
});

function currentNode(){
  return G.activeNode || G.levelNodes[G.level] || null;
}

function currentLevelData(){
  const node = currentNode();
  return node ? node.data : LEVELS[G.level];
}

function resetZombie(z){
  z.frame=0; z.animT=0; z.mode='idle'; z.burstF=0; z.dead=false;
}

function activateLevel(level, revive=true){
  G.level = Math.max(0,Math.min(level, TOTAL_LEVELS-1));
  G.activeNode = G.levelNodes[G.level] || null;
  G.tower = G.activeNode ? G.activeNode.tower : null;
  G.zombie = G.activeNode ? G.activeNode.zombie : null;
  G.levelNodes.forEach((node,i)=>{
    if(i<G.level && node.status!=='OFFSCREEN') node.status='PASSED';
    else if(i===G.level) node.status='ACTIVE';
    else if(i>G.level) node.status='UPCOMING';
  });
  if(revive && G.zombie) resetZombie(G.zombie);
  syncWorldPositions();
}

function syncWorldPositions(){
  G.levelNodes.forEach(node=>{
    node.tower.worldX = node.worldX;
    node.tower.x = node.tower.worldX - G.cameraX;
    node.zombie.worldX = node.worldX + node.zombie.offsetX;
    node.zombie.x = node.zombie.worldX - G.cameraX;
  });
}

/* ============================================================
   LEVEL SETUP
   ============================================================ */
function initializeLevel(levelIndex, {revive=true, enter='brief', fast=false}={}){
  G.level = Math.max(0, Math.min(levelIndex, TOTAL_LEVELS-1));
  G.tries = 0;
  G.shell=null; G.aimPath=null; G.hitDelay=0;
  G.particles.length=0;
  G.drive=null; G.tankVel=0; G.dustT=0; G.lay=null; G.brief=null;
  G.angleShown = G.barrelTarget = BARREL_REST_ANGLE;
  G.shells = SHELLS; renderShells('load');    // a new zombie, a full rack
  if(!G.levelNodes.length) G.levelNodes = buildLevelNodes();
  activateLevel(G.level, revive);

  if(enter!=='none'){
    G.cameraX = levelRestCamera(G.level);
    G.tankWorldX = levelRestTankX(G.level);
    syncWorldPositions();
  }

  setAngle(DEFAULT_START_ANGLE);
  resetHint(); GameBus.pendingQuestion = true;
  if(enter==='brief') beginBriefing({fast});
  else if(enter==='aim') enterAiming({instant:true});
  else { clearReveal(); G.guideAlpha=0; stowDock(true); updateControlsForState(); }
}

function setupLevel(opts={}){
  initializeLevel(G.level, {revive:true, enter:'brief', ...opts});
}

/* ============================================================
   CHOREOGRAPHY — one rhythm, replayed every round:

     roll in ▸ adjacent ▸ opposite ▸ hypotenuse ▸ θ ▸ givens ▸ controls

   Nothing here uses setTimeout: every beat is a position on one clock that
   the game loop advances, so pausing, restarting and fast-forwarding all
   behave, and the whole feel is tuned from the CUES table above.
   ============================================================ */
function clearReveal(){ REVEAL_KEYS.forEach(k=>G.reveal[k]=0); }
function revealAll(){ REVEAL_KEYS.forEach(k=>G.reveal[k]=1); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function stowDock(stowed){ $('controlDock').classList.toggle('is-stowed', !!stowed); }

/* the opening: tank drives in from off-screen left, world scrolling with it */
function beginIntro(onArrive=beginBriefing){
  const restCam = levelRestCamera(0), restTank = levelRestTankX(0);
  G.cameraX = Math.max(0, restCam - INTRO_PAN);
  G.tankWorldX = restTank - INTRO_ROLL_IN;
  G.tankVel = 0; G.dustT = 0; G.wheelRot = 0;
  G.guideAlpha = 0; clearReveal(); stowDock(true);
  G.angleShown = G.barrelTarget = BARREL_REST_ANGLE;
  syncWorldPositions();
  setGameState(GameState.INTRO);
  GameBus.screen('intro', 'intro');
  G.drive = {t:0, nextLevel:null, tankStart:G.tankWorldX, tankEnd:restTank,
             cameraStart:G.cameraX, cameraEnd:restCam,
             onArrive};
  if(!ambientMotionAllowed()){ poseDriveAt(1); finishDrive(); }
}

function beginBriefing(opts){
  const fast = !!(opts && opts.fast);
  G.lay = null; G.barrelTarget = BARREL_REST_ANGLE;
  clearReveal(); stowDock(true);
  setGameState(GameState.BRIEFING);
  /* Later rounds run a little quicker — the player already knows the shape
     of the score by then — but only a little: this is the round's one
     explanation, and outrunning it to save a second is a bad trade. A
     retry is the exception; that player has seen this exact triangle. */
  G.brief = {t:0, rate:fast ? 1.6 : (G.level===0 ? 1 : 1.12), fired:0};
  /* the answerable screen is mounting: every route into a round — the intro
     hand-off, the drive to the next tower, a retry — passes through here */
  if(GameBus.running && GameBus.pendingQuestion){
    GameBus.pendingQuestion = false;
    GameBus.questionStarted();
  }
  if(!ambientMotionAllowed()) finishBriefing();
}
function updateBriefing(dt){
  const b = G.brief; if(!b) return;
  b.t += dt*b.rate;
  CUES.forEach(c=>{ G.reveal[c.key] = easeOutCubic(clamp01((b.t-c.at)/c.dur)); });
  while(b.fired<CUES.length && b.t>=CUES[b.fired].at){ AU.blip(CUES[b.fired].note); b.fired++; }
  if(b.t>=BRIEF_END) finishBriefing();
}
function finishBriefing(){ G.brief = null; enterAiming(); }

/* hand the round over to the player: triangle complete, controls ride up */
function enterAiming({instant=false}={}){
  revealAll(); stowDock(false);
  G.lay = null; G.barrelTarget = BARREL_REST_ANGLE;
  if(instant){ G.guideAlpha = 1; G.angleShown = BARREL_REST_ANGLE; }
  setGameState(GameState.AIMING);
  angleInput.value = G.angleTarget;
  if(!instant) announceShells();     // the rack is in play from here
}

/* the cinematics are skippable — a replay shouldn't cost the player 5 seconds */
function inChoreo(){ return G.state===GameState.INTRO || G.state===GameState.BRIEFING
  || G.state===GameState.OUTRO || G.state===GameState.COMMANDER; }
function skipChoreo(){
  if(G.state===GameState.OUTRO) return skipOutro();
  if(G.state===GameState.INTRO){ if(G.drive){ poseDriveAt(1); finishDrive(); } return true; }
  if(G.state===GameState.BRIEFING){ finishBriefing(); return true; }
  if(G.state===GameState.COMMANDER) return skipCommander();
  return false;
}

/* ============================================================
   THE COMMANDER — her hatch scene
   Beat 5 of the story opens it ("Let's get into the tank!"): the hatch
   opens, she climbs out, and the camera closes in on her. The story keeps
   her up for beats 6-9 and eases the camera back off her (zoomBack); NEXT
   on beat 9 hands over to the lesson (openLesson), and when the student
   comes back she ducks inside, the hatch shuts, and round one's briefing
   begins. One clock on the game loop, settled at once under reduced motion.
   ============================================================ */
/* The score, in seconds. Two movements — the hatch, then the pop — and
   every beat lands on its own sound, so the ear follows it as well as the
   eye does:
     push   the camera leans in on the turret before anything moves
     latch  two catches let go, and the lid raps against them three times
     crack  it lifts a finger's width and the pressure goes: hiss, steam
     throw  it is flung open, creaking, and CLANGS against its stop
     pop    a beat of empty hatch, then she springs out — and the camera
            punches in with her */
const CMD_IN = {
  push:[0,.6], latch:.3, knocks:[.4,.52,.64], crack:[.78,1.02], throw:[1.02,1.18],
  pop:1.6, punch:[1.6,1.95]
};
const CMD_OUT = {duck:[0,.16], slam:[.2,.34], zoom:[.32,.95], end:1.0};
const CMD_ZOOM = 3.4;
const CMD_PUSH = .42;                // the share of the close-up the opening lean-in takes (2x)
const CMD_FRAME = {x:.3, y:.44};     // where her face settles, as a share of the screen
const CMD_SETTLE = .3;               // her spring has come to rest this long after the pop
const LID_CRACK = .2;                // radians the pressure lifts it before it is thrown
const span = (t,[a,b]) => clamp01((t-a)/(b-a));

function beginCommander(){
  G.lay = null; G.barrelTarget = BARREL_REST_ANGLE;
  clearReveal(); stowDock(true);
  G.cmd = {t:0, out:null, ready:false, steamT:0, zoomBack:null, zoomFrom:0, dive:null};
  setGameState(GameState.COMMANDER);
  if(!ambientMotionAllowed()) G.cmd.t = CMD_IN.punch[1] + .4;   // already up
}
function updateCommander(dt){
  const c = G.cmd; if(!c) return;
  const h = hatchAt();
  if(c.out!==null){
    const was = c.out; c.out += dt;
    if(was<CMD_OUT.slam[1] && c.out>=CMD_OUT.slam[1]){
      AU.clang(true); G.shake = 4; hatchSteam(h, 5, true);
    }
    if(c.out>=CMD_OUT.end) finishCommander();
    return;
  }
  const was = c.t;
  c.t += dt;
  /* A beat fires when the clock steps over it. A skip jumps the clock by
     seconds, and every beat it jumps is dropped, so a tap does not set the
     whole score off in one chord. */
  const t = c.t, I = CMD_IN, at = x => t-was < .2 && was < x && t >= x;
  if(at(I.latch)) AU.latch();
  I.knocks.forEach(k=>{ if(at(k)) AU.knock(); });
  if(at(I.crack[0])) AU.hiss(.9);
  if(at(I.throw[0])) AU.creak(I.throw[1]-I.throw[0]+.06);
  if(at(I.throw[1])){ AU.clang(false); G.shake = 6; hatchSteam(h, 12, true); }
  if(at(I.pop)){ AU.popOut(); AU.whoosh(.32); }
  // while the lid is only cracked, steam leaks round its rim
  if(t>I.crack[0] && t<I.throw[1] && (c.steamT -= dt) <= 0){ hatchSteam(h, 2, false); c.steamT = .03; }
}
/* The lid on the clock: still, then knocking at the latch, then cracked by
   the pressure, then thrown — accelerating — onto its stop, where it
   rebounds twice and rests. */
function lidSwingIn(t){
  const I = CMD_IN;
  if(t<I.crack[0]){
    for(const k of I.knocks) if(t>=k && t<k+.07) return .12*Math.sin(Math.PI*(t-k)/.07);
    return 0;
  }
  if(t<I.throw[0]) return LID_CRACK*easeOutCubic(span(t, I.crack));
  if(t<I.throw[1]){ const u = span(t, I.throw); return LID_CRACK + (LID_OPEN-LID_CRACK)*u*u; }
  const s = t - I.throw[1];
  return LID_OPEN - .26*Math.exp(-8*s)*Math.abs(Math.sin(16*s));
}
/* Her climb after the pop is a spring: past the rim, back, and settled in a
   third of a second — then STILL, nothing breathing or drifting. Its speed
   is what squashes and stretches her (drawCommander). */
function popSpring(s){
  if(s<=0) return {y:0, v:0};
  const e = Math.exp(-12*s), c = Math.cos(22*s), n = Math.sin(22*s);
  return {y:1 - e*c, v:e*(12*c + 22*n)};
}
/* lid swing (radians), climb (0–1, overshooting), her speed, and zoom (0–1) */
function commanderPose(){
  const c = G.cmd;
  if(!c) return {lid:0, rise:0, v:0, zoom:0, dive:0};
  if(c.out!==null){
    const o = c.out, D = CMD_OUT.duck, d = span(o, D), sl = span(o, CMD_OUT.slam);
    return {lid:LID_OPEN*(1-sl*sl), rise:1-d*d, v:d>0 && d<1 ? -2*d/(D[1]-D[0]) : 0,
            zoom:c.zoomFrom*(1-easeInOutCubic(span(o, CMD_OUT.zoom))), dive:0};
  }
  const t = c.t, sp = popSpring(t - CMD_IN.pop);
  let zoom = CMD_PUSH*easeInOutCubic(span(t, CMD_IN.push))
           + (1-CMD_PUSH)*easeOutCubic(span(t, CMD_IN.punch));
  // the story eases the camera back off her to show the tank and its target
  if(c.zoomBack!=null) zoom *= 1 - easeInOutCubic(clamp01((t - c.zoomBack)/.9));
  let rise = sp.y, v = sp.v, dive = 0;
  if(c.dive!=null){                     // "Let's get into the tank!" — she drops in first…
    const d = clamp01((t - c.dive)/.24);
    rise = 1 - d*d; v = d>0 && d<1 ? -8 : 0;
    dive = clamp01((t - c.dive - .12)/.6);   // …and the camera follows her down into it
  }
  return {lid:lidSwingIn(t), rise, v, zoom, dive};
}
/* steam out of the hatch: a thin leak at the rim's two ends while the lid is
   cracked, one big breath of it when the lid is flung open */
function hatchSteam(h, n, burst){
  for(let i=0;i<n;i++){
    const side = Math.random()<.5 ? -1 : 1;
    G.particles.push(burst ? {
      x:h.x + (Math.random()-.5)*h.rx*1.4, y:h.y - 2,
      vx:(Math.random()-.5)*240, vy:-50-Math.random()*60,
      r:3+Math.random()*4, t:0, life:.45+Math.random()*.3, kind:'steam'
    } : {
      x:h.x + side*h.rx*(.6+Math.random()*.4), y:h.y - 1,
      vx:side*(30+Math.random()*40), vy:-22-Math.random()*30,
      r:3+Math.random()*3, t:0, life:.5+Math.random()*.35, kind:'steam'
    });
  }
}
/* The close-up: the camera scales about her face while sliding it to
   CMD_FRAME, and the view is held inside the painted screen so a zoom can
   never show past the edge of the world. At e=0 this is the identity. */
function commanderView(e){
  const z = 1 + (CMD_ZOOM-1)*e, f = commanderAt(1).head;
  let x = f.x - (lerp(f.x, W*CMD_FRAME.x, e) - W/2)/z;
  let y = f.y - (lerp(f.y, H*CMD_FRAME.y, e) - H/2)/z;
  const hw = W/(2*z), hh = H/(2*z);
  x = Math.max(hw, Math.min(W-hw, x));
  y = Math.max(hh, Math.min(H-hh, y));
  return {x, y, z};
}
function pressCommanderNext(){
  const c = G.cmd;
  if(G.state!==GameState.COMMANDER || !c || !c.ready) return;
  AU.click();
  c.ready = false; $('cmdNext').disabled = true;
  $('cmdNext').classList.remove('is-in');
  shieldTaps();                     // the world is under NEXT, and a tap there skips
  endStory();
  openLesson(leaveCommander);
}
/* THE LESSON plugs in here: open it, and call `back` once the student has
   finished it — the hatch scene picks up from there. Until the learning
   section is wired in, NEXT comes straight back to the round. */
function openLesson(back){ back(); }
function leaveCommander(){
  const c = G.cmd; if(!c) return;
  c.zoomFrom = commanderPose().zoom;     // wherever the camera is, it comes home from there
  c.out = 0;
  if(!ambientMotionAllowed()){ finishCommander(); return; }
  AU.duckIn();
}
function finishCommander(){
  G.cmd = null;
  if(G.zombie && G.zombie.mode==='alert') G.zombie.mode = 'idle';
  beginBriefing();
}
/* inside the story a tap is the story's (storyTap); what is left to skip here
   is her ducking back in on the way to the briefing */
function skipCommander(){
  const c = G.cmd; if(!c || c.out===null) return false;
  finishCommander(); return true;
}

/* ============================================================
   THE STORY — the opening, between START and the first round
   (STORY_INTRO.md). The LXD's nine beats, every line verbatim, told IN the
   game rather than in front of it — the same world, camera and characters
   the player is about to play with:
     1-3  a fly-over of the real level: the tank parked at the start, the
          five zombie outposts and the stragglers between them, the safe
          zone at the far end, and the mission's shape drawn as it goes
     4    a whip back to the tank, which rolls up to the first outpost
     5    the hatch scene: she calls the player in, drops into the hatch,
          and the camera dives in after her
     6-9  on the real triangle: the barrel searches, the triangle draws
          itself, its sides take their names — then NEXT
   One director: a beat holds for its voice-over (or long enough to read
   it) and for whatever it is doing on screen, whichever is longer. A tap
   moves on, SKIP jumps to the hand-off, and the hand-off itself is only
   ever taken with NEXT.
   ============================================================ */
const STORY_BEATS = [
  {key:'Welcome to Zombie Land!',                                  fly:'open',  min:3.8},
  {key:'There are zombies everywhere!',                            fly:'horde', min:4.8},
  {key:'We need to cross these barriers and reach the safe zone.', fly:'goal',  min:5.6},
  {key:'But first, we need to clear the way!',                     act:'drive'},
  {key:"Let's get into the tank!",                                 act:'hatch'},
  {key:'We need to aim carefully.',                                act:'aim',      min:2.8},
  {key:'What angle will help us hit the target?',                  act:'triangle', min:3.0},
  {key:'Trigonometric ratios connect the sides and angles.',       act:'sides',    min:3.0},
  {key:"Let's explore all six ratios to help us aim!",             act:'handoff'}
];
const STORY_TAP_GUARD = .8;     // a beat ignores taps this long, so one eager tap can't skip two
/* The voice-over in assets/vo/<lang>/ (STORY_VO.md) is a SYNTHETIC DRAFT —
   robotic, and Marathi and Odia are read by other languages' voices — so it
   plays only when asked for with ?vo=draft. When the reviewed recordings
   replace it at the same paths, this becomes LANGS. A line without a voice
   holds long enough to read instead. */
const VO_LANGS = QS.get('vo')==='draft' ? LANGS : [];
const STORY_NEXT_AT = 1.4;      // beat 9: NEXT rises this long after the line
/* the storyboard's colours for the three sides: the glow's core and bloom,
   and the tag their names sit on */
const SIDE_HUE = {hyp:{core:'#ffdcd4', bloom:'#ff4b3a', tag:'#c63a2a'},
                  opp:{core:'#fff6c6', bloom:'#ffcf1f', tag:'#a97d04'},
                  adj:{core:'#a9dcff', bloom:'#1689ff', tag:'#1b74bd'}};

/* THE FLY-OVER. The tank waits at the very start of the world; the camera
   opens pushed in on the sky above it and pulls back (beat 1), then glides
   right over the first three outposts (2) and on past the last two to the
   safe zone (3) — eased, so it settles on each end. */
const STORY_PARK = 70;          // the tank's world x before it rolls up to the first outpost
const STORY_OPEN = {z:1.32, y:236, pull:[.2, 2.8]};   // the crane-back reveal
const STORY_FLY = {horde:[.15, 4.55], goal:[.1, 4.9], whip:.95};
/* zombies standing in the swamp between the outposts, already there when
   the camera passes — the game's own three, on the outposts' ground line or
   a little further back: [after outpost, gap from its right edge, type,
   scale, far] */
const STORY_HORDE = [
  [0,320,'runner',.66,0], [0,520,'shambler',.56,1], [1,300,'bruiser',.62,0],
  [1,560,'runner',.54,1], [2,340,'shambler',.66,0], [3,330,'bruiser',.6,0],
  [3,600,'runner',.52,1], [4,360,'shambler',.64,0]
];

function beginStory(){
  G.story = {beat:-1, t:0, clock:0, fly:true, view:null, whip:null, fadeIn:0, fadeDur:.5,
             strip:0, stripAt:0, arrived:false, arrivedT:0, diveDone:false,
             guides:false, hl:{adj:0, opp:0, hyp:0}, vo:0, horde:[], heard:{}};
  // the tank waits at the start of the world
  G.tankWorldX = STORY_PARK; G.cameraX = 0; G.tankVel = 0; G.drive = null;
  G.story.horde = STORY_HORDE.map(([k, gap, type, scale, far])=>{
    const n = G.levelNodes[k];
    return {type, scale, far, wx:n.worldX + n.tower.w + gap, frame:0, animT:0, sway:0, mode:'idle'};
  });
  syncWorldPositions();
  document.body.classList.add('in-story');
  $('storyUi').classList.remove('hidden');
  setGameState(GameState.STORY);
  GameBus.screen('story', 'intro');
  enterBeat(0);
}
function endStory(){
  stopVO();
  G.story = null;
  document.body.classList.remove('in-story');
  $('storyUi').classList.add('hidden');
  $('caption').classList.remove('is-title');
  hideCaption();
}
function enterBeat(i){
  const s = G.story, b = STORY_BEATS[i];
  s.beat = i; s.t = 0; s.vo = 0; s.lineAt = null;
  if(b.act==='hatch') hideCaption();       // hers waits until she is out to say it
  else sayLine();
  if(b.fly==='horde') s.flyFrom = G.cameraX;
  else if(b.fly==='goal'){ s.flyFrom = G.cameraX; s.stripAt = s.clock; }
  else if(b.act==='drive'){ s.whip = {t:0, from:G.cameraX}; AU.whoosh(.6); }
  else if(b.act==='hatch') beginCommander();
  else if(b.act==='aim'){
    if(G.cmd){ G.cmd.dive = null; G.cmd.zoomBack = G.cmd.t - 5; }   // out of the dive, at 1:1
    s.fadeIn = s.fadeDur = .5;
  }
  else if(b.act==='triangle') s.guides = true;
}
/* the beat's line: its caption, its voice, and the moment it began */
function sayLine(){
  const s = G.story, i = s.beat;
  s.lineAt = s.t;
  playVO('story_' + String(i+1).padStart(2,'0'), d=>{ if(G.story && G.story.beat===i) G.story.vo = d; });
  showCaption(t(STORY_BEATS[i].key), i>0);
  $('caption').classList.toggle('is-title', i===0);          // the opening line is the title
}
/* the fly-over's two legs end on these */
const flyHordeEnd =()=>{ const n = G.levelNodes[2]; return n.worldX + n.tower.w/2 - W*.56; };
/* a beat's end state, at once — what a tap or SKIP leaves behind it */
function settleBeat(i){
  const s = G.story, b = STORY_BEATS[i];
  if(b.fly==='open') s.view = null;
  if(b.fly==='horde' || b.fly==='goal'){
    G.cameraX = b.fly==='horde' ? flyHordeEnd() : safeZoneCamera();
    syncWorldPositions();
    // whatever the camera has now passed has had its groan, so the jump
    // doesn't set them all off at once
    G.levelNodes.forEach((n,i)=>{ if(n.zombie.worldX < G.cameraX + W) s.heard['n'+i] = true; });
    s.horde.forEach((h,k)=>{ if(h.wx < G.cameraX + W) s.heard['h'+k] = true; });
    if(b.fly==='goal') s.strip = 1;
  }
  if(b.act==='drive'){
    /* wherever the story is — mid-fly-over, mid-whip, mid-roll — the tank
       ends up at the first outpost with the camera on it */
    s.whip = null; s.fly = false; s.strip = 0;
    if(!s.arrived){
      if(!G.drive){ G.cameraX = 0; storyDrive(); }           // the roll hadn't begun…
      if(G.drive){ poseDriveAt(1); finishDrive(); }           // …land it; storyArrived fires
    }
  }
  if(b.act==='hatch'){
    if(!G.cmd) beginCommander();
    G.cmd.t = Math.max(G.cmd.t, CMD_IN.punch[1] + .4);
  }
  if(b.act==='aim'){
    if(G.cmd){ G.cmd.dive = null; G.cmd.zoomBack = G.cmd.t - 5; }
    s.fadeIn = 0;
    G.barrelTarget = G.angleShown = BARREL_REST_ANGLE;
  }
  if(b.act==='triangle'){ s.guides = true; ['adj','opp','hyp','theta'].forEach(k=>G.reveal[k] = 1); }
  if(b.act==='sides') ['adj','opp','hyp'].forEach(k=>s.hl[k] = 1);
}
function nextBeat(){ settleBeat(G.story.beat); enterBeat(G.story.beat + 1); }
function readTime(b){
  const s = G.story;
  return s.vo ? s.vo + .7 : Math.max(3.2, .065*t(b.key).length);
}
function beatDone(){
  const s = G.story, b = STORY_BEATS[s.beat];
  if(b.act==='hatch') return s.diveDone;              // she has called us in and we are in
  if(s.t < (b.min || 0) || s.t - s.lineAt < readTime(b)) return false;
  if(b.act==='drive') return s.arrived && s.arrivedT >= 1.1;
  return true;
}
/* after the whip: the tank rolls up from the start to the first outpost */
function storyDrive(){
  setGameState(GameState.INTRO);
  GameBus.screen('intro', 'intro');
  G.drive = {t:0, nextLevel:null, tankStart:G.tankWorldX, tankEnd:levelRestTankX(0),
             cameraStart:G.cameraX, cameraEnd:levelRestCamera(0), onArrive:storyArrived};
  if(!ambientMotionAllowed()){ poseDriveAt(1); finishDrive(); }
}
/* the tank has rolled up to the first outpost, and its zombie has seen it */
function storyArrived(){
  const s = G.story; if(!s) return;
  s.arrived = true; s.arrivedT = 0;
  setGameState(GameState.STORY);
  if(G.zombie){ G.zombie.mode = 'alert'; G.zombie.animT = 0; }
  AU.zombieUhOh();
}
function storyTap(){
  const s = G.story;
  if(!s || s.beat >= STORY_BEATS.length-1 || s.t < STORY_TAP_GUARD) return false;
  nextBeat(); return true;
}
/* straight to the hand-off: everything up to it settled, NEXT on its way */
function skipStory(){
  const s = G.story, last = STORY_BEATS.length-1;
  if(!s || s.beat >= last) return;
  AU.click();
  for(let i = s.beat; i < last; i++) settleBeat(i);
  enterBeat(last);
}

/* ---- the voice: one line at a time, the story's and the ending's ---- */
let voEl = null;
function playVO(id, onLength){
  stopVO();
  if(!VO_LANGS.includes(I18N.lang) || AU.muted) return;
  const a = new Audio(`assets/vo/${I18N.lang}/${id}.mp3`);
  if(onLength) a.addEventListener('loadedmetadata', ()=>{ if(voEl===a) onLength(a.duration || 0); });
  a.play().catch(()=>{});
  voEl = a;
}
function stopVO(){ if(voEl){ voEl.pause(); voEl = null; } }

function updateStory(dt){
  const s = G.story; if(!s) return;
  const was = s.t; s.t += dt; s.clock += dt;
  /* a cue fires when the clock steps over it; a tap that jumps the clock
     drops every cue it jumps, as in the hatch scene */
  const t = s.t, b = STORY_BEATS[s.beat], at = x => t-was < .2 && was < x && t >= x;
  const moving = ambientMotionAllowed();

  // 1: the crane back from the sky to the whole of the start of the world
  if(b.fly==='open'){
    const e = moving ? easeInOutCubic(span(t, STORY_OPEN.pull)) : 1;
    s.view = e < 1 ? {z:lerp(STORY_OPEN.z, 1, e), y:lerp(STORY_OPEN.y, H/2, e)} : null;
  }
  // 2-3: the glide over the outposts, then on to the safe zone
  if(b.fly==='horde' || b.fly==='goal'){
    const to = b.fly==='horde' ? flyHordeEnd() : safeZoneCamera();
    const e = moving ? easeInOutCubic(span(t, STORY_FLY[b.fly])) : 1;
    G.cameraX = lerp(s.flyFrom, to, e);
    syncWorldPositions();
  }
  // the zombies are already out there; each one groans as the camera finds it
  if(s.fly && s.beat >= 1){
    G.levelNodes.forEach((n,i)=>{
      if(!s.heard['n'+i] && n.zombie.x < W - 130){ s.heard['n'+i] = true; AU.groan(1.15 - n.level*.05); }
    });
    s.horde.forEach((h,k)=>{
      const x = h.wx - G.cameraX;
      if(!s.heard['h'+k] && x < W - 90 && x > -60){
        s.heard['h'+k] = true; AU.groan(h.type==='bruiser' ? .82 : h.type==='runner' ? 1.3 : 1.05);
      }
    });
  }
  s.horde.forEach((h,k)=>{
    h.sway = moving ? Math.sin(G.time*2 + k*1.9)*.045 : 0;
    const look = ZOMBIE_TYPES[h.type].look;
    if(look.fps>0 && (h.animT += dt) > 1/look.fps){ h.animT = 0; h.frame++; }
  });
  // the mission strip: in on beat 3, out once the tank starts to roll
  s.strip = b.fly==='goal' || (b.act==='drive' && s.whip)
          ? Math.min(1, s.strip + dt/.4) : Math.max(0, s.strip - dt/.5);
  if(b.fly==='goal') [0,1,2,3,4,5,6].forEach(k=>{ if(at(.25 + k*.12)) AU.blip(700 + k*95); });

  // 4: the whip back to the tank, through a dip, then the roll up (without
  //    motion, a plain dip to black that cuts at its darkest)
  if(s.whip){
    s.whip.t += dt;
    const u = clamp01(s.whip.t/STORY_FLY.whip);
    G.cameraX = lerp(s.whip.from, 0, moving ? easeInOutCubic(u) : +(u >= .5));
    syncWorldPositions();
    if(u>=1){ s.whip = null; s.fly = false; storyDrive(); }
  }
  if(s.fadeIn > 0) s.fadeIn = Math.max(0, s.fadeIn - dt);
  if(s.arrived) s.arrivedT += dt;

  // 5: she says it once she's out and settled; once it's said, she drops
  //    into the hatch and we follow her in
  if(b.act==='hatch' && G.cmd){
    const c = G.cmd;
    if(s.lineAt==null && c.t >= CMD_IN.pop + CMD_SETTLE) sayLine();
    if(c.dive==null && s.lineAt!=null && c.t >= CMD_IN.punch[1] + .5
       && t - s.lineAt >= Math.max(1.8, readTime(b) - .5)){
      c.dive = c.t; AU.duckIn(); AU.whoosh(.5);
    }
    if(c.dive!=null && c.t - c.dive >= .8) s.diveDone = true;
  }
  // 6: the barrel searches — up past the zombie and back — and never stops on the answer
  if(b.act==='aim' && moving)
    [[.45,72],[1.35,14],[2.15,BARREL_REST_ANGLE]].forEach(([x,a])=>{ if(at(x)){ G.barrelTarget = a; AU.servo(.55); } });
  if(b.act==='triangle')
    [['adj',.2,.8,588],['opp',.9,1.45,699],['hyp',1.55,2.25,831],['theta',2.3,2.9,988]].forEach(([k,a,e,n])=>{
      G.reveal[k] = Math.max(G.reveal[k], easeOutCubic(span(t,[a,e])));
      if(at(a)) AU.blip(n);
    });
  if(b.act==='sides')
    [['hyp',.2,.6,831],['opp',1,1.4,699],['adj',1.8,2.2,588]].forEach(([k,a,e,n])=>{
      s.hl[k] = Math.max(s.hl[k], easeOutCubic(span(t,[a,e])));
      if(at(a)) AU.blip(n);
    });
  if(b.act==='handoff'){
    if(G.cmd && !G.cmd.ready && t >= STORY_NEXT_AT){
      G.cmd.ready = true;
      const key = $('cmdNext');
      key.disabled = false; key.classList.add('is-in'); key.focus({preventScroll:true});
    }
  }
  if(s.beat < STORY_BEATS.length-1 && beatDone()) nextBeat();
}
/* a straggler's soles: the outposts' ground line, or a little further back */
const hordeFeet = h => TARGET_BASE_Y - (h.far ? 16 : 0);

/* ---- drawing the story into the world ---------------------------------- */
/* the stragglers, drawn like any zombie — the far ones a shade into the mist */
function drawStoryHorde(){
  const s = G.story; if(!s || !s.fly) return;
  [...s.horde].sort((a,b)=>(b.far - a.far)).forEach(h=>{
    const x = h.wx - G.cameraX; if(x < -200 || x > W + 200) return;
    const t = ZOMBIE_TYPES[h.type];
    ctx.save();
    ctx.globalAlpha = h.far ? .8 : 1;
    drawZombie({type:h.type, scale:h.scale, frame:h.frame, mode:'idle', sway:h.sway,
                x, y:hordeFeet(h) - t.feetOffset*h.scale});
    ctx.restore();
  });
}
/* the mission, at a glance: the tank, the five outposts, the safe zone */
function drawStoryStrip(){
  const s = G.story; if(!s || s.strip<=0) return;
  /* on the wall below the ground line: nothing plays there during the story,
     where the sky above is where the tallest ruins stand their zombies */
  const w = 640, h = 66, x0 = W/2 - w/2, y0 = 612, mid = y0 + h/2;
  ctx.save();
  ctx.globalAlpha = s.strip;
  roundRectPath(x0, y0, w, h, 20);
  ctx.fillStyle = 'rgba(8,24,28,.74)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(240,192,99,.95)'; ctx.stroke();
  ctx.setLineDash([7,9]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,244,200,.55)';
  ctx.beginPath(); ctx.moveTo(x0 + 92, mid + 14); ctx.lineTo(x0 + w - 104, mid + 14); ctx.stroke();
  ctx.setLineDash([]);
  const a = s.clock - s.stripAt;
  const pop = k => Math.max(0, popSpring(a - .25 - k*.12).y);
  const stamp = (k, cx, draw)=>{                       // each icon springs in, in turn
    const p = pop(k); if(p<=0) return;
    ctx.save(); ctx.translate(cx, mid + 22); ctx.scale(p, p); draw(); ctx.restore();
  };
  const hs = SP.hull;
  stamp(0, x0 + 52, ()=>ctx.drawImage(IMGS.tank, hs[0],hs[1],hs[2],hs[3], -34, -24, 68, 22));
  G.levelNodes.forEach((n, i)=>{
    const passed = G.cameraX + W*.5 > n.worldX + n.tower.w*.5 || !s.fly;
    stamp(1 + i, x0 + 150 + i*82, ()=>{
      const type = ZOMBIE_TYPES[n.zombie.type] ? n.zombie.type : 'shambler', k = 44/ZOMBIE_TYPES[type].height;
      ctx.globalAlpha *= passed ? 1 : .45;
      drawZombie({type, scale:k, frame:0, mode:'idle', x:0, y:-ZOMBIE_TYPES[type].feetOffset*k});
    });
  });
  const arrived = G.cameraX >= safeZoneCamera() - 60 || !s.fly;
  stamp(6, x0 + w - 56, ()=>{
    if(arrived){                                     // the goal lights up once we've seen it
      const g = ctx.createRadialGradient(0, -18, 0, 0, -18, 46);
      g.addColorStop(0, 'rgba(120,200,255,.55)'); g.addColorStop(1, 'rgba(120,200,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -18, 46, 0, 7); ctx.fill();
    }
    ctx.drawImage(IMGS.safeZone, -44, -40, 88, 88*SZ.h/SZ.w);
  });
  ctx.restore();
}
/* everything the story lays over the finished frame: the mission strip, and
   the dips to black — the whip, the dive into the hatch, and up out of it */
function drawStoryOverlay(pose){
  const s = G.story;
  if(s) drawStoryStrip();
  let black = 0;
  if(s && s.whip) black = Math.sin(Math.PI*clamp01(s.whip.t/STORY_FLY.whip))*.92;
  if(pose.dive>0) black = Math.max(black, pose.dive);
  if(s && s.fadeIn>0) black = Math.max(black, s.fadeIn/s.fadeDur);
  if(black>0){
    ctx.save(); ctx.globalAlpha = black; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}
/* beat 8: each side's name, on a tag in its own colour, where the round's
   measurement cards would stand */
function drawStorySides(){
  const s = G.story; if(!s || G.guideAlpha<=.01) return;
  const tri = trigTriangle(); if(!tri) return;
  const clearOfTank = TANK.x - G.recoil*.6 + TANK.w + 12;
  const AT = {
    adj:{x:tri.ax+(tri.bx-tri.ax)/2, y:tri.by+7, align:'center', hang:true, minLeft:clearOfTank},
    opp:{x:tri.bx+22,                y:(tri.by+tri.cy)/2, align:'left'},
    hyp:{x:(tri.ax+tri.cx)/2 - 26,   y:(tri.ay+tri.cy)/2 - 38, align:'right'}
  };
  ['hyp','opp','adj'].forEach(k=>{
    const u = s.hl[k]; if(u<=.01) return;
    const p = AT[k], label = t(SIDE_WORD[k]);
    ctx.save(); ctx.globalAlpha *= clamp01(u);
    ctx.font = `800 19px ${FONT}`;
    const w = ctx.measureText(label).width + 30, h = 34;
    let left = p.align==='center' ? p.x - w/2 : p.align==='left' ? p.x : p.x - w;
    if(p.minLeft!=null) left = Math.max(left, p.minLeft);
    const top = (p.hang ? p.y : p.y - h/2) + (1-u)*8;
    roundRectPath(left, top, w, h, 11);
    ctx.fillStyle = SIDE_HUE[k].tag; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
    guideText(label, left + w/2, top + h/2 + 1, {size:19, fill:'#fff', outline:'rgba(20,10,4,.55)'});
    ctx.restore();
  });
}

/* ============================================================
   THE OUTPOSTS' FORTIFICATIONS — the barriers the story promises, on the
   real level: barricades, hedgehogs and wire behind every zombie's ruin,
   and a last line of them before the safe zone's gate. Back-lane dressing
   on the ruins' own ground line, always to a ruin's RIGHT: the triangle,
   its cards and the gun all live to its left, so nothing here can cross
   them. (assets/world_barriers.webp, `tools/fit_assets.py barriers`.)
   ============================================================ */
const BARRIER_BOX = {hedgehog:[4,4,234,217], barricade:[266,26,293,189], concrete:[573,32,330,181],
                     sandbags:[912,71,287,143], wire:[1206,24,293,193]};
const BARRIER_H = {hedgehog:64, barricade:52, concrete:48, sandbags:40, wire:56};
const OUTPOST_PROPS = [          // per outpost: [prop, gap from the ruin's right edge]
  [['sandbags',14],['hedgehog',118]],
  [['concrete',18],['wire',132]],
  [['hedgehog',10],['sandbags',104]],
  [['barricade',16],['hedgehog',136]],
  [['wire',12],['concrete',124],['sandbags',236]]
];
const GATE_PROPS = [['hedgehog',-430],['barricade',-322],['sandbags',-196]];   // from the compound's left edge
function drawWorldProps(){
  if(!G.levelNodes.length) return;
  const place = (name, wx)=>{
    const [sx,sy,sw,sh] = BARRIER_BOX[name], h = BARRIER_H[name], w = sw*h/sh;
    const x = wx - G.cameraX; if(x > W + 20 || x + w < -20) return;
    const foot = TARGET_BASE_Y + 3;
    ctx.fillStyle = 'rgba(16,30,22,.38)';
    ctx.beginPath(); ctx.ellipse(x + w/2, foot - 1, w*.55, 6, 0, 0, 7); ctx.fill();
    ctx.drawImage(IMGS.barriers, sx,sy,sw,sh, x, foot - h, w, h);
  };
  G.levelNodes.forEach((n, i)=>{
    const right = n.worldX + n.tower.w;
    (OUTPOST_PROPS[i] || []).forEach(([name, gap])=>place(name, right + gap));
  });
  const sx = safeZoneX();
  GATE_PROPS.forEach(([name, dx])=>place(name, sx + dx));
}

/* where the camera and the tank come to rest for a given round */
function levelRestCamera(level){
  const node = G.levelNodes[level];
  return node ? Math.max(0, node.targetWorldX - node.screenX) : 0;
}
function levelRestTankX(level){
  const node = G.levelNodes[level];
  return levelRestCamera(level) + (node ? node.tankScreenX : CAMERA_FOLLOW_X);
}

function resetWorld(){
  G.levelNodes = buildLevelNodes();
  G.cameraX=levelRestCamera(0); G.tankWorldX=levelRestTankX(0); G.tankVel=0;
  G.drive=null; G.dustT=0; G.guideAlpha=1;
  G.cmd=null; endStory();
  G.outro=null; hideCaption();
  activateLevel(0, true);
}

/* ============================================================
   INPUT / UI
   ============================================================ */
const angleInput = $('angleInput');
/* The dock's number is the player's answer and nothing more — the barrel does
   NOT follow it. It only moves once FIRE commits the answer (see pressFire),
   which is what stops the level from being solvable by eye. */
/* The dock holds a POSITION on the table, not a number: every value it can
   show is one the student could have read off sin/cos/tan of 0, 30, 45, 60,
   90. setAngle snaps anything else to the nearest of them, so no code path —
   a debug command, a restored value, a future feature — can put the gun at
   an angle the table cannot explain. */
function angleIndex(v){
  let best = 0;
  ANGLE_CHOICES.forEach((a,i)=>{ if(Math.abs(a-v) < Math.abs(ANGLE_CHOICES[best]-v)) best = i; });
  return best;
}
function setAngle(v){
  const a = ANGLE_CHOICES[angleIndex(v)];
  G.angleTarget = a; angleInput.value = a;
}
function setControlsEnabled(enabled){
  if(!enabled) stopHolds();
  $('downBtn').disabled=!enabled; $('upBtn').disabled=!enabled;
  angleInput.disabled=!enabled;
  $('fireBtn').disabled=!enabled;
  $('hintBtn').disabled=!enabled;
  $('controlDock').classList.toggle('is-busy', !enabled);
}

/* ---------- HINT ----------
   Scaffolded, free, and never the answer. Free because this is a game for
   learning a table: charging for help teaches a student to guess rather than
   ask, which is the opposite of the habit worth building. */
/* ---------- THE TABLE ----------
   Six ratios across the five standard angles — 0 to 90, the first quadrant
   and nothing past it. The reference chart carried 120/180/270/360 as well,
   but they are angles this game's dial cannot hold and this syllabus does
   not lean on, and every column that cannot be an answer is a column the
   student's eye has to rule out. Cutting them also buys the five that matter
   half again the width each.
   It is DATA and not a picture for one reason: a picture of a table cannot
   POINT, and pointing is the entire value of opening it mid-round.
   Cells are either a plain string or a fraction, so they can be set the way
   a textbook prints them — one over the other with a rule between — rather
   than flattened to "1/2", which is the same ambiguity the vinculum fix
   dealt with on the triangle's own labels. */
const FR = (n,d) => ({n,d});
const TRIG_ANGLES = [0, 30, 45, 60, 90];
const TRIG_ROWS = [
  {fn:'sin', label:'sin θ', cells:['0',      FR(1,2),      FR(1,'√2'), FR('√3',2), '1']},
  {fn:'cos', label:'cos θ', cells:['1',      FR('√3',2),   FR(1,'√2'), FR(1,2),    '0']},
  {fn:'tan', label:'tan θ', cells:['0',      FR(1,'√3'),   '1',        '√3',       '∞']},
  {fn:'csc', label:'csc θ', cells:['∞',      '2',          '√2',       FR(2,'√3'), '1']},
  {fn:'sec', label:'sec θ', cells:['1',      FR(2,'√3'),   '√2',       '2',        '∞']},
  {fn:'cot', label:'cot θ', cells:['∞',      '√3',         '1',        FR(1,'√3'), '0']}
];
/* √n as a drawn sign running into a bar over n (see .surd). The glyph is
   still there for a screen reader, just not drawn. */
const RAD_SIGN = '<svg class="radSign" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true">'
  + '<path d="M.8 12.4 2.6 10.6 5.2 19.2 10 .6"/></svg>';
const withRadicals = s => s.replace(/√(\d+)/g,
  `<span class="surd"><span class="srOnly">√</span>${RAD_SIGN}<span class="rad">$1</span></span>`);
/* the table is the same every round, so it is built once and only re-pointed */
let trigBuilt = false;
function buildTrigTable(){
  if(trigBuilt) return;
  const tbl = $('trigTable'), mk = (tag,cls,txt)=>{
    const n = document.createElement(tag); n.className = cls;
    // our own data, never user text: the only markup added is the radical
    if(txt!==undefined) n.innerHTML = withRadicals(String(txt));
    return n;
  };
  const head = document.createElement('tr'); head.className = 'headRow';
  head.appendChild(mk('th','corner', t('ANGLE')));
  TRIG_ANGLES.forEach((a,i)=>{ const th = mk('th','ang', a+'°'); th.dataset.col = i; head.appendChild(th); });
  tbl.appendChild(head);
  TRIG_ROWS.forEach(r=>{
    const tr = document.createElement('tr'); tr.dataset.fn = r.fn;
    tr.appendChild(mk('th','fn', r.label));
    r.cells.forEach((c,i)=>{
      const td = mk('td',''); td.dataset.col = i;
      if(c && typeof c === 'object'){
        const f = mk('span','frac');
        f.appendChild(mk('span','num', String(c.n)));
        f.appendChild(mk('span','den', String(c.d)));
        td.appendChild(f);
      } else td.innerHTML = withRadicals(String(c));
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  });
  trigBuilt = true;
}

/* ---------- HINT ----------
   Two rungs, and the sheet is where both of them land now.

   RUNG ONE lights the round's ratio ROW and nothing else. That is deliberate:
   the student is told which function this is and what its value works out to,
   and is left to run their eye along the row and find the match. Reading a
   value off a table is the skill the table exists to teach, and handing over
   the column would spend it.
   RUNG TWO — one button away, never withheld — lights the answer's column
   and beats on the cell where the two cross.
   Free at both rungs: charging for help teaches a student to guess instead
   of ask, which is the opposite of the habit worth building. */
let trigOpen = false, trigRevealed = false;
function callHint(on){ $('hintBtn').classList.toggle('is-calling', !!on); }
function resetHint(){ callHint(false); closeTrigSheet(); trigRevealed = false; }

function openTrigSheet(){
  const L = currentLevelData();
  buildTrigTable();
  const t = $('trigTable');
  t.classList.add('is-pointing');
  t.querySelectorAll('.row-on,.col-on,.is-answer')
   .forEach(n=>n.classList.remove('row-on','col-on','is-answer'));
  const row = t.querySelector(`tr[data-fn="${L.type}"]`);
  if(row) row.classList.add('row-on');
  $('trigHint').textContent = hintFor(L, 0);   // rung one: which pair of sides
  $('trigReveal').hidden = false;
  trigRevealed = false;
  $('trigSheet').classList.remove('hidden');
  trigOpen = true;
  shieldTaps();                     // it rises under the finger that asked for it
  /* Two rungs, one verb: the rung is the object's id, never a new event name.
     Emitted here rather than in pressHint because rung two has a button of
     its own inside the sheet and never passes back through the bulb. */
  GameBus.hint('bulb');
  requestAnimationFrame(()=>$('trigReveal').focus({preventScroll:true}));
}
function revealTrigAnswer(){
  if(!trigOpen || trigRevealed) return;
  const L = currentLevelData(), t = $('trigTable');
  const col = TRIG_ANGLES.indexOf(L.ans);
  if(col >= 0){
    t.querySelectorAll(`[data-col="${col}"]`).forEach(n=>n.classList.add('col-on'));
    const cell = t.querySelector(`tr[data-fn="${L.type}"] td[data-col="${col}"]`);
    if(cell) cell.classList.add('is-answer');
  }
  /* Nothing is written under the title: the sheet is a chart, not a worked
     solution. What the round needs is said by the lit row, and on this second
     ask by the lit column and the cell where they cross. */
  $('trigReveal').hidden = true;
  trigRevealed = true;
  GameBus.hint('bulb_reveal');
  AU.blip(988);
  $('trigClose').focus({preventScroll:true});
}
function closeTrigSheet(){
  if(!trigOpen) return;
  $('trigSheet').classList.add('hidden');
  trigOpen = false;
  shieldTaps();                     // FIRE and the dial were under it
  $('hintBtn').focus({preventScroll:true});
}
function pressHint(){
  if(G.state!==GameState.AIMING) return;
  AU.click(); callHint(false);
  if(!trigOpen) openTrigSheet();
  else if(!trigRevealed) revealTrigAnswer();
  else closeTrigSheet();
}
function updateControlsForState(){
  setControlsEnabled(G.state===GameState.AIMING);
}
let stateAt = 0;                  // when the current state began (performance.now), for the tap guard
function setGameState(newState){
  GameBus.signal('state', {from:G.state, to:newState, level:G.level, tries:G.tries});
  G.state = newState;
  stateAt = performance.now();
  document.body.dataset.state = newState;
