<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank vs Zombie — Angle Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — one language for every panel in the game
   ============================================================ */
:root{
  --hud-bg:rgba(11,23,33,.7);
  --hud-bg-strong:rgba(8,17,25,.88);
  --hud-border:rgba(120,197,224,.32);
  --hud-border-bright:rgba(120,197,224,.65);
  --text-primary:#f2fbff;
  --text-secondary:#8fadbc;
  --accent-cyan:#4fd3f5;
  --accent-orange:#ff8c1a;
  --accent-orange-deep:#df640a;
  --accent-green:#8be05a;
  --heart:#ff4d5e;
  --panel-radius:16px;
  --panel-radius-sm:10px;
  --hud-shadow:0 6px 16px rgba(0,0,0,.35);

  /* --- UI palette -----------------------------------------------------
     This block used to be sampled off the painted button files, and it
     shrank every time one of them was replaced by CSS. Every key in the
     game is now drawn by the CANDY-GEL BUTTON KIT and reskinned from the
     --gel-* variables on that class, so the only survivor here is the ink
     the trig table's function column still borrows. A palette that lists
     colours nothing reads is a palette that lies about itself. */
  --btn-ink:#fef8dc;          /* cream, on the trig table's fn column */

  /* --- BOARD — the dock is assets/board.svg now, so the timber palette it
     used to be painted with is gone. This one colour survives: the θ
     read-out is cut INTO that board, and its ring is the board's own
     shadow line, sampled off the art. */
  --board-frame:#4a1b28;

  /* --- PLAY-PLATE KIT — the START pill's material, promoted to a
     panel language. One recipe, four layers, top to bottom:
       brown casing ring → cream bezel → glossy green gem → dark-olive ink.
     Every panel that carries WORDS is built from these, so a banner, a
     toast, a heading plaque and a card button all read as the same
     moulded plastic part the player already pressed on the title screen.
     Long-form copy sits on the parchment face instead: the same frame,
     a light interior, because a paragraph needs a page, not a gem. */
  --plate-case:#6b3a14;       /* outer brown casing  */
  --plate-case-deep:#4a2409;  /* the block it stands on */
  --plate-ring:#f0c063;       /* cream bezel         */
  --plate-a:#dcf055;          /* gem face, lit       */
  --plate-b:#b4d833;
  --plate-c:#8cb81e;
  --plate-d:#6b9612;          /* gem face, shadow    */
  --plate-ink:#3d3005;        /* the START letter colour */
  --parch-a:#fff4d2;          /* card page, lit      */
  --parch-b:#f6e1ab;
  --parch-c:#e6c98a;          /* card page, shadow   */
  --parch-ink:#4a2b10;        /* body copy on parchment */
  --parch-ink-soft:#8a6437;
}

/* ============================================================
   GAME CONTAINER
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050d12;
  font-family:'Chakra Petch','Trebuchet MS','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',sans-serif;
  /* a game, not a page: no pull-to-refresh or rubber-band, and no
     double-tap zoom (pinch still works, for anyone who needs it) */
  overscroll-behavior:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;aspect-ratio:16/9;
  transform-origin:center center;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.7)}
button{font-family:inherit}
button:focus-visible,#angleInput:focus-visible{
  outline:3px solid #ffd23f;
  outline-offset:4px;
  filter:brightness(1.1);
}
#angleInput:focus-visible{border-radius:6px}

/* ============================================================
   WORLD LAYERS (background/tank/target/trajectory are canvas-drawn;
   the canvas itself is one full-bleed layer under the HUD)
   ============================================================ */
canvas{position:absolute;inset:0;display:block}
/* the world takes every touch itself (see worldTap): no browser pan, zoom
   or long-press callout fighting it for the finger */
#game{touch-action:none;-webkit-touch-callout:none}

/* ============================================================
   TOP HUD — the objective banner, the status line and the control dock.
   ============================================================ */
#hud{position:absolute;inset:0;pointer-events:none;color:var(--text-primary)}
/* .hudPanel is gone. It was the old painted-console recipe, and #controlDock
   was the last thing still wearing it — but the ID rule only overrode its
   border and background, so its box-shadow (carrying `0 0 0 3px` of rust)
   kept drawing a brown rectangle around the board art. A base class whose
   leftovers outlive the thing it styled is worse than no base class. */

/* --- the text plate itself: the START pill, flattened into a label.
   Same four layers and the same dark-olive ink, so every line of copy the
   game speaks arrives on the part the player already knows how to read. --- */
.gemPlate{position:relative;color:var(--plate-ink);
  border:4px solid var(--plate-ring);border-radius:18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.5),
    inset 0 -7px 0 rgba(63,92,8,.42),
    0 0 0 4px var(--plate-case),
    0 5px 0 var(--plate-case-deep),
    0 12px 18px rgba(0,0,0,.42);
  text-shadow:0 2px 0 rgba(255,255,255,.38),0 -1px 0 rgba(74,58,6,.22)}
/* the moulded dome — the highlight that makes a flat rectangle look pressed */
.gemPlate::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:36%;
  pointer-events:none;border-radius:13px;
  border-bottom-left-radius:60% 100%;border-bottom-right-radius:60% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}

/* THE OBJECTIVE PLATE IS GONE. It sat over the tank's corner and read
   "Solve for θ" for the whole of every round — a standing instruction for a
   thing the screen already says. The dock asks for an angle in θ's own name,
   the arc marks the unknown, and the two numbers sit on the sides they
   measure; the banner restated all three in words and cost a corner of sky
   doing it. What replaced it is nothing, which is the point. */
#msgText{position:relative;z-index:1}

#msg{position:absolute;left:18px;top:78px;
  padding:7px 22px 9px;border-radius:16px;opacity:0;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;font-weight:400;
  font-size:19px;letter-spacing:.7px;
  transition:opacity .34s;white-space:nowrap}

/* --- utility key: the hint --------------------------------------------
   Parked top-right, opposite the objective plate, on the one strip of frame
   the composition never reaches: frameRound() centres the scene, so the
   content's right edge lands around x=1030 at its widest and this corner
   stays clear in every round. Same gem as everything else you can press. */
#utilBtns{position:absolute;right:18px;top:14px;display:flex;gap:11px;
  align-items:flex-start;pointer-events:auto}
/* The corner's keys were painted plates, in a rust-and-red palette that
   belonged to nothing else left on screen — and each was framed differently
   inside its file, so half the rule below used to be arithmetic undoing a
   transparent halo. The bulb is a gel icon key now: the corner matches the
   dock and the cards, a reskin reaches it, and the glyph is inline SVG, which
   is what lets it take the shell's own ink colour. (The restart key that
   stood beside it is gone; the round's briefing plays once.) */
#hintBtn{--gel-h:58px}
#hintBtn{--gel-top:#fff2b0;--gel-mid:#ffd033;--gel-bot:#f0a000}  /* the bulb runs hotter */

/* A wrong answer is the moment help is worth offering, so the bulb asks to be
   pressed instead of waiting to be found — and stops the instant it is.
   The call MOVES as well as glows: motion is what the eye catches in
   peripheral vision, and the bulb lives in a corner nobody is looking at.
   Now that the key is a real box it casts a real halo, so the ring rides its
   own box-shadow with the shell's stack under it — the extra ::after element
   the painted version needed is gone. */
#hintBtn.is-calling{animation:hintCall 1.05s cubic-bezier(.4,0,.3,1) infinite}
/* the same rule the other two pulses need: an animated box-shadow outranks a
   static one, so the call stands down once the key is actually being pointed
   at — which is also the moment it has done its job */
#hintBtn.is-calling:hover,#hintBtn.is-calling:focus-visible{animation:none}
@keyframes hintCall{
  0%,100%{transform:translateY(0) scale(1);
          box-shadow:var(--gel-shadow),0 0 0 0 rgba(255,214,88,.55)}
  45%    {transform:translateY(-5px) scale(1.06);
          box-shadow:var(--gel-shadow),0 0 0 12px rgba(255,214,88,0),
                     0 0 26px 6px rgba(255,226,120,.9)}
}

/* ============================================================
   CANDY-GEL BUTTON KIT
   ONE recipe for every pressable thing the CSS draws, cut to the
   golden brass-and-ivory kit in the reference art: a thick creamy rim,
   a thin brass line just inside it, a shell that runs yellow → amber →
   orange top to bottom, dark-toffee ink, and two crisp gleams hugging
   the top-left curve — a convex, inflated, glossy candy shell.

   EVERY dimension derives from one knob, --gel-h. Set the height and the
   radius, padding, border, gap, stud depth, gloss, ink size and all four
   shadow layers follow, so a 52px sheet key and an 84px title pill are
   the same object at two sizes instead of two hand-tuned drawings.

   RESKIN by editing the variables below and nothing else:
     --gel-h            master height — everything scales off it
     --gel-r/--gel-pad  corner radius / horizontal padding
     --gel-rim          the thick outer ring (creamy ivory)
     --gel-line         the thin outline just inside that ring (brass)
     --gel-top/mid/bot  the shell gradient, top → mid → bottom
     --gel-shade        the shading along the lower inside edge
     --gel-stud         the block the shell squashes onto when pressed
     --gel-depth        how tall that block is
     --gel-glow         the hover / focus halo
     --gel-drop         the ground shadow
     --gel-ink          label colour     --gel-ink-lift  its embossing edge

   The gloss lives in the BACKGROUND stack, not in ::before/::after, and
   that is deliberate: an absolutely-positioned pseudo-element paints ABOVE
   an element's own text, and half these buttons carry a bare text node
   with no span to lift back over it. Background layers paint under the
   label by definition, so the gleam can never fog a letter — and the
   mirrored variant is then a background-position swap, one line.

   Variants at the foot of the block: .is-quiet, .gelBtn--icon,
   .gelBtn--pill, .gelBtn--right (gleams mirrored to the top-right).
   The gold gel no longer reaches the dock: the read-out, the arrow keys
   and FIRE are the steel console kit further down.
   ============================================================ */
.gelBtn,.bigBtn,.playTitleBtn,.sheetBtn{
  /* --- the knob, and the palette it drives --------------------------- */
  --gel-h:64px;
  --gel-r:calc(var(--gel-h)*.30);
  --gel-pad:calc(var(--gel-h)*.36);
  --gel-rim:#f7ead0;
  --gel-line:#eda512;
  --gel-top:#ffdb4d;
  --gel-mid:#ffb400;
  --gel-bot:#f18a00;
  --gel-shade:rgba(186,86,0,.45);
  --gel-stud:#a8560a;
  --gel-depth:calc(var(--gel-h)*.105);
  --gel-glow:rgba(255,203,74,.55);
  --gel-drop:rgba(95,40,10,.38);
  --gel-ink:#5c2b06;
  --gel-ink-lift:rgba(255,247,219,.55);

  /* --- the four layers that make it look inflated rather than printed:
     brass line hugging the rim → soft highlight along the top edge →
     dark shading along the lower edge → the stud it stands on → ground. */
  --gel-shadow:
    inset 0 0 0 calc(var(--gel-h)*.025) var(--gel-line),
    inset 0 calc(var(--gel-h)*.05) calc(var(--gel-h)*.075) rgba(255,255,255,.5),
    inset 0 calc(var(--gel-h)*-.06) calc(var(--gel-h)*.09) var(--gel-shade),
    0 var(--gel-depth) 0 var(--gel-stud),
    0 calc(var(--gel-depth) + var(--gel-h)*.08) calc(var(--gel-h)*.17) var(--gel-drop);
  /* pressed: the shell sits down ON the stud, so the stud goes to nothing,
     the top highlight dims, and the ground shadow tightens under it */
  --gel-shadow-in:
    inset 0 0 0 calc(var(--gel-h)*.025) var(--gel-line),
    inset 0 calc(var(--gel-h)*.045) calc(var(--gel-h)*.07) rgba(255,255,255,.3),
    inset 0 calc(var(--gel-h)*-.04) calc(var(--gel-h)*.07) var(--gel-shade),
    0 0 0 var(--gel-stud),
    0 calc(var(--gel-h)*.03) calc(var(--gel-h)*.07) var(--gel-drop);

  position:relative;box-sizing:border-box;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  gap:calc(var(--gel-h)*.16);
  height:var(--gel-h);padding:0 var(--gel-pad);
  border-radius:var(--gel-r);
  border:calc(var(--gel-h)*.08) solid var(--gel-rim);
  overflow:hidden;                    /* clips the sheen to the shell */
  font-family:inherit;font-size:calc(var(--gel-h)*.42);line-height:1;
  color:var(--gel-ink);
  /* gloss, top layer down: small glint · main corner gleam · dome sheet · shell */
  background-image:
    radial-gradient(closest-side,rgba(255,255,255,.9) 55%,rgba(255,255,255,0) 100%),
    radial-gradient(closest-side,rgba(255,255,255,.92) 60%,rgba(255,255,255,0) 100%),
    linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.07) 34%,rgba(255,255,255,0) 56%),
    linear-gradient(180deg,var(--gel-top) 0%,var(--gel-mid) 52%,var(--gel-bot) 100%);
  /* the gleams are sized and placed off --gel-h, never off the WIDTH: in
     percent they stretched into a long smear the moment a button got wide
     (START is 318px on an 84px shell). Anchored to the height they stay
     the same small round catchlight at every width, which is what a gleam is. */
  background-size:
    calc(var(--gel-h)*.095) calc(var(--gel-h)*.08),
    calc(var(--gel-h)*.22) calc(var(--gel-h)*.17),
    100% 100%, 100% 100%;
  background-position:
    left calc(var(--gel-h)*.31) top calc(var(--gel-h)*.105),
    left calc(var(--gel-h)*.10) top calc(var(--gel-h)*.13),
    0 0, 0 0;
  background-repeat:no-repeat;
  box-shadow:var(--gel-shadow);
  text-shadow:0 calc(var(--gel-h)*.028) 0 var(--gel-ink-lift);
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease,opacity .25s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}

/* the wet-glass sweep — parked off the left edge, crossing only on hover.
   It is the one thing allowed over the label, because a highlight passing
   across the letters is what glass does. */
.gelBtn::after,.bigBtn::after,.playTitleBtn::after,.sheetBtn::after{
  content:"";position:absolute;top:-40%;bottom:-40%;width:38%;left:-45%;
  pointer-events:none;opacity:0;transform:skewX(-18deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.42),rgba(255,255,255,0));
  transition:left .5s cubic-bezier(.3,.7,.3,1),opacity .18s ease}
.gelBtn:hover:not(:disabled)::after,.bigBtn:hover:not(:disabled)::after,
.playTitleBtn:hover:not(:disabled)::after,.sheetBtn:hover:not(:disabled)::after{
  left:112%;opacity:1}

/* --- states ---------------------------------------------------------- */
.gelBtn:hover:not(:disabled),.bigBtn:hover:not(:disabled),
.playTitleBtn:hover:not(:disabled),.sheetBtn:hover:not(:disabled){
  transform:translateY(calc(var(--gel-h)*-.045)) scale(1.03);
  filter:brightness(1.05);
  box-shadow:var(--gel-shadow),
    0 0 calc(var(--gel-h)*.26) calc(var(--gel-h)*.05) var(--gel-glow)}

/* the press rides a CLASS as well as :active — see armPress() for why */
.gelBtn:active:not(:disabled),.gelBtn.is-pressed,
.bigBtn:active:not(:disabled),.bigBtn.is-pressed,
.playTitleBtn:active:not(:disabled),.playTitleBtn.is-pressed,
.sheetBtn:active:not(:disabled),.sheetBtn.is-pressed{
  transition:transform .05s ease-out,box-shadow .05s ease-out,filter .07s ease;
  transform:translateY(var(--gel-depth)) scale(.985);
  filter:none;animation:none;
  box-shadow:var(--gel-shadow-in)}

/* a gold outline on a gold shell is invisible — these get a white ring */
.gelBtn:focus-visible,.bigBtn:focus-visible,
.playTitleBtn:focus-visible,.sheetBtn:focus-visible{
  outline:none;filter:none;
  box-shadow:var(--gel-shadow),
    0 0 0 calc(var(--gel-h)*.05) rgba(255,255,255,.8),
    0 0 calc(var(--gel-h)*.30) calc(var(--gel-h)*.07) var(--gel-glow)}

/* switched off, not muddied: the shell keeps its shape and its gloss and
   loses only its colour, so a disabled key still reads as the same object */
.gelBtn:disabled,.bigBtn:disabled,.playTitleBtn:disabled,.sheetBtn:disabled{
  --gel-top:#dcd6cc; --gel-mid:#bcb4a8; --gel-bot:#a09789;
  --gel-line:#9a9186; --gel-shade:rgba(70,62,52,.34);
  --gel-stud:#7d7568; --gel-glow:transparent;
  --gel-ink:#6e675d; --gel-ink-lift:rgba(255,255,255,.45);
  cursor:default;transform:none;animation:none;opacity:.85}
.gelBtn:disabled:hover,.bigBtn:disabled:hover,
.playTitleBtn:disabled:hover,.sheetBtn:disabled:hover{
  transform:none;filter:none;box-shadow:var(--gel-shadow)}

/* --- variants -------------------------------------------------------- */
/* the secondary key: a cream wafer, same shell, no shout */
.gelBtn.is-quiet,.bigBtn.is-quiet,.sheetBtn.is-quiet{
  --gel-top:#fff3d4; --gel-mid:#f2dda8; --gel-bot:#dcbe7f;
  --gel-line:#c9a05a; --gel-shade:rgba(122,82,32,.34);
  --gel-stud:#9a743c; --gel-glow:rgba(255,231,175,.5);
  --gel-ink:#6a441a; --gel-ink-lift:rgba(255,255,255,.6)}
.gelBtn--pill{--gel-r:999px}
/* a key with no words: a square (or round) shell, padding gone, sized to
   its glyph rather than to a label that is not there */
.gelBtn--icon{--gel-pad:0;width:var(--gel-h);flex:0 0 auto}
/* with no label to set the scale, the glyph takes the room the words would
   have had — at label size an icon-only key reads as a mostly-empty shell */
.gelBtn--icon svg{height:1.32em}
/* the glyph is embossed the way the label is — one light edge underneath —
   so an icon key and a word key are lit by the same lamp. currentColor means
   a palette swap moves the icon with the ink, no second variable. */
.gelBtn svg,.bigBtn svg,.playTitleBtn svg,.sheetBtn svg{
  height:.98em;width:auto;display:block;flex:0 0 auto;
  fill:currentColor;pointer-events:none;
  filter:drop-shadow(0 calc(var(--gel-h)*.026) 0 var(--gel-ink-lift))}
/* light coming from the other side: both gleams mirrored to the top-right */
.gelBtn--right{background-position:
  right calc(var(--gel-h)*.31) top calc(var(--gel-h)*.105),
  right calc(var(--gel-h)*.10) top calc(var(--gel-h)*.13),
  0 0, 0 0}

/* --- optional behaviours, opt in by class ---------------------------- */
.gelBtn.appear{animation:gelPop .32s cubic-bezier(.2,.8,.3,1) backwards}
.gelBtn.hint{animation:gelHint 1.6s ease-in-out infinite}
.gelBtn.picked{animation:gelPicked .4s ease}
@keyframes gelPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes gelHint{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.03);filter:brightness(1.09) drop-shadow(0 0 14px rgba(255,195,50,.55))}}
@keyframes gelPicked{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ============================================================
   BOTTOM CONTROLS — the mossy console dock
   ============================================================ */
/* ONE painted console — assets/cpPanel.webp — with the read-out, the two
   arrow keys and the FIRE key set into the four windows cut clean through it,
   and the theta label painted on its left cheek. Everything the old plank
   dock built out of gradients, chamfers and clip-paths is IN the art now, so
   what is left here places parts and sets live text over them.
   tools/cut_panel.py cuts the parts; re-run it if the sheet is redrawn.

   HOW IT IS MEASURED. --u is one pixel of the artwork, so every box in this
   block is written in the panel's own coordinates — the same numbers
   cut_panel.py reads off the sheet's alpha and prints. The CSS and the cutter
   therefore describe the same rectangles, and a redrawn sheet only has to
   reprint the table. --dockW is the one real length here: change it and the
   whole console scales as a rigid unit, the way #stage does.

   ONE OF ITS WORDS IS LIVE — the FIRE key's — and that is why the sheet is
   repainted on its way through the cutter: the artist lettered it in English
   and this game speaks six languages. The sheet's "CONTROL PANEL" plaque is
   not cut at all; see WHERE IT SITS. */
#controlDock{
  --dockW:450px;                          /* the console's width on the stage */
  --u:calc(var(--dockW)/1223);            /* …and one pixel of the sheet */
  position:absolute;left:50%;bottom:-18px;
  width:var(--dockW);height:calc(365*var(--u));
  transform:translateX(-50%) translateY(var(--dockY,0));
  transform-origin:center bottom;
  transition:transform .60s cubic-bezier(.18,.86,.24,1),opacity .38s ease,filter .2s ease;
  background:url(assets/cpPanel.webp) 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 6px 9px rgba(4,12,8,.55));
  /* the box is a rectangle and the console inside it is not, so the frame
     itself never takes a pointer — only the four things you can press do */
  pointer-events:none}

/* WHERE IT SITS, and why it is not the plank's rule any more. The old dock
   fitted entirely inside the dirt band below PLAY_SURFACE_Y=600, and this
   console very nearly does: the art is 3.35:1 where the plank was 5.2:1, so
   at a width that leaves the read-out legible it stands ~134px tall against a
   120px band. Two things in the art make that fit, and the numbers above are
   set by them:
     · the bottom sixth of the sheet is moss fringe and pipe ends hanging off
       the console, so the box is dropped past the stage floor and #stage's
       own overflow:hidden crops decoration rather than instrument;
     · the sheet stacks a "CONTROL PANEL" plaque, a pipe rail either side of
       it and a mat of moss over the frame's top bevel, and all of that stood
       up past the grass line into the field — over the tank's front fender,
       and over the adjacent side's measurement. The cutter trims it off, so
       the bevel IS the console's top edge.
   450/-18 is the pair those two pull to, and it is measured, not chosen: the
   console's top edge lands at y≈604, just under the grass line, and its last
   50 SHEET-px of moss and pipe hang past the stage floor and are cropped.
   That is the part of the old invariant which was actually load-bearing —
   the tank stands ON the grass line and keeps its tracks, its hull and its
   gun, and the triangle never comes near, since its horizontal leg runs at
   the gun's own height, y~523, and its right angle stands off at the target's
   column. Nothing of the console reaches the field: it reads as what it is,
   a console bolted to the parapet in FRONT of the tank.
   The two numbers move together. Widening the console at a fixed drop walks
   its top up into the field — 3.35:1 turns 100px of width into 30px of
   height — and dropping it further at a fixed width buys that back by
   cropping more moss, of which there is only that ~50 sheet-px to spend. */

/* stowed = below the deck (during the roll-in and the briefing);
   busy = present but not yours yet (a shot is in the air) */
#controlDock.is-stowed{--dockY:150%;opacity:0}
/* filter is not additive — a plain saturate() here would drop the console's
   ground shadow the moment a shot was in the air */
#controlDock.is-busy{filter:drop-shadow(0 6px 9px rgba(4,12,8,.55)) saturate(.72) brightness(.86)}

/* Every part is placed by the same four numbers, in sheet pixels. The keys
   and the read-out are set a little PROUD of the window they cover — the
   sheet draws them with their own frames, and a frame that stops short of
   the hole it sits in leaves the swamp showing through the corner. */
#controlDock > *{position:absolute;
  left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));
  width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u))}
/*                          x    y    w    h   —  window it covers          */
.thetaTag{--x:155;--y: 84;--w:129;--h:115}   /* the left cheek              */
.valBox  {--x:289;--y: 52;--w:273;--h:172}   /* readout  315, 64,221x148    */
#upBtn   {--x:601;--y: 20;--w:111;--h:110}   /* up       608, 30, 97x 90    */
#downBtn {--x:600;--y:148;--w:112;--h:110}   /* down     608,158, 97x 90    */
#fireBtn {--x:773;--y: 17;--w:300;--h:238}   /* fire     801, 33,244x207    */

/* --- theta: a LABEL, not part of the read-out, so it stands outside the
   slot — the slot holds the answer and nothing else. It is the sheet's own
   glyph, repainted by the cutter in the plaque's cream (see THETA_INK), and
   the shadow under it is what lifts paint off metal. */
.thetaTag{background:url(assets/cpTheta.webp) 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 calc(2*var(--u)) 0 rgba(10,14,8,.8))}

/* --- angle read-out: a lit slot, not a button --------------------------
   This is the one thing on the console a child has to read at a glance, so
   it gets the sheet's biggest numerals: the artist's own example plate sets
   them at 52% of the plate's height, and that is what is matched here. The
   colour and the bloom are sampled off that plate — pale lime on near-black,
   lit from within, which is what makes it read as a display rather than a
   painted number. */
.valBox{background:url(assets/cpPlate.webp) 0 0/100% 100% no-repeat;
  display:flex;align-items:center;justify-content:center;
  padding:calc(12*var(--u)) calc(15*var(--u));
  color:#eef7a4;pointer-events:auto}
#angleInput,.valBox .deg{
  font-family:inherit;font-weight:700;line-height:1;color:inherit;
  text-shadow:0 0 calc(14*var(--u)) rgba(178,232,86,.85),
              0 0 calc(34*var(--u)) rgba(140,206,52,.5)}
/* The field sizes to its own content where the browser can do it, so 0 and
   30 are both centred with the degree sign hard against them. `size` is the
   fallback everywhere else — two digits wide, which is what four of the five
   angles on the dial are. It stays an <input>, readonly and un-typeable, for
   the reason it always was: it keeps a focus ring and is still announced. */
#angleInput{width:auto;field-sizing:content;border:none;background:none;
  outline:none;text-align:center;padding:0;font-size:calc(124*var(--u))}
/* No gap and a measured drop: the sign belongs ON the numerals' shoulder,
   which is where the sheet's own example plate puts it — a degree sign
   floating off in the corner reads as a second thing on the display, and the
   display holds one thing. */
.valBox .deg{font-size:calc(70*var(--u));align-self:flex-start;
  margin-top:calc(22*var(--u))}
#angleInput:disabled{color:inherit;opacity:.55}

/* --- the two step keys, and FIRE: painted plates, so all that is left is
   the physics. A bitmap key cannot be re-lit with a gradient, so the press,
   the hover and the switched-off state are brightness and travel — which is
   what those states look like on a real steel key anyway. */
.stepBtn,#fireBtn{border:none;padding:0;background:0 0/100% 100% no-repeat;
  cursor:pointer;pointer-events:auto;
  transition:transform .12s ease,filter .12s ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#upBtn{background-image:url(assets/cpUp.webp)}
#downBtn{background-image:url(assets/cpDown.webp)}
#fireBtn{background-image:url(assets/cpFire.webp);
  animation:firePulse 3.4s ease-in-out infinite}

.stepBtn:hover:not(:disabled){filter:brightness(1.22)}
/* White, where the rest of the game rings a focused button in gold: the two
   keys here are a near-black plate and a bright red one, and gold reads as
   part of the FIRE key's own palette on the second of those. The ring also
   scales with the console instead of holding a fixed 3px, so it stays the
   same weight relative to the key it is drawn around. */
.stepBtn:focus-visible,#fireBtn:focus-visible{outline:calc(6*var(--u)) solid rgba(255,255,255,.9);
  outline-offset:calc(4*var(--u))}
/* the press rides a CLASS as well as :active — see armPress() for why */
.stepBtn:active:not(:disabled),.stepBtn.is-pressed{
  transform:translateY(calc(7*var(--u)));filter:brightness(.72)}
/* switched off, not muddied: the key keeps its shape and loses its charge */
.stepBtn:disabled,#fireBtn:disabled{cursor:default;filter:saturate(.25) brightness(.62)}

/* FIRE carries a real LABEL instead of one baked into the plate, which is the
   whole reason the sheet's own word was taken off: "FIRE" had been the last
   string in the game that stayed English in every language. The span is set
   over the key's LIT FACE rather than over its box — the hazard tape runs
   down the left edge of the plate, so the two centres are not the same one. */
#fireBtn span{position:absolute;left:21.7%;top:14.5%;width:64.9%;height:67.5%;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(88*var(--u));font-weight:700;line-height:1;white-space:nowrap;
  color:#fdeb5d;
  text-shadow:0 0 calc(16*var(--u)) rgba(255,150,40,.9),
              0 0 calc(40*var(--u)) rgba(255,90,20,.6)}
/* the Indic labels are longer and unicase — they get room instead of size */
html:not([lang="en"]) #fireBtn span{font-size:calc(52*var(--u))}
#fireBtn:hover:not(:disabled){animation:none;
  filter:brightness(1.15) drop-shadow(0 0 calc(24*var(--u)) rgba(255,110,40,.8))}
#fireBtn:active:not(:disabled),#fireBtn.is-pressed{animation:none;
  transform:translateY(calc(9*var(--u)));filter:brightness(.78)}

.shakeX{animation:shakeX .35s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}

/* ============================================================
   ANIMATIONS
   ============================================================ */
/* The idle heartbeat on FIRE. The plate is painted with its neon ring already
   lit, so this does not light the key — it breathes the spill AROUND it, and
   that is a drop-shadow because the key is a bitmap octagon and a box-shadow
   would halo the rectangle it is drawn in. */
@keyframes firePulse{
  0%,100%{filter:drop-shadow(0 0 calc(6*var(--u)) rgba(255,96,28,.35))}
  50%    {filter:drop-shadow(0 0 calc(26*var(--u)) rgba(255,138,58,.85))}
}
/* ============================================================
   THE TRIG TABLE
   Built in code rather than shipped as the reference PNG, for one reason:
   a picture of a table cannot POINT. The whole value of opening it mid-round
   is that it can light the row the round needs and, when asked, the column
   that answers it — and a flat image can do neither.
   ============================================================ */
#trigSheet{position:absolute;inset:0;z-index:6;display:flex;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(6,14,20,.55);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  pointer-events:auto;animation:sheetIn .22s ease-out both}
#trigSheet.hidden{display:none!important}
@keyframes sheetIn{from{opacity:0}to{opacity:1}}

/* Three blocks, two gaps: sign, table, keys — and with nothing written under
   the title, the panel is set on one rhythm of ~22px between them.
   The MARGINS are not all 22 because two of these blocks paint outside their
   boxes: the title plank carries a baked shadow under its bottom plank, and
   the footer keys sit on a stud with a drop shadow below it. Setting every
   margin to the same number leaves gaps that MEASURE equal and LOOK uneven,
   so the two that paint past their edge are given 18 and the honest one 22.
   Measured on screen: 21.6 / 21.3 / 22.2. */
.trigPanel{position:relative;max-width:880px;width:100%;
  padding:24px 26px 18px;text-align:center;color:var(--parch-ink);
  border:5px solid var(--plate-ring);border-radius:26px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 22%),
    linear-gradient(180deg,var(--parch-a) 0%,var(--parch-b) 60%,var(--parch-c) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.8),
    0 0 0 5px var(--plate-case),
    0 12px 0 var(--plate-case-deep),
    0 26px 60px rgba(0,0,0,.6);
  animation:sheetPop .26s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes sheetPop{from{transform:translateY(14px) scale(.97)}to{transform:none}}

/* The header is the dock's own plank, stood on its end of the panel.
   BLOCK, not inline-block: as an inline-block its vertical position comes
   from baseline alignment inside a line box, so a margin-top on it moved
   nothing — the air above the sign is the panel's own padding-top instead,
   and that is the number to turn. */
.trigTitle{display:block;width:fit-content;margin:0 auto 18px;padding:13px 46px 15px;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;font-size:27px;letter-spacing:2px;
  color:var(--board-cream,#fcebc5);text-shadow:0 3px 0 rgba(60,16,40,.55);
  background:url(assets/board.svg) 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 5px 6px rgba(20,6,10,.45))}
.trigHint{max-width:640px;margin:-8px auto 18px;text-align:center;
  font-family:'Chakra Petch','Trebuchet MS','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',sans-serif;
  font-size:17px;font-weight:600;letter-spacing:.3px;line-height:1.45;
  /* this line sits INSIDE the parchment panel, not on the night scene, so it
     takes the sheet's own ink — the swamp palette has no business in here */
  color:var(--parch-ink,#4a2b10)}
.trigHint:empty{display:none}
.trigScroll{overflow-x:auto;overflow-y:hidden}

#trigTable{border-collapse:separate;border-spacing:5px;margin:0 auto;
  font-family:'Chakra Petch','Trebuchet MS','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',sans-serif}
#trigTable th,#trigTable td{
  padding:7px 6px;min-width:112px;height:56px;border-radius:10px;
  font-size:23px;font-weight:800;text-align:center;vertical-align:middle;
  transition:opacity .2s ease,filter .2s ease,transform .2s ease}
/* the angle headings, in the FIRE orange */
#trigTable th.ang{color:#fff6e2;
  background:linear-gradient(180deg,#ffa32e 0%,#f07d16 55%,#d85f0b 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 0 0 2px #8a3a18,0 3px 0 #8a3a18;
  text-shadow:0 2px 0 rgba(120,45,6,.6)}
#trigTable th.corner{color:#fff6e2;letter-spacing:1px;
  background:linear-gradient(180deg,#8f5bd8 0%,#6f3cbb 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 0 2px #4b2483,0 3px 0 #4b2483;
  text-shadow:0 2px 0 rgba(50,20,95,.6)}
/* the ratio names down the side */
#trigTable th.fn{color:var(--btn-ink);min-width:148px;letter-spacing:.5px;
  background:linear-gradient(180deg,#a44d24 0%,#7c3315 60%,#5b220d 100%);
  box-shadow:inset 0 2px 0 rgba(255,232,190,.3),0 0 0 2px #4a1b28,0 3px 0 #4a1b28;
  text-shadow:0 2px 0 rgba(40,12,4,.6)}
#trigTable td{color:#4a2b10;
  background:linear-gradient(180deg,#fff6dc 0%,#f7e6b8 100%);
  box-shadow:inset 0 0 0 2px rgba(168,125,60,.28)}

/* stacked fractions, the way the textbook prints them */
.frac{display:inline-flex;flex-direction:column;align-items:center;
  line-height:1.02;font-size:19px;vertical-align:middle}
.frac .den{border-top:2px solid currentColor;margin-top:2px;padding-top:2px}
/* ...and a radical that is ONE sign: the display face has no √ of its own,
   the fallback glyph is a thin tick, and a bar laid over the radicand beside
   it never met it — "√2" read as "/2", the same trap the triangle's labels
   fell into. The sign is drawn (radSign) and runs straight into the bar,
   which is the radicand's top border; the flex row stretches the sign to the
   radicand's full height so its last stroke lands ON that border. */
.surd{display:inline-flex;align-items:stretch;vertical-align:baseline}
.radSign{width:.52em;height:auto;overflow:visible;fill:none;stroke:currentColor;
  stroke-width:2.2px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rad{border-top:2.2px solid currentColor;line-height:1.05;padding:1px 2px 0 1px}

/* ---- POINTING ----------------------------------------------------------
   The other RATIO rows recede; the round's own row stays lit. The angle
   headings never dim — they are the axis you read the answer off, and a
   student running along the sin row needs to see which column they have
   stopped at. Dimming them would hide the thing the row is pointing AT.
   The answer's column only arrives on the second ask, so the first look
   still leaves the lookup to do — which is the skill the table is for. */
#trigTable.is-pointing tr:not(.headRow):not(.row-on) th,
#trigTable.is-pointing tr:not(.headRow):not(.row-on) td{opacity:.46;filter:saturate(.5)}
/* the answer's column lifts out of the dim, but only part way: enough for
   the eye to travel from the heading down to the cell, not enough to
   compete with the cell itself */
#trigTable.is-pointing tr:not(.headRow):not(.row-on) td.col-on{
  opacity:.82;filter:none;box-shadow:inset 0 0 0 2px rgba(107,150,18,.4)}
#trigTable td.col-on,#trigTable td.row-on{
  box-shadow:inset 0 0 0 2px rgba(168,125,60,.5)}
#trigTable .row-on th.fn{
  background:linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  color:var(--plate-ink);text-shadow:0 2px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px var(--plate-case),0 3px 0 var(--plate-case)}
/* the one cell that answers the round */
#trigTable td.is-answer{opacity:1;filter:none;color:#2c3f06;transform:scale(1.06);
  background:linear-gradient(180deg,#eaff9a 0%,#c7ea55 55%,#a3cf2c 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 3px #6b9612,0 0 20px rgba(190,236,86,.9);
  animation:answerBeat 1.1s ease-in-out infinite}
@keyframes answerBeat{
  0%,100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 3px #6b9612,0 0 14px rgba(190,236,86,.7)}
  50%    {box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 0 3px #7fae18,0 0 30px rgba(214,247,120,1)}
}
#trigTable th.ang.col-on{background:linear-gradient(180deg,#ffd05a 0%,#f7a222 55%,#e07f0d 100%)}

.trigFoot{display:flex;gap:14px;justify-content:center;margin-top:22px}
/* The sheet's two keys are the gel shell at 52px. Only the knob, the
   padding and the display face are set here — the material comes from
   the kit, so these can never drift out of step with the card buttons. */
.sheetBtn{--gel-h:52px;--gel-pad:30px;--gel-r:17px;
  padding-bottom:3px;                       /* Luckiest Guy sits high in its box */
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;
  font-size:21px;font-weight:400;letter-spacing:1.5px}
.sheetBtn[hidden]{display:none}

@media (max-width:900px){
  #trigTable th,#trigTable td{min-width:80px;height:48px;font-size:19px;padding:5px 4px}
  #trigTable th.fn{min-width:112px}
  .frac{font-size:16px}
  .trigTitle{font-size:22px;padding:11px 30px 13px}
}

/* ============================================================
   OVERLAYS (title screen / pause / game-over / win cards)
   ============================================================ */
#hud{transition:opacity .45s ease}
#stage.is-pregame #hud,
body[data-state="OUTRO"] #hud,body[data-state="WIN"] #hud{opacity:0;pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(3,10,14,.72);display:flex;
  align-items:center;justify-content:center;pointer-events:auto;overflow:hidden;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#overlay.hidden{display:none!important}
#overlay.titleScreen{display:block;background:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none}
#overlay.titleScreen::before{content:"";position:absolute;inset:0;pointer-events:none;
  display:none}
/* The card wears the pill's frame — brown casing, cream bezel — but its
   face is parchment, not gem. Paragraphs need a page: dark ink on cream
   holds its contrast all the way down, and it leaves the green free to
   mean "this is the thing you press". */
.card{position:relative;text-align:center;color:var(--parch-ink);
  border:5px solid var(--plate-ring);border-radius:28px;
  padding:32px 54px 40px;max-width:760px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 24%),
    linear-gradient(180deg,var(--parch-a) 0%,var(--parch-b) 58%,var(--parch-c) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.85),
    inset 0 -10px 0 rgba(170,124,60,.28),
    0 0 0 5px var(--plate-case),
    0 12px 0 var(--plate-case-deep),
    0 26px 60px rgba(0,0,0,.6)}
/* hairline stitch inside the bezel, the same trim the console dock wears */
.card::before{content:"";position:absolute;inset:7px;border-radius:21px;pointer-events:none;
  border:2px solid rgba(107,58,20,.16)}
/* the heading is a plate in its own right — the pill, holding a title */
.card h1,.card h2{position:relative;display:inline-block;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;font-weight:400;
  color:var(--plate-ink);letter-spacing:1.5px;line-height:1.14;
  padding:12px 30px 15px;border-radius:20px;border:4px solid var(--plate-ring);
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.5),
    inset 0 -8px 0 rgba(63,92,8,.42),
    0 0 0 4px var(--plate-case),
    0 6px 0 var(--plate-case-deep),
    0 14px 20px rgba(0,0,0,.32);
  text-shadow:0 2px 0 rgba(255,255,255,.4),0 -2px 0 rgba(74,58,6,.22)}
.card h1{font-size:40px}
.card h2{font-size:34px}
.card .sub{font-size:17px;color:var(--parch-ink-soft);font-weight:800;letter-spacing:5px;
  text-transform:uppercase;margin-top:12px}
.card p{font-size:19px;margin:18px 0;color:var(--parch-ink);line-height:1.55;
  text-shadow:0 1px 0 rgba(255,255,255,.55)}
.card .hint{font-size:15px;color:var(--parch-ink-soft)}
.card b{color:#4b7a0d}
/* the card's action key IS the title pill, sized down — same gem, same
   casing, same ink, so "press this" looks identical wherever it appears */
/* The card's action key IS the title pill, sized down — same shell, same
   ring, same ink, so "press this" looks identical wherever it appears. */
.bigBtn{--gel-h:68px;--gel-pad:46px;--gel-r:22px;
  margin-top:22px;padding-bottom:4px;white-space:nowrap;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;
  font-size:28px;font-weight:400;letter-spacing:2.5px}
/* a card's keys sit in a centred row — the last card has just the one, FINISH */
.cardActions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.cardActions .bigBtn{margin-top:22px}

/* --- NEXT ▶ — the story's hand-off to the lesson, in the corner a "go on"
   key lives, as the storyboard places it --- */
#cmdNext{position:absolute;right:34px;bottom:30px;margin:0;visibility:hidden}
#cmdNext.is-in{visibility:visible;animation:gelPop .32s cubic-bezier(.2,.8,.3,1) backwards}
/* the story is a scene, not a round: the round's keys and readouts stand
   down for all of it */
body.in-story #hud,body[data-state="COMMANDER"] #hud{opacity:0;pointer-events:none}

/* --- THE STORY'S CONTROL — a quiet SKIP in the corner the hint bulb uses
   during a round. --- */
#storyUi{position:absolute;inset:0;pointer-events:none}
#storyUi.hidden{display:none}
#storySkip{position:absolute;right:18px;top:14px;pointer-events:auto;
  --gel-h:46px;--gel-pad:22px;font-size:18px;font-weight:800;letter-spacing:1px}
/* beat 1's line is the story's TITLE, set the way the game sets its own name:
   the wordmark's slime green, a heavy dark outline, a block shadow under it —
   not a caption box. It springs in over the world and stays for the beat. */
#caption.is-title{top:31%;transform:translate(-50%,-50%);max-width:1100px;
  padding:0;border:0;background:none;box-shadow:none;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;
  font-size:84px;font-weight:400;letter-spacing:2px;line-height:1.08;color:#cdf24e;
  -webkit-text-stroke:8px #14240a;paint-order:stroke fill;
  text-shadow:0 7px 0 #0b1505,0 16px 26px rgba(0,0,0,.6);
  animation-name:storyTitleIn;animation-duration:.7s}
html:not([lang="en"]) #caption.is-title{letter-spacing:0;font-size:72px}
/* its own name: the title screen's titleIn is declared further down and,
   sharing the name, won — and that one never centres, so this title slid in
   off to the right and snapped into place */
@keyframes storyTitleIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}
  65%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(1deg)}
  100%{opacity:1;transform:translate(-50%,-50%)}}
/* the speaker: her face, in a porthole on the bar's left, beside every line
   she says — the voice of the story has a face from its first caption on */
#caption.has-speaker{padding-left:96px}
#caption.has-speaker::before{content:"";position:absolute;left:16px;top:50%;
  width:60px;height:60px;margin-top:-30px;border-radius:50%;
  background:url(assets/commander.webp) -16px -8px/88px auto no-repeat,
             radial-gradient(circle at 50% 40%,#3f6b57,#1d3a30);
  box-shadow:0 0 0 3px var(--plate-ring),0 0 0 6px var(--plate-case),inset 0 -6px 10px rgba(0,0,0,.25)}

/* --- THE SHELL RACK — tries left on this zombie, in the corner opposite
   the bulb, on the same green plate every line of game copy sits on. A spent
   shell stays in the rack, greyed, so the count reads at a glance as "used
   of three", not just "left". --- */
#shellBar{position:absolute;left:18px;top:14px;display:flex;align-items:center;gap:12px;
  padding:6px 16px 8px 18px;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;
  font-size:20px;font-weight:400;letter-spacing:1px}
#shellBar > *{position:relative;z-index:1}          /* over the plate's dome highlight */
html:not([lang="en"]) #shellBar{letter-spacing:0}
.shellIcons{display:flex;gap:6px}
.shell{display:block;width:16px;height:34px}
.shell svg{display:block;width:100%;height:100%;overflow:visible}
.shell .nose{fill:#cdd5d7;stroke:#3d3005;stroke-width:1.4}
.shell .body{fill:#e5b13f;stroke:#3d3005;stroke-width:1.4}
.shell .band{fill:#b4532c}
.shell .base{fill:#a3741f;stroke:#3d3005;stroke-width:1.4}
.shell .shine{fill:#fff;opacity:.45}
.shell.spent{opacity:.3;filter:grayscale(1) brightness(.7)}
.shell.is-spending{animation:shellSpend .55s cubic-bezier(.3,.7,.3,1)}
.shell.is-loading{animation:shellLoad .4s cubic-bezier(.2,.9,.3,1.25) backwards}
.shell.is-loading:nth-child(2){animation-delay:.09s}
.shell.is-loading:nth-child(3){animation-delay:.18s}
@keyframes shellSpend{
  0%{transform:none;opacity:1;filter:none}
  35%{transform:scale(1.45) rotate(-16deg);opacity:1;filter:none}
  100%{transform:none}}
@keyframes shellLoad{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
/* the first time the rule is said, the rack it is about lights up with it */
#shellBar.is-calling{animation:shellCall 1.1s ease-in-out 3}
@keyframes shellCall{50%{transform:scale(1.08);filter:drop-shadow(0 0 12px rgba(255,232,120,.95))}}
/* …and the out-of-shells card shows the empty rack it is talking about */
.cardShells{display:flex;justify-content:center;gap:12px;margin:20px 0 2px}
.cardShells .shell{width:22px;height:46px;opacity:.45}

/* --- THE CAPTION — the ending's narration, across the top the way the
   storyboard's frames carry theirs, on the cards' parchment. --- */
/* sized to its words, up to 940px — anchored at the stage's middle, it would
   otherwise only ever get the right half to wrap in — and a line that does
   wrap is balanced, so no word is left alone on the second row */
#caption{position:absolute;left:50%;top:22px;transform:translateX(-50%);
  width:max-content;max-width:940px;text-wrap:balance;
  padding:14px 38px 16px;text-align:center;pointer-events:none;
  border:5px solid var(--plate-ring);border-radius:22px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 30%),
    linear-gradient(180deg,var(--parch-a) 0%,var(--parch-b) 58%,var(--parch-c) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.85),inset 0 -8px 0 rgba(170,124,60,.28),
    0 0 0 5px var(--plate-case),0 9px 0 var(--plate-case-deep),0 20px 40px rgba(0,0,0,.5);
  font-size:28px;font-weight:800;line-height:1.3;color:var(--parch-ink);
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  animation:captionIn .45s cubic-bezier(.2,.9,.3,1.2) backwards}
#caption.hidden{display:none}
@keyframes captionIn{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}
  to{opacity:1;transform:translate(-50%,0)}}
/* the last card lets the safe zone's fireworks show round it */
#overlay.is-win{background:rgba(3,10,14,.3);-webkit-backdrop-filter:none;backdrop-filter:none}
/* Indic scripts are unicase and their conjuncts sit tight: UPPERCASE is a
   no-op and tracking only pulls the clusters apart, so both come off for
   every language but English. */
html:not([lang="en"]) .card h1,
html:not([lang="en"]) .card h2,
html:not([lang="en"]) .bigBtn,
html:not([lang="en"]) .playTitleBtn,
html:not([lang="en"]) .trigTitle,
html:not([lang="en"]) .sheetBtn{text-transform:none;letter-spacing:0}

/* ============================================================
   TITLE SCREEN
   Laid out after the arcade key-art convention: a night skyline
   behind a burst of light, the slime wordmark up top, one fat
   START pill on the burst's centre, and the utilities parked
   as chunky wooden plates in the corners.
   The wordmark and the whole landscape are painted into the plate
   drawTitleScene() lays down, and the zombie line-up is drawn on the
   canvas beside it, so this sheet dresses one thing: the pill.
   ============================================================ */
.titleScreenInner{position:absolute;inset:0;color:var(--text-primary);text-align:center;
  animation:titleIn .78s cubic-bezier(.2,.8,.2,1) both}
#overlay.leaving .titleScreenInner{animation:titleOut .52s ease-in both}

.srOnly{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* --- START — the one pill, standing in the light ---------------------
   It used to be centred on TITLE_BURST, which pinned the burst 52px above the
   wall and left its lower rays nowhere to go. The two are decoupled now: the
   burst is up in the sky behind the title, and the pill sits below it in the
   pool of light, clear of the wordmark and just above the wall's mossy lip. */
.titleCtas{position:absolute;left:50%;top:524px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3}
/* the biggest instance of the same shell: 84px tall, fixed width so the
   pill's silhouette is identical in every language */
.playTitleBtn{--gel-h:84px;--gel-r:26px;
  width:318px;padding-bottom:4px;
  font-family:'Luckiest Guy','Chakra Petch','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Telugu','Noto Sans Oriya','Noto Serif Oriya',cursive;
  font-size:40px;font-weight:400;letter-spacing:3px;
  animation:playPulse 3.6s ease-in-out infinite}
/* an animated box-shadow outranks any static one, so the idle pulse has to
   stand down for the hover halo and the focus ring to be seen at all */
.playTitleBtn:hover:not(:disabled),.playTitleBtn:focus-visible{animation:none}
#loadBar{position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  width:322px;height:12px;border-radius:7px;background:#2a1607;
  border:2px solid #8a5a1a;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#loadFill{height:100%;width:0%;
  background:linear-gradient(90deg,#f18a00,#ffdb4d);
  transition:width .2s;box-shadow:0 0 12px rgba(255,196,64,.75)}
#loadBar.ready{opacity:0;transform:scaleX(.86);transition:opacity .35s ease,transform .35s ease}

@keyframes titleIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleOut{to{opacity:0;transform:translateY(-18px) scale(1.02)}}
@keyframes playPulse{
  0%,100%{box-shadow:var(--gel-shadow),
    0 0 calc(var(--gel-h)*.34) calc(var(--gel-h)*.02) rgba(255,196,64,.34)}
  50%    {box-shadow:var(--gel-shadow),
    0 0 calc(var(--gel-h)*.62) calc(var(--gel-h)*.08) rgba(255,218,104,.78)}
}

@media (prefers-reduced-motion: reduce){
  .titleScreenInner,.playTitleBtn,
  #fireBtn,.shakeX,#hintBtn.is-calling,
  #trigSheet,.trigPanel,#trigTable td.is-answer,#cmdNext,
  .shell,#shellBar,#caption{animation:none!important}
  .playTitleBtn:hover{transform:none}
  .gelBtn,.bigBtn,.playTitleBtn,.sheetBtn{animation:none!important}
  .gelBtn:hover,.bigBtn:hover,.sheetBtn:hover{transform:none}
  .gelBtn::after,.bigBtn::after,.playTitleBtn::after,.sheetBtn::after{display:none}
  #hud,#msg,#loadFill,#loadBar.ready{transition:none}
  #controlDock{transition:opacity .2s ease}
}
@media (max-width:700px){
  /* A phone gets the console a little smaller and a little lower, which keeps
     the same bargain the full-size numbers strike — see #controlDock. */
  #controlDock{--dockW:414px;bottom:-12px}
}

/* ============================================================
   RESPONSIVE RULES — #stage is scaled as one rigid 16:9 unit by
   fitStage() in JS, so every HUD element keeps its position and
   proportion relative to the game at any viewport size.
   ============================================================ */
</style>

<script>
'use strict';
/* ============================================================
   TANK vs ZOMBIE — Angle Academy
   A trigonometry game for young students.
   The scenery is one complete illustrated background plate; gameplay
   objects are layered over it in world space.
   ============================================================ */
const W = 1280, H = 720;
const PLAY_SURFACE_Y = 600;                // measured: tan field meets the grass lip at y≈602 on every plate
const GROUND_Y = PLAY_SURFACE_Y;           // compatibility alias for shell/building collision
/* ---- the target lane ------------------------------------------------
   The tank drives along the FRONT of the field; every target stands one
   lane back from it, with its foot line this far up the plate. Two things
   come out of that one number, and they are the same thing seen twice:
   a strip of ground runs in front of every structure, which is what makes
   it read as standing IN the field rather than as a wall across it — and
   because a structure is scaled to reach from its deck down to its own
   foot line, moving that line up is what makes it SMALLER.
   The deck itself never moves: the round's triangle pins it under the
   zombie's soles. So this shrinks the building without touching a single
   number the player is solving for, and hands the roof back to the zombie,
   who is the thing they are supposed to be looking at.

   What caps this number is the DIAGRAM, not the art: the triangle's
   horizontal leg runs at the gun's own height (y~522), so a foot line set
   back past that would put the right angle — the corner that says "this is
   a right triangle" — on open field BELOW the building it belongs to. The
   assertion under pivotFromTankScreen() holds anyone who raises it. */
const TARGET_SET_BACK = 46;
const TARGET_BASE_Y = PLAY_SURFACE_Y - TARGET_SET_BACK;
const TOTAL_LEVELS = 5;
/* Shells are per ZOMBIE: every target gets the full rack, shown in the
   corner, and running dry means trying THAT zombie again. A rack shared by
   the whole mission meant one early miss quietly cost a shot three rounds
   later, and "out of shells" arrived after two misses with no warning. */
const SHELLS = 3;
/* Where the camera holds the tank WHILE TRAVELLING. Each round's resting
   position is its own — see frameRound() — and the drive lands on that. */
const CAMERA_FOLLOW_X = 164;
/* ---- THE RULER -----------------------------------------------------
   One metre is this many pixels, in every round, for good.

   Each round's triangle was always similar to its own numbers — the target
   sits on the answer ray, so the three sides came out in exactly the ratio
   the labels claim, 69.0 / 69.0 / 69.0 px per metre and so on. What was NOT
   true is the thing a student actually builds a sense of length from: the
   ruler CHANGED between rounds. Round 1 drew 6 m as 414px and round 3 drew
   8 m as 398px, so the bigger number came out shorter, and "how far is 8
   metres" stopped meaning anything the moment the round changed.

   Holding it still costs the framing its freedom: a round can no longer be
   pushed out to fill the frame, because its distance is now its own number
   times this constant. That is the right trade — the picture IS the
   quantity. What the rounds spend instead is SIZE: they grow 5 m to 9 m
   through the run, which only reads as growth because the ruler doesn't. */
const WORLD_SCALE = 44;            // px per metre — see the ceiling note below
const TARGET_SCREEN_X_MAX = 1120;  // seeds the world x of round 1 (see below)
const TARGET_TOP_MARGIN = 22;      // sky the tallest standing pose keeps above it
const TARGET_EDGE_MARGIN = 26;     // frame the building has to stay whole inside,
                                   // with a sliver to spare — a shape that kisses
                                   // the edge reads as cropped even when it isn't
const MIN_TANK_CLEARANCE = 96;     // ground that has to stay open between the
                                   // tank's nose and the structure's near wall
/* ...except that a STEEP round has no ground to leave. At 60 degrees the
   target stands at opposite/tan60 — barely 220px out — while the tank alone
   reaches 161px past its own pivot. The geometry puts the tower AT the tank's
   nose, and that IS what a 60-degree shot looks like; demanding clearance
   there is demanding the angle not exist.
   So a steep round may tuck its structure behind the hull instead. It reads
   as depth rather than collision because the structure stands on the set-back
   lane and the tank is drawn over it — the same reason the tank passes in
   front of cleared buildings. Capped at TANK_TUCK so a tower can never appear
   to grow out of the turret. */
const TANK_TUCK = -46;
const TANK_BOTTOM_PADDING = 6;             // lets visible wheels/tracks meet the surface, not the PNG box
/* The tank is anchored at CAMERA_FOLLOW_X, and the round's own numbers put
   its target: `adjacent` metres out along the gun's line, `opposite` metres
   up from it, both measured with WORLD_SCALE. Nothing chooses the framing any
   more; it is read off the level data.

   THE NUMBERS ARE THE STAGING. A 30-degree round is wide and low, a
   45-degree round is square and steep, and a round with bigger numbers is
   simply bigger — all three of those are now visible facts about the picture
   rather than side effects of a framing search.

   WHAT LIMITS THE RULER. The stage holds ~400px of sky above the gun's line
   before the tallest standing pose starts to crop, so the largest `opposite`
   in the level table sets the ceiling on WORLD_SCALE: at 9 m that is 44 px/m.
   Raise one and the other has to come down.

   WHY 60 IS NOT AN ANSWER, though it is on the dial. A 60-degree round would
   have to stand its target at run = opposite/tan60 ~ 230px, while the tank
   itself reaches 161px right of its own pivot and the slimmest structure in
   the set still spills ~0.29 of its height left of where it is pinned. Work
   it through and the clearance is 0.29*O - 147 px: it does not reach zero
   until the target is ~510px up, which is off the top of the stage. So a
   60-degree target would stand ON the tank, with its adjacent leg and label
   drawn across the hull. It is not a tuning problem; the tank's own length is
   wider than the triangle. 0 and 90 have no triangle at all. Hence answers of
   30 and 45, and three distractors that are wrong for a reason a student can
   see on screen once they fire at them.
   Round 1's world sits INTRO_PAN to the right of the camera's home position,
   which gives the opening roll-in real ground to cover: the world scrolls
   with the tank instead of the level snapping into place. */
const INTRO_PAN = 300;
// measured off the WIDEST framing a round can take, so the opening roll keeps
// its full pan whatever building round 1 draws
const FIRST_TARGET_WORLD_X = TARGET_SCREEN_X_MAX + INTRO_PAN;
const INTRO_ROLL_IN = 820;                 // tank starts this far back — fully off-screen left
/* Ground between neighbouring structures. This is pure world space — no
   round's triangle touches it — so it is the one separation knob that costs
   nothing but drive time, and TANK_MAX_SPEED below is lifted to match so the
   longer haul still lands in about the same beat. */
const TARGET_SPACING = 1450;
const CULL_MARGIN = 320, DESPAWN_MARGIN = 120;
const TANK_ACCEL = 430, TANK_MAX_SPEED = 455, TANK_DECEL = 520;
const CAMERA_FOLLOW_STRENGTH = 6.4, CAMERA_LOOKAHEAD_MAX = 52;
const FINAL_ROLL_DISTANCE = 520;
/* ---- THE TABLE ------------------------------------------------------
   Class 10 trigonometry is taught off five standard angles, and a student
   answering from that table should never have to invent a number it cannot
   produce. So the dock is a DIAL over exactly these values: + and - step
   along the list, there is no way to land between them, and the gun can
   only ever be laid to one of them.
   0 and 90 are on the dial for the same reason they are in the table — they
   are part of what a student has to know — but no round can ANSWER to them:
   a right triangle with a 0 or 90 degree angle at the gun has no target to
   stand anywhere. They are the table's two honest distractors. */
const ANGLE_CHOICES = [0, 30, 45, 60, 90];
const DEFAULT_START_ANGLE = 0;   // the dial starts where the gun already rests
const PROJECTILE_SPEED = 620, HIT_PADDING = 18;
/* ---------- CHOREOGRAPHY ----------
   The gun rests level while the student works. The barrel only swings once
   FIRE commits an answer, so the angle has to come from the triangle instead
   of from nudging the barrel until it looks about right.

   PACING. One rule governs every duration in this file:

       the RESPONSE to an input is instant; the CONSEQUENCE of it breathes.

   So the press physics, the stepper's hold-repeat and the angle field are
   left alone — a control that lags its own finger feels broken, not weighty.
   Everything downstream of the press is deliberately unhurried, because a
   beat the player can watch is a beat they can read: the gun lays over,
   holds, THEN fires; the shell crosses the hypotenuse slowly enough to see
   it ride the line the guides just drew; the knockdown tumbles instead of
   snapping. The teaching beat — the briefing below — gets the most room of
   all, and it is skippable (click, Enter or Space) so a replay never pays
   for it twice. */
const BARREL_REST_ANGLE = 0;
const LAY_BASE = .46, LAY_PER_DEG = .019, LAY_MAX = 1.40;  // time to lay the gun over
const LAY_HOLD = .32;                                      // beat of stillness before the shot
/* The briefing score: one cue per element, in the order it earns attention.
   Tuning the whole rhythm means editing this table and nothing else.

   Each cue now finishes drawing BEFORE the next one starts, and the gap
   after it is deliberate: that pause is the only moment the player has to
   take the new side in on its own, against the ones already up. Run them
   overlapping and the triangle merely appears; run them spaced and it gets
   built, one named part at a time. The note per cue rises with the phrase,
   so the ear counts the parts too. */
const CUES = [
  {key:'adj',   at:.22, dur:.62, note:588},   // horizontal, gun → under the target
  {key:'opp',   at:.92, dur:.54, note:699},   // vertical, up to the target
  {key:'hyp',   at:1.56,dur:.70, note:831},   // the line of fire
  {key:'theta', at:2.42,dur:.66, note:988},   // θ sweeps open at the gun
  {key:'chipA', at:3.16,dur:.34, note:1175},  // the two given lengths
  {key:'chipO', at:3.40,dur:.34, note:1319}
];
const BRIEF_END = 3.95;
const REVEAL_KEYS = CUES.map(c=>c.key);
const clamp01 = v => v<0 ? 0 : v>1 ? 1 : v;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const FONT = '"Chakra Petch","Trebuchet MS","Noto Sans Devanagari","Noto Sans Gujarati",'
           + '"Noto Sans Telugu","Noto Sans Oriya",sans-serif';
const REDUCED_MOTION = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
const ambientMotionAllowed = () => !REDUCED_MOTION.matches;

/* ============================================================
   LAUNCH PARAMETERS
   The host launches the book with a query string and everything below
   reads from this one place: ?lan= picks the language, ?dev=1 opens the
   raw signal firehose, and ?context_id / ?journey_id / ?medium are the
   platform's own journey binding, echoed back into every statement.
   ============================================================ */
const QS = new URLSearchParams(location.search);

/* ============================================================
   LANGUAGE
   Every line of screen text lives in i18n/strings.json, keyed by its
   ENGLISH source line. That choice is what makes the fallback safe: if
   the file cannot be fetched — opened straight off disk, say, where
   fetch has no origin — t() hands back the key, and the key IS the
   English line. The game loses its translations, never its text.
   ============================================================ */
const LANGS = ['en','hi','mr','te','or','gu'];
const I18N = {
  /* ?lan= is the documented switch; ?lang= is accepted because people type
     it, and ?medium= (the platform's own field) is honoured last so a host
     that only sets the medium still gets the right script on screen. */
  lang: (v => LANGS.includes(v) ? v : 'en')(
          String(QS.get('lan') || QS.get('lang') || QS.get('medium') || 'en').toLowerCase()),
  strings: null,
  /* The inline #i18nStrings block is read first so a file:// open is already
     translated; the fetch then runs and wins if it succeeds, so a served
     build always shows the latest i18n/strings.json without a rebuild. */
  inline(){
    const el = document.getElementById('i18nStrings');
    if(!el) return null;
    try { return JSON.parse(el.textContent).strings || null; }
    catch(e){ return null; }
  },
  load(){
    this.strings = this.inline();
    return fetch('i18n/strings.json', {cache:'no-cache'})
      .then(r => r.ok ? r.json() : null)
      .then(d => { if(d && d.strings) this.strings = d.strings; })
      .catch(() => {});   // keep the inline pack; English is already the key
  },
  t(key, vars){
    const entry = this.strings && this.strings[key];
    let out = (entry && (entry[this.lang] || entry.en)) || key;
    if(vars) out = out.replace(/\{(\w+)\}/g, (m,k) => k in vars ? vars[k] : m);
    return out;
  }
};
const t = (key, vars) => I18N.t(key, vars);
/* The markup carries its English inline (so a raw file:// open still reads),
   and these three attributes name the msgid to swap it for. */
function applyI18n(){
  document.documentElement.lang = I18N.lang;
  document.title = t('Tank vs Zombie — Angle Academy');
  document.querySelectorAll('[data-i18n]')
          .forEach(n => n.textContent = t(n.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]')
          .forEach(n => n.title = t(n.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]')
          .forEach(n => n.setAttribute('aria-label', t(n.dataset.i18nAria)));
}

/* ============================================================
   PLATFORM BRIDGE — the outbound event stream (see XAPI_EVENTS.md)

   Seven verbs, one shape: {verb, object, result, context}. They go out
   through SwiftPAL.sendEvent when the platform bridge is present, and
   fall back to a postMessage when it is not, so the same build runs
   inside the app and on a bare dev server.

   The 30-odd internal signals are a separate, DEV-ONLY channel
   (GameBus.signal, ?dev=1). A production host sees the seven verbs and
   nothing else.
   ============================================================ */
/* The stable content id of this book. It does NOT change per journey —
   the journey binding arrives on the query string — so the same build can
   be dropped into any course without colliding. ?skill_code= overrides it
   for hosts that shelve the book under an id of their own. */
const SKILL_CODE  = QS.get('skill_code') || 'MA10T01_L01_S01';
const LO_CODE     = QS.get('lo_code') || SKILL_CODE.replace(/_S\d+$/, '');
const MEDIUM      = QS.get('medium') || I18N.lang;
const CONTEXT_ID  = QS.get('context_id') || null;
const JOURNEY_ID  = QS.get('journey_id') || null;
const DEV_SIGNALS = QS.get('dev') === '1';

const GameBus = {
  bootT: performance.now(),
  runT: null,            // the tap on PLAY — what activity_completed's duration_ms measures from
  running: false,        // false during the title screen and the #preview harnesses
  completed: false,      // activity_completed fires once per run and only on the button
  pendingQuestion: false,
  answers: [],           // one row per question actually answered, first try recorded
  current: null,

  post(msg){
    try{ (window.parent && window.parent !== window ? window.parent : window).postMessage(msg, '*'); }
    catch(_){}
  },
  context(extra){
    const c = {skill_code:SKILL_CODE, lo_code:LO_CODE, medium:MEDIUM,
               session_ms: Math.round(performance.now() - this.bootT)};
    if(extra) Object.assign(c, extra);
    if(CONTEXT_ID) c.context_id = CONTEXT_ID;
    if(JOURNEY_ID) c.journey_id = JOURNEY_ID;
    return c;
  },
  send(verb, object, result, extra){
    const statement = {verb, object};
    if(result) statement.result = result;          // optional-by-verb: omitted, never null-stuffed
    statement.context = this.context(extra);
    try{
      if(window.SwiftPAL && typeof window.SwiftPAL.sendEvent === 'function') window.SwiftPAL.sendEvent(statement);
      else this.post({type:'swiftpal:xapi', statement});   // standalone dev, no bridge
    }catch(_){}
    if(DEV_SIGNALS) console.debug('[xapi]', verb, statement);
    return statement;
  },
  /* the old firehose: still here, still useful for tuning, never shipped */
  signal(name, data){
    if(!DEV_SIGNALS) return;
    this.post({type:'swiftpal:signal', name, data:data||null,
               t:Math.round(performance.now() - this.bootT)});
  },

  /* every question-bearing statement carries the same five fields, so the
     five rounds are told apart by context.template, not by new verbs */
  questionCtx(){
    const L = currentLevelData();
    if(!L) return {phase:'practice'};
    return {question_id:'L'+L.id, question_index:G.level,
            template:'SOLVE_ANGLE_'+L.type.toUpperCase(),
            question_format:'mcq', phase:'practice'};
  },

  launched(){
    this.runT = performance.now();
    this.running = true; this.completed = false;
    this.answers = []; this.current = null;
    this.send('activity_launched', {type:'activity', id:SKILL_CODE}, null, {phase:'intro'});
  },
  screen(id, phase){
    this.send('screen_viewed', {type:'screen', id}, null, {phase: phase || 'practice'});
  },
  questionStarted(){
    const L = currentLevelData(); if(!L) return;
    const id = 'L'+L.id;
    /* a round re-entered after a game over is answered again, not answered
       twice — the old row goes so the final accuracy counts each question once */
    this.answers = this.answers.filter(r => r.id !== id);
    this.current = {id, index:G.level, first:null};
    this.send('question_started', {type:'question', id}, null, this.questionCtx());
  },
  answered(correct){
    /* the dial is a five-option MCQ that is never shuffled, so the position
       shown and the position authored are the same index */
    const idx = ANGLE_CHOICES.indexOf(G.angleTarget);
    const attempt = G.tries;
    if(this.current && this.current.first === null){
      this.current.first = !!correct;
      this.answers.push(this.current);
    }
    this.send('question_answered',
      {type:'text', id:'opt_'+idx, text:G.angleTarget+'°', mediaUrl:null,
       ui_index:idx, original_index:idx},
      {score: (correct && attempt === 1) ? 1 : 0, attempt, is_correct: !!correct},
      this.questionCtx());
  },
  hint(id){  this.send('hint_used',      {type:'hint',  id}, null, this.questionCtx()); },
  audio(id){ this.send('audio_replayed', {type:'audio', id}, null, this.questionCtx()); },

  /* first-try accuracy across everything answered — not the star score, and
     emphatically not always 1 */
  accuracy(){
    if(!this.answers.length) return 0;
    return Math.round(this.answers.filter(r => r.first).length / this.answers.length * 100) / 100;
  },
  /* Fires on the FINISH tap and nowhere else. The celebration screen
     appearing is not completion: a host that redirects on this event will
     always let the child watch the fireworks and choose to move on. */
  complete(){
    if(this.completed) return;
    this.completed = true;
    const score = this.accuracy();
    const duration_ms = Math.round(performance.now() - (this.runT || this.bootT));
    this.send('activity_completed', {type:'activity', id:SKILL_CODE},
      {completed:true, progress:100, score, duration_ms}, {phase:'outro'});
    this.post({type:'swiftpal:lesson_complete', report:{
      skill_code:SKILL_CODE, lo_code:LO_CODE, score, duration_ms,
      questions:this.answers.map(r => ({question_id:r.id, question_index:r.index,
                                        first_try_correct:!!r.first}))
    }});
    this.post({type:'swiftpal:proceed'});     // the existing next-module message
  }
};
window.GameBus = GameBus;

function loadAll(cb){
  const keys = Object.keys(MANIFEST); let done = 0;
  keys.forEach(k=>{
    const im = new Image();
    im.onload = im.onerror = ()=>{ done++;
      $('loadFill').style.width = (done/keys.length*100)+'%';
      if(done===keys.length) cb(); };
    im.src = MANIFEST[k]; IMGS[k]=im;
  });
}
/* A picture is decoded the first time it is drawn, and a baked canvas is
   only painted the first time something draws from it — and most of those
   first times used to land inside the story: the whole swamp strip and the
   tank on its opening title, each zombie sheet as the horde rose, the
   barriers and the compound on the glide. Drawing everything once at load,
   full size but clipped to a single pixel, gets all of it done while the
   loading bar is still up. */
function warmArt(list){
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, 1, 1); ctx.clip();
  list.forEach(im=>{ if(im && (im.naturalWidth || im.width)) ctx.drawImage(im, 0, 0); });
  ctx.restore();
  ctx.clearRect(0, 0, 1, 1);
}

/* ============================================================
   ZOMBIE TYPES
   Three characters share one rig. A type owns its art, its
   on-screen height and its animation cadence; the rest of the game
   never asks which one is standing on the roof — it asks the
   registry.

   A pose is [sx, sy, sw, sh, ax?] in that sheet's own pixels:
     sx,sy,sw,sh  the frame's content box
     ax           the body's centre-line, measured from sx. Optional;
                  defaults to the box centre.
   Poses draw bottom-anchored on feetY and ax-anchored on z.x, so a
   type can neither resize nor slide sideways between poses. That
   `ax` matters: on a sheet where the arms reach, the content box
   grows with the arm and box-centre anchoring would swing the body
   up to 23px — a visible shuffle in place.

   `bodyPx` is the STANDING body height in that sheet's own pixels,
   which is what turns `height` into a draw scale. A type's idle art
   and its knockdown art are drawn at different resolutions, so each
   frame set carries its own — that is what keeps a zombie the same
   size at the instant it is hit.

   Where a knockdown leaves the ground, its box is padded down to the
   sheet's common ground line instead of cropped to the body, so plain
   bottom-anchoring reproduces the airborne beat the artist drew.

   FACING: the tank is always to the LEFT of the roof, so every zombie has
   to look down the barrel at it. The Zombie2 and Zombie3 sheets are drawn
   three-quarter to camera and already read that way; the ZombieSprite sheet
   is a right-facing profile, so its type sets `facesRight` and drawZombie
   mirrors it — look, alarm and knockdown together, so the flip survives the
   hit (and the tumble now carries AWAY from the gun, which is where a shell
   from the left would actually send it).

   FAIRNESS: the types differ in silhouette, palette and cadence but
   NOT in how hard they are to hit. zombieHitbox() is one fixed box
   around the trig anchor for every type, so a round's difficulty
   comes from its triangle and nothing else. Heights are kept inside
   a narrow band for the same reason.
   ============================================================ */

// the trig anchor (z.y) sits at mid-body on every type, so the soles are
// this fraction of the body below it — measured once off the shambler
const Z_ANCHOR = 82/165;
Object.values(ZOMBIE_TYPES).forEach(t=>{
  t.feetOffset = t.height*Z_ANCHOR;

     the alarm, on all three, because that is the one with the arms up. It is

     taller pose re-prices what the level table is allowed to ask for. */
  const poses = t.look.idle.concat([t.look.alert]);
  t.tallest = t.height * Math.max(...poses.map(p=>p[3])) / t.look.bodyPx;
