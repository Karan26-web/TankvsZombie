  else     { g.addColorStop(0,'#6f7d52'); g.addColorStop(1,'#4a5638'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(h.x, cy, R, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  if(outer){
    // shut: the grab handle on top and three rivets along the front
    ctx.lineWidth = 9*k; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(h.x-R*.18, cy-ry*.4); ctx.lineTo(h.x-R*.12, cy-ry-9*k);
    ctx.lineTo(h.x+R*.12, cy-ry-9*k); ctx.lineTo(h.x+R*.18, cy-ry*.4);
    ctx.stroke();
    ctx.lineWidth = 3.5*k; ctx.strokeStyle = '#6f7d52'; ctx.stroke();
    ctx.fillStyle = '#2e373c';
    [-.6,0,.6].forEach(f=>{ ctx.beginPath();
      ctx.arc(h.x+R*f, cy+ry*(f ? .35 : .55), 3.5*k, 0, Math.PI*2); ctx.fill(); });
  } else {
    // open: the rubber seal round the inside, the latch lever, the hinge
    ctx.lineWidth = 4*k; ctx.strokeStyle = 'rgba(25,33,42,.85)';
    ctx.beginPath(); ctx.ellipse(h.x, cy, R*.8, ry*.8, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#2e373c'; ctx.strokeStyle = '#19212a'; ctx.lineWidth = 4*k;
    roundRectPath(h.x-R*.32, cy+ry*.18, R*.64, Math.max(2, ry*.14), 3*k); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#434c47'; ctx.lineWidth = 5*k;
    roundRectPath(h.x-R*.42, hingeY-6*k, R*.84, 12*k, 5*k); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawShell(){
  if(!G.shell) return;
  const s=G.shell, r=SP.shellFlame, len=95, hgt=len*r[3]/r[2];
  ctx.save();
  ctx.translate(s.x,s.y); ctx.rotate(s.a);
  ctx.drawImage(IMGS.shot, r[0],r[1],r[2],r[3], -len+18, -hgt/2, len, hgt);
  ctx.restore();
}

function drawParticles(){
  G.particles.forEach(p=>{
    const k=1-p.t/p.life;
    const px = p.world ? p.x-G.cameraX : p.x;
    if(p.kind==='smoke'){
      ctx.globalAlpha=k*.45; ctx.fillStyle='#cfd4dd';
      ctx.beginPath(); ctx.arc(px,p.y,p.r,0,7); ctx.fill();
    } else if(p.kind==='fire'){
      ctx.globalAlpha=k; ctx.fillStyle=p.t<.15?'#fff3b0':(p.t<.3?'#ffb037':'#ff5d2a');
      ctx.beginPath(); ctx.arc(px,p.y,p.r*k,0,7); ctx.fill();
    } else if(p.kind==='dust'){
      ctx.globalAlpha=k*.22; ctx.fillStyle='#7a532a';
      ctx.beginPath(); ctx.ellipse(px,p.y,p.r*1.8,p.r*.72,0,0,7); ctx.fill();
    } else if(p.kind==='steam'){
      ctx.globalAlpha=k*.5; ctx.fillStyle='#e4efe9';
      ctx.beginPath(); ctx.arc(px,p.y,p.r,0,7); ctx.fill();
    } else if(p.kind==='spark'){        // a firework's star, added to the light behind it
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=Math.min(1,k*1.6); ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(px,p.y,p.r*(.55+.45*k),0,7); ctx.fill();
      ctx.globalAlpha*=.35; ctx.beginPath(); ctx.arc(px,p.y,p.r*2.2,0,7); ctx.fill();
      ctx.globalCompositeOperation='source-over';
    } else if(p.kind==='flash'){        // …and the white kick it starts with
      const fr = p.r*(1+p.t*4), fg = ctx.createRadialGradient(px,p.y,0,px,p.y,fr);
      fg.addColorStop(0,'rgba(255,250,230,.9)'); fg.addColorStop(1,'rgba(255,240,200,0)');
      ctx.globalAlpha=k; ctx.fillStyle=fg;
      ctx.beginPath(); ctx.arc(px,p.y,fr,0,7); ctx.fill();
    } else { // star
      ctx.globalAlpha=Math.min(1,k*1.5); ctx.fillStyle=['#ffd23f','#ff8b3d','#8bd45e','#5ec8ff'][(p.r|0)%4];
      ctx.save(); ctx.translate(px,p.y); ctx.rotate(p.rot);
      star5(p.r); ctx.fill(); ctx.restore();
    }
  });
  ctx.globalAlpha=1;
}
function star5(r){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2?r*.45:r, a=i*Math.PI/5-Math.PI/2;
    i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.state===GameState.PREGAME){ if(ambientMotionAllowed()) G.time+=dt; render(); return; }
  if(G.state===GameState.PAUSED || G.frozen){ render(); return; }
  update(dt);
  render();
}
function render(){
  syncWorldPositions();
  if(G.state===GameState.PREGAME){
    ctx.save();
    drawTitleScene();
    ctx.restore();
    return;
  }
  const nodes = visibleLevelNodes();
  const pose = commanderPose();
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  // the hatch scene's close-up, and the story's opening crane — the only
  // times the camera ever leaves 1:1
  if(pose.zoom>0){
    const v = commanderView(pose.zoom);
    if(pose.dive>0 && ambientMotionAllowed()){        // down into the hatch after her
      const e = pose.dive*pose.dive, h = hatchAt();
      v.x = lerp(v.x, h.x, e); v.y = lerp(v.y, h.y + 4, e); v.z *= 1 + 2.6*e;
    }
    ctx.translate(W/2, H/2); ctx.scale(v.z, v.z); ctx.translate(-v.x, -v.y);
  } else if(G.story && G.story.view){
    const v = G.story.view, hh = H/(2*v.z);
    ctx.translate(W/2, H/2); ctx.scale(v.z, v.z);
    ctx.translate(-W/2, -Math.max(hh, Math.min(H - hh, v.y)));
  }
  drawBG();
  drawSkyClouds();
  nodes.forEach(node=>drawTower(node.tower));
  drawWorldProps();        // the outposts' barricades, on the ruins' ground line
  nodes.forEach(node=>drawZombie(node.zombie));
  drawStoryHorde();        // the story's stragglers, standing in the swamp
  // the world drops back behind her as the camera closes in
  if(pose.zoom>0){ ctx.fillStyle = `rgba(3,10,14,${.34*pose.zoom})`; ctx.fillRect(0,0,W,H); }
  drawSafeZone('back');    // the compound, and the lit passage behind its gates
  drawTank(pose);
  drawSafeZone('front');   // …whose wall the tank drives in behind, and the gates
  drawTriangleLegs();      // over the tank, faded where it crosses the hull
  drawGuides();            // right angle, θ sweep, the given lengths
  drawStorySides();        // the story's names for the sides, while it shows them
  drawShell();
  drawParticles();
  ctx.restore();
  drawStoryOverlay(pose);  // the mission strip, and the story's dips to black
}

/* ============================================================
   BOOT
   ============================================================ */
function onAssetsReady(){
  buildLayers();
  BGL.fan = bakeBurstFan();
  warmArt([...Object.values(IMGS), BGL.world, BGL.cloud, BGL.fan]);
  // the compound's sign is lettered in the title face, so it waits for that
  if(document.fonts) document.fonts.load('400 40px "Luckiest Guy"').catch(()=>{}).then(()=>{
    if(SZ_ART) return;
    SZ_ART = bakeSafeZone();
    warmArt([SZ_ART.back, SZ_ART.front].concat(SZ_ART.leaf));
  });
  setTitleReady();
  GameBus.screen('start', 'intro');
  setupLevel({enter:'none'});               // so the title screen shows a live scene behind the start layer
  setGameState(GameState.PREGAME);
  const dp = location.hash.match(/^#previewdrive(\d{1,3})$/);
  const sp = location.hash.match(/^#previewshot(\d{1,3})$/);
  const auto = location.hash==='#autoplay';
  const pv = location.hash.match(/^#preview(\d)?(f)?$/);   // headless screenshot helper
  // the two cut-scenes, for tuning: #previewstory3 starts the story at beat 3
  // (everything before it settled), #previewend the ending from the last
  // zombie's fall; a number after either (#previewstory3_150, #previewend450)
  // plays that many hundredths of a second and freezes there, in the scene's
  // own state, so the HUD stays as the scene has it
  const stp = location.hash.match(/^#previewstory([1-9])(?:_(\d{1,4}))?$/);
  const ep = location.hash.match(/^#previewend(\d{1,4})?$/);
  const playTo = cs => { for(let k = 0; k < cs/100*60; k++) update(1/60); G.frozen = true; };
  if(stp){
    resetWorld(); initializeLevel(0, {revive:true, enter:'none'});
    $('overlay').classList.add('hidden');
    beginStory();
    const n = +stp[1] - 1;
    for(let i = 0; i < n; i++) settleBeat(i);
    if(n > 0) enterBeat(n);
    if(stp[2]) playTo(+stp[2]);
  } else if(ep){
    resetWorld(); initializeLevel(TOTAL_LEVELS-1, {revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    G.zombie.dead = true; G.zombie.mode = 'gone';
    startOutro();
    if(ep[1]) playTo(+ep[1]);
  } else if(auto){
    resetWorld(); initializeLevel(0, {revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    const autoTimer = setInterval(()=>{
      if(G.state===GameState.AIMING){
        setAngle(Math.round(currentLevelData().ans));
        pressFire();
      }
      if(G.state===GameState.GAME_COMPLETE || G.state===GameState.GAME_OVER){
        document.body.dataset.autoplay = G.state===GameState.GAME_COMPLETE ? 'complete' : 'gameover';
        document.body.dataset.level = String(G.level+1);
        clearInterval(autoTimer);
      }
    }, 180);
  } else if(sp){
    const progress = Math.min(100,+sp[1])/100;
    resetWorld(); initializeLevel(0, {revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    setAngle(Math.round(currentLevelData().ans));
    const path = calculateAimPath(G.angleTarget);
    G.aimPath = path;
    G.shell = {x:path.startX, y:path.startY, a:path.screenAngle, path, travelled:path.length*progress, minDz:1e9};
    G.shell.x = path.startX + (path.endX-path.startX)*progress;
    G.shell.y = path.startY + (path.endY-path.startY)*progress;
    setGameState(GameState.PROJECTILE_FLYING);
    G.guideAlpha=.55; G.prevPaused=GameState.PROJECTILE_FLYING; setGameState(GameState.PAUSED);
  } else if(dp){
    const progress = Math.min(100,+dp[1])/100;
    resetWorld(); G.level=0; setupLevel({enter:'aim'});
    $('overlay').classList.add('hidden');
    G.zombie.dead=true; G.zombie.mode='gone';
    if(G.activeNode) G.activeNode.status='CLEARED';
    setGameState(GameState.TRAVELLING); prepareDrive(); poseDriveAt(progress);
    if(progress>=1 && G.drive && G.drive.nextLevel!=null){
      const nextLevel = G.drive.nextLevel;
      G.cameraX = G.drive.cameraEnd;
      G.tankWorldX = G.drive.tankEnd;
      G.drive=null;
      initializeLevel(nextLevel, {revive:false, enter:'aim'});
      syncWorldPositions();
    } else {
      G.prevPaused=GameState.TRAVELLING; setGameState(GameState.PAUSED);
    }
  } else if(pv){
    if(pv[1]){
      const level = Math.min(+pv[1],TOTAL_LEVELS-1);
      resetWorld();
      G.cameraX = levelRestCamera(level);
      G.tankWorldX = levelRestTankX(level);
      initializeLevel(level, {revive:true, enter:'aim'});
    } else {
      initializeLevel(0, {revive:true, enter:'aim'});
    }
    $('overlay').classList.add('hidden');
    if(pv[2]) setTimeout(()=>{ setAngle(Math.round(currentLevelData().ans)); pressFire(); }, 700);
  }
  requestAnimationFrame(loop);
}

/* The strings land before the first painted frame, so the loading bar and the
   PLAY key are already in the child's language — there is no English flash to
   swap out. If the file cannot be fetched, t() falls through to its keys and
   the game boots in English rather than not at all. */
I18N.load().then(()=>{
  applyI18n();
  $('overlayCard').innerHTML = titleMarkup(false);
  wireTitleButtons();
  loadAll(onAssetsReady);
});
</script>
</body>
</html>
