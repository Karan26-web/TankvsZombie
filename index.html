<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank vs Zombie — Angle Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — one language for every panel in the game
   ============================================================ */
:root{
  --hud-bg:rgba(11,23,33,.7);
  --hud-bg-strong:rgba(8,17,25,.88);
  --hud-border:rgba(120,197,224,.32);
  --hud-border-bright:rgba(120,197,224,.65);
  --text-primary:#f2fbff;
  --text-secondary:#8fadbc;
  --accent-cyan:#4fd3f5;
  --accent-orange:#ff8c1a;
  --accent-orange-deep:#df640a;
  --accent-green:#8be05a;
  --heart:#ff4d5e;
  --panel-radius:16px;
  --panel-radius-sm:10px;
  --hud-shadow:0 6px 16px rgba(0,0,0,.35);

  /* --- UI palette, sampled from the button art itself -----------------
     btnPlate/btnPlus/btnMinus give the tan ring + rust casing + gem green,
     btnFire gives the orange and the cream. Every panel is built from these,
     so the chrome and the buttons read as one set of physical parts. */
  --btn-rim:#f2ab4f;          /* the plates' tan ring        */
  --btn-rim-dark:#8a3a18;     /* their rust outer casing     */
  --btn-stud:#4b1c0b;         /* the block a key presses on  */
  --btn-ink:#fef8dc;          /* the FIRE cream              */
  /* the console-body and loose gem tokens that used to live here are gone:
     the dock is timber now (see --board-* below) and every gem face comes
     off the PLAY-PLATE kit, so nothing was reading them. A palette that
     still lists colours nothing uses is a palette that lies about itself. */
  --fire-orange:#fd8b06;
  --fire-deep:#88200a;

  /* --- BOARD — the dock is assets/board.svg now, so the timber palette it
     used to be painted with is gone. This one colour survives: the θ
     read-out is cut INTO that board, and its ring is the board's own
     shadow line, sampled off the art. */
  --board-frame:#4a1b28;

  /* --- PLAY-PLATE KIT — the PLAY GAME pill's material, promoted to a
     panel language. One recipe, four layers, top to bottom:
       brown casing ring → cream bezel → glossy green gem → dark-olive ink.
     Every panel that carries WORDS is built from these, so a banner, a
     toast, a heading plaque and a card button all read as the same
     moulded plastic part the player already pressed on the title screen.
     Long-form copy sits on the parchment face instead: the same frame,
     a light interior, because a paragraph needs a page, not a gem. */
  --plate-case:#6b3a14;       /* outer brown casing  */
  --plate-case-deep:#4a2409;  /* the block it stands on */
  --plate-ring:#f0c063;       /* cream bezel         */
  --plate-a:#dcf055;          /* gem face, lit       */
  --plate-b:#b4d833;
  --plate-c:#8cb81e;
  --plate-d:#6b9612;          /* gem face, shadow    */
  --plate-ink:#3d3005;        /* the PLAY GAME letter colour */
  --parch-a:#fff4d2;          /* card page, lit      */
  --parch-b:#f6e1ab;
  --parch-c:#e6c98a;          /* card page, shadow   */
  --parch-ink:#4a2b10;        /* body copy on parchment */
  --parch-ink-soft:#8a6437;
}

/* ============================================================
   GAME CONTAINER
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050d12;
  font-family:'Chakra Petch','Trebuchet MS',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;aspect-ratio:16/9;
  transform-origin:center center;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.7)}
button{font-family:inherit}
button:focus-visible,#angleInput:focus-visible{
  outline:3px solid #ffd23f;
  outline-offset:4px;
  filter:brightness(1.1);
}
#angleInput:focus-visible{border-radius:6px}
.valBox:focus-within{border-color:var(--hud-border-bright)}

/* ============================================================
   WORLD LAYERS (background/tank/target/trajectory are canvas-drawn;
   the canvas itself is one full-bleed layer under the HUD)
   ============================================================ */
canvas{position:absolute;inset:0;display:block}

/* ============================================================
   TOP HUD — the objective banner, the status line and the control dock.
   ============================================================ */
#hud{position:absolute;inset:0;pointer-events:none;color:var(--text-primary)}
/* .hudPanel is gone. It was the old painted-console recipe, and #controlDock
   was the last thing still wearing it — but the ID rule only overrode its
   border and background, so its box-shadow (carrying `0 0 0 3px` of rust)
   kept drawing a brown rectangle around the board art. A base class whose
   leftovers outlive the thing it styled is worse than no base class. */

/* --- the text plate itself: the PLAY GAME pill, flattened into a label.
   Same four layers and the same dark-olive ink, so every line of copy the
   game speaks arrives on the part the player already knows how to read. --- */
.gemPlate{position:relative;color:var(--plate-ink);
  border:4px solid var(--plate-ring);border-radius:18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.5),
    inset 0 -7px 0 rgba(63,92,8,.42),
    0 0 0 4px var(--plate-case),
    0 5px 0 var(--plate-case-deep),
    0 12px 18px rgba(0,0,0,.42);
  text-shadow:0 2px 0 rgba(255,255,255,.38),0 -1px 0 rgba(74,58,6,.22)}
/* the moulded dome — the highlight that makes a flat rectangle look pressed */
.gemPlate::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:36%;
  pointer-events:none;border-radius:13px;
  border-bottom-left-radius:60% 100%;border-bottom-right-radius:60% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}

/* Parked over the tank's own corner, not centred. A 45-degree round stands
   its target at x~700 and high — dead behind a centred banner — while the
   sky above the tank is empty in every round the geometry can produce, since
   the nearest a structure ever comes to the gun is MIN_TANK_CLEARANCE. */
#objBanner{position:absolute;left:18px;top:14px;
  padding:8px 22px 10px;gap:10px;white-space:nowrap;
  display:flex;align-items:center;
  font-family:'Luckiest Guy','Chakra Petch',cursive;font-weight:400;
  font-size:17px;letter-spacing:.6px}
#objBanner svg{flex:none;width:17px;height:17px;position:relative;z-index:1}
#objBanner span,#msgText{position:relative;z-index:1}

#msg{position:absolute;left:18px;top:78px;
  padding:7px 22px 9px;border-radius:16px;opacity:0;
  font-family:'Luckiest Guy','Chakra Petch',cursive;font-weight:400;
  font-size:19px;letter-spacing:.7px;
  transition:opacity .34s;white-space:nowrap}

/* --- utility keys: hint and restart -----------------------------------
   Parked top-right, opposite the objective plate, on the one strip of frame
   the composition never reaches: frameRound() centres the scene, so the
   content's right edge lands around x=1030 at its widest and this corner
   stays clear in every round. Same gem as everything else you can press. */
#utilBtns{position:absolute;right:18px;top:14px;display:flex;gap:11px;
  align-items:flex-start;pointer-events:auto}
/* Both keys are painted plates, so both are artBtns: the art carries its own
   bevel, ring and lighting and all the CSS owes it is honest press physics.
   THE TWO FILES ARE FRAMED DIFFERENTLY and that is the only fiddly part —
   resetBtn.svg is trimmed to its plate, while hintbtn.png carries a wide
   transparent halo and its plaque fills just 66% of the file. Sized to their
   BOXES the bulb would come out a third smaller than the arrow, so the hint
   is given the larger box its halo needs and then pulled back by the halo's
   own width. What lines up on screen is the timber, not the bounding box. */
#resetBtn{width:56px;height:58px;--sink:5px;
  background-image:url(assets/resetBtn.svg);
  filter:drop-shadow(0 4px 4px rgba(38,10,2,.42))}
#hintBtn{width:84px;height:84px;--sink:5px;
  margin:-12px -15px -15px -14px;      /* the halo, taken back out of layout */
  background-image:url(assets/hintbtn.png);
  filter:drop-shadow(0 4px 4px rgba(38,10,2,.42))}
#resetBtn:hover,#hintBtn:hover{filter:drop-shadow(0 6px 6px rgba(38,10,2,.38)) brightness(1.06)}
#resetBtn:active,#resetBtn.is-pressed,
#hintBtn:active,#hintBtn.is-pressed{filter:drop-shadow(0 1px 2px rgba(38,10,2,.5)) brightness(.96)}
/* A wrong answer is the moment help is worth offering, so the bulb asks to be
   pressed instead of waiting to be found — and stops the instant it is. The
   call is a GLOW around the plate's own silhouette, not a box-shadow: there
   is no box here to cast one, only art on a transparent field. */
/* The old call was a slow glow and it was easy to miss against a bright sky.
   This one moves as well as glows — a small rise and settle on the same beat
   — because motion is what the eye actually catches in peripheral vision,
   and the bulb lives in a corner nobody is looking at. A halo ring behind it
   carries the same pulse so the shape reads even where the sky is pale. */
#hintBtn.is-calling{animation:hintCall 1.05s cubic-bezier(.4,0,.3,1) infinite}
#hintBtn.is-calling::after{content:"";position:absolute;left:14px;right:15px;top:12px;bottom:15px;
  border-radius:20%;pointer-events:none;z-index:-1;
  animation:hintHalo 1.05s cubic-bezier(.4,0,.3,1) infinite}
@keyframes hintCall{
  0%,100%{filter:drop-shadow(0 4px 4px rgba(38,10,2,.42)) drop-shadow(0 0 3px rgba(255,214,88,.35));
          transform:translateY(0) scale(1)}
  45%    {filter:drop-shadow(0 8px 7px rgba(38,10,2,.36)) drop-shadow(0 0 17px rgba(255,226,120,1))
          brightness(1.12);
          transform:translateY(-5px) scale(1.06)}
}
@keyframes hintHalo{
  0%,100%{box-shadow:0 0 0 0 rgba(255,214,88,.5)}
  45%    {box-shadow:0 0 0 11px rgba(255,214,88,0)}
}

/* ============================================================
   GAMIFIED BUTTON KIT
   One toy-console language for every pressable thing:
   candy shell (bright rim + dark casing) → gem face → stud depth.
   Per-button custom props tune the recipe:
     --face-a / --face-b : gem gradient (top → bottom)
     --rim               : bright outer casing colour
     --stud              : the 3D block the button sits on
     --depth             : how tall that block is (px)
   ============================================================ */
.bigBtn,.playTitleBtn{
  --face-a:#b8571f; --face-b:#5d2210;
  --rim:var(--btn-rim); --stud:var(--btn-stud); --depth:6px;
  position:relative;cursor:pointer;color:var(--btn-ink);font-family:inherit;
  border:3px solid var(--rim);
  background:linear-gradient(180deg,var(--face-a) 0%,var(--face-b) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.3),
    inset 0 -7px 0 rgba(0,0,0,.32),
    0 0 0 3px var(--btn-rim-dark),
    0 var(--depth) 0 var(--stud),
    0 calc(var(--depth) + 7px) 16px rgba(0,0,0,.42);
  text-shadow:0 3px 0 rgba(58,12,28,.62);
  transition:transform .09s ease,filter .12s ease,box-shadow .09s ease;
  -webkit-tap-highlight-color:transparent}

/* glossy dome highlight — the thing that makes a button look moulded */
.bigBtn::before,.playTitleBtn::before{
  content:"";position:absolute;left:7%;right:7%;top:2px;height:34%;pointer-events:none;
  border-radius:inherit;
  border-bottom-left-radius:70% 100%;border-bottom-right-radius:70% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.05) 60%,rgba(255,255,255,0))}

/* press physics: shell squashes onto its stud */
.bigBtn:hover,.playTitleBtn:hover{
  filter:brightness(1.09) saturate(1.05);transform:translateY(-2px)}
.bigBtn:active,.playTitleBtn:active,
.bigBtn.is-pressed,.playTitleBtn.is-pressed{
  transition:transform .045s ease-out,box-shadow .045s ease-out,filter .07s ease;
  transform:translateY(calc(var(--depth) - 1px)) scale(.985);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.22),
    inset 0 -3px 0 rgba(0,0,0,.34),
    0 0 0 3px var(--btn-rim-dark),
    0 1px 0 var(--stud),
    0 3px 9px rgba(0,0,0,.36)}
.bigBtn:disabled,.playTitleBtn:disabled{
  filter:grayscale(.7) brightness(.72);cursor:default;transform:none;animation:none}
.playTitleBtn:disabled:hover{filter:grayscale(.7) brightness(.72);transform:none}

/* ============================================================
   ART BUTTONS — painted plates instead of CSS shells.
   The art already carries the bevel, ring and lighting, so all the CSS
   owes it is honest press physics: lift on hover, sink into a shorter
   ground shadow on press, and no rectangle drawn anywhere near it.
   ============================================================ */
.artBtn{
  --sink:7px;
  position:relative;cursor:pointer;border:none;padding:0;background:none;
  background-repeat:no-repeat;background-position:center;background-size:contain;
  filter:drop-shadow(0 6px 5px rgba(38,10,2,.5));
  transition:transform .17s cubic-bezier(.22,.9,.3,1.35),filter .12s ease;   /* release springs back */
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
.artBtn:hover{transform:translateY(-2px);filter:drop-shadow(0 8px 7px rgba(38,10,2,.45)) brightness(1.06)}
/* The press rides a CLASS, not :active alone — see armPress() for why.
   Down is near-instant, up is the springy base transition above. */
.artBtn:active,.artBtn.is-pressed{transform:translateY(var(--sink)) scale(.955);
  transition:transform .045s ease-out,filter .07s ease;
  filter:drop-shadow(0 1px 2px rgba(38,10,2,.6)) brightness(.95)}
.artBtn:disabled{cursor:default;animation:none;
  filter:grayscale(.72) brightness(.72) drop-shadow(0 4px 4px rgba(38,10,2,.4))}
/* a key that disables itself on its own click still gets to finish the press */
.artBtn:disabled:not(.is-pressed),
.artBtn:disabled:hover:not(.is-pressed){transform:none}
.artBtn:disabled:hover{filter:grayscale(.72) brightness(.72) drop-shadow(0 4px 4px rgba(38,10,2,.4))}

/* ============================================================
   BOTTOM CONTROLS — tank-console dock
   ============================================================ */
/* The dock is furniture, not scenery: it sits entirely inside the dirt band
   BELOW the play surface (PLAY_SURFACE_Y = 600 of the 720-tall stage), so it
   never covers ground the tank, the target or the triangle can occupy.
   That invariant fixes the three numbers below —
       visual top = 720 - bottom - height*dockScale
   which must stay clear of 600. At 118/.79/10px that lands on 617, about
   17px of dirt above the board — it used to clear by 6px, which read as the
   board grazing the grass line. Retune all three together, and keep the
   narrow-screen override below on the same rule.

   The HEIGHT is set by the board rather than chosen: the timber in
   board.svg fills 90% of the file's height (the rest is its baked shadow),
   and the tallest thing standing on it is the 92px FIRE key — so the box
   has to be at least 92/0.90 plus margin, or FIRE overhangs the plank it is
   supposed to be bolted to. 118 also brings the dock's own aspect nearer the
   art's, which drops the stretch from 2.2x anisotropic to 1.8x.
   118 is a FLOOR, not a preference: the 92px FIRE key has to sit inside the
   timber, which needs height >= 92/(0.905-0.5) = 114. Anything thinner than
   that means shrinking FIRE first. So "thinner" is spent on the scale
   instead, where it costs nothing structural. */
#controlDock{position:absolute;left:50%;bottom:10px;--dockScale:.79;height:118px;
  transform:translateX(-50%) translateY(var(--dockY,0)) scale(var(--dockScale,1));
  transform-origin:center bottom;
  transition:transform .60s cubic-bezier(.18,.86,.24,1),opacity .38s ease,filter .2s ease;
  pointer-events:auto;display:flex;align-items:center;gap:13px;
  padding:13px 26px;border:none;border-radius:0;
  /* --- THE BOARD is the art, stretched ---------------------------------
     assets/board.svg, drawn to the dock's whole box. It carries its own
     frame, plank edges, knots, lit rim and shadow, so the CSS that used to
     paint all of that in gradients is gone with it — none of it was ever
     going to beat a painted board.
     The stretch is ~3.1x across against ~1.4x down, and it survives because
     of WHAT is being stretched: the art is loose and hand-drawn, its grain
     already runs horizontally, and its two knots simply go elliptical —
     which is what a knot looks like on a plank cut along the grain. There
     is nothing in it with a circle that has to stay a circle.
     It needs preserveAspectRatio="none" on the file to stretch at all; the
     default maps a viewBox with "meet", which letterboxes instead. */
  background:url(assets/board.svg) 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 9px 11px rgba(20,6,10,.42));
  overflow:visible}
/* stowed = below the deck (during the roll-in and the briefing);
   busy = present but not yours yet (a shot is in the air) */
#controlDock.is-stowed{--dockY:165%;opacity:0;pointer-events:none}
/* filter is not additive — a plain saturate() here would drop the board's
   ground shadow the moment a shot was in the air */
#controlDock.is-busy{filter:drop-shadow(0 9px 11px rgba(20,6,10,.42)) saturate(.82) brightness(.9)}
/* no ::before chamfer and no ::after ground shadow any more — the painted
   board already has both, and a second set drawn over it only muddies it */
.stepperGroup{position:relative;display:flex;align-items:center;gap:12px;z-index:1}
.dockDivider{position:relative;z-index:1;width:4px;height:70px;border-radius:2px;
  background:linear-gradient(180deg,rgba(60,16,40,.62),rgba(60,16,40,.44) 50%,rgba(60,16,40,.62));
  box-shadow:1.5px 0 0 rgba(255,214,158,.26),-1px 0 0 rgba(60,16,40,.35)}

/* the three keys: two painted plates and the painted FIRE pill */
.stepBtn{width:74px;height:74px;z-index:1}
#downBtn{background-image:url(assets/btnMinus.webp)}
#upBtn{background-image:url(assets/btnPlus.webp)}

/* angle read-out: recessed slot, not a button */
/* θ = is a LABEL, not part of the read-out, so it stands outside the slot —
   the slot holds the answer and nothing else. It used to sit hunched in the
   slot's top-left corner competing with the number for the same box. */
/* Gold on timber is gold on gold — the label was the same family of warm
   brown-orange as the plank behind it, so it sank into the grain. Everything
   else on this board carries its own edge (the keys are painted with one,
   the read-out has a tan ring), and this was the one mark relying on a drop
   shadow alone. It gets a real outline: eight offsets of the board's own
   saw-line colour, which is a ring rather than a shadow and so holds the
   glyph at every angle instead of only from above. */
.thetaTag{position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  padding-bottom:3px;font-size:37px;font-weight:800;line-height:1;color:#ffd487;
  text-shadow:
    -2px -2px 0 #4a1b28, 0 -2px 0 #4a1b28,  2px -2px 0 #4a1b28,
    -2px  0    0 #4a1b28,                   2px  0    0 #4a1b28,
    -2px  2px 0 #4a1b28, 0  2px 0 #4a1b28,  2px  2px 0 #4a1b28,
    0 5px 0 rgba(40,10,22,.6),
    0 0 15px rgba(255,190,110,.4)}
.thetaTag i{font-style:normal;font-size:31px;color:#ffc978}

.valBox{position:relative;display:flex;align-items:center;justify-content:center;
  width:126px;height:76px;border-radius:18px;border:4px solid var(--btn-rim);z-index:1;
  background:linear-gradient(180deg,#3a1a0c 0%,#261006 58%,#160903 100%);
  /* cut into the plank rather than screwed onto it: the board's own dark
     edge rings it, and the shadow falls INWARD from the top */
  box-shadow:
    inset 0 5px 10px rgba(0,0,0,.7),
    inset 0 0 0 2px rgba(255,216,136,.22),
    0 0 0 3px var(--board-frame),
    0 3px 0 rgba(255,200,140,.16),
    0 8px 14px rgba(0,0,0,.34)}
/* The number owns the middle of the slot. It is centred rather than pushed
   right because the slot now holds ONE thing — with the unit lifted into the
   corner, an off-centre number just looks off-centre. */
#angleInput{width:100%;font-size:44px;font-weight:800;text-align:center;
  border:none;background:transparent;color:var(--btn-ink);outline:none;font-family:inherit;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 14px rgba(255,226,178,.35)}
/* the unit rides the corner, the way a form field carries its unit: present,
   never competing with the value for the eye */
/* the reference sets its unit in the same ink as the field's contents, not
   as a second colour — at this size a gold speck in the corner read as dirt
   on the glass rather than as a degree sign */
.valBox .deg{position:absolute;top:6px;right:12px;line-height:1;
  font-size:24px;font-weight:800;color:var(--btn-ink);
  text-shadow:0 2px 0 rgba(0,0,0,.55)}

/* FIRE: the painted pill itself, glowing on its own */
#fireBtn{width:200px;height:92px;z-index:1;--sink:9px;
  background-image:url(assets/btnFire.webp);
  filter:drop-shadow(0 7px 6px rgba(38,10,2,.5)) drop-shadow(0 0 16px rgba(253,139,6,.42));
  animation:firePulse 3.4s ease-in-out infinite}
#fireBtn:hover{filter:drop-shadow(0 9px 8px rgba(38,10,2,.45)) drop-shadow(0 0 22px rgba(253,139,6,.6)) brightness(1.05)}
#fireBtn:active{animation-play-state:paused;
  filter:drop-shadow(0 2px 3px rgba(38,10,2,.55)) drop-shadow(0 0 10px rgba(253,139,6,.4))}
#fireBtn:disabled{animation:none;
  filter:grayscale(.72) brightness(.7) drop-shadow(0 4px 4px rgba(38,10,2,.4))}

.shakeX{animation:shakeX .35s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes firePulse{
  0%,100%{filter:drop-shadow(0 7px 6px rgba(38,10,2,.5)) drop-shadow(0 0 14px rgba(253,139,6,.36))}
  50%{filter:drop-shadow(0 7px 6px rgba(38,10,2,.5)) drop-shadow(0 0 30px rgba(255,176,58,.72))}
}
@keyframes fireSheen{
  0%,72%{background-position:200% 0}
  100%{background-position:-80% 0}
}
/* ============================================================
   THE TRIG TABLE
   Built in code rather than shipped as the reference PNG, for one reason:
   a picture of a table cannot POINT. The whole value of opening it mid-round
   is that it can light the row the round needs and, when asked, the column
   that answers it — and a flat image can do neither.
   ============================================================ */
#trigSheet{position:absolute;inset:0;z-index:6;display:flex;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(6,14,20,.55);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  pointer-events:auto;animation:sheetIn .22s ease-out both}
#trigSheet.hidden{display:none!important}
@keyframes sheetIn{from{opacity:0}to{opacity:1}}

/* Three blocks, two gaps: sign, table, keys — and with nothing written under
   the title, the panel is set on one rhythm of ~22px between them.
   The MARGINS are not all 22 because two of these blocks paint outside their
   boxes: the title plank carries a baked shadow under its bottom plank, and
   the footer keys sit on a stud with a drop shadow below it. Setting every
   margin to the same number leaves gaps that MEASURE equal and LOOK uneven,
   so the two that paint past their edge are given 18 and the honest one 22.
   Measured on screen: 21.6 / 21.3 / 22.2. */
.trigPanel{position:relative;max-width:880px;width:100%;
  padding:24px 26px 18px;text-align:center;color:var(--parch-ink);
  border:5px solid var(--plate-ring);border-radius:26px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 22%),
    linear-gradient(180deg,var(--parch-a) 0%,var(--parch-b) 60%,var(--parch-c) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.8),
    0 0 0 5px var(--plate-case),
    0 12px 0 var(--plate-case-deep),
    0 26px 60px rgba(0,0,0,.6);
  animation:sheetPop .26s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes sheetPop{from{transform:translateY(14px) scale(.97)}to{transform:none}}

/* The header is the dock's own plank, stood on its end of the panel.
   BLOCK, not inline-block: as an inline-block its vertical position comes
   from baseline alignment inside a line box, so a margin-top on it moved
   nothing — the air above the sign is the panel's own padding-top instead,
   and that is the number to turn. */
.trigTitle{display:block;width:fit-content;margin:0 auto 18px;padding:13px 46px 15px;
  font-family:'Luckiest Guy','Chakra Petch',cursive;font-size:27px;letter-spacing:2px;
  color:var(--board-cream,#fcebc5);text-shadow:0 3px 0 rgba(60,16,40,.55);
  background:url(assets/board.svg) 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 5px 6px rgba(20,6,10,.45))}
.trigScroll{overflow-x:auto;overflow-y:hidden}

#trigTable{border-collapse:separate;border-spacing:5px;margin:0 auto;
  font-family:'Chakra Petch','Trebuchet MS',sans-serif}
#trigTable th,#trigTable td{
  padding:7px 6px;min-width:112px;height:56px;border-radius:10px;
  font-size:23px;font-weight:800;text-align:center;vertical-align:middle;
  transition:opacity .2s ease,filter .2s ease,transform .2s ease}
/* the angle headings, in the FIRE orange */
#trigTable th.ang{color:#fff6e2;
  background:linear-gradient(180deg,#ffa32e 0%,#f07d16 55%,#d85f0b 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 0 0 2px #8a3a18,0 3px 0 #8a3a18;
  text-shadow:0 2px 0 rgba(120,45,6,.6)}
#trigTable th.corner{color:#fff6e2;letter-spacing:1px;
  background:linear-gradient(180deg,#8f5bd8 0%,#6f3cbb 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 0 2px #4b2483,0 3px 0 #4b2483;
  text-shadow:0 2px 0 rgba(50,20,95,.6)}
/* the ratio names down the side */
#trigTable th.fn{color:var(--btn-ink);min-width:148px;letter-spacing:.5px;
  background:linear-gradient(180deg,#a44d24 0%,#7c3315 60%,#5b220d 100%);
  box-shadow:inset 0 2px 0 rgba(255,232,190,.3),0 0 0 2px #4a1b28,0 3px 0 #4a1b28;
  text-shadow:0 2px 0 rgba(40,12,4,.6)}
#trigTable td{color:#4a2b10;
  background:linear-gradient(180deg,#fff6dc 0%,#f7e6b8 100%);
  box-shadow:inset 0 0 0 2px rgba(168,125,60,.28)}

/* stacked fractions, the way the textbook prints them */
.frac{display:inline-flex;flex-direction:column;align-items:center;
  line-height:1.02;font-size:19px;vertical-align:middle}
.frac .den{border-top:2px solid currentColor;margin-top:2px;padding-top:2px}
/* ...and a radical that actually has a bar over its radicand. The display
   face has no √ of its own and the fallback glyph's vinculum is hairline, so
   "√2" reads as "/2" — the same trap the triangle's own labels fell into. */
.rad{display:inline-block;border-top:2px solid currentColor;
  line-height:1.05;padding:0 1px;margin-left:1px}

/* ---- POINTING ----------------------------------------------------------
   The other RATIO rows recede; the round's own row stays lit. The angle
   headings never dim — they are the axis you read the answer off, and a
   student running along the sin row needs to see which column they have
   stopped at. Dimming them would hide the thing the row is pointing AT.
   The answer's column only arrives on the second ask, so the first look
   still leaves the lookup to do — which is the skill the table is for. */
#trigTable.is-pointing tr:not(.headRow):not(.row-on) th,
#trigTable.is-pointing tr:not(.headRow):not(.row-on) td{opacity:.46;filter:saturate(.5)}
/* the answer's column lifts out of the dim, but only part way: enough for
   the eye to travel from the heading down to the cell, not enough to
   compete with the cell itself */
#trigTable.is-pointing tr:not(.headRow):not(.row-on) td.col-on{
  opacity:.82;filter:none;box-shadow:inset 0 0 0 2px rgba(107,150,18,.4)}
#trigTable td.col-on,#trigTable td.row-on{
  box-shadow:inset 0 0 0 2px rgba(168,125,60,.5)}
#trigTable .row-on th.fn{
  background:linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  color:var(--plate-ink);text-shadow:0 2px 0 rgba(255,255,255,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px var(--plate-case),0 3px 0 var(--plate-case)}
/* the one cell that answers the round */
#trigTable td.is-answer{opacity:1;filter:none;color:#2c3f06;transform:scale(1.06);
  background:linear-gradient(180deg,#eaff9a 0%,#c7ea55 55%,#a3cf2c 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 3px #6b9612,0 0 20px rgba(190,236,86,.9);
  animation:answerBeat 1.1s ease-in-out infinite}
@keyframes answerBeat{
  0%,100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 3px #6b9612,0 0 14px rgba(190,236,86,.7)}
  50%    {box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 0 3px #7fae18,0 0 30px rgba(214,247,120,1)}
}
#trigTable th.ang.col-on{background:linear-gradient(180deg,#ffd05a 0%,#f7a222 55%,#e07f0d 100%)}

.trigFoot{display:flex;gap:14px;justify-content:center;margin-top:22px}
.sheetBtn{cursor:pointer;height:52px;padding:0 30px 3px;border-radius:18px;
  border:4px solid var(--plate-ring);color:var(--plate-ink);
  font-family:'Luckiest Guy','Chakra Petch',cursive;font-size:21px;letter-spacing:1.5px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(63,92,8,.45),
    0 0 0 4px var(--plate-case),0 5px 0 var(--plate-case-deep),0 11px 16px rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(255,255,255,.4);
  transition:transform .09s ease,filter .12s ease,box-shadow .09s ease}
.sheetBtn.is-quiet{
  background:linear-gradient(180deg,#f6e4b4 0%,#e2c489 100%);color:#5a3a17;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 0 0 4px var(--plate-case),
    0 5px 0 var(--plate-case-deep),0 11px 16px rgba(0,0,0,.3)}
.sheetBtn:hover{filter:brightness(1.07);transform:translateY(-2px)}
.sheetBtn:active,.sheetBtn.is-pressed{transform:translateY(4px) scale(.985);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 4px var(--plate-case),
    0 1px 0 var(--plate-case-deep),0 3px 8px rgba(0,0,0,.3)}
.sheetBtn[hidden]{display:none}

@media (max-width:900px){
  #trigTable th,#trigTable td{min-width:80px;height:48px;font-size:19px;padding:5px 4px}
  #trigTable th.fn{min-width:112px}
  .frac{font-size:16px}
  .trigTitle{font-size:22px;padding:11px 30px 13px}
}

/* ============================================================
   OVERLAYS (title screen / pause / game-over / win cards)
   ============================================================ */
#hud{transition:opacity .45s ease}
#stage.is-pregame #hud,
#stage.is-transition #hud{opacity:0;pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(3,10,14,.72);display:flex;
  align-items:center;justify-content:center;pointer-events:auto;overflow:hidden;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#overlay.hidden{display:none!important}
#overlay.titleScreen{display:block;background:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none}
#overlay.titleScreen::before{content:"";position:absolute;inset:0;pointer-events:none;
  display:none}
/* The card wears the pill's frame — brown casing, cream bezel — but its
   face is parchment, not gem. Paragraphs need a page: dark ink on cream
   holds its contrast all the way down, and it leaves the green free to
   mean "this is the thing you press". */
.card{position:relative;text-align:center;color:var(--parch-ink);
  border:5px solid var(--plate-ring);border-radius:28px;
  padding:32px 54px 40px;max-width:760px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 24%),
    linear-gradient(180deg,var(--parch-a) 0%,var(--parch-b) 58%,var(--parch-c) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.85),
    inset 0 -10px 0 rgba(170,124,60,.28),
    0 0 0 5px var(--plate-case),
    0 12px 0 var(--plate-case-deep),
    0 26px 60px rgba(0,0,0,.6)}
/* hairline stitch inside the bezel, the same trim the console dock wears */
.card::before{content:"";position:absolute;inset:7px;border-radius:21px;pointer-events:none;
  border:2px solid rgba(107,58,20,.16)}
/* the heading is a plate in its own right — the pill, holding a title */
.card h1,.card h2{position:relative;display:inline-block;
  font-family:'Luckiest Guy','Chakra Petch',cursive;font-weight:400;
  color:var(--plate-ink);letter-spacing:1.5px;line-height:1.14;
  padding:12px 30px 15px;border-radius:20px;border:4px solid var(--plate-ring);
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.5),
    inset 0 -8px 0 rgba(63,92,8,.42),
    0 0 0 4px var(--plate-case),
    0 6px 0 var(--plate-case-deep),
    0 14px 20px rgba(0,0,0,.32);
  text-shadow:0 2px 0 rgba(255,255,255,.4),0 -2px 0 rgba(74,58,6,.22)}
.card h1{font-size:40px}
.card h2{font-size:34px}
.card .sub{font-size:17px;color:var(--parch-ink-soft);font-weight:800;letter-spacing:5px;
  text-transform:uppercase;margin-top:12px}
.card p{font-size:19px;margin:18px 0;color:var(--parch-ink);line-height:1.55;
  text-shadow:0 1px 0 rgba(255,255,255,.55)}
.card .hint{font-size:15px;color:var(--parch-ink-soft)}
.card b{color:#4b7a0d}
/* the card's action key IS the title pill, sized down — same gem, same
   casing, same ink, so "press this" looks identical wherever it appears */
.bigBtn{--depth:8px;
  --rim:var(--plate-ring);--btn-rim-dark:var(--plate-case);--stud:var(--plate-case-deep);
  margin-top:22px;height:68px;padding:0 46px 4px;border-radius:24px;border-width:5px;
  font-family:'Luckiest Guy','Chakra Petch',cursive;font-size:28px;font-weight:400;
  letter-spacing:2.5px;white-space:nowrap;color:var(--plate-ink);
  background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--plate-a) 0%,var(--plate-b) 38%,var(--plate-c) 68%,var(--plate-d) 100%);
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.5),
    inset 0 -9px 0 rgba(63,92,8,.45),
    0 0 0 5px var(--plate-case),
    0 var(--depth) 0 var(--stud),
    0 calc(var(--depth) + 10px) 22px rgba(0,0,0,.45),
    0 0 30px rgba(190,236,86,.3);
  text-shadow:0 2px 0 rgba(255,255,255,.4),0 -2px 0 rgba(74,58,6,.25)}
/* the casing is 5px here, so the pressed state has to say 5px too —
   otherwise the ring snaps thinner the instant the key goes down */
.bigBtn:active,.bigBtn.is-pressed{
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    inset 0 -5px 0 rgba(63,92,8,.5),
    0 0 0 5px var(--plate-case),
    0 0 0 var(--stud),
    0 4px 10px rgba(0,0,0,.45)}
.stars{font-size:50px;letter-spacing:10px;margin-top:14px;
  text-shadow:0 3px 0 rgba(120,80,20,.28)}

/* ============================================================
   TITLE SCREEN
   Laid out after the arcade key-art convention: a night skyline
   behind a burst of light, the slime wordmark up top, one fat
   PLAY GAME pill on the burst's centre, and the utilities parked
   as chunky wooden plates in the corners.
   The wordmark and the whole landscape are painted into the plate
   drawTitleScene() lays down, and the zombie line-up is drawn on the
   canvas beside it, so this sheet dresses one thing: the pill.
   ============================================================ */
.titleScreenInner{position:absolute;inset:0;color:var(--text-primary);text-align:center;
  animation:titleIn .78s cubic-bezier(.2,.8,.2,1) both}
#overlay.leaving .titleScreenInner{animation:titleOut .52s ease-in both}

.srOnly{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* --- PLAY GAME — the one pill, parked on the burst's centre -------------
   top is derived, not guessed: the pill's own centre must land on
   TITLE_BURST.y (548), so top = 548 - height/2 = 506. Move one, move both. */
.titleCtas{position:absolute;left:50%;top:506px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3}
.playTitleBtn{--depth:8px;
  width:318px;height:84px;padding:0 0 4px;border-radius:22px;
  border:5px solid #f0c063;
  display:flex;align-items:center;justify-content:center;
  font-family:'Luckiest Guy','Chakra Petch',cursive;
  font-size:40px;letter-spacing:3px;font-weight:400;color:#3d3005;
  background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,#dcf055 0%,#b4d833 38%,#8cb81e 68%,#6b9612 100%);
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.5),
    inset 0 -9px 0 rgba(63,92,8,.45),
    0 0 0 5px #6b3a14,
    0 var(--depth) 0 #4a2409,
    0 calc(var(--depth) + 10px) 22px rgba(0,0,0,.5),
    0 0 40px rgba(190,236,86,.35);
  text-shadow:0 2px 0 rgba(255,255,255,.4),0 -2px 0 rgba(74,58,6,.25);
  animation:playPulse 3.6s ease-in-out infinite}
.playTitleBtn::before{left:8px;right:8px;top:6px;height:34%;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.playTitleBtn:hover{transform:scale(1.035);filter:brightness(1.05) saturate(1.05)}
.playTitleBtn:active,.playTitleBtn.is-pressed{animation:none;
  transform:translateY(var(--depth));
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    inset 0 -5px 0 rgba(63,92,8,.5),
    0 0 0 5px #6b3a14,
    0 0 0 #4a2409,
    0 4px 10px rgba(0,0,0,.45)}
.playTitleBtn:disabled{animation:none;filter:grayscale(.55) brightness(.75)}
.playTitleBtn:disabled:hover{transform:none;filter:grayscale(.55) brightness(.75)}
#loadBar{position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  width:322px;height:12px;border-radius:7px;background:#12211f;
  border:2px solid #6b3a14;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#loadFill{height:100%;width:0%;
  background:linear-gradient(90deg,#6b9612,#dcf055);
  transition:width .2s;box-shadow:0 0 12px rgba(190,236,86,.75)}
#loadBar.ready{opacity:0;transform:scaleX(.86);transition:opacity .35s ease,transform .35s ease}

@keyframes titleIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleOut{to{opacity:0;transform:translateY(-18px) scale(1.02)}}
@keyframes playPulse{
  0%,100%{box-shadow:
    inset 0 4px 0 rgba(255,255,255,.5),inset 0 -9px 0 rgba(63,92,8,.45),
    0 0 0 5px #6b3a14,0 8px 0 #4a2409,
    0 18px 22px rgba(0,0,0,.5),0 0 34px rgba(190,236,86,.3)}
  50%{box-shadow:
    inset 0 4px 0 rgba(255,255,255,.62),inset 0 -9px 0 rgba(63,92,8,.45),
    0 0 0 5px #6b3a14,0 8px 0 #4a2409,
    0 18px 22px rgba(0,0,0,.5),0 0 60px rgba(214,247,120,.6)}
}

@media (prefers-reduced-motion: reduce){
  .titleScreenInner,.playTitleBtn,
  #fireBtn,.shakeX,#hintBtn.is-calling,#hintBtn.is-calling::after,
  #trigSheet,.trigPanel,#trigTable td.is-answer{animation:none!important}
  .playTitleBtn:hover,.artBtn:hover{transform:none}
  #hud,#msg,#loadFill,#loadBar.ready{transition:none}
  #controlDock{transition:opacity .2s ease}
}
@media (max-width:700px){
  #controlDock{--dockScale:.75}     /* same invariant: top = 720-10-118*.75 = 622 */
}

/* ============================================================
   RESPONSIVE RULES — #stage is scaled as one rigid 16:9 unit by
   fitStage() in JS, so every HUD element keeps its position and
   proportion relative to the game at any viewport size.
   ============================================================ */
</style>
</head>
<body>
<div id="stage" class="is-pregame">
  <canvas id="game" width="1280" height="720" aria-hidden="true"></canvas>

  <div id="hud">
    <div class="gemPlate" id="objBanner">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8" stroke="#4a2409" stroke-width="2.4"/>
        <circle cx="12" cy="12" r="2.4" fill="#4a2409"/>
        <path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" stroke="#4a2409" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span id="objText">Hit the zombie using trigonometry</span>
    </div>

    <div id="msg" class="gemPlate" role="status" aria-live="polite"><span id="msgText"></span></div>

    <div id="utilBtns">
      <button type="button" class="artBtn" id="hintBtn" title="Hint — which ratio is this?" aria-label="Hint"></button>
      <button type="button" class="artBtn" id="resetBtn" title="Start this round again" aria-label="Start this round again"></button>
    </div>

    <div id="controlDock">
      <div class="stepperGroup">
        <button type="button" class="stepBtn artBtn" id="downBtn" aria-label="Decrease angle"></button>
        <span class="thetaTag" aria-hidden="true">θ<i>=</i></span>
        <div class="valBox">
          <input id="angleInput" readonly value="0" autocomplete="off"
                 title="Angle — step it with + and −"
                 aria-label="Angle in degrees, chosen from 0, 30, 45, 60 and 90">
          <span class="deg" aria-hidden="true">°</span>
        </div>
        <button type="button" class="stepBtn artBtn" id="upBtn" aria-label="Increase angle"></button>
      </div>
      <div class="dockDivider"></div>
      <button type="button" class="artBtn" id="fireBtn" aria-label="Fire"></button>
    </div>
  </div>

  <!-- the trig table: built in code so it can point at things (see TRIG_TABLE) -->
  <div id="trigSheet" class="hidden" role="dialog" aria-modal="true" aria-label="Trigonometric table">
    <div class="trigPanel" role="document">
      <div class="trigTitle">TRIGONOMETRIC TABLE</div>
      <div class="trigScroll"><table id="trigTable"></table></div>
      <div class="trigFoot">
        <button type="button" class="sheetBtn" id="trigReveal">SHOW ME THE ANGLE</button>
        <button type="button" class="sheetBtn is-quiet" id="trigClose">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="titleScreen">
    <!-- authored once in titleMarkup() and painted in before the first
         asset lands, so the loading bar has somewhere to go -->
    <div class="titleScreenInner" id="overlayCard"></div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   TANK vs ZOMBIE — Angle Academy
   A trigonometry game for young students.
   The scenery is one complete illustrated background plate; gameplay
   objects are layered over it in world space.
   ============================================================ */
const W = 1280, H = 720;
const PLAY_SURFACE_Y = 600;                // measured: tan field meets the grass lip at y≈602 on every plate
const GROUND_Y = PLAY_SURFACE_Y;           // compatibility alias for shell/building collision
/* ---- the target lane ------------------------------------------------
   The tank drives along the FRONT of the field; every target stands one
   lane back from it, with its foot line this far up the plate. Two things
   come out of that one number, and they are the same thing seen twice:
   a strip of ground runs in front of every structure, which is what makes
   it read as standing IN the field rather than as a wall across it — and
   because a structure is scaled to reach from its deck down to its own
   foot line, moving that line up is what makes it SMALLER.
   The deck itself never moves: the round's triangle pins it under the
   zombie's soles. So this shrinks the building without touching a single
   number the player is solving for, and hands the roof back to the zombie,
   who is the thing they are supposed to be looking at.

   What caps this number is the DIAGRAM, not the art: the triangle's
   horizontal leg runs at the gun's own height (y~522), so a foot line set
   back past that would put the right angle — the corner that says "this is
   a right triangle" — on open field BELOW the building it belongs to. The
   assertion under pivotFromTankScreen() holds anyone who raises it. */
const TARGET_SET_BACK = 46;
const TARGET_BASE_Y = PLAY_SURFACE_Y - TARGET_SET_BACK;
const TOTAL_LEVELS = 5;
/* Where the camera holds the tank WHILE TRAVELLING. Each round's resting
   position is its own — see frameRound() — and the drive lands on that. */
const CAMERA_FOLLOW_X = 164;
/* ---- THE RULER -----------------------------------------------------
   One metre is this many pixels, in every round, for good.

   Each round's triangle was always similar to its own numbers — the target
   sits on the answer ray, so the three sides came out in exactly the ratio
   the labels claim, 69.0 / 69.0 / 69.0 px per metre and so on. What was NOT
   true is the thing a student actually builds a sense of length from: the
   ruler CHANGED between rounds. Round 1 drew 6 m as 414px and round 3 drew
   8 m as 398px, so the bigger number came out shorter, and "how far is 8
   metres" stopped meaning anything the moment the round changed.

   Holding it still costs the framing its freedom: a round can no longer be
   pushed out to fill the frame, because its distance is now its own number
   times this constant. That is the right trade — the picture IS the
   quantity. What the rounds spend instead is SIZE: they grow 5 m to 9 m
   through the run, which only reads as growth because the ruler doesn't. */
const WORLD_SCALE = 44;            // px per metre — see the ceiling note below
const TARGET_SCREEN_X_MAX = 1120;  // seeds the world x of round 1 (see below)
const TARGET_TOP_MARGIN = 22;      // sky the tallest standing pose keeps above it
const TARGET_EDGE_MARGIN = 26;     // frame the building has to stay whole inside,

   target stands at opposite/tan60 — barely 220px out — while the tank alone
   reaches 161px past its own pivot. The geometry puts the tower AT the tank's
   nose, and that IS what a 60-degree shot looks like; demanding clearance

   So a steep round may tuck its structure behind the hull instead. It reads
   as depth rather than collision because the structure stands on the set-back
   lane and the tank is drawn over it — the same reason the tank passes in
   front of cleared buildings. Capped at TANK_TUCK so a tower can never appear
   to grow out of the turret. */
const TANK_TUCK = -46;
const TANK_BOTTOM_PADDING = 6;             // lets visible wheels/tracks meet the surface, not the PNG box
/* The tank is anchored at CAMERA_FOLLOW_X, and the round's own numbers put
   its target: `adjacent` metres out along the gun's line, `opposite` metres
   up from it, both measured with WORLD_SCALE. Nothing chooses the framing any
   more; it is read off the level data.

   THE NUMBERS ARE THE STAGING. A 30-degree round is wide and low, a
   45-degree round is square and steep, and a round with bigger numbers is
   simply bigger — all three of those are now visible facts about the picture
   rather than side effects of a framing search.

   WHAT LIMITS THE RULER. The stage holds ~400px of sky above the gun's line
   before the tallest standing pose starts to crop, so the largest `opposite`
   in the level table sets the ceiling on WORLD_SCALE: at 9 m that is 44 px/m.
   Raise one and the other has to come down.

   WHY 60 IS NOT AN ANSWER, though it is on the dial. A 60-degree round would
   have to stand its target at run = opposite/tan60 ~ 230px, while the tank
   itself reaches 161px right of its own pivot and the slimmest structure in
   the set still spills ~0.29 of its height left of where it is pinned. Work
   it through and the clearance is 0.29*O - 147 px: it does not reach zero
   until the target is ~510px up, which is off the top of the stage. So a
   60-degree target would stand ON the tank, with its adjacent leg and label
   drawn across the hull. It is not a tuning problem; the tank's own length is
   wider than the triangle. 0 and 90 have no triangle at all. Hence answers of
   30 and 45, and three distractors that are wrong for a reason a student can
   see on screen once they fire at them.
   Round 1's world sits INTRO_PAN to the right of the camera's home position,
   which gives the opening roll-in real ground to cover: the world scrolls
   with the tank instead of the level snapping into place. */
const INTRO_PAN = 300;
// measured off the WIDEST framing a round can take, so the opening roll keeps
// its full pan whatever building round 1 draws

/* Ground between neighbouring structures. This is pure world space — no
   round's triangle touches it — so it is the one separation knob that costs
   nothing but drive time, and TANK_MAX_SPEED below is lifted to match so the
   longer haul still lands in about the same beat. */

const CULL_MARGIN = 320, DESPAWN_MARGIN = 120;

/* ---- THE TABLE ------------------------------------------------------
   Class 10 trigonometry is taught off five standard angles, and a student
   answering from that table should never have to invent a number it cannot
   produce. So the dock is a DIAL over exactly these values: + and - step
   along the list, there is no way to land between them, and the gun can
   only ever be laid to one of them.
   0 and 90 are on the dial for the same reason they are in the table — they
   are part of what a student has to know — but no round can ANSWER to them:
   a right triangle with a 0 or 90 degree angle at the gun has no target to
   stand anywhere. They are the table's two honest distractors. */
const ANGLE_CHOICES = [0, 30, 45, 60, 90];
const DEFAULT_START_ANGLE = 0;   // the dial starts where the gun already rests
const PROJECTILE_SPEED = 620, HIT_PADDING = 18;
/* ---------- CHOREOGRAPHY ----------
   The gun rests level while the student works. The barrel only swings once
   FIRE commits an answer, so the angle has to come from the triangle instead
   of from nudging the barrel until it looks about right.

   PACING. One rule governs every duration in this file:

       the RESPONSE to an input is instant; the CONSEQUENCE of it breathes.

   So the press physics, the stepper's hold-repeat and the angle field are
   left alone — a control that lags its own finger feels broken, not weighty.
   Everything downstream of the press is deliberately unhurried, because a
   beat the player can watch is a beat they can read: the gun lays over,
   holds, THEN fires; the shell crosses the hypotenuse slowly enough to see
   it ride the line the guides just drew; the knockdown tumbles instead of
   snapping. The teaching beat — the briefing below — gets the most room of
   all, and it is skippable (click, Enter or Space) so a replay never pays
   for it twice. */
const BARREL_REST_ANGLE = 0;
const LAY_BASE = .46, LAY_PER_DEG = .019, LAY_MAX = 1.40;  // time to lay the gun over
const LAY_HOLD = .32;                                      // beat of stillness before the shot
/* The briefing score: one cue per element, in the order it earns attention.
   Tuning the whole rhythm means editing this table and nothing else.

   Each cue now finishes drawing BEFORE the next one starts, and the gap
   after it is deliberate: that pause is the only moment the player has to
   take the new side in on its own, against the ones already up. Run them
   overlapping and the triangle merely appears; run them spaced and it gets
   built, one named part at a time. The note per cue rises with the phrase,
   so the ear counts the parts too. */

  {key:'opp',   at:.92, dur:.54, note:699},   // vertical, up to the target
  {key:'hyp',   at:1.56,dur:.70, note:831},   // the line of fire
  {key:'theta', at:2.42,dur:.66, note:988},   // θ sweeps open at the gun
  {key:'chipA', at:3.16,dur:.34, note:1175},  // the two given lengths
  {key:'chipO', at:3.40,dur:.34, note:1319}
];
const BRIEF_END = 3.95;

/* ============================================================
   ZOMBIE TYPES
   Three characters share one rig. A type owns its art, its
   on-screen height and its animation cadence; the rest of the game
   never asks which one is standing on the roof — it asks the
   registry.

   A pose is [sx, sy, sw, sh, ax?] in that sheet's own pixels:
     sx,sy,sw,sh  the frame's content box
     ax           the body's centre-line, measured from sx. Optional;
                  defaults to the box centre.
   Poses draw bottom-anchored on feetY and ax-anchored on z.x, so a
   type can neither resize nor slide sideways between poses. That
   `ax` matters: on a sheet where the arms reach, the content box
   grows with the arm and box-centre anchoring would swing the body
   up to 23px — a visible shuffle in place.

   `bodyPx` is the STANDING body height in that sheet's own pixels,
   which is what turns `height` into a draw scale. A type's idle art
   and its knockdown art are drawn at different resolutions, so each
   frame set carries its own — that is what keeps a zombie the same
   size at the instant it is hit.

   Where a knockdown leaves the ground, its box is padded down to the
   sheet's common ground line instead of cropped to the body, so plain
   bottom-anchoring reproduces the airborne beat the artist drew.

   FACING: the tank is always to the LEFT of the roof, so every zombie has
   to look down the barrel at it. The Zombie2 and Zombie3 sheets are drawn
   three-quarter to camera and already read that way; the ZombieSprite sheet
   is a right-facing profile, so its type sets `facesRight` and drawZombie
   mirrors it — look, alarm and knockdown together, so the flip survives the
   hit (and the tumble now carries AWAY from the gun, which is where a shell
   from the left would actually send it).

   FAIRNESS: the types differ in silhouette, palette and cadence but
   NOT in how hard they are to hit. zombieHitbox() is one fixed box
   around the trig anchor for every type, so a round's difficulty
   comes from its triangle and nothing else. Heights are kept inside
   a narrow band for the same reason.
   ============================================================ */

// the trig anchor (z.y) sits at mid-body on every type, so the soles are

// Each building scales as one piece, so it keeps its native aspect — which

// LEFT of its deck, because that edge is what closes on the tank. Which
// shapes clear which rounds is no longer a list kept by hand: stagingFits()

// each type's soles sit t.feetOffset px below its trig anchor (z.y); sink
// them Z_SINK px into the deck so the shoes grip the roof, never graze it
const Z_SINK = 3;

/* ============================================================
   LEVELS — five target nodes. Adjacent/opposite define the real
   right-triangle ratio; hypotenuse and answer are computed once.
   ============================================================ */
/* `zombie` names the type from ZOMBIE_TYPES that mans this roof. The run
   tours all three and never repeats one two rounds running, so each level
   reads as a fresh target; the finale draws the tallest silhouette. */
/* Every round is one ratio question: two sides given, theta unknown, and the
   answer is always a value off the table. Which two sides are given is what
   makes the round a tan / sin / cos question, so the run tours all three
   instead of drilling tan five times.

   `show` is what the triangle LABELS, written the way the textbook writes it.
   The standard angles are irrational everywhere except tan 45, so a round
   that gives 8.7 m has already done the recognising for the student and left
   them a division; a round that gives 5 root 3 m is the actual exercise.
   The numbers underneath are exact, so the drawn triangle is exact too.

   Only 30 and 45 appear as answers, and that is a staging limit rather than
   a teaching choice — see the note above CAMERA_FOLLOW_X. */
const R2 = Math.SQRT2, R3 = Math.sqrt(3);
/* reads a drawn label — "10", "6√3", "9√2" — back to the number it claims */
const SURD_LABEL = /^(\d+(?:\.\d+)?)(?:√(\d+))?$/;
function labelValue(txt){
  const m = SURD_LABEL.exec(String(txt).trim());
  return m ? parseFloat(m[1]) * (m[2] ? Math.sqrt(parseFloat(m[2])) : 1) : NaN;
}
/* All three table angles are used, no two rounds running share one, and the
   ratio type turns over as well — a student meets sin, cos and tan rather
   than one of them five times.
   The SIZES are not free to be a neat ascending ramp, and the reason is the
   tank. Clearance at 45 degrees works out to 0.711*opposite - 146px, so a
   45-degree round needs ~345px of opposite before its structure clears the
   hull at all; below that the round cannot be staged. 30 degrees has no such
   floor — it runs wide and low — so the shallow rounds are free to be the
   small ones and the steep rounds have to be big. The load-time check
   enforces this: an earlier draft of this table put a 6m 45-degree round at
   level 2 and the game refused to start, naming the round and the distance.
   Rounds 1 and 5 share their numbers, 5 and 10, on purpose: one asks for sin
   and one for cos, and they answer 30 and 60. Same two lengths, different
   question, different angle — which is the whole point of the table.
   SIXTY closes the run, and its position is not a preference: it is the
   steepest angle the stage can hold, which makes it both the tightest
   staging and the most dramatic picture — the target almost overhead, the
   tower's foot tucked behind the tank. Putting it last means the player meets
   that composition once they already know how to read the triangle. */
const LEVELS = [
  {id:1, ans:30, type:'sin', h:5,     hyp:10,   show:['5','10'],    zombie:'shambler'},
  {id:2, ans:45, type:'tan', d:9,     h:9,      show:['9','9'],     zombie:'runner'},
  {id:3, ans:30, type:'cos', d:7*R3,  hyp:14,   show:['7√3','14'],  zombie:'shambler'},
  {id:4, ans:45, type:'sin', h:8,     hyp:8*R2, show:['8','8√2'],   zombie:'runner'},
  {id:5, ans:60, type:'cos', d:5,     hyp:10,   show:['5','10'],    zombie:'bruiser'}
].map(L=>{
  // the third side is never given, but the triangle still has to be drawn
  const t = L.ans*Math.PI/180;
  const d   = L.d   !== undefined ? L.d   : (L.hyp!==undefined ? L.hyp*Math.cos(t) : L.h/Math.tan(t));
  const h   = L.h   !== undefined ? L.h   : (L.hyp!==undefined ? L.hyp*Math.sin(t) : L.d*Math.tan(t));
  const hyp = L.hyp !== undefined ? L.hyp : Math.hypot(d,h);
  return {...L, d, h, hyp, adjacent:d, opposite:h};
});
/* Which two sides a round hands over, in the order `show` lists them. */
const GIVEN_SIDES = {tan:['adj','opp'], sin:['opp','hyp'], cos:['adj','hyp']};
/* ...and which of them is over which in the ratio itself. The two orders are
   NOT the same — a tan round is given adjacent-then-opposite but written
   opposite OVER adjacent — so keeping them apart is what stops a hint from
   quietly teaching the ratio upside down. */
const RATIO_OVER = {tan:['opp','adj'], sin:['opp','hyp'], cos:['adj','hyp']};
const SIDE_WORD  = {adj:'ADJACENT', opp:'OPPOSITE', hyp:'HYPOTENUSE'};
const givenValues = L => {
  const v = {}; GIVEN_SIDES[L.type].forEach((side,i)=>{ v[side] = L.show[i]; }); return v;
};
/* Two rungs, and the first one is the one that teaches: naming the pair of
   sides you were handed is the whole decision a class-10 student is making,
   and the substitution after it is only arithmetic. A hint that opens on the
   ratio would hand over the step worth practising. Neither rung gives the
   angle — the table is still theirs to read. */
function hintFor(L, stage){
  const [a,b] = GIVEN_SIDES[L.type];
  if(stage <= 0) return `You're given the ${SIDE_WORD[a]} and the ${SIDE_WORD[b]} — that pair is ${L.type} θ`;
  const v = givenValues(L), [over, under] = RATIO_OVER[L.type];
  return `${L.type} θ = ${v[over]} ÷ ${v[under]}`;
}
/* The level table is data, and data that lies is worse than none: a round
   whose numbers do not actually make its stated angle would teach the wrong
   ratio and still look right on screen. So it is checked, once, at load. */
LEVELS.forEach(L=>{
  if(!ANGLE_CHOICES.includes(L.ans))
    throw new Error(`level ${L.id}: ${L.ans}° is not on the class-10 table`);
  const given = {tan:L.h/L.d, sin:L.h/L.hyp, cos:L.d/L.hyp}[L.type];
  const table = {tan:Math.tan, sin:Math.sin, cos:Math.cos}[L.type](L.ans*Math.PI/180);
  if(!(Math.abs(given-table) < 1e-9))
    throw new Error(`level ${L.id}: ${L.type} of ${L.ans}° is ${table.toFixed(4)}, but its sides give ${given.toFixed(4)}`);
  if(L.show.length !== 2) throw new Error(`level ${L.id}: needs a label for each given side`);
  /* A label is data too, and one pinned to the wrong side is the worst kind
     of wrong: the picture and the number disagree and both look
     authoritative. The ratio check above cannot see it — 6 over 6√3 is the
     same fraction whichever leg you write where — so each label is parsed
     back and checked against the side it is actually drawn on. */
  const SIDE_KEY = {adj:'d', opp:'h', hyp:'hyp'};
  GIVEN_SIDES[L.type].forEach((side,i)=>{
    const want = L[SIDE_KEY[side]], got = labelValue(L.show[i]);
    if(!(Math.abs(got - want) < 1e-9))
      throw new Error(`level ${L.id}: the ${side} side measures ${want.toFixed(2)} m, `
        + `but the label drawn on it reads "${L.show[i]}" (${got.toFixed(2)} m)`);
  });
});
/* Rounds used to draw their zombie smaller the later they came, on the
   reasoning that each target stood further off than the last. The angle now
   decides that instead, and it does not follow the round order: round 3 is a
   45-degree round staged NEAR and round 4 a 30-degree one staged FAR, so a
   ramp keyed to the round number would have drawn the near target smaller
   than the far one. One size for every round is the only rule that cannot
   contradict where the geometry actually put him. */

if(LEVELS.length !== TOTAL_LEVELS) throw new Error('TOTAL_LEVELS must match LEVELS.length');

/* ============================================================
   AUDIO — everything synthesized with WebAudio (SFX + music)
   ============================================================ */
const AU = {
  ctx:null, master:null, sfxGain:null, musGain:null, muted:false,
  engine:null, musicTimer:null,
  init(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : .9;
    this.master.connect(this.ctx.destination);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
    this.musGain = this.ctx.createGain(); this.musGain.gain.value = this.musicMuted ? 0 : .16;
    this.musGain.connect(this.master);
    this.startMusic();
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:.9; },
  musicMuted:false,
  setMusicMuted(m){ this.musicMuted=m; if(this.musGain) this.musGain.gain.value = m?0:.16; },
  now(){ return this.ctx.currentTime; },

  tone(freq, t0, dur, type='sine', vol=.3, dest, bendTo){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(bendTo) o.frequency.exponentialRampToValueAtTime(bendTo, t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(dest||this.sfxGain);
    o.start(t0); o.stop(t0+dur+.05);
  },
  noise(t0, dur, vol=.4, fLow=200, fHigh=4000){
    const n = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*dur, this.ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
    n.buffer=buf;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime((fLow+fHigh)/2,t0); bp.Q.value=.6;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    n.connect(bp); bp.connect(g); g.connect(this.sfxGain);
    n.start(t0); n.stop(t0+dur);
    return {n,bp,g};
  },

  click(){ if(!this.ctx)return; this.tone(720,this.now(),.06,'square',.12); },
  tick(){ if(!this.ctx)return; this.tone(980,this.now(),.045,'square',.09); },
  /* one soft mallet note per briefing beat — the reveal has a melody */
  blip(freq){ if(!this.ctx)return; const t=this.now();
    this.tone(freq,t,.16,'triangle',.15); this.tone(freq*2,t,.07,'sine',.045); },
  /* the turret motor, held for exactly as long as the barrel is moving */
  servo(dur=.5){ if(!this.ctx)return; const t=this.now();
    this.tone(190,t,dur,'sawtooth',.05,null,270);
    this.noise(t,dur,.045,320,1100); },
  /* gun laid, target set */
  lockOn(){ if(!this.ctx)return; const t=this.now();
    this.tone(880,t,.07,'square',.09); this.tone(1320,t+.07,.1,'square',.09); },
  fire(){
    if(!this.ctx)return; const t=this.now();
    this.noise(t,.28,.5,80,1500);
    this.tone(150,t,.3,'sine',.55,null,42);
    this.tone(60,t,.4,'triangle',.4,null,30);
  },
  whoosh(dur){
    if(!this.ctx)return; const t=this.now();
    const {bp}=this.noise(t,dur,.16,900,2400);
    bp.frequency.setValueAtTime(2200,t);
    bp.frequency.exponentialRampToValueAtTime(500,t+dur);
  },
  /* the fuse: a hiss that tightens as it burns down to the casing */
  fuse(dur){
    if(!this.ctx)return; const t=this.now();
    const {bp}=this.noise(t,dur,.10,1400,6000);
    bp.frequency.setValueAtTime(1700,t);
    bp.frequency.exponentialRampToValueAtTime(5400,t+dur);
  },
  explode(big){
    if(!this.ctx)return; const t=this.now();
    this.noise(t,big?.9:.55,big?.7:.5,60,900);
    this.tone(120,t,big?.8:.5,'sine',.6,null,28);
  },
  zombiePop(){
    if(!this.ctx)return; const t=this.now();
    this.tone(300,t,.16,'square',.3,null,900);           // comedic rising pop
    this.tone(140,t+.05,.25,'sawtooth',.22,null,50);     // splat
    this.noise(t+.02,.2,.25,1200,4200);
  },
  zombieUhOh(){
    if(!this.ctx)return; const t=this.now();
    this.tone(500,t,.12,'triangle',.25);
    this.tone(370,t+.15,.2,'triangle',.25);
  },
  wrong(){
    if(!this.ctx)return; const t=this.now();
    this.tone(280,t,.22,'sawtooth',.22,null,240);
    this.tone(240,t+.24,.35,'sawtooth',.22,null,170);
  },
  success(){
    if(!this.ctx)return; const t=this.now();
    [523,659,784,1047].forEach((f,i)=> this.tone(f,t+i*.09,.32,'triangle',.32));
    this.tone(2093,t+.4,.3,'sine',.15);
  },
  fanfare(){
    if(!this.ctx)return; const t=this.now();
    [523,523,659,784,1047,784,1047].forEach((f,i)=> this.tone(f,t+i*.13,.3,'square',.16));
    [262,330,392,523].forEach((f,i)=> this.tone(f,t+i*.13,.4,'triangle',.2));
  },
  engineStart(){
    if(!this.ctx || this.engine) return;
    const o=this.ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=52;
    const o2=this.ctx.createOscillator(); o2.type='square'; o2.frequency.value=26;
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=11;
    const lg=this.ctx.createGain(); lg.gain.value=6;
    lfo.connect(lg); lg.connect(o.frequency);
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
    const g=this.ctx.createGain(); g.gain.value=0;
    g.gain.linearRampToValueAtTime(.25,this.now()+.25);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfxGain);
    o.start(); o2.start(); lfo.start();
    this.engine={o,o2,lfo,g};
  },
  engineDrive(speed01){
    if(!this.engine || !this.ctx) return;
    const e=this.engine, t=this.now(), k=Math.max(0,Math.min(1,speed01));
    e.o.frequency.setTargetAtTime(46 + k*20, t, .08);
    e.o2.frequency.setTargetAtTime(23 + k*10, t, .08);
    e.g.gain.setTargetAtTime(.12 + k*.15, t, .08);
  },
  engineStop(){
    if(!this.engine) return;
    const e=this.engine, t=this.now();
    e.g.gain.linearRampToValueAtTime(0,t+.3);
    setTimeout(()=>{try{e.o.stop();e.o2.stop();e.lfo.stop();}catch(_){}} ,400);
    this.engine=null;
  },
  /* spooky minor-key chiptune loop */
  startMusic(){
    if(this.musicTimer) return;
    const mel=[330,392,494,440, 494,523,494,440, 392,440,494,392, 349,330,311,330];
    const bass=[82,82,110,110, 87,87,98,98, 82,82,110,110, 98,98,82,82];
    let step=0, next=this.ctx.currentTime+.1;
    const beat=.275;   // the loop paces the room; eased with the rest of the game
    this.musicTimer = setInterval(()=>{
      while(next < this.ctx.currentTime + .3){
        const i=step%16;
        if(i%2===0) this.tone(bass[i],next,beat*1.7,'triangle',.5,this.musGain);
        this.tone(mel[i],next,beat*.92,'square',.18,this.musGain);
        if(i%4===2) this.noise(next,.05,.03,5000,9000);
        next+=beat; step++;
      }
    },120);
  }
};

const GameState = {

  BRIEFING:'BRIEF',     // the triangle draws itself in, one side at a time

  LAYING:'LAYING',      // barrel swings to the angle the player committed to

  TRAVELLING:'DRIVE',
  GAME_OVER:'GAMEOVER',
  GAME_COMPLETE:'WIN',
  PAUSED:'PAUSED'
};
const G = {
  state:GameState.PREGAME, 
  level:0, score:0, hearts:3, tries:0,
  angleTarget:DEFAULT_START_ANGLE,      // the number in the dock — the player's answer
  angleShown:BARREL_REST_ANGLE,         // where the barrel actually points

/* ============================================================
   BACKGROUND PLATE — one complete 16:9 landscape. Gameplay sprites
   are drawn separately on top, so the world reads as one illustration
   instead of stacked/tiled scenery strips.
   ============================================================ */
const BGL = {};
function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function drawCover(g,img,x,y,w,h){
  const sc = Math.max(w/img.width, h/img.height);
  const sw = w/sc, sh = h/sc;
  const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
  g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function drawCoverSlice(g,img,sx,sy,sw,sh,x,y,w,h){
  const sc = Math.max(w/img.width, h/img.height);
  const coverSw = w/sc, coverSh = h/sc;
  const coverSx = (img.width-coverSw)/2, coverSy = (img.height-coverSh)/2;
  g.drawImage(img, sx, sy, sw, sh,
    x + (sx-coverSx)*sc, y + (sy-coverSy)*sc, sw*sc, sh*sc);
}
function buildLayers(){
  const baseScenes = ['scene','scene2','scene3','scene4','scene5'].map(k=>{
    const c = makeCv(W,H), g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    drawCover(g, IMGS[k], 0, 0, W, H);
    return c;
  });
  const overlap = 360, stride = W - overlap;
  const neededWidth = FIRST_TARGET_WORLD_X + TARGET_SPACING*(TOTAL_LEVELS-1) + W + 240;
  const sceneCount = Math.max(baseScenes.length, Math.ceil((neededWidth-W)/stride)+1);
  BGL.scenes = Array.from({length:sceneCount}, (_,i)=>baseScenes[i%baseScenes.length]);
  BGL.world = makeCv(stride*(BGL.scenes.length-1)+W, H);
  const wg = BGL.world.getContext('2d');
  wg.drawImage(BGL.scenes[0], 0, 0);
  for(let i=1; i<BGL.scenes.length; i++){
    const x = i*stride, scene = BGL.scenes[i];
    wg.drawImage(scene, overlap,0,W-overlap,H, x+overlap,0,W-overlap,H);
    const blend = makeCv(overlap,H), bg = blend.getContext('2d');
    bg.drawImage(scene, 0,0,overlap,H, 0,0,overlap,H);
    const fade = bg.createLinearGradient(0,0,overlap,0);
    fade.addColorStop(0,'rgba(255,255,255,0)');
    fade.addColorStop(1,'rgba(255,255,255,1)');
    bg.globalCompositeOperation='destination-in';
    bg.fillStyle=fade; bg.fillRect(0,0,overlap,H);
    bg.globalCompositeOperation='source-over';
    wg.drawImage(blend, x, 0);
  }
  bakeCloud();
  bakeTitlePatches();
  bakeBoomLayers();
}

/* cloud.png is a 1254² plate that is ~59% empty padding, and no cloud ever
   draws wider than ~330px. Bake the tight crop down once into a right-sized
   offscreen canvas: the per-frame draws then sample a small texture instead
   of a 6MB one, and the downscale is filtered once instead of every frame. */
const CLOUD_SRC = [40,352,1174,553];      // measured content box in cloud.png
function bakeCloud(){
  const [sx,sy,sw,sh] = CLOUD_SRC;
  const bw = 512, bh = Math.round(bw*sh/sw);
  BGL.cloud = makeCv(bw,bh);
  const g = BGL.cloud.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(IMGS.cloud, sx,sy,sw,sh, 0,0, bw,bh);
  BGL.cloudAspect = sw/sh;
}

/* ---------- tank geometry ---------- */
const TANK = { w:288 };    // pivot lands ~19% across at rest
TANK.h  = TANK.w * SP.hull[3]/SP.hull[2];           // hull draw height
TANK.baseY = PLAY_SURFACE_Y - TANK.h + TANK_BOTTOM_PADDING;
Object.defineProperties(TANK, {
  x:{get(){ return G.tankWorldX - G.cameraX; }},
  y:{get(){
    const roll = G.drive ? Math.sin(G.time*15)*1.2*Math.min(1,Math.abs(G.tankVel)/210) : 0;
    return TANK.baseY + roll;
  }}
});
// cannon pivot sits on the turret ring (tuned visually)
TANK.pivot = ()=>({ x:TANK.x + TANK.w*0.44 - G.recoil*.6, y:TANK.y + TANK.h*0.10 });
const BARREL_LEN = TANK.w*.6, BARREL_SC = BARREL_LEN/(SP.cannonTip[0]-SP.cannonPivot[0]);
// spinning wheel overlay positions (fraction of hull rect) — measured off the
// hull art's baked road-wheel discs so the overlays land exactly on them
TANK.wheelFr = [[.195,.83],[.346,.83],[.499,.83],[.653,.83]];
TANK.wheelR  = TANK.h*.195;

/* The gun's rotation centre for a tank parked at this screen x. This is the
   apex of the level's triangle AND the one point every shot's line passes
   through — the muzzle at angle θ always sits on the ray leaving here at θ —
   so placing a target on that ray guarantees the drawn angle and the angle
   that actually hits are the same number. */
function pivotFromTankScreen(tankScreenX){
  return {x:tankScreenX + TANK.w*.44, y:TANK.baseY + TANK.h*.10};
}
/* The bound TARGET_SET_BACK is chosen against, made executable: the right
   angle is drawn where the gun's line meets the target's column, so the
   target's foot line has to stay BELOW that line or the corner comes off the
   building and floats over the field in front of it. */
const CORNER_FOOTING = TARGET_BASE_Y - pivotFromTankScreen(0).y;
if(CORNER_FOOTING < 12) throw new Error(
  `TARGET_SET_BACK is ${Math.round(-CORNER_FOOTING+12)}px too deep — the triangle's right angle would fall off the building it belongs to`);
function muzzlePos(angleDeg=G.angleShown){
  const p=TANK.pivot(), a=angleDeg*Math.PI/180;
  return { x:p.x + Math.cos(a)*BARREL_LEN, y:p.y - Math.sin(a)*BARREL_LEN };
}
function calculateAimPath(angleDeg=G.angleShown){
  const start = muzzlePos(angleDeg), a=angleDeg*Math.PI/180;
  const dx = Math.cos(a), dy = -Math.sin(a);
  const candidates = [];
  if(dx>.001) candidates.push((W+80-start.x)/dx);
  if(dy<-.001) candidates.push((-80-start.y)/dy);
  const length = Math.max(120, Math.min(...candidates.filter(v=>v>0)));
  const endX = start.x + dx*length, endY = start.y + dy*length;
  return {startX:start.x, startY:start.y, endX, endY, angle:a, screenAngle:Math.atan2(dy,dx), angleDeg, length, dirX:dx, dirY:dy};
}

/* ---- where a round lands, for one building at one framing -------------
   The building scales as ONE piece so its flat deck passes exactly under the
   zombie's soles, and slides sideways so the deck's centre (deckCx) sits at
   the zombie's x — he stands on the flat spot, not the art's centre. Because
   the scale is uniform, height drags width along with it, which is why
   `reachLeft` (how far the shape spills LEFT of where it is pinned) is the
   number that decides how close the building crowds the tank.
   ONE source of truth: makeLevelNode places with this and stagingFits vets
   with it, so what is checked is exactly what gets drawn. */
function fitBuilding(level, bld){
  const L = LEVELS[level];
  /* Only the gun's HEIGHT matters here — where the tank stands across the
     frame is decided afterwards, by frameRound(), and none of this depends
     on it. Keeping the two apart is what lets the composition be centred
     without the geometry moving. */
  const gunY = pivotFromTankScreen(0).y;
  /* Both legs come off the same ruler, so the drawn triangle carries the
     level's own ratio by construction — h/d is tan(theta) whatever the
     scale, and the load-time check already proved h/d is this round's angle. */
  const zombieY = gunY - L.h * WORLD_SCALE;
  const zType = ZOMBIE_TYPES[L.zombie] ? L.zombie : 'shambler';
  const t = ZOMBIE_TYPES[zType], zScale = 1;
  const [bsx,bsy,bsw,bsh] = bld.box;
  const deckPlaneY = zombieY + t.feetOffset*zScale - Z_SINK;
  const s = (TARGET_BASE_Y - deckPlaneY) / (bsy + bsh - bld.deck);
  const reachLeft = (bld.deckCx - bsx) * s;
  return {
    zombieY, zType, zScale, reachLeft,
    adjacentPx: L.d * WORLD_SCALE,                        // gun to the target's column
    towerY: deckPlaneY - (bld.deck - bsy) * s,
    w: bsw * s,
    top: zombieY + (t.feetOffset - t.tallest) * zScale    // its zombie's crown
  };
}

/* ---- CENTRING --------------------------------------------------------
   The scene is the tank and the thing it is aiming at, and the frame should
   hold that PAIR in the middle. It never did: the tank was pinned to a fixed
   x near the left edge and everything else grew rightwards from it, so a
   round's composition sat as far left as its triangle was short — the small
   ones worst of all, which is most of them. What was left over was dead
   grass on the right.
   So the tank's resting x is derived, not fixed: measure the content from
   the tank's own left edge to whichever reaches further right — the
   structure's far wall or the zombie standing on it — and give the frame
   equal margins either side. The tank now stands between roughly x=220 and
   x=340 depending on the round, and each round arrives centred.
   Note what this does NOT touch: clearance is a distance BETWEEN two things
   that move together, so nothing about the staging changes — only where the
   whole picture sits. */
const ZOMBIE_HALF = 92;   // how far a pose spreads either side of its column
function frameRound(level, bld){
  const f = fitBuilding(level, bld);
  const targetOff = TANK.w*.44 + f.adjacentPx;     // tank's left edge → target column
  const contentW  = Math.max(targetOff - f.reachLeft + f.w, targetOff + ZOMBIE_HALF);
  const tankScreenX = Math.round((W - contentW) / 2);
  return Object.assign(f, {
    tankScreenX,
    screenX: tankScreenX + targetOff,
    left:    tankScreenX + targetOff - f.reachLeft,
    right:   tankScreenX + contentW
  });
}

/* ---- how far right this round can stand its target ---------------------
   Three things bound it, and the round is framed at the last x that keeps
   all three: its zombie's tallest pose stays clear of the stage's ceiling,
   its building stays whole inside the frame (these are complete
   illustrations — a cropped one reads as a bug, not as depth), and the
   OPPOSITE label keeps its own margin on the right.
   The framing used to be searched for — the widest one the ceiling allowed.
   That search is gone with the ruler: there is exactly one place a round's
   target can stand, so what were bounds to search inside are now facts to
   CHECK. A round that will not fit is a level-design error, and it is thrown
   at load rather than quietly reframed into a lie about its own numbers. */

/* Ground left open between the tank's nose and the structure's near wall.
   Both sit on the same framing, so this is the same number wherever the
   composition is centred — which is why centring cost the staging nothing. */
function tankClearance(level, bld){
  const f = fitBuilding(level, bld);
  return f.adjacentPx + TANK.w*.44 - f.reachLeft - TANK.w;
}
/* Whether a shape can stand a round at all. A steep round pulls its target in
   toward the gun while a tall deck pushes the shape's reach out, so the wide
