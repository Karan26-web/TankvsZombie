  TRAVELLING:'DRIVE',
  GAME_OVER:'GAMEOVER',
  GAME_COMPLETE:'WIN',
  PAUSED:'PAUSED'
};
const G = {
  state:GameState.PREGAME, 
  level:0, score:0, hearts:3, tries:0,
  angleTarget:DEFAULT_START_ANGLE,      // the number in the dock — the player's answer
  angleShown:BARREL_REST_ANGLE,         // where the barrel actually points
  barrelTarget:BARREL_REST_ANGLE,
  lay:null, brief:null, trans:null,     // active choreography, if any
  reveal:{adj:0,opp:0,hyp:0,theta:0,chipA:0,chipO:0},
  aimPath:null, shell:null, particles:[], floaters:[],
  shake:0, recoil:0, flash:0, guideAlpha:1,
  cameraX:0, tankWorldX:0, tankVel:0,
  zombie:{worldX:0,x:0,y:0,frame:0,animT:0,mode:'idle',burstF:0,dead:false},
  tower:null, activeNode:null, levelNodes:[],
  drive:null, wheelRot:0, dustT:0, hitDelay:0,
  time:0, prevPaused:null
};

/* ============================================================
   BACKGROUND PLATE — one complete 16:9 landscape. Gameplay sprites
   are drawn separately on top, so the world reads as one illustration
   instead of stacked/tiled scenery strips.
   ============================================================ */
const BGL = {};
function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function drawCover(g,img,x,y,w,h){
  const sc = Math.max(w/img.width, h/img.height);
  const sw = w/sc, sh = h/sc;
  const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
  g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function drawCoverSlice(g,img,sx,sy,sw,sh,x,y,w,h){
  const sc = Math.max(w/img.width, h/img.height);
  const coverSw = w/sc, coverSh = h/sc;
  const coverSx = (img.width-coverSw)/2, coverSy = (img.height-coverSh)/2;
  g.drawImage(img, sx, sy, sw, sh,
    x + (sx-coverSx)*sc, y + (sy-coverSy)*sc, sw*sc, sh*sc);
}
function buildLayers(){
  const baseScenes = ['scene','scene2','scene3','scene4','scene5'].map(k=>{
    const c = makeCv(W,H), g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    drawCover(g, IMGS[k], 0, 0, W, H);
    return c;
  });
  const overlap = 360, stride = W - overlap;
  const neededWidth = FIRST_TARGET_WORLD_X + TARGET_SPACING*(TOTAL_LEVELS-1) + W + 240;
  const sceneCount = Math.max(baseScenes.length, Math.ceil((neededWidth-W)/stride)+1);
  BGL.scenes = Array.from({length:sceneCount}, (_,i)=>baseScenes[i%baseScenes.length]);
  BGL.world = makeCv(stride*(BGL.scenes.length-1)+W, H);
  const wg = BGL.world.getContext('2d');
  wg.drawImage(BGL.scenes[0], 0, 0);
  for(let i=1; i<BGL.scenes.length; i++){
    const x = i*stride, scene = BGL.scenes[i];
    wg.drawImage(scene, overlap,0,W-overlap,H, x+overlap,0,W-overlap,H);
    const blend = makeCv(overlap,H), bg = blend.getContext('2d');
    bg.drawImage(scene, 0,0,overlap,H, 0,0,overlap,H);
    const fade = bg.createLinearGradient(0,0,overlap,0);
    fade.addColorStop(0,'rgba(255,255,255,0)');
    fade.addColorStop(1,'rgba(255,255,255,1)');
    bg.globalCompositeOperation='destination-in';
    bg.fillStyle=fade; bg.fillRect(0,0,overlap,H);
    bg.globalCompositeOperation='source-over';
    wg.drawImage(blend, x, 0);
  }
  bakeCloud();
  bakeTitlePatches();
  bakeBoomLayers();
}

/* cloud.png is a 1254² plate that is ~59% empty padding, and no cloud ever
   draws wider than ~330px. Bake the tight crop down once into a right-sized
   offscreen canvas: the per-frame draws then sample a small texture instead
   of a 6MB one, and the downscale is filtered once instead of every frame. */
const CLOUD_SRC = [40,352,1174,553];      // measured content box in cloud.png
function bakeCloud(){
  const [sx,sy,sw,sh] = CLOUD_SRC;
  const bw = 512, bh = Math.round(bw*sh/sw);
  BGL.cloud = makeCv(bw,bh);
  const g = BGL.cloud.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(IMGS.cloud, sx,sy,sw,sh, 0,0, bw,bh);
  BGL.cloudAspect = sw/sh;
}

/* ---------- tank geometry ---------- */
const TANK = { w:308 };    // pivot lands ~19% across at rest, +10% scale
TANK.h  = TANK.w * SP.hull[3]/SP.hull[2];           // hull draw height
TANK.baseY = PLAY_SURFACE_Y - TANK.h + TANK_BOTTOM_PADDING;
Object.defineProperties(TANK, {
  x:{get(){ return G.tankWorldX - G.cameraX; }},
  y:{get(){
    const roll = G.drive ? Math.sin(G.time*22)*1.1*Math.min(1,Math.abs(G.tankVel)/260) : 0;
    return TANK.baseY + roll;
  }}
});
// cannon pivot sits on the turret ring (tuned visually)
TANK.pivot = ()=>({ x:TANK.x + TANK.w*0.44 - G.recoil*.6, y:TANK.y + TANK.h*0.10 });
const BARREL_LEN = 185, BARREL_SC = BARREL_LEN/(SP.cannonTip[0]-SP.cannonPivot[0]);
// spinning wheel overlay positions (fraction of hull rect) — measured off the
// hull art's baked road-wheel discs so the overlays land exactly on them
TANK.wheelFr = [[.195,.83],[.346,.83],[.499,.83],[.653,.83]];
TANK.wheelR  = TANK.h*.195;

/* The gun's rotation centre for a tank parked at this screen x. This is the
   apex of the level's triangle AND the one point every shot's line passes
   through — the muzzle at angle θ always sits on the ray leaving here at θ —
   so placing a target on that ray guarantees the drawn angle and the angle
   that actually hits are the same number. */
function pivotFromTankScreen(tankScreenX){
  return {x:tankScreenX + TANK.w*.44, y:TANK.baseY + TANK.h*.10};
}
function muzzlePos(angleDeg=G.angleShown){
  const p=TANK.pivot(), a=angleDeg*Math.PI/180;
  return { x:p.x + Math.cos(a)*BARREL_LEN, y:p.y - Math.sin(a)*BARREL_LEN };
}
function calculateAimPath(angleDeg=G.angleShown){
  const start = muzzlePos(angleDeg), a=angleDeg*Math.PI/180;
  const dx = Math.cos(a), dy = -Math.sin(a);
  const candidates = [];
  if(dx>.001) candidates.push((W+80-start.x)/dx);
  if(dy<-.001) candidates.push((-80-start.y)/dy);
  const length = Math.max(120, Math.min(...candidates.filter(v=>v>0)));
  const endX = start.x + dx*length, endY = start.y + dy*length;
  return {startX:start.x, startY:start.y, endX, endY, angle:a, screenAngle:Math.atan2(dy,dx), angleDeg, length, dirX:dx, dirY:dy};
}

function makeLevelNode(level, targetWorldX, bld){
  const L = LEVELS[level];
  const restPivot = pivotFromTankScreen(CAMERA_FOLLOW_X);
  const targetScreenX = TARGET_SCREEN_X;
  const zombieY = restPivot.y - (targetScreenX-restPivot.x)*Math.tan(L.ans*Math.PI/180);
  // the building scales as one piece so its flat deck passes exactly under
  // the zombie's soles, and slides sideways so the deck's centre (deckCx)
  // sits at the zombie's x — he stands ON the flat spot, not the art centre
  const [bsx,bsy,bsw,bsh] = bld.box;
  const zType = ZOMBIE_TYPES[L.zombie] ? L.zombie : 'shambler';
  const deckPlaneY = zombieY + ZOMBIE_TYPES[zType].feetOffset - Z_SINK;
  const s = (GROUND_Y - deckPlaneY) / (bsy + bsh - bld.deck);
  const towerY = deckPlaneY - (bld.deck - bsy) * s;
  const tw = bsw * s;
  const buildingWorldX = targetWorldX - (bld.deckCx - bsx) * s;
  const zombie = {
    offsetX:(bld.deckCx - bsx) * s, offsetY:0,
    worldX:targetWorldX, x:targetWorldX-G.cameraX, y:zombieY,
    type:zType, frame:0, animT:0, mode:'idle', burstF:0, dead:false
  };
  const tower = {worldX:buildingWorldX, x:buildingWorldX - G.cameraX, y:towerY, w:tw, h:GROUND_Y-towerY, bld};
  return {
    level, targetWorldX, worldX:buildingWorldX, tower, zombie,
    targetHeight:tower.h, zombieOffsetX:zombie.offsetX, zombieOffsetY:zombie.offsetY,
    status:level===0 ? 'ACTIVE' : 'UPCOMING',
    data:{...L}
  };
}

// assign a building to each round from its height-suitability pool, never
// repeating within one run — so every playthrough tours a fresh skyline
function assignBuildings(){
  const used = new Set();
  return LEVEL_BUILDING_POOL.map(pool=>{
    const free = pool.filter(i=>!used.has(i));
    const pick = free.length ? free[Math.floor(Math.random()*free.length)] : pool[0];
    used.add(pick);
    return BUILDINGS[pick];
  });
}
function buildLevelNodes(){
  const picks = assignBuildings();
  return Array.from({length:TOTAL_LEVELS}, (_,level)=>makeLevelNode(level, FIRST_TARGET_WORLD_X + level*TARGET_SPACING, picks[level]));
}

function currentNode(){
  return G.activeNode || G.levelNodes[G.level] || null;
}

function currentLevelData(){
  const node = currentNode();
  return node ? node.data : LEVELS[G.level];
}

function resetZombie(z){
  z.frame=0; z.animT=0; z.mode='idle'; z.burstF=0; z.dead=false;
}

function activateLevel(level, revive=true){
  G.level = Math.max(0,Math.min(level, TOTAL_LEVELS-1));
  G.activeNode = G.levelNodes[G.level] || null;
  G.tower = G.activeNode ? G.activeNode.tower : null;
  G.zombie = G.activeNode ? G.activeNode.zombie : null;
  G.levelNodes.forEach((node,i)=>{
    if(i<G.level && node.status!=='OFFSCREEN') node.status='PASSED';
    else if(i===G.level) node.status='ACTIVE';
    else if(i>G.level) node.status='UPCOMING';
  });
  if(revive && G.zombie) resetZombie(G.zombie);
  syncWorldPositions();
}

function syncWorldPositions(){
  G.levelNodes.forEach(node=>{
    node.tower.worldX = node.worldX;
    node.tower.x = node.tower.worldX - G.cameraX;
    node.zombie.worldX = node.worldX + node.zombie.offsetX;
    node.zombie.x = node.zombie.worldX - G.cameraX;
  });
}

/* ============================================================
   LEVEL SETUP
   ============================================================ */
function initializeLevel(levelIndex, {resetHearts=false, revive=true, enter='brief', fast=false}={}){
  G.level = Math.max(0, Math.min(levelIndex, TOTAL_LEVELS-1));
  G.tries = 0; G.shell=null; G.aimPath=null; G.hitDelay=0;
  G.particles.length=0; G.floaters.length=0;
  G.drive=null; G.tankVel=0; G.dustT=0; G.lay=null; G.brief=null;
  G.angleShown = G.barrelTarget = BARREL_REST_ANGLE;
  if(resetHearts) G.hearts = 3;
  if(!G.levelNodes.length) G.levelNodes = buildLevelNodes();
  activateLevel(G.level, revive);

  if(enter!=='none'){
    G.cameraX = levelRestCamera(G.level);
    G.tankWorldX = levelRestTankX(G.level);
    syncWorldPositions();
  }

  setAngle(DEFAULT_START_ANGLE);
  if(enter==='brief') beginBriefing({fast});
  else if(enter==='aim') enterAiming({instant:true});
  else { clearReveal(); G.guideAlpha=0; stowDock(true); updateControlsForState(); }
}

function setupLevel(opts={}){
  initializeLevel(G.level, {resetHearts:true, revive:true, enter:'brief', ...opts});
}

/* ============================================================
   CHOREOGRAPHY — one rhythm, replayed every round:

     roll in ▸ adjacent ▸ opposite ▸ hypotenuse ▸ θ ▸ givens ▸ controls

   Nothing here uses setTimeout: every beat is a position on one clock that
   the game loop advances, so pausing, restarting and fast-forwarding all
   behave, and the whole feel is tuned from the CUES table above.
   ============================================================ */
function clearReveal(){ REVEAL_KEYS.forEach(k=>G.reveal[k]=0); }
function revealAll(){ REVEAL_KEYS.forEach(k=>G.reveal[k]=1); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function stowDock(stowed){ $('controlDock').classList.toggle('is-stowed', !!stowed); }

/* the opening: tank drives in from off-screen left, world scrolling with it */
function beginIntro(){
  const restCam = levelRestCamera(0), restTank = levelRestTankX(0);
  G.cameraX = Math.max(0, restCam - INTRO_PAN);
  G.tankWorldX = restTank - INTRO_ROLL_IN;
  G.tankVel = 0; G.dustT = 0; G.wheelRot = 0;
  G.guideAlpha = 0; clearReveal(); stowDock(true);
  G.angleShown = G.barrelTarget = BARREL_REST_ANGLE;
  syncWorldPositions();
  setObjective('Rolling into position…');
  setGameState(GameState.INTRO);
  G.drive = {t:0, nextLevel:null, tankStart:G.tankWorldX, tankEnd:restTank,
             cameraStart:G.cameraX, cameraEnd:restCam, onArrive:beginBriefing};
  if(!ambientMotionAllowed()){ poseDriveAt(1); finishDrive(); }
}

function beginBriefing(opts){
  const fast = !!(opts && opts.fast);
  G.lay = null; G.barrelTarget = BARREL_REST_ANGLE;
  clearReveal(); stowDock(true);
  setObjective(`Reading the target — ${zombieTypeOf(G.zombie).name}…`);
  setGameState(GameState.BRIEFING);
  G.brief = {t:0, rate:fast ? 2.1 : (G.level===0 ? 1 : 1.32), fired:0};
  if(!ambientMotionAllowed()) finishBriefing();
}
function updateBriefing(dt){
  const b = G.brief; if(!b) return;
  b.t += dt*b.rate;
  CUES.forEach(c=>{ G.reveal[c.key] = easeOutCubic(clamp01((b.t-c.at)/c.dur)); });
  while(b.fired<CUES.length && b.t>=CUES[b.fired].at){ AU.blip(CUES[b.fired].note); b.fired++; }
  if(b.t>=BRIEF_END) finishBriefing();
}
function finishBriefing(){ G.brief = null; enterAiming(); }

/* hand the round over to the player: triangle complete, controls ride up */
function enterAiming({instant=false}={}){
  revealAll(); stowDock(false);
  G.lay = null; G.barrelTarget = BARREL_REST_ANGLE;
  if(instant){ G.guideAlpha = 1; G.angleShown = BARREL_REST_ANGLE; }
  setObjective('Solve for θ — then FIRE');
  setGameState(GameState.AIMING);
  angleInput.value = G.angleTarget;
}

/* the cinematics are skippable — a replay shouldn't cost the player 5 seconds */
function inChoreo(){ return G.state===GameState.INTRO || G.state===GameState.BRIEFING
  || G.state===GameState.TRANSITION; }
function skipChoreo(){
  if(G.trans){ finishVictoryBoom(); return true; }
  if(G.state===GameState.INTRO){ if(G.drive){ poseDriveAt(1); finishDrive(); } return true; }
  if(G.state===GameState.BRIEFING){ finishBriefing(); return true; }
  return false;
}

/* where the camera and the tank come to rest for a given round */
function levelRestCamera(level){
  const node = G.levelNodes[level];
  return node ? Math.max(0, node.targetWorldX - TARGET_SCREEN_X) : 0;
}
function levelRestTankX(level){ return levelRestCamera(level) + CAMERA_FOLLOW_X; }

function resetWorld(){
  G.levelNodes = buildLevelNodes();
  G.cameraX=levelRestCamera(0); G.tankWorldX=levelRestTankX(0); G.tankVel=0;
  G.drive=null; G.dustT=0; G.guideAlpha=1;
  activateLevel(0, true);
}

/* ============================================================
   INPUT / UI
   ============================================================ */
const angleInput = $('angleInput');
/* The dock's number is the player's answer and nothing more — the barrel does
   NOT follow it. It only moves once FIRE commits the answer (see pressFire),
   which is what stops the level from being solvable by eye. */
function setAngle(v){
  v = Math.max(1, Math.min(89, Math.round(v)||1));
  G.angleTarget = v; angleInput.value = v;
}
function setControlsEnabled(enabled){
  $('downBtn').disabled=!enabled; $('upBtn').disabled=!enabled;
  angleInput.disabled=!enabled;
  $('fireBtn').disabled=!enabled;
  $('controlDock').classList.toggle('is-busy', !enabled);
}
function updateControlsForState(){
  setControlsEnabled(G.state===GameState.AIMING);
}
function setGameState(newState){
  G.state = newState;
  document.body.dataset.state = newState;
  $('stage').classList.toggle('is-pregame', newState===GameState.PREGAME);
  updateControlsForState();
}
function setObjective(txt){
  $('objText').textContent = txt;
}
function nudge(d){
  if(G.state!==GameState.AIMING) return;
  AU.tick(); setAngle((parseInt(angleInput.value)||0)+d);
}

let holdT=null, holdI=null;
function bindHold(btn, d){
  const start=e=>{ e.preventDefault(); nudge(d);
    holdT=setTimeout(()=>{ holdI=setInterval(()=>nudge(d),70); },400); };
  const stop=()=>{ clearTimeout(holdT); clearInterval(holdI); };
  btn.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
}
bindHold($('upBtn'),1); bindHold($('downBtn'),-1);

angleInput.addEventListener('input', ()=>{
  if(G.state!==GameState.AIMING) return;
  const v = parseInt(angleInput.value.replace(/\D/g,''));
  if(!isNaN(v)) setAngle(Math.max(1,Math.min(89,v)));
});
angleInput.addEventListener('blur', ()=>{
  if(G.state===GameState.AIMING) setAngle(parseInt(angleInput.value)||G.angleTarget);
  else angleInput.value = G.angleTarget;
});

addEventListener('keydown', e=>{
  if(inChoreo() && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); skipChoreo(); return; }
  if(G.state===GameState.AIMING){
    if(e.key==='ArrowUp'){ nudge(1); flashPress($('upBtn')); e.preventDefault(); }
    if(e.key==='ArrowDown'){ nudge(-1); flashPress($('downBtn')); e.preventDefault(); }
    if(e.key==='Enter'){ flashPress($('fireBtn')); pressFire(); }
  } else if(G.state===GameState.PREGAME && e.key==='Enter'){
    const play = $('playBtn');
    if(!play || !play.disabled){ e.preventDefault(); startGame(); }
  }
});

/* ---------- press physics ----------
   :active alone does not survive contact with this UI. Three separate holes:
     · the stepper's hold-to-repeat calls preventDefault() on pointerdown,
       which is exactly what tells the browser to drop :active;
     · FIRE disables itself inside its own click handler, and a disabled
       button is forced back to transform:none before the press can paint;
     · a fast tap holds :active for less time than the key takes to travel,
       and touch browsers withhold it anyway until they have ruled out a
       scroll gesture.
   So the press is a class we own: on at pointerdown, held for at least
   PRESS_MIN so every tap reads as a real push no matter how quick the
   finger is, then released on pointerup wherever that lands. */
const PRESS_MIN = 120;
function armPress(btn){
  if(!btn) return;
  const id = btn._pressId = (btn._pressId||0)+1;
  const t0 = performance.now();
  btn.classList.add('is-pressed');
  const release = ()=>{
    EVENTS.forEach(ev=>removeEventListener(ev, release));
    setTimeout(()=>{ if(btn._pressId===id) btn.classList.remove('is-pressed'); },
               Math.max(0, PRESS_MIN-(performance.now()-t0)));
  };
  // on window, not the button: the finger may slide off before it lifts, and
  // blur/visibilitychange catch an app switch mid-hold so no key stays stuck down
  const EVENTS = ['pointerup','pointercancel','blur','visibilitychange'];
  EVENTS.forEach(ev=>addEventListener(ev, release));
}
/* keyboard has no pointerup to wait for — the key just blinks the button, so
   the on-screen control still answers when the round is played from the keys */
function flashPress(btn){
  if(!btn) return;
  const id = btn._pressId = (btn._pressId||0)+1;
  btn.classList.add('is-pressed');
  setTimeout(()=>{ if(btn._pressId===id) btn.classList.remove('is-pressed'); }, PRESS_MIN);
}
addEventListener('pointerdown', e=>{
  const btn = e.target.closest && e.target.closest('button');
  if(btn && !btn.disabled) armPress(btn);
}, true);

$('fireBtn').addEventListener('click', pressFire);
/* tapping the world fast-forwards the roll-in / briefing */
cv.addEventListener('pointerdown', ()=>{ if(inChoreo()){ AU.click(); skipChoreo(); } });
const BEST_SCORE_KEY = 'tankVsZombieAngleAcademyBest';
let startingMission = false;
function getBestScore(){
  try{ return Math.max(0, parseInt(localStorage.getItem(BEST_SCORE_KEY),10)||0); }
  catch(_){ return 0; }
}
function saveBestScore(score){
  const best = Math.max(getBestScore(), score);
  try{ localStorage.setItem(BEST_SCORE_KEY, String(best)); }catch(_){}
  return best;
}
/* The title screen is the painted plate and one button, so the mute,
   music, fullscreen and how-to plates are gone. AU.setMuted /
   AU.setMusicMuted are left intact — the capability is still there, it
   just has no control surface on this screen any more. */
function toggleSound(){
  AU.setMuted(!AU.muted);
  if(!AU.muted) AU.click();
}

/* ============================================================
   TITLE MARKUP
   The wordmark, the tank and the watchtower are painted into the
   preLBD1 plate that drawTitleScene() lays down, so this layer
   carries no art of its own — only the pill, the corner plates and
   the heading screen readers need.
   ============================================================ */
function titleMarkup(ready=true){
  return `<h1 class="srOnly">Tank vs Zombie — Angle Academy</h1>

      <div class="titleCtas">
        ${ready ? '' : '<div id="loadBar"><div id="loadFill"></div></div>'}
        <button type="button" class="playTitleBtn" id="playBtn" ${ready?'':'disabled'}
                title="Play — or press Enter">${ready?'PLAY GAME':'LOADING'}</button>
      </div>`;
}
function wireTitleButtons(){
  const play = $('playBtn');
  if(play) play.onclick = startGame;
}
function setTitleReady(){
  const fill = $('loadFill'), bar = $('loadBar'), play = $('playBtn');
  if(fill) fill.style.width = '100%';
  if(bar){
    bar.classList.add('ready');
    // opacity:0 still occupies the layer, and a transition that never runs
    // would leave the bar sitting on the plate — so pull it once it has gone
    setTimeout(()=>bar.remove(), 420);
  }
  if(play){
    play.disabled = false;
    play.textContent = 'PLAY GAME';
  }
  wireTitleButtons();
}
function startGame(){
  if(startingMission) return;
  const play = $('playBtn');
  if(play && play.disabled) return;
  startingMission = true;
  AU.init(); AU.resume(); AU.click();
  hideMsg();
  const overlay = $('overlay');
  overlay.classList.add('leaving');
  setTimeout(()=>{
    overlay.classList.add('hidden');
    overlay.classList.remove('titleScreen','leaving');
    G.level=0; G.score=0; G.hearts=3;
    resetWorld();
    initializeLevel(0, {resetHearts:true, revive:true, enter:'none'});
    beginIntro();
    showMsg('Mission start!', 1200);
    startingMission = false;
  }, 420);
}

function showCard(html){
  const overlay = $('overlay'), card = $('overlayCard');
  overlay.classList.remove('titleScreen','leaving');
  card.className = 'card';
  card.innerHTML = html;
  overlay.classList.remove('hidden');
  requestAnimationFrame(()=>{
    const action = card.querySelector('button');
    if(action) action.focus({preventScroll:true});
  });
}
function showTitle(){
  setGameState(GameState.PREGAME);
  const overlay = $('overlay'), card = $('overlayCard');
  overlay.classList.remove('hidden','leaving');
  overlay.classList.add('titleScreen');
  card.className = 'titleScreenInner';
  card.innerHTML = titleMarkup(true);
  wireTitleButtons();
}

let msgTimer=null;
function showMsg(txt, ms=2600){
  $('msg').textContent = txt; $('msg').style.opacity=1;
  clearTimeout(msgTimer);
  if(ms) msgTimer=setTimeout(hideMsg, ms);
}
function hideMsg(){ $('msg').style.opacity=0; }

/* ============================================================
   FIRING
   ============================================================ */
/* FIRE is a commitment, not an aim: the gun lays over to the number the
   player typed, holds one beat, and only then shoots. Three separate moments
   the player can read — decide, aim, boom — instead of one instant event. */
function pressFire(){
  if(G.state!==GameState.AIMING) return;
  const v = parseInt(angleInput.value);
  if(isNaN(v)||v<1||v>89){
    angleInput.classList.remove('shakeX'); void angleInput.offsetWidth;
    angleInput.classList.add('shakeX'); AU.wrong();
    showMsg('Type an angle from 1° to 89°!'); return;
  }
  setAngle(v); hideMsg();
  setGameState(GameState.LAYING);
  const from = G.angleShown;
  const dur = ambientMotionAllowed()
    ? Math.min(LAY_MAX, LAY_BASE + Math.abs(v-from)*LAY_PER_DEG)
    : .001;
  G.lay = {from, to:v, t:0, dur, hold:LAY_HOLD, laid:false};
  G.barrelTarget = v;                      // stays laid until the shot resolves
  setObjective(`Laying the gun to ${v}°…`);
  AU.servo(dur);
}
function updateLay(dt){
  const l = G.lay; if(!l) return;
  l.t += dt;
  if(!l.laid){
    G.angleShown = l.from + (l.to-l.from)*easeInOutCubic(clamp01(l.t/l.dur));
    if(l.t>=l.dur){ G.angleShown = l.to; l.laid = true; l.t = 0; AU.lockOn(); }
    return;
  }
  if(l.t>=l.hold){ G.lay = null; launchShell(); }
}
function launchShell(){
  setGameState(GameState.PROJECTILE_FLYING);
  setObjective('Shell away!');
  G.tries++;
  G.angleShown = G.angleTarget;
  const aimPath = calculateAimPath(G.angleTarget);
  G.aimPath = aimPath;
  G.shell = { x:aimPath.startX, y:aimPath.startY, a:aimPath.screenAngle, path:aimPath, travelled:0, minDz:1e9 };
  G.recoil = 14; G.flash = .13; G.shake = 5;
  AU.fire(); AU.whoosh(1.6);
  if(G.zombie){ G.zombie.mode='alert'; AU.zombieUhOh(); }
  spawnSmoke(aimPath.startX, aimPath.startY, 8);
}

function resolveHit(){
  if(G.activeNode) G.activeNode.status='CLEARED';
  G.zombie.mode='burst'; G.zombie.burstF=0; G.zombie.animT=0;
  AU.explode(true); AU.zombiePop();
  G.shake=14;
  const pts = G.tries===1?300 : G.tries===2?200 : 100;
  G.score+=pts;
  spawnStars(G.zombie.x, G.zombie.y, 16);
  G.floaters.push({x:G.zombie.x, y:G.zombie.y-50, txt:'+'+pts, t:0});
  showMsg(G.tries===1 ? `💥 PERFECT! θ = ${G.angleTarget}°` : `💥 BOOM! θ = ${G.angleTarget}°`, 3000);
  setObjective(G.level===TOTAL_LEVELS-1 ? 'Final target cleared!' : 'Target cleared - moving forward!');
  setTimeout(()=>AU.success(), 350);
  setGameState(GameState.HIT_REACTION);
}

function resolveMiss(near){
  AU.explode(false);
  G.shake=5; G.hearts--;
  G.zombie.mode='idle';
  const L=currentLevelData(), v=G.angleTarget;
  let hint = (near?'SO close! ':'') +
    (v > L.ans+TOL ? 'Too steep — aim lower ⬇' : 'Too shallow — aim higher ⬆');
  if(G.hearts===1){
    const n = {tan:`tan θ = ${L.h} ÷ ${L.d}`, sin:`sin θ = ${L.h} ÷ ${L.hyp}`, cos:`cos θ = ${L.d} ÷ ${L.hyp}`}[L.type];
    hint += `  💡 ${n}`;
  }
  AU.wrong();
  if(G.hearts<=0){
    showMsg(`The answer was ${Math.round(L.ans)}°!`, 4000);
    setTimeout(gameOver, 1400);
  } else {
    showMsg(hint, 4200);
    G.barrelTarget = BARREL_REST_ANGLE;     // gun settles back down for another lay
    setObjective('Try again — solve for θ');
    setGameState(GameState.AIMING);
  }
}

function gameOver(){
  setGameState(GameState.GAME_OVER);
  showCard(`<h2>💀 OUT OF SHELLS!</h2>
    <p>The zombie is doing a happy dance…<br>but you'll get it next time!</p>
    <p>⭐ Score: <b>${G.score}</b></p>
    <button type="button" class="bigBtn" onclick="retryLevel()">TRY AGAIN</button>`);
}
window.retryLevel = ()=>{
  AU.click(); $('overlay').classList.add('hidden');
  setupLevel({fast:true});
};

function winGame(){
  setGameState(GameState.GAME_COMPLETE); AU.fanfare();
  saveBestScore(G.score);
  const s = G.score>=1200?'⭐⭐⭐' : G.score>=800?'⭐⭐☆':'⭐☆☆';
  showCard(`<h1>🏆 MISSION COMPLETE! 🏆</h1>
    <div class="stars">${s}</div>
    <p>All ${TOTAL_LEVELS} targets cleared with the power of <b>trigonometry</b>!</p>
    <p>⭐ Final score: <b>${G.score}</b></p>
    <button type="button" class="bigBtn" onclick="playAgain()">PLAY AGAIN</button>`);
}
window.playAgain = ()=>{
  AU.click(); $('overlay').classList.add('hidden');
  G.level=0; G.score=0; G.hearts=3;
  resetWorld();
  initializeLevel(0, {resetHearts:true, revive:true, enter:'none'});
  beginIntro();
};

/* ============================================================
   PARTICLES
   ============================================================ */
function spawnSmoke(x,y,n){
  for(let i=0;i<n;i++) G.particles.push({
    x,y, vx:(Math.random()-.3)*60, vy:-Math.random()*50-10,
    r:6+Math.random()*10, t:0, life:.6+Math.random()*.5, kind:'smoke'});
}
function spawnBoom(x,y){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*220;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,
      r:4+Math.random()*8,t:0,life:.4+Math.random()*.5,kind:'fire'});
  }
  spawnSmoke(x,y,10);
}
function spawnStars(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=90+Math.random()*260;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,
      r:8+Math.random()*9,t:0,life:.9+Math.random()*.6,kind:'star',
      rot:Math.random()*6, vr:(Math.random()-.5)*8});
  }
}
function spawnDriveDust(){
  G.particles.push({
    x:G.tankWorldX + TANK.w*.12, y:PLAY_SURFACE_Y-4,
    vx:-28-Math.random()*38, vy:-6-Math.random()*12,
    r:4+Math.random()*5, t:0, life:.42+Math.random()*.16, kind:'dust', world:true
  });
}
function easeInOutCubic(t){
  return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
}

function updateNodeStatuses(){
  G.levelNodes.forEach(node=>{
    if(node.status==='CLEARED' && G.tankWorldX > node.worldX + node.tower.w + 60){
      node.status='PASSED';
    }
    const sx = node.worldX - G.cameraX;
    if((node.status==='PASSED' || node.status==='CLEARED') && sx + node.tower.w < -DESPAWN_MARGIN){
      node.status='OFFSCREEN';
    }
  });
}

function updateZombies(dt){
  G.levelNodes.forEach(node=>{
    const z=node.zombie;
    if(z.dead) return;
    const t = zombieTypeOf(z);
    z.animT+=dt;
    if(z.mode==='burst'){
      if(z.animT > 1/t.fall.fps){
        z.animT=0; z.burstF++;
        if(z.burstF>=t.fall.poses.length){
          z.dead=true; z.mode='gone';
          if(node===G.activeNode) G.hitDelay=.45;
        }
      }
    } else if(z.mode==='idle' && t.look.fps>0 && z.animT > 1/t.look.fps){
      // the alarm pose is a held beat, so only the idle loop steps
      z.animT=0; z.frame=(z.frame+1)%t.look.idle.length;
    }
  });
}

/* One box for all three types — see the FAIRNESS note on ZOMBIE_TYPES.
   It is anchored on z.y, the point the triangle actually solves for. */
function zombieHitbox(z){
  return {
    x:z.x-48-HIT_PADDING,
    y:z.y-70-HIT_PADDING,
    w:96+HIT_PADDING*2,
    h:126+HIT_PADDING*2
  };
}

function pointInBox(x,y,b){
  return x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h;
}

function updateProjectile(dt){
  const s=G.shell, z=G.zombie;
  if(!s || !z) return;
  const p=s.path;
  s.travelled = Math.min(p.length, s.travelled + PROJECTILE_SPEED*dt);
  const u = p.length ? s.travelled/p.length : 1;
  s.x = p.startX + (p.endX-p.startX)*u;
  s.y = p.startY + (p.endY-p.startY)*u;
  s.a = p.screenAngle;
  if(Math.random()<.65) G.particles.push({
    x:s.x-p.dirX*28, y:s.y-p.dirY*28, vx:0, vy:0,
    r:3.5, t:0, life:.24, kind:'smoke'
  });

  const dz = Math.hypot(s.x-z.x, s.y-z.y);
  s.minDz = Math.min(s.minDz, dz);
  if(!z.dead && z.mode!=='burst' && pointInBox(s.x, s.y, zombieHitbox(z))){
    spawnBoom(s.x,s.y); G.shell=null; resolveHit();
  } else if(u>=1){
    const near=s.minDz<90;
    if(s.x>-80 && s.x<W+100 && s.y>-100 && s.y<H+80) spawnBoom(s.x,s.y);
    G.shell=null; resolveMiss(near);
  }
}

function finishDrive(){
  const d=G.drive; if(!d) return;
  AU.engineStop();
  G.cameraX = d.cameraEnd;
  G.tankWorldX = d.tankEnd;
  G.tankVel = 0;
  G.drive = null;
  syncWorldPositions();
  updateNodeStatuses();
  if(d.onArrive){ d.onArrive(); return; }   // the opening roll-in hands off to the briefing
  if(d.nextLevel==null){
    winGame();
    return;
  }
  initializeLevel(d.nextLevel, {resetHearts:false, revive:false});
  showMsg('Level '+(G.level+1)+'!', 1200);
}

function updateDrive(dt){
  const d=G.drive; if(!d) return;
  AU.engineStart();
  d.t += dt;
  const remaining = Math.max(0, d.tankEnd - G.tankWorldX);
  const stopDistance = G.tankVel*G.tankVel/(2*TANK_DECEL);
  const targetVel = remaining <= stopDistance + 10 ? 0 : TANK_MAX_SPEED;
  if(targetVel > G.tankVel) G.tankVel = Math.min(targetVel, G.tankVel + TANK_ACCEL*dt);
  else G.tankVel = Math.max(targetVel, G.tankVel - TANK_DECEL*dt);
  let moved = Math.min(remaining, Math.max(0,G.tankVel)*dt);
  if(remaining<12 && G.tankVel<55){ moved=remaining; G.tankVel=0; }
  G.tankWorldX += moved;

  const lookAhead = Math.min(G.tankVel*.10, CAMERA_LOOKAHEAD_MAX);
  let desiredCamera = Math.max(d.cameraStart, G.tankWorldX - CAMERA_FOLLOW_X + lookAhead);
  desiredCamera = Math.min(d.cameraEnd, desiredCamera);
  G.cameraX += (desiredCamera - G.cameraX) * Math.min(1, CAMERA_FOLLOW_STRENGTH*dt);
  if(d.tankEnd - G.tankWorldX < 1.2){
    G.tankWorldX = d.tankEnd;
    G.tankVel = 0;
    G.cameraX += (d.cameraEnd - G.cameraX) * Math.min(1, CAMERA_FOLLOW_STRENGTH*1.35*dt);
  }

  G.wheelRot += Math.abs(moved)/TANK.wheelR;
  AU.engineDrive(Math.abs(G.tankVel)/TANK_MAX_SPEED);
  G.dustT -= dt;
  if(G.dustT<=0 && Math.abs(G.tankVel)>55){
    spawnDriveDust();
    G.dustT = .11 + Math.random()*.08;
  }
  syncWorldPositions();
  updateNodeStatuses();
  if(Math.abs(d.tankEnd-G.tankWorldX)<.8 && Math.abs(d.cameraEnd-G.cameraX)<1.5 && Math.abs(G.tankVel)<1){
    finishDrive();
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  G.time+=dt;
  syncWorldPositions();
  // barrel eases toward target angle
  // the barrel is driven by the laying tween while a shot is being committed,
  // and otherwise eases toward its rest / travel angle
  if(G.lay) updateLay(dt);
  else G.angleShown += (G.barrelTarget-G.angleShown)*Math.min(1,dt*9);
  const guidesUp = G.state===GameState.BRIEFING || G.state===GameState.AIMING || G.state===GameState.LAYING;
  const guideTarget = guidesUp ? 1 : (G.state===GameState.PROJECTILE_FLYING ? .6 : 0);
  G.guideAlpha += (guideTarget-G.guideAlpha)*Math.min(1,dt*12);
  if(G.recoil>0) G.recoil=Math.max(0,G.recoil-dt*60);
  if(G.flash>0) G.flash-=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*26);

  if(G.state===GameState.BRIEFING) updateBriefing(dt);

  updateZombies(dt);

  updateProjectile(dt);

  if(G.state===GameState.HIT_REACTION && G.zombie && G.zombie.dead){
    G.hitDelay = Math.max(0, G.hitDelay-dt);
    if(G.hitDelay<=0){
      if(G.level>=TOTAL_LEVELS-1) startVictoryBoom();
      else startDrive();
    }
  }

  if(G.trans) updateVictoryBoom(dt);

  // rolling: the opening entrance and the runs between rounds share one drive
  if(G.state===GameState.TRAVELLING || G.state===GameState.INTRO){
    updateDrive(dt);
  }

  // particles & floaters
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.kind==='star'){ p.vy+=380*dt; p.rot+=p.vr*dt; }
    if(p.kind==='fire') p.vy+=140*dt;
    if(p.kind==='smoke') p.r+=14*dt;
    if(p.kind==='dust'){ p.r+=10*dt; p.vy-=4*dt; }
    if(p.t>p.life) G.particles.splice(i,1);
  }
  for(let i=G.floaters.length-1;i>=0;i--){
    const f=G.floaters[i]; f.t+=dt; f.y-=40*dt;
    if(f.t>1.4) G.floaters.splice(i,1);
  }
}

function prepareDrive(){
  setObjective('Target cleared — moving up!');
  G.guideAlpha = 0;
  G.barrelTarget = BARREL_REST_ANGLE;    // gun back to travel position
  stowDock(true);
  if(G.activeNode && G.activeNode.status==='ACTIVE') G.activeNode.status='CLEARED';
  const nextNode = G.levelNodes[G.level+1] || null;
  const cameraEnd = nextNode ? nextNode.targetWorldX - TARGET_SCREEN_X : G.cameraX + FINAL_ROLL_DISTANCE;
  const tankEnd = cameraEnd + CAMERA_FOLLOW_X;
  G.drive = {
    t:0,
    nextLevel:nextNode ? nextNode.level : null,
    tankStart:G.tankWorldX,
    tankEnd:Math.max(G.tankWorldX+90, tankEnd),
    cameraStart:G.cameraX,
    cameraEnd:Math.max(G.cameraX, cameraEnd)
  };
  G.dustT = 0;
  syncWorldPositions();
}
function poseDriveAt(progress){
  const d = G.drive; if(!d) return;
  const u = Math.max(0,Math.min(1,progress));
  const e = easeInOutCubic(u);
  G.tankWorldX = d.tankStart + (d.tankEnd-d.tankStart)*e;
  const lookAhead = u>0 && u<1 ? CAMERA_LOOKAHEAD_MAX*.7 : 0;
  G.cameraX = Math.min(d.cameraEnd, Math.max(d.cameraStart, G.tankWorldX - CAMERA_FOLLOW_X + lookAhead));
  G.tankVel = u>0 && u<1 ? TANK_MAX_SPEED*(1-Math.abs(u-.5)*1.2) : 0;
  G.wheelRot = Math.abs(G.tankWorldX-d.tankStart)/TANK.wheelR;
  syncWorldPositions();
  updateNodeStatuses();
}
function startDrive(){
  if(G.state===GameState.PAUSED && G.prevPaused===GameState.HIT_REACTION){ prepareDrive(); G.prevPaused=GameState.TRAVELLING; return; }
  if(G.state!==GameState.HIT_REACTION) return;
  setGameState(GameState.TRAVELLING);
  prepareDrive();
}

/* ============================================================
   THE FINALE — one comic BOOM, and only for the last target.
   Rounds 1–4 hand over the way they always did: the tank drives to
   the next target. Clearing the FINAL zombie earns this instead — the
   gun lobs a cartoon bomb into the middle of the frame, it settles,
   its fuse catches and burns down, and THEN it goes off, filling the
   screen so the win card comes up out of the blast.

   The order is the whole point: arrive → light → burn → bang. One
   clock (tr.t) drives it, and every beat below is a time on that
   clock, so retiming the sequence means editing this table only.
   ============================================================ */
const TR = {
  land:  .46,   // bomb reaches centre frame
  lit:   .64,   // it has stopped wobbling; the fuse catches
  bang: 1.16,   // the spark reaches the casing
  pop:   .26,   // how long the burst takes to spring open
  out:  1.88,   // panel lifts and the win card comes up behind it
  outDur:.36,
  total:2.24
};
const BOOM_CX = W/2, BOOM_CY = H*.47;
const BOMB_R = 58;      // the finale's centrepiece — sized to be read, not spotted

let BOOM_BG = null, HALFTONE = null;
/* The backdrop is baked square at the screen's diagonal so it still covers
   every corner while it slowly rotates, and the halftone is a repeating tile
   drawn in screen space — a print screen doesn't scale with the art on it. */
function bakeBoomLayers(){
  const D = Math.ceil(Math.hypot(W,H)) + 16, R = D/2;
  const c = makeCv(D,D), g = c.getContext('2d');
  const rg = g.createRadialGradient(R,R,0,R,R,R);
  rg.addColorStop(0,'#ffd23f'); rg.addColorStop(.40,'#ff9f1c'); rg.addColorStop(1,'#ef4f19');
  g.fillStyle=rg; g.fillRect(0,0,D,D);
  const RAYS = 30;                                   // speed lines out of the blast
  g.fillStyle='rgba(255,240,196,.28)';
  for(let i=0;i<RAYS;i+=2){
    const a0=i*2*Math.PI/RAYS, a1=(i+1)*2*Math.PI/RAYS;
    g.beginPath(); g.moveTo(R,R); g.arc(R,R,R,a0,a1); g.closePath(); g.fill();
  }
  g.fillStyle='rgba(198,40,18,.5)';                  // halftone, opening out toward the rim
  const step = 27;
  for(let y=step/2, row=0; y<D; y+=step, row++){
    for(let x=step/2; x<D; x+=step){
      const px = x + (row%2 ? step/2 : 0);
      const d = Math.hypot(px-R,y-R)/R;
      const k = (d-.30)/.70;
      if(k<=0 || d>1.02) continue;
      g.beginPath(); g.arc(px, y, k*k*7, 0, 7); g.fill();
    }
  }
  BOOM_BG = c;

  const S = 18, tile = makeCv(S,S), tg = tile.getContext('2d');
  tg.fillStyle='rgba(206,45,22,.45)';
  tg.beginPath(); tg.arc(S*.25,S*.25,3.1,0,7); tg.fill();
  tg.beginPath(); tg.arc(S*.75,S*.75,3.1,0,7); tg.fill();
  HALFTONE = ctx.createPattern(tile,'repeat');
}
function easeOutBack(t){
  const c1=1.70158, c3=c1+1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}
/* a hand-drawn starburst: every other spike is wobbled off-length so the
   silhouette reads as inked, not machined */
function starburstPath(R,r,points,seed){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const a = i*Math.PI/points - Math.PI/2;
    const rad = i%2 ? r*(1+Math.sin(i*1.7+seed)*.06) : R*(1+Math.sin(i*2.7+seed)*.11);
    const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath();
}

function startVictoryBoom(){
  if(!ambientMotionAllowed()){ winGame(); return; }
  setGameState(GameState.TRANSITION);
  G.guideAlpha = 0; G.barrelTarget = BARREL_REST_ANGLE;
  clearReveal(); stowDock(true); hideMsg();
  if(G.activeNode && G.activeNode.status==='ACTIVE') G.activeNode.status='CLEARED';
  G.trans = {t:0, from:muzzlePos(G.angleShown), ignited:false, banged:false, handed:false};
  $('stage').classList.add('is-transition');
  AU.whoosh(.44);
}
function updateVictoryBoom(dt){
  const tr = G.trans; if(!tr) return;
  tr.t += dt;
  if(!tr.ignited && tr.t>=TR.lit){
    tr.ignited = true;
    AU.tick(); AU.fuse(TR.bang-TR.lit);
  }
  if(!tr.banged && tr.t>=TR.bang){
    tr.banged = true;
    AU.explode(true); G.shake = 26;
  }
  if(!tr.handed && tr.t>=TR.out){
    tr.handed = true;                                // the win card rises out of the blast
    $('stage').classList.remove('is-transition');
    winGame();
  }
  if(tr.t>=TR.total) G.trans = null;
}
function finishVictoryBoom(){
  const tr = G.trans; if(!tr) return;
  G.trans = null;
  $('stage').classList.remove('is-transition');
  if(!tr.handed) winGame();
}

/* ---------- the bomb ---------- */
/* the fuse, as one curve off the casing's neck — the spark rides it from the
   far tip (p=1) down to the cap (p=0), and only the unburnt part is drawn */
function fusePoint(p){
  const R=BOMB_R;
  const x0=0, y0=-R-.20*R, cx=.55*R, cy=-R-1.10*R, x1=1.15*R, y1=-R-.80*R;
  const q=1-p;
  return {x: q*q*x0 + 2*q*p*cx + p*p*x1,
          y: q*q*y0 + 2*q*p*cy + p*p*y1};
}
function drawFinaleBomb(t){
  const tr = G.trans, f = tr.from;
  let x, y, sx=1, sy=1, rot, burn=1, alight=false;

  if(t < TR.land){                                   // the lob
    const u = t/TR.land;
    x = f.x + (BOOM_CX-f.x)*u;
    y = f.y + (BOOM_CY-f.y)*u - 260*Math.sin(Math.PI*u);
    rot = -.6 + u*1.5;
  } else {                                           // arrived: settle, then burn
    const b = clamp01((t-TR.land)/(TR.lit-TR.land));
    const k = (1-b)*Math.sin(b*Math.PI*3);           // decaying squash-and-stretch
    x = BOOM_CX; y = BOOM_CY - Math.abs(k)*18;
    sx = 1 + k*.22; sy = 1 - k*.22;
    rot = .9*(1-b);
    if(t >= TR.lit){
      burn = 1 - clamp01((t-TR.lit)/(TR.bang-TR.lit));
      alight = true;
      const tense = Math.pow(1-burn, 3);              // it swells and shivers as time runs out
      x += (Math.random()-.5)*3.4*(1-burn);
      y += (Math.random()-.5)*3.4*(1-burn);
      sx = sy = 1 + tense*.12;
    }
  }

  ctx.save();
  if(t < TR.land){                                   // fuse-smoke trail down the arc
    const u = t/TR.land;
    for(let i=1;i<=3;i++){
      const pu = u - i*.07; if(pu<=0) break;
      const px = f.x + (BOOM_CX-f.x)*pu, py = f.y + (BOOM_CY-f.y)*pu - 260*Math.sin(Math.PI*pu);
      ctx.globalAlpha = (1-i/4)*.30*u;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,7+i*4,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sx,sy);

  const bg = ctx.createRadialGradient(-BOMB_R*.35,-BOMB_R*.4,2,0,0,BOMB_R);
  bg.addColorStop(0,'#5a5f66'); bg.addColorStop(.45,'#24272b'); bg.addColorStop(1,'#0b0d10');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(0,0,BOMB_R,0,7); ctx.fill();
  ctx.strokeStyle='#0a0c0e'; ctx.lineWidth=BOMB_R*.11; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=BOMB_R*.11; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,BOMB_R*.66,Math.PI*1.05,Math.PI*1.5); ctx.stroke();
  if(alight){                                        // the spark throws its own light on the casing
    ctx.globalAlpha = .30 + (1-burn)*.45;
    ctx.strokeStyle='#ffb02e'; ctx.lineWidth=BOMB_R*.14;
    ctx.beginPath(); ctx.arc(0,0,BOMB_R*.93,-Math.PI*.85,-Math.PI*.15); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle='#2c3036';                           // the neck the fuse sits in
  ctx.beginPath(); ctx.moveTo(-BOMB_R*.27,-BOMB_R-1); ctx.lineTo(BOMB_R*.27,-BOMB_R-1);
  ctx.lineTo(BOMB_R*.20,-BOMB_R*1.28); ctx.lineTo(-BOMB_R*.20,-BOMB_R*1.28); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0c0e'; ctx.lineWidth=BOMB_R*.09; ctx.stroke();

  if(burn > .02){                                    // what is left of the fuse
    ctx.strokeStyle = alight ? '#a97b3c' : '#d8b06a';
    ctx.lineWidth=BOMB_R*.15; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<=14;i++){
      const p = fusePoint(burn*i/14);
      i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y);
    }
    ctx.stroke();
  }
  if(alight){
    const s = fusePoint(burn);
    const fl = .78 + Math.sin(G.time*46)*.22;
    const ig = 1-clamp01((t-TR.lit)/.16);            // the flare of it catching
    ctx.globalAlpha = .5;
    ctx.fillStyle='#ff9a2e'; ctx.beginPath(); ctx.arc(s.x,s.y,BOMB_R*.44*fl,0,7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(s.x,s.y,BOMB_R*.22*fl,0,7); ctx.fill();
    ctx.fillStyle='#fff6c4'; ctx.beginPath(); ctx.arc(s.x,s.y,BOMB_R*.11*fl,0,7); ctx.fill();
    if(ig>0){
      ctx.globalAlpha = ig*.9;
      ctx.strokeStyle='#fff6c4'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(s.x,s.y,BOMB_R*(.3+(1-ig)*.9),0,7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for(let i=0;i<4;i++){                            // sparks flicking off the burn
      const a = G.time*9 + i*2.3, d = BOMB_R*(.3+((i*7+Math.floor(G.time*22))%9)*.02);
      ctx.globalAlpha = .55;
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(s.x+Math.cos(a)*d, s.y+Math.sin(a)*d*.7, BOMB_R*.055, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- the blast ---------- */
function drawBoomBackdrop(a, t){
  ctx.save(); ctx.globalAlpha *= clamp01(a);
  ctx.translate(BOOM_CX, H/2); ctx.rotate((t-TR.bang)*.30);
  ctx.drawImage(BOOM_BG, -BOOM_BG.width/2, -BOOM_BG.height/2);
  ctx.restore();
}
function drawBoomStar(s, t){
  if(s<=.01) return;
  const jitter = 3.5*Math.max(0, 1-(t-TR.bang)/.35);   // the burst shudders on impact
  ctx.save();
  ctx.translate(BOOM_CX + (Math.random()-.5)*jitter, BOOM_CY + (Math.random()-.5)*jitter);
  ctx.scale(s,s);
  ctx.lineJoin='miter'; ctx.miterLimit=3;
  starburstPath(452, 300, 13, 1.2);
  ctx.strokeStyle='#150d08'; ctx.lineWidth=11; ctx.stroke();
  ctx.fillStyle='#f0891d'; ctx.fill();
  ctx.rotate(.11);
  starburstPath(372, 244, 13, 4.1);
  ctx.strokeStyle='#150d08'; ctx.lineWidth=7; ctx.stroke();
  ctx.fillStyle='#ffd645'; ctx.fill();
  ctx.clip();                                   // halftone stays a fixed print screen,
  ctx.setTransform(1,0,0,1,0,0);                // so it does not scale with the pop
  ctx.fillStyle=HALFTONE; ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function drawBoomWord(s){
  if(s<=.01) return;
  ctx.save();
  ctx.translate(BOOM_CX, BOOM_CY);
  ctx.rotate(-6*Math.PI/180);
  ctx.scale(s,s);
  ctx.font=`900 168px ${FONT}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.fillStyle='#160b05'; ctx.fillText('BOOM!', 13, 16);       // the comic's offset block
  ctx.lineWidth=26; ctx.strokeStyle='#160b05'; ctx.strokeText('BOOM!',0,0);
  const g = ctx.createLinearGradient(0,-80,0,80);
  g.addColorStop(0,'#f0483a'); g.addColorStop(1,'#bf1f16');
  ctx.fillStyle=g; ctx.fillText('BOOM!',0,0);
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,214,69,.75)'; ctx.strokeText('BOOM!',0,0);
  ctx.restore();
}
/* Drawn outside the shake transform: this panel is the screen's whole
   surface for a moment, so nothing is allowed to slide its edges off. */
function drawTransition(){
  const tr = G.trans; if(!tr) return;
  const t = tr.t;
  const out = t<TR.out ? 1 : 1-clamp01((t-TR.out)/TR.outDur);
  if(out<=0) return;
  if(t < TR.bang){ drawFinaleBomb(t); return; }
  ctx.save();
  ctx.globalAlpha = out;
  drawBoomBackdrop((t-TR.bang)/.09, t);
  drawBoomStar(easeOutBack(clamp01((t-TR.bang)/TR.pop)), t);
  drawBoomWord(easeOutBack(clamp01((t-TR.bang-.06)/TR.pop)));
  const flash = 1-clamp01((t-TR.bang)/.09);       // the white kick of the detonation
  if(flash>0){
    ctx.globalAlpha = out*flash*.85;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

/* ============================================================
   DRAW
   ============================================================ */
function drawBG(){
  const cam = Math.max(0, Math.min(G.cameraX, BGL.world.width-W));
  ctx.drawImage(BGL.world, cam,0,W,H, 0,0,W,H);
}

/* ---------- sky clouds — the background plates are painted clean of
   clouds, so every cloud on screen is this drifting layer, cut from the
   one painted cloud.png. With a single source sprite the trick is to stop
   it reading as copy-paste: each cloud gets a DEPTH, and size, opacity,
   parallax and wind speed are all derived from that one number, so far
   clouds are small, pale and slow while near ones are big, solid and
   quick — the layer gains real depth instead of looking like one shape
   scattered nine times. A per-cloud mirror and slight vertical squash
   then break up the silhouette so no two repeats line up. ---------- */
const SKY_CLOUD_SPAN = 1800;             // world-px before the pattern repeats
const CLOUD_BAND_Y = [34, 250];          // kept in open sky, clear of the mountain line
const lerp = (a,b,t)=>a+(b-a)*t;
// few and small on purpose: the sky is backdrop, not scenery — a handful of
// modest clouds spaced wide apart keeps the tank, target and guides dominant
const SKY_CLOUDS = Array.from({length:5}, (_,i)=>{
  const depth = Math.random();           // 0 = near/bold, 1 = far/faint
  return {
    // evenly spaced, then jittered, so they never sit in a visible rhythm
    baseX:   (i+.5)/5*SKY_CLOUD_SPAN + (Math.random()-.5)*150,
    y:       lerp(CLOUD_BAND_Y[1], CLOUD_BAND_Y[0], depth) + (Math.random()-.5)*40,
    w:       lerp(200, 85, depth),       // near clouds read bigger
    alpha:   lerp(.82, .38, depth),      // ...and more solid
    parallax:lerp(.55, .20, depth),      // ...and slide past faster
    wind:    lerp(11, 3.5, depth),       // ...and outrun the far ones on the breeze
    flip:    Math.random()<.5 ? -1 : 1,  // mirror half of them
    squash:  .86 + Math.random()*.28,    // vary the silhouette height
    phase:   Math.random()*Math.PI*2,
    bobAmp:  2 + Math.random()*3.5,
    bobSpeed:.25 + Math.random()*.28
  };
});
/* one cloud, centred on (x,y), drawn from the baked sprite */
function drawCloud(x, y, w, alpha, flip=1, squash=1){
  if(!BGL.cloud) return;
  const h = w/BGL.cloudAspect*squash;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(flip<0) ctx.scale(-1,1);
  ctx.drawImage(BGL.cloud, -w/2, -h/2, w, h);
  ctx.restore();
}
function drawSkyClouds(){
  SKY_CLOUDS.forEach(c=>{
    // wind drifts them even while the camera holds still (aiming); parallax
    // slides them against the camera at less than ground speed
    let sx = (c.baseX + G.time*c.wind - G.cameraX*c.parallax) % SKY_CLOUD_SPAN;
    if(sx<0) sx += SKY_CLOUD_SPAN;
    const y = c.y + Math.sin(G.time*c.bobSpeed + c.phase)*c.bobAmp;
    const half = c.w/2;
    for(const off of [-SKY_CLOUD_SPAN, 0, SKY_CLOUD_SPAN]){
      const x = sx+off;
      if(x > -half && x < W+half) drawCloud(x, y, c.w, c.alpha, c.flip, c.squash);
    }
  });
}

/* ============================================================
   TITLE SCENE
   The attract screen is the painted key-art plate: preLBD.png is a
   finished 16:9 illustration — wordmark, valley, ruins, hedgerow —
   so this draws exactly two things over it. A burst of light thrown
   from behind the wordmark, and then the plate's own wordmark
   rectangle re-blitted on top of that burst.

   That second draw is the whole trick. Without it the rays wash
   across the letters; with it they read as light spilling from
   BEHIND the logo, which is how the reference key art reads. It
   costs one drawImage and never needs re-registering, because
   drawCoverSlice puts the rect back exactly where the plate had it.

   The pill itself is HTML, parked on TITLE_BURST's centre.
   ============================================================ */
/* ---------- feathered plate patches ----------
   Two live layers get painted over the plate and then partly covered by
   the plate again: the burst goes behind the wordmark, and the zombie
   line-up stands inside the hedgerow. Both are the same move — re-blit a
   rectangle of preLBD.png on top — and both need the same care.

   A HARD-edged re-blit is the trap. It cuts every ray, and every zombie
   leg, along one straight line, which reads as a seam the moment the
   light gets bright. So each patch is baked once with the edges that
   actually get crossed faded out; the light dies under the logo and the
   legs sink into the leaves instead of stopping dead.

   `feather` values are stage px per edge. Edges the live layers never
   reach are left hard — no point paying for a fade nobody sees. */
function bakePlatePatch(rect, feather){
  const img = IMGS.pre, [sx,sy,sw,sh] = rect;
  const sc = Math.max(W/img.naturalWidth, H/img.naturalHeight);
  const coverSx = (img.naturalWidth - W/sc)/2, coverSy = (img.naturalHeight - H/sc)/2;
  const dw = Math.ceil(sw*sc), dh = Math.ceil(sh*sc);
  const c = makeCv(dw, dh), g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx,sy,sw,sh, 0,0, dw,dh);
  // Each pass multiplies the patch's alpha by one edge ramp. destination-in
  // clears whatever the source misses, so every ramp must be filled across
  // the WHOLE patch — two part-canvas fills would erase each other.
  g.globalCompositeOperation = 'destination-in';
  const ramp = (x0,y0,x1,y1, len, span)=>{
    const grd = g.createLinearGradient(x0,y0,x1,y1);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(Math.min(1, len/span), 'rgba(0,0,0,1)');
    grd.addColorStop(1, 'rgba(0,0,0,1)');
    g.fillStyle = grd; g.fillRect(0,0,dw,dh);
  };
  if(feather.top)    ramp(0,0, 0,dh, feather.top,    dh);
  if(feather.bottom) ramp(0,dh, 0,0, feather.bottom, dh);
  if(feather.left)   ramp(0,0, dw,0, feather.left,   dw);
  if(feather.right)  ramp(dw,0, 0,0, feather.right,  dw);
  g.globalCompositeOperation = 'source-over';
  return {cv:c, at:[(sx-coverSx)*sc, (sy-coverSy)*sc, dw, dh]};
}
/* Rects are in preLBD.png's own 1672x941 pixels. The hedge rect runs to the
   plate's exact right and bottom edges, so only its top and left are cut —
   and its top sits DEEP inside the plate's own leaf mass (stage y ~686,
   where the plate is bushes above and below alike). That is what lets the
   feather be tight: the seam falls bush-on-bush, so no straight line shows.
   It only ever veils the mob's toes — enough to plant them in the hedge,
   never enough to cut a leg. */
const TITLE_LOGO_RECT  = [439, 39, 807, 531];
const TITLE_HEDGE_RECT = [1071, 896, 601, 45];
function bakeTitlePatches(){
  BGL.titleLogo  = bakePlatePatch(TITLE_LOGO_RECT,  {bottom:46});
  BGL.titleHedge = bakePlatePatch(TITLE_HEDGE_RECT, {top:14, left:74});
}

/* The plate leaves one open band — under the logo, across the dirt lip —
   and this is its centre. .titleCtas in the stylesheet is anchored to the
   same number: move one and move both. */
const TITLE_BURST = {x:640, y:548, rx:276, ry:238, rays:20};

function drawTitleBurst(){
  const b = TITLE_BURST;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(G.time*0.075);
  ctx.scale(1, b.ry/b.rx);
  const fade = ctx.createRadialGradient(0,0,18, 0,0,b.rx);
  // the pill covers the bright core, so the alpha is held out to ~80% of the
  // radius — otherwise the only ray the player ever sees is its faintest tail
  fade.addColorStop(0,   'rgba(255,253,206,.96)');
  fade.addColorStop(.5,  'rgba(252,230,74,.84)');
  fade.addColorStop(.82, 'rgba(244,212,44,.52)');
  fade.addColorStop(1,   'rgba(238,202,34,0)');
  ctx.fillStyle = fade;
  const step = Math.PI*2/b.rays;
  for(let i=0;i<b.rays;i++){
    const a = i*step;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,b.rx, a-step*.27, a+step*.27);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // the warm core the pill is bedded into
  const core = ctx.createRadialGradient(b.x,b.y,0, b.x,b.y,b.rx*.7);
  core.addColorStop(0,'rgba(255,250,206,.6)');
  core.addColorStop(1,'rgba(255,244,166,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.ellipse(b.x,b.y,b.rx*.7,b.ry*.7,0,0,7); ctx.fill();
}

/* ---------- the corner lurker ----------
   One zombie, enlarged, leaning in over the bottom-right corner with
   roughly half of him out of frame.

   The bruiser gets the job on resolution alone. Its sheet carries a 383px
   body, so 600px on screen is a 1.6x push; the runner's 250px sheet would
   be 2.4x and the shambler's 167px sheet 3.6x — visibly soft at this size.
   Nothing else about him is special here, and swapping `type` is the only
   edit needed if better art turns up.

   The rotation is taken about the pivot, and the pivot is the point his
   soles stand on — the whole figure hangs off it. That means `tilt` swings
   him without ever unplanting the anchor, and `x`/`feetY` stay readable as
   "where his boots are", even though they are off-canvas.
   Drawn straight off the type registry, so he shuffles at the same cadence
   the player will meet on level 3. */
/* x/feetY are deliberately off-canvas — that is the point. Only the top
   half of him lands inside the 1280x720 frame; the rest leans out past the
   corner. Shrinking him means pulling the pivot in as well as dropping
   `height` — the figure scales toward its soles, so height alone would
   just slide him off the edge. Tuned by eye against the plate: further
   left and his hair fouls the wordmark's 'E', bigger and it crowds it. */
const TITLE_LURKER = {type:'bruiser', x:1245, feetY:845, height:540, tilt:-19};
function drawTitleLurker(){
  const L = TITLE_LURKER, set = ZOMBIE_TYPES[L.type].look;
  const f  = set.fps>0 ? set.idle[Math.floor(G.time*set.fps) % set.idle.length]
                       : set.idle[0];
  const sc = L.height/set.bodyPx;
  const ax = (f[4]!==undefined ? f[4] : f[2]/2)*sc;
  // a slow rock on top of the fixed tilt, so the corner is never a still frame
  const a  = (L.tilt + Math.sin(G.time*.9)*1.4) * Math.PI/180;
  ctx.save();
  ctx.translate(L.x, L.feetY);
  ctx.rotate(a);
  ctx.drawImage(IMGS[set.sheet], f[0],f[1],f[2],f[3], -ax, -f[3]*sc, f[2]*sc, f[3]*sc);
  ctx.restore();
}

function drawTitleScene(){
  ctx.clearRect(0, 0, W, H);
  drawCover(ctx, IMGS.pre, 0, 0, W, H);
  drawTitleBurst();
  ctx.drawImage(BGL.titleLogo.cv,  ...BGL.titleLogo.at);   // rays fall in behind the wordmark
  drawTitleLurker();
  ctx.drawImage(BGL.titleHedge.cv, ...BGL.titleHedge.at);  // leaves close over their boots
}

function visibleLevelNodes(){
  return G.levelNodes.filter(node=>{
    if(node.status==='OFFSCREEN') return false;
    const sx = node.worldX - G.cameraX;
    return sx > -node.tower.w-CULL_MARGIN && sx < W+CULL_MARGIN;
  });
}

/* ---------- the zombie's perch: one complete building illustration,
   scaled as a single piece so its flat deck lands at the height this
   level's opposite side needs — no sliced or repeated sections --- */
function drawTower(tower=G.tower){
  const b=tower; if(!b) return;
  // contact shadow at the base
  const cs=ctx.createRadialGradient(b.x+b.w/2, GROUND_Y, 0, b.x+b.w/2, GROUND_Y, b.w*.7);
  cs.addColorStop(0,'rgba(20,35,20,.4)'); cs.addColorStop(1,'rgba(20,35,20,0)');
  ctx.fillStyle=cs;
  ctx.beginPath(); ctx.ellipse(b.x+b.w/2, GROUND_Y, b.w*.7, 14, 0,0,7); ctx.fill();
  // one complete structure, scaled as a single piece — no stacked slices
  const [sx,sy,sw,sh] = b.bld.box;
  ctx.drawImage(IMGS[b.bld.img], sx,sy,sw,sh, b.x, b.y, b.w, b.h);
}
function hitTower(x,y){
  const b=G.tower;
  return b && x>b.x-4 && x<b.x+b.w+4 && y>b.y+6 && y<GROUND_Y;
}

function drawZombie(z=G.zombie){
  if(!z || z.dead) return;
  const t = zombieTypeOf(z);
  const feetY = z.y + t.feetOffset;      // soles rest on the building's deck
  const set = z.mode==='burst' ? t.fall : t.look;
  const f   = z.mode==='burst' ? set.poses[Math.min(z.burstF, set.poses.length-1)]
            : z.mode==='alert' ? set.alert
            : set.idle[z.frame % set.idle.length];
  const sc = t.height/set.bodyPx;
  const w = f[2]*sc, h = f[3]*sc;
  const ax = (f[4]!==undefined ? f[4] : f[2]/2)*sc;   // the body's centre-line
  // every pose hangs off (z.x, feetY), so a knockdown staggers, falls and
  // crumples ON the roof whatever shape its frame happens to be
  ctx.save();
  ctx.translate(z.x, feetY);
  // a type with no idle loop breathes instead: a squash anchored at the soles,
  // so the torso rises and falls while the feet stay glued to the deck
  if(z.mode==='idle' && set.fps===0) ctx.scale(1, 1 + Math.sin(G.time*3)*.018);
  ctx.drawImage(IMGS[set.sheet], f[0],f[1],f[2],f[3], -ax, -h, w, h);
  ctx.restore();
}

/* ============================================================
   THE TRIANGLE — the round's word problem, drawn on the world.

     A = the gun's rotation centre      B = corner under the target
     C = the target                     θ = the unknown at A

   Every zombie is placed on the ray leaving A at its level's answer angle,
   so this triangle IS the level data — there is no second source of truth
   to drift out of sync with what actually hits.
   ============================================================ */
const GUIDE_INK='#fff4c8',            // the given sides — lit filament, not hairline
      GUIDE_BLOOM='#ffb02e',          // the amber light they throw
      GUIDE_HALO='rgba(30,11,3,.42)', // keeps them readable over a bright wall
      GUIDE_VALUE='#ffcb57',          // the plates' tan, for numbers and θ
      GUIDE_CAPTION='#fef8dc',        // the FIRE cream, for labels
      GUIDE_SHOT='#ff9a2e';           // your committed angle
function trigTriangle(){
  const z = G.zombie; if(!z) return null;
  const ax = TANK.x + TANK.w*.44, ay = TANK.y + TANK.h*.10;   // pivot, ignoring recoil
  return {ax, ay, bx:z.x, by:ay, cx:z.x, cy:z.y};
}
function meters(v){
  return Math.abs(v-Math.round(v))<.05 ? `${Math.round(v)} m` : `${v.toFixed(1)} m`;
}
/* Every measured mark is struck the same way, so the whole triangle reads as
   one filament of light: a faint dark halo (so it survives a bright wall), a
   wide soft bloom, a tighter hot bloom, then a near-white core inside both.
   `path` only builds the path — each pass re-strokes it.
   The bloom breathes slowly, which is what makes the sides read as LIT rather
   than merely drawn; held still when the player asked for reduced motion. */
function glowStroke(path, {w=3.4, halo=7.5, core=GUIDE_INK, bloom=GUIDE_BLOOM, blur=1, cap='round'}={}){
  const pulse = ambientMotionAllowed() ? 1 + Math.sin(G.time*2.4)*.14 : 1;
  ctx.save();
  ctx.lineCap=cap; ctx.lineJoin='round';
  ctx.strokeStyle=GUIDE_HALO; ctx.lineWidth=halo; path(); ctx.stroke();
  ctx.shadowColor=bloom; ctx.shadowBlur=22*blur*pulse;      // the amber band and its spill
  ctx.strokeStyle=bloom; ctx.lineWidth=w+3.5; path(); ctx.stroke();
  ctx.shadowColor='rgba(255,228,152,.95)'; ctx.shadowBlur=7*blur;
  ctx.strokeStyle=core;  ctx.lineWidth=w;     path(); ctx.stroke();
  ctx.restore();
}
/* a side that draws itself on: u is how much of it has arrived */
function guideLeg(x1,y1,x2,y2,u){
  if(u<=.002) return;
  const x=x1+(x2-x1)*u, y=y1+(y2-y1)*u;
  glowStroke(()=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x,y); });
}
function guideText(txt,x,y,{size=21,weight=800,fill=GUIDE_VALUE,align='center'}={}){
  ctx.font=`${weight} ${size}px ${FONT}`;
  ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(4,size*.34);
  ctx.strokeStyle='rgba(38,14,4,.72)'; ctx.strokeText(txt,x,y);
  ctx.fillStyle=fill; ctx.fillText(txt,x,y);
}
/* a given length: small caption over a big number, so it reads as data */
function guideValue(x,y,caption,value,u,align='center'){
  if(u<=.01) return;
  ctx.save();
  ctx.globalAlpha *= clamp01(u);
  const rise = (1-u)*10;
  guideText(caption, x, y-15+rise, {size:12, weight:700, fill:GUIDE_CAPTION, align});
  guideText(value,   x, y+5+rise,  {size:22, weight:800, align});
  ctx.restore();
}
function elbowPath(x,y,dx,dy){
  ctx.beginPath(); ctx.moveTo(x+dx,y); ctx.lineTo(x+dx,y+dy); ctx.lineTo(x,y+dy);
}
/* The sides go BEHIND the tank, so the barrel hides the triangle's root: the
   horizontal reads as leaving the muzzle (exactly like the sketch) while the
   maths still measures the full side from the pivot. */
function drawTriangleLegs(){
  if(G.guideAlpha<=.01) return;
  const t = trigTriangle(); if(!t) return;
  ctx.save(); ctx.globalAlpha *= G.guideAlpha;
  guideLeg(t.ax,t.ay,t.bx,t.by,G.reveal.adj);   // adjacent
  guideLeg(t.bx,t.by,t.cx,t.cy,G.reveal.opp);   // opposite
  guideLeg(t.ax,t.ay,t.cx,t.cy,G.reveal.hyp);   // hypotenuse / line of fire
  ctx.restore();
}
/* The parts that must stay readable over everything: right-angle box, the θ
   sweep at the gun, the two given lengths, and — only once a shot has been
   committed — where the barrel is actually pointing. */
function drawGuides(){
  if(G.guideAlpha<=.01) return;
  const t = trigTriangle(); if(!t) return;
  const L = currentLevelData();
  const inSign = Math.sign(t.ax-t.bx) || -1, upSign = Math.sign(t.cy-t.by) || -1;

  const ru = clamp01((G.reveal.opp-.5)/.35);
  if(ru>0){
    const s = 15*ru;
    ctx.save(); ctx.globalAlpha *= G.guideAlpha*ru;
    glowStroke(()=>elbowPath(t.bx,t.by,inSign*s,upSign*s), {w:2.8, halo:6, blur:.8});
    ctx.restore();
  }

  if(G.reveal.theta>0){
    const ans = Math.atan2(t.ay-t.cy, t.cx-t.ax);    // the unknown, straight off the geometry
    const u = G.reveal.theta, R = 104, swept = ans*u;
    ctx.save(); ctx.globalAlpha *= G.guideAlpha;
    glowStroke(()=>{ ctx.beginPath(); ctx.arc(t.ax,t.ay,R,-swept,0); },
               {w:3.6, halo:7, cap:'butt'});
    const mid = swept*.5;
    guideText('θ', t.ax+Math.cos(mid)*(R+32), t.ay-Math.sin(mid)*(R+32), {size:26+8*(1-u)});
    ctx.restore();
  }

  ctx.save(); ctx.globalAlpha *= G.guideAlpha;
  guideValue((t.ax+t.bx)/2, t.by+36, 'ADJACENT', meters(L.adjacent), G.reveal.chipA);
  guideValue(t.bx+24, (t.by+t.cy)/2, 'OPPOSITE', meters(L.opposite), G.reveal.chipO, 'left');
  ctx.restore();

  if(G.state===GameState.LAYING || G.state===GameState.PROJECTILE_FLYING){
    const p = G.shell ? G.shell.path : calculateAimPath(G.angleShown);
    ctx.save(); ctx.globalAlpha *= .8*G.guideAlpha;
    ctx.setLineDash([12,10]); ctx.lineCap='butt';
    ctx.strokeStyle='rgba(38,14,4,.4)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(p.startX,p.startY); ctx.lineTo(p.endX,p.endY); ctx.stroke();
    ctx.strokeStyle=GUIDE_SHOT; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(p.startX,p.startY); ctx.lineTo(p.endX,p.endY); ctx.stroke();
    ctx.restore();
  }
}

function drawTank(){
  const p = TANK.pivot();
  const a = G.angleShown*Math.PI/180;
  const hx = TANK.x - G.recoil*.6;

  // subtle contact shadow directly under the tracks
  const sg = ctx.createRadialGradient(hx+TANK.w*.45, PLAY_SURFACE_Y+3, 0, hx+TANK.w*.45, PLAY_SURFACE_Y+3, TANK.w*.42);
  sg.addColorStop(0,'rgba(2,22,24,.28)'); sg.addColorStop(1,'rgba(2,22,24,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(hx+TANK.w*.45, PLAY_SURFACE_Y+3, TANK.w*.42, 7, 0,0,7); ctx.fill();

  // cannon (rotates around pivot, drawn under hull dome)
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(-a);
  const cs=SP.cannon, pv=SP.cannonPivot, sc=BARREL_SC;
  const kick = G.recoil*.9;
  ctx.drawImage(IMGS.tank, cs[0],cs[1],cs[2],cs[3],
    -pv[0]*sc - kick, -pv[1]*sc, cs[2]*sc, cs[3]*sc);
  ctx.restore();

  // muzzle flash
  if(G.flash>0){
    const m = muzzlePos(), b=SP.blast, fs=.32+G.flash;
    ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(-a);
    ctx.globalAlpha=Math.min(1,G.flash*10);
    ctx.drawImage(IMGS.shot, b[0],b[1],b[2],b[3], -14, -b[3]*fs/2, b[2]*fs, b[3]*fs);
    ctx.restore();
  }

  // turret dome covers the cannon base
  const d=SP.dome, dw=TANK.w*.19, dh=dw*d[3]/d[2];
  ctx.drawImage(IMGS.tank, d[0],d[1],d[2],d[3], p.x-dw*.52, p.y-dh*.42, dw, dh);

  // hull
  const hs=SP.hull;
  ctx.drawImage(IMGS.tank, hs[0],hs[1],hs[2],hs[3], hx, TANK.y, TANK.w, TANK.h);

  // spinning wheels overlaid on the track
  const wr=TANK.wheelR;
  TANK.wheelFr.forEach((f,i)=>{
    const wx = hx + TANK.w*f[0], wy = TANK.y + TANK.h*f[1];
    const cell = SP.wheels[i];
    const pivot = SP.wheelPivot[i] || [cell[2]*.5, cell[3]*.5];
    const sc = (wr*2) / cell[2];
    // Keep the current rested placement, but spin around the actual hub.
    const axisX = wx + (pivot[0] - cell[2]*.5) * sc;
    const axisY = wy + (pivot[1] - cell[3]*.5) * sc;
    ctx.save(); ctx.translate(axisX,axisY); ctx.rotate(G.wheelRot);
    ctx.drawImage(IMGS.tank, cell[0],cell[1],cell[2],cell[3],
      -pivot[0]*sc, -pivot[1]*sc, cell[2]*sc, cell[3]*sc);
    ctx.restore();
  });
}

function drawShell(){
  if(!G.shell) return;
  const s=G.shell, r=SP.shellFlame, len=95, hgt=len*r[3]/r[2];
  ctx.save();
  ctx.translate(s.x,s.y); ctx.rotate(s.a);
  ctx.drawImage(IMGS.shot, r[0],r[1],r[2],r[3], -len+18, -hgt/2, len, hgt);
  ctx.restore();
}

function drawParticles(){
  G.particles.forEach(p=>{
    const k=1-p.t/p.life;
    const px = p.world ? p.x-G.cameraX : p.x;
    if(p.kind==='smoke'){
      ctx.globalAlpha=k*.45; ctx.fillStyle='#cfd4dd';
      ctx.beginPath(); ctx.arc(px,p.y,p.r,0,7); ctx.fill();
    } else if(p.kind==='fire'){
      ctx.globalAlpha=k; ctx.fillStyle=p.t<.15?'#fff3b0':(p.t<.3?'#ffb037':'#ff5d2a');
      ctx.beginPath(); ctx.arc(px,p.y,p.r*k,0,7); ctx.fill();
    } else if(p.kind==='dust'){
      ctx.globalAlpha=k*.22; ctx.fillStyle='#7a532a';
      ctx.beginPath(); ctx.ellipse(px,p.y,p.r*1.8,p.r*.72,0,0,7); ctx.fill();
    } else { // star
      ctx.globalAlpha=Math.min(1,k*1.5); ctx.fillStyle=['#ffd23f','#ff8b3d','#8bd45e','#5ec8ff'][(p.r|0)%4];
      ctx.save(); ctx.translate(px,p.y); ctx.rotate(p.rot);
      star5(p.r); ctx.fill(); ctx.restore();
    }
  });
  ctx.globalAlpha=1;
}
function star5(r){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2?r*.45:r, a=i*Math.PI/5-Math.PI/2;
    i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
}

function drawFloaters(){
  ctx.font='700 34px '+FONT;
  ctx.textAlign='center';
  G.floaters.forEach(f=>{
    ctx.globalAlpha=Math.max(0,1-f.t/1.4);
    ctx.lineWidth=6; ctx.strokeStyle='#143119'; ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle='#8bff5e'; ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.state===GameState.PREGAME){ if(ambientMotionAllowed()) G.time+=dt; render(); return; }
  if(G.state===GameState.PAUSED){ render(); return; }
  update(dt);
  render();
}
function render(){
  syncWorldPositions();
  if(G.state===GameState.PREGAME){
    ctx.save();
    drawTitleScene();
    ctx.restore();
    return;
  }
  const nodes = visibleLevelNodes();
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  drawBG();
  drawSkyClouds();
  nodes.forEach(node=>drawTower(node.tower));
  nodes.forEach(node=>drawZombie(node.zombie));
  drawTriangleLegs();      // behind the tank — the barrel hides the triangle's root
  drawTank();
  drawGuides();            // in front — right angle, θ sweep, the given lengths
  drawShell();
  drawParticles();
  drawFloaters();
  ctx.restore();
  drawTransition();        // full-screen comic panel — the level swap hides under it
}

/* ============================================================
   BOOT
   ============================================================ */
$('overlayCard').innerHTML = titleMarkup(false);
wireTitleButtons();

loadAll(()=>{
  buildLayers();
  setTitleReady();
  setupLevel({enter:'none'});               // so the title screen shows a live scene behind the start layer
  setGameState(GameState.PREGAME);
  const dp = location.hash.match(/^#previewdrive(\d{1,3})$/);
  const sp = location.hash.match(/^#previewshot(\d{1,3})$/);
  const auto = location.hash==='#autoplay';
  const pv = location.hash.match(/^#preview(\d)?(f)?$/);   // headless screenshot helper
  if(auto){
    resetWorld(); G.score=0; G.hearts=3; initializeLevel(0, {resetHearts:true, revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    const autoTimer = setInterval(()=>{
      if(G.state===GameState.AIMING){
        setAngle(Math.round(currentLevelData().ans));
        pressFire();
      }
      if(G.state===GameState.GAME_COMPLETE || G.state===GameState.GAME_OVER){
        document.body.dataset.autoplay = G.state===GameState.GAME_COMPLETE ? 'complete' : 'gameover';
        document.body.dataset.level = String(G.level+1);
        document.body.dataset.score = String(G.score);
        clearInterval(autoTimer);
      }
    }, 180);
  } else if(sp){
    const progress = Math.min(100,+sp[1])/100;
    resetWorld(); initializeLevel(0, {resetHearts:true, revive:true, enter:'aim'});
    $('overlay').classList.add('hidden');
    setAngle(Math.round(currentLevelData().ans));
    const path = calculateAimPath(G.angleTarget);
    G.aimPath = path;
    G.shell = {x:path.startX, y:path.startY, a:path.screenAngle, path, travelled:path.length*progress, minDz:1e9};
    G.shell.x = path.startX + (path.endX-path.startX)*progress;
    G.shell.y = path.startY + (path.endY-path.startY)*progress;
    setGameState(GameState.PROJECTILE_FLYING);
    G.guideAlpha=.55; G.prevPaused=GameState.PROJECTILE_FLYING; setGameState(GameState.PAUSED);
  } else if(dp){
    const progress = Math.min(100,+dp[1])/100;
    resetWorld(); G.level=0; setupLevel({enter:'aim'});
    $('overlay').classList.add('hidden');
    G.zombie.dead=true; G.zombie.mode='gone';
    if(G.activeNode) G.activeNode.status='CLEARED';
    setGameState(GameState.TRAVELLING); prepareDrive(); poseDriveAt(progress);
    if(progress>=1 && G.drive && G.drive.nextLevel!=null){
      const nextLevel = G.drive.nextLevel;
      G.cameraX = G.drive.cameraEnd;
      G.tankWorldX = G.drive.tankEnd;
      G.drive=null;
      initializeLevel(nextLevel, {resetHearts:false, revive:false, enter:'aim'});
      syncWorldPositions();
    } else {
      G.prevPaused=GameState.TRAVELLING; setGameState(GameState.PAUSED);
    }
  } else if(pv){
    if(pv[1]){
      const level = Math.min(+pv[1],TOTAL_LEVELS-1);
      resetWorld();
      G.cameraX = levelRestCamera(level);
      G.tankWorldX = levelRestTankX(level);
      initializeLevel(level, {resetHearts:true, revive:true, enter:'aim'});
    } else {
      initializeLevel(0, {resetHearts:true, revive:true, enter:'aim'});
    }
    $('overlay').classList.add('hidden');
    if(pv[2]) setTimeout(()=>{ setAngle(Math.round(currentLevelData().ans)); pressFire(); }, 700);
  }
  requestAnimationFrame(loop);
});
</script>
